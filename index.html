","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa dua fungsi utama project charter?</li><li>Mengapa kriteria keberhasilan di charter harus terukur?</li><li>Pemangku kepentingan dengan kekuasaan tinggi dan kepentingan tinggi dikelola dengan strategi apa?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari charter ke lingkup yang rinci</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen lingkup: mengumpulkan kebutuhan dan menyusun scope statement dibahas di Pertemuan 4; membuat WBS serta validasi dan pengendalian lingkup di Pertemuan 5.\"><defs><marker id=\"ps\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kumpulkan kebutuhan</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dibutuhkan?</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope statement</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dikerjakan dan tidak?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Buat WBS</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">pecah menjadi paket kerja</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Validasi &amp; kendalikan</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">terima hasil, jaga batas</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 4 (HARI INI) ··········································</text><text x=\"446\" y=\"150\" class=\"s-hd\">PERTEMUAN 5 ··········································</text></svg><figcaption>Alur manajemen lingkup dalam mata kuliah ini, dirangkum dari pembahasan scope management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>\"Tolong buatkan sistem informasi pesantren\"</h2><div class=\"cols w\"><div><p class=\"lead\">Pengasuh menyampaikan permintaan itu. Lalu Anda bertanya kepada empat orang:</p><ul><li><b>Pengasuh</b>: \"Saya ingin tahu jumlah santri dan keuangan kapan saja.\"</li><li><b>Bagian keuangan</b>: \"Tagihan SPP jangan lagi dihitung manual.\"</li><li><b>Admin</b>: \"Data pendaftar jangan diketik dua kali.\"</li><li><b>Ustaz wali kelas</b>: \"Rapor jangan direkap dari tumpukan kertas.\"</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Diskusikan 3 menit</h3><ol><li>Apakah empat kalimat ini sudah cukup untuk mulai membuat sistem?</li><li>Apa yang masih kabur?</li><li>Apa risikonya bila tim langsung mengetik kode?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"scope\">lingkup</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The sum of the products, services, and results to be provided as a project.\"</p><p class=\"tr\">\"Jumlah dari produk, layanan, dan hasil yang akan diberikan sebagai suatu proyek.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Lingkup selalu punya dua sisi, yaitu apa yang dihasilkan dan pekerjaan untuk menghasilkannya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Dua jenis lingkup</h3><table class=\"t\"><tbody><tr><th></th><th><button type=\"button\" class=\"term\" data-term=\"product-scope\">Lingkup produk</button></th><th><button type=\"button\" class=\"term\" data-term=\"project-scope\">Lingkup proyek</button></th></tr><tr><td>Isi</td><td>fitur dan fungsi sistem</td><td>pekerjaan untuk menghasilkannya</td></tr><tr><td>Contoh</td><td>modul tagihan SPP</td><td>analisis, desain, coding, uji, pelatihan</td></tr><tr><td>Diukur dengan</td><td>kebutuhan</td><td>rencana kerja</td></tr></tbody></table><p class=\"muted\" style=\"margin:.5em 0 0;font-size:.85em\">Diadaptasi dari pembedaan lingkup produk dan lingkup proyek (PMI, 2025).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Kebutuhan: dari keinginan ke yang dapat diuji</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A condition or capability that is necessary to be present in a product, service, or result to satisfy a business need.\"</p><p class=\"tr\">\"Suatu kondisi atau kemampuan yang perlu ada pada suatu produk, layanan, atau hasil untuk memenuhi suatu kebutuhan bisnis.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Ada tiga lapis yang sering bercampur:</p><ul><li><b>Kebutuhan bisnis</b>: mengapa proyek ada (mis. tunggakan SPP berkurang).</li><li><b>Kebutuhan pemangku kepentingan</b>: apa yang diperlukan tiap pihak.</li><li><b>Kebutuhan solusi</b>: apa yang harus dimiliki sistem.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Dua jenis kebutuhan solusi</h3><p><button type=\"button\" class=\"term\" data-term=\"functional-req\">Fungsional</button>: apa yang dilakukan sistem.</p><p class=\"muted\" style=\"margin-top:0\">\"Sistem membuat tagihan SPP bulanan untuk setiap santri aktif.\"</p><p><button type=\"button\" class=\"term\" data-term=\"nonfunctional-req\">Nonfungsional</button>: seberapa baik atau dalam batasan apa.</p><p class=\"muted\" style=\"margin:0\">\"Dasbor pengasuh tampil kurang dari 3 detik pada jaringan 4G.\"</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknik</span><span>Indikator 1</span></div><h2>Menggali kebutuhan (<button type=\"button\" class=\"term\" data-term=\"elicitation\">elicitation</button>)</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknik</th><th>Cocok untuk</th><th>Contoh di proyek mitra</th></tr></thead><tbody><tr><td><b>Wawancara</b></td><td>pimpinan, pengguna kunci</td><td>Tanya pengasuh tentang laporan yang diperlukan</td></tr><tr><td><b>Diskusi kelompok</b></td><td>banyak pihak, perlu kesepakatan</td><td>Pertemuan staf keuangan, admin, dan ustaz</td></tr><tr><td><b>Kuesioner</b></td><td>pengguna yang banyak</td><td>Formulir daring untuk wali santri</td></tr><tr><td><b>Observasi</b></td><td>proses yang berjalan</td><td>Mengamati antrean pembayaran SPP</td></tr><tr><td><b>Analisis dokumen</b></td><td>proses sudah tercatat</td><td>Buku induk, formulir, rekap Excel</td></tr><tr><td><b>Prototipe</b></td><td>kebutuhan sulit diucapkan</td><td>Sketsa layar tagihan untuk dikomentari</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Daftar teknik diadaptasi dari pembahasan pengumpulan kebutuhan (PMI, 2025; Schwalbe, 2019). Contoh adalah kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 1</span></div><h2>Menulis kebutuhan yang dapat diuji</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Masih kabur</th><th>Dapat diuji</th></tr></thead><tbody><tr><td>Sistem harus cepat.</td><td>Dasbor pengasuh tampil kurang dari 3 detik pada jaringan 4G.</td></tr><tr><td>Aplikasi mudah dipakai.</td><td>Wali kelas dapat menginput presensi satu kelas (maks. 40 santri) dalam kurang dari 2 menit setelah pelatihan 1 sesi.</td></tr><tr><td>Tagihan otomatis.</td><td>Sistem menerbitkan tagihan SPP bulanan untuk seluruh santri aktif pada tanggal 1 tiap bulan.</td></tr><tr><td>Data aman.</td><td>Nilai santri hanya dapat dilihat oleh wali kelas yang bersangkutan dan pengasuh.</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.6em\"><b>Ciri kebutuhan yang baik:</b> jelas (satu makna), dapat diuji (ada ukuran), satu hal per kalimat, dan punya sumber (siapa yang memintanya).</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 1</span></div><h2>Memilih yang didahulukan: <button type=\"button\" class=\"term\" data-term=\"moscow\">MoSCoW</button></h2><div class=\"grid4\"><div class=\"card ok\"><h3>Must</h3><p>Tanpa ini proyek dianggap gagal.</p><p class=\"muted\" style=\"margin:0\">Tagihan SPP otomatis</p></div><div class=\"card hl\"><h3>Should</h3><p>Penting, tetapi ada jalan sementara.</p><p class=\"muted\" style=\"margin:0\">Cetak rapor dari impor nilai</p></div><div class=\"card\"><h3>Could</h3><p>Bagus bila waktu dan dana ada.</p><p class=\"muted\" style=\"margin:0\">Notifikasi tagihan lewat WhatsApp</p></div><div class=\"card warn\"><h3>Won't (kali ini)</h3><p>Disepakati tidak dikerjakan sekarang.</p><p class=\"muted\" style=\"margin:0\">Pembayaran dompet digital</p></div></div><p style=\"margin-top:.8em\">Saat pemangku kepentingan berbeda pendapat, kembali ke <b>tujuan di charter</b> dan <b>peta power/interest</b> dari Pertemuan 3. Keputusan akhir ada pada sponsor.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumentasi</span><span>Indikator 1</span></div><h2>Daftar kebutuhan dan <button type=\"button\" class=\"term\" data-term=\"traceability-matrix\">matriks keterlacakan</button></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>ID</th><th>Kebutuhan</th><th>Sumber</th><th>Prioritas</th><th>Deliverable</th></tr></thead><tbody><tr><td>K-01</td><td>Dasbor menampilkan jumlah santri dan total tunggakan per bulan</td><td>Pengasuh</td><td>Must</td><td>Dasbor pengasuh</td></tr><tr><td>K-02</td><td>Tagihan SPP terbit otomatis tiap bulan</td><td>Bag. keuangan</td><td>Must</td><td>Modul tagihan</td></tr><tr><td>K-03</td><td>Data pendaftar diterima tidak diketik ulang</td><td>Admin</td><td>Must</td><td>Modul pendaftaran</td></tr><tr><td>K-04</td><td>Nilai diimpor dari spreadsheet dan rapor dapat dicetak</td><td>Ustaz</td><td>Should</td><td>Modul rapor</td></tr><tr><td>K-05</td><td>Pembayaran lewat dompet digital</td><td>Wali santri</td><td>Won't</td><td>(ditunda)</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Kasus ilustrasi. Matriks ini dilengkapi kolom pengujian di Pertemuan 11 (UAT).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"scope-statement\">scope statement</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The description of the project scope, major deliverables, assumptions, and constraints.\"</p><p class=\"tr\">\"Uraian tentang lingkup proyek, deliverable utama, asumsi, dan batasan.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Charter menyebut lingkup awal secara ringkas. Scope statement <b>memperincinya</b> menjadi kesepakatan bersama yang menjadi dasar WBS, jadwal, dan biaya.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Empat unsur indikator 2</h3><ol><li><button type=\"button\" class=\"term\" data-term=\"deliverable\">Deliverable</button></li><li>Batasan (<button type=\"button\" class=\"term\" data-term=\"constraint\">constraint</button>)</li><li>Asumsi (<button type=\"button\" class=\"term\" data-term=\"assumption\">assumption</button>)</li><li><button type=\"button\" class=\"term\" data-term=\"acceptance-criteria\">Kriteria penerimaan</button></li></ol><p class=\"muted\" style=\"margin:.4em 0 0;font-size:.85em\">Ditambah: uraian lingkup dan hal yang <button type=\"button\" class=\"term\" data-term=\"out-of-scope\">tidak termasuk</button>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>Scope statement ringkas</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><tbody><tr><td style=\"width:24%\"><b>Lingkup</b></td><td>Sistem web untuk pendaftaran santri, penagihan SPP, dan rapor, serta dasbor pengasuh.</td></tr><tr><td><b>Deliverable</b></td><td>(1) modul pendaftaran; (2) modul tagihan SPP; (3) modul rapor; (4) dasbor pengasuh; (5) manual pengguna dan 2 sesi pelatihan.</td></tr><tr><td><b>Kriteria penerimaan</b></td><td>Tagihan terbit untuk 100% santri aktif pada uji data satu semester; dasbor tampil &lt; 3 detik di 4G; lima pengguna kunci lulus skenario uji; berita acara ditandatangani pengasuh.</td></tr><tr><td><b>Batasan</b></td><td>Anggaran maksimal Rp80 juta; selesai sebelum tahun ajaran baru; tim pengembang 5 orang.</td></tr><tr><td><b>Asumsi</b></td><td>Data santri lama tersedia dalam Excel; internet pesantren stabil; lima pengguna kunci hadir pelatihan.</td></tr><tr><td><b>Tidak termasuk</b></td><td>Aplikasi mobile native; pembayaran dompet digital; perangkat keras baru; modul perpustakaan.</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 2</span></div><h2>Kriteria penerimaan dan batas lingkup</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A set of conditions that is required to be met before deliverables are accepted.\"</p><p class=\"tr\">\"Seperangkat kondisi yang harus dipenuhi sebelum deliverable diterima.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><table class=\"t\"><thead><tr><th>Lemah</th><th>Kuat</th></tr></thead><tbody><tr><td>Sistem berjalan baik.</td><td>Seluruh skenario uji prioritas Must lulus tanpa cacat kritis.</td></tr><tr><td>Pengguna puas.</td><td>Lima pengguna kunci menandatangani berita acara uji.</td></tr></tbody></table></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Batas lingkup</h3><ul><li>Tulis <b>tidak termasuk</b> sama tegasnya dengan yang termasuk.</li><li>Asumsi yang tidak dicek hari ini menjadi risiko besok.</li><li>Batasan datang dari luar tim (anggaran, tenggat, aturan); asumsi adalah tebakan kita.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok · 12 menit · Kasus ilustrasi</span></div><h2>Portal layanan Desa Sukamaju</h2><div class=\"cols w\"><div><p>Kepala desa meminta, dengan anggaran <b>Rp40 juta</b> dan waktu <b>4 bulan</b>:</p><ol><li>Pengajuan surat keterangan secara daring.</li><li>Pembayaran PBB lewat portal.</li><li>Aplikasi Android.</li><li>Terhubung ke data kependudukan nasional.</li><li>\"Sekalian\" situs wisata desa.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas kelompok</h3><ol><li>Golongkan tiap permintaan: <b>di dalam</b>, <b>di luar</b>, atau <b>perlu klarifikasi</b>.</li><li>Tulis satu asumsi dan satu batasan.</li><li>Tulis satu kriteria penerimaan terukur untuk permintaan no. 1.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 30 menit</span></div><h2>Kebutuhan dan scope statement proyek Anda</h2><div class=\"cols\"><div><p><b>Untuk proyek mitra kelompok Anda:</b></p><ol><li>Tulis minimal 10 kebutuhan bernomor, lengkap dengan sumber dan prioritas MoSCoW.</li><li>Pastikan tiap kebutuhan dapat diuji.</li><li>Susun draf scope statement: lingkup, deliverable, kriteria penerimaan, batasan, asumsi, tidak termasuk.</li><li>Tandai satu asumsi yang paling berisiko dan cara mengeceknya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dikumpulkan</h3><ul><li>Setiap kebutuhan punya sumber</li><li>Setiap deliverable berasal dari kebutuhan</li><li>Kriteria penerimaan terukur</li><li>Ada bagian \"tidak termasuk\"</li><li>Anggaran dan tenggat sama dengan charter</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Lingkup mencakup <b>produk</b> (fitur) dan <b>proyek</b> (pekerjaan untuk menghasilkannya).</li><li>Kebutuhan digali dengan beberapa teknik, lalu ditulis <b>jelas dan dapat diuji</b>.</li><li>Prioritaskan dengan <b>MoSCoW</b>, rujuk tujuan charter dan peta pemangku kepentingan.</li><li>Catat dalam <b>daftar kebutuhan</b> yang bisa ditelusuri ke sumber dan deliverable.</li><li><b>Scope statement</b> memuat lingkup, deliverable, kriteria penerimaan, batasan, asumsi, dan yang tidak termasuk.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Kebutuhan yang baik memuat ukuran yang dapat diperiksa; tiga pilihan lain masih kabur.\"><p class=\"q\">Kebutuhan mana yang paling dapat diuji?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Sistem harus cepat</button><button type=\"button\" data-o=\"b\">B. Aplikasi mudah dipakai</button><button type=\"button\" data-o=\"c\">C. Wali kelas dapat menginput presensi satu kelas dalam kurang dari 2 menit</button><button type=\"button\" data-o=\"d\">D. Tampilan harus modern</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Menyebut dengan tegas apa yang tidak dikerjakan mencegah salah paham antara tim dan pemangku kepentingan.\"><p class=\"q\">Bagian \"tidak termasuk\" dalam scope statement berfungsi untuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Memperpanjang dokumen</button><button type=\"button\" data-o=\"b\">B. Menegaskan batas agar tidak ada harapan yang keliru</button><button type=\"button\" data-o=\"c\">C. Menyembunyikan pekerjaan yang sulit</button><button type=\"button\" data-o=\"d\">D. Menggantikan kriteria penerimaan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Asumsi adalah hal yang dianggap benar tetapi belum pasti. Pilihan A dan C adalah batasan, D adalah kebutuhan.\"><p class=\"q\">Manakah yang merupakan ASUMSI?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Anggaran maksimal Rp80 juta</button><button type=\"button\" data-o=\"b\">B. Data santri lama tersedia dalam Excel</button><button type=\"button\" data-o=\"c\">C. Selesai sebelum tahun ajaran baru</button><button type=\"button\" data-o=\"d\">D. Tagihan terbit otomatis tiap bulan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian pengumpulan kebutuhan dan scope statement dalam Schwalbe (2019), serta bagian domain lingkup dalam PMBOK Guide edisi ke-8 (PMI, 2025). Pertemuan 5 membahas WBS.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · scope statement dan WBS)</h3><ul><li>Rapikan <b>daftar kebutuhan</b> (minimal 10, bersumber, MoSCoW).</li><li>Susun <b>scope statement</b> lengkap untuk proyek mitra.</li><li>Bawa draf ke Pertemuan 5 untuk dijadikan <b>WBS</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Tugas 1 bagian ini dinilai dengan <b>Penilaian Hasil Produk</b> memakai bobot blok Pertemuan 4–5 (Tugas 1: 10%; UTS: 5%). Tenggat: <b>[PERLU DIISI]</b>. Format dan rubrik ada di lembar Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Requirement</span></dt><dd>Kondisi atau kemampuan yang harus ada pada produk, layanan, atau hasil proyek agar kebutuhan pemangku kepentingan terpenuhi. <i>(kebutuhan / persyaratan)</i></dd></div><div><dt><span class=\"en\">Requirements elicitation</span></dt><dd>Kegiatan menggali kebutuhan dari pemangku kepentingan, mis. lewat wawancara, observasi, atau kuesioner. <i>(penggalian kebutuhan)</i></dd></div><div><dt><span class=\"en\">Functional requirement</span></dt><dd>Kebutuhan tentang apa yang harus dapat dilakukan sistem, mis. membuat tagihan SPP bulanan. <i>(kebutuhan fungsional)</i></dd></div><div><dt><span class=\"en\">Non-functional requirement</span></dt><dd>Kebutuhan tentang mutu atau batasan sistem, mis. kecepatan, keamanan, dan ketersediaan. <i>(kebutuhan nonfungsional)</i></dd></div><div><dt><span class=\"en\">MoSCoW</span></dt><dd>Teknik memprioritaskan kebutuhan menjadi Must have, Should have, Could have, dan Won't have (kali ini). <i>(prioritas MoSCoW)</i></dd></div><div><dt><span class=\"en\">Requirements traceability matrix</span></dt><dd>Tabel yang menghubungkan tiap kebutuhan dengan sumbernya, deliverable, dan pengujiannya agar dapat ditelusuri. <i>(matriks keterlacakan kebutuhan)</i></dd></div><div><dt><span class=\"en\">Scope</span></dt><dd>Seluruh produk, layanan, dan hasil yang akan diberikan oleh proyek, beserta pekerjaan untuk menghasilkannya. <i>(lingkup)</i></dd></div><div><dt><span class=\"en\">Product scope</span></dt><dd>Fitur dan fungsi yang menjadi ciri produk, layanan, atau hasil proyek. <i>(lingkup produk)</i></dd></div><div><dt><span class=\"en\">Project scope</span></dt><dd>Pekerjaan yang dilakukan untuk menghasilkan produk, layanan, atau hasil dengan fitur dan fungsi yang ditentukan. <i>(lingkup proyek)</i></dd></div><div><dt><span class=\"en\">Project scope statement</span></dt><dd>Dokumen yang menguraikan lingkup, deliverable utama, asumsi, dan batasan proyek, sebagai dasar kesepakatan bersama. <i>(pernyataan lingkup proyek)</i></dd></div><div><dt><span class=\"en\">Acceptance criteria</span></dt><dd>Syarat yang harus dipenuhi sebelum deliverable diterima oleh sponsor atau pelanggan. <i>(kriteria penerimaan)</i></dd></div><div><dt><span class=\"en\">Out of scope</span></dt><dd>Hal yang secara tegas tidak dikerjakan proyek; dicatat agar tidak muncul harapan yang keliru. <i>(di luar lingkup / tidak termasuk)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Assumption</span></dt><dd>Hal yang dianggap benar untuk keperluan perencanaan tanpa bukti pasti, sehingga perlu dicek kembali. <i>(asumsi)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Manajemen Lingkup (2)","subtitle":"WBS, WBS dictionary, validasi lingkup, dan scope creep","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Lingkup (2)</h1><p class=\"lead\">WBS, WBS dictionary, validasi lingkup, dan scope creep</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Scope statement → WBS → jaga batas</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun rencana lingkup proyek SI, termasuk scope statement dan WBS (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3 dan 4)</span></h3><ol><li>Ketepatan menurunkan kebutuhan pemangku kepentingan menjadi lingkup proyek. <span class=\"muted\">(Pertemuan 4)</span></li><li>Kelengkapan scope statement (deliverable, batasan, asumsi, kriteria penerimaan). <span class=\"muted\">(Pertemuan 4)</span></li><li>Ketepatan dekomposisi WBS dan WBS dictionary.</li><li>Ketepatan mengidentifikasi potensi scope creep.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda lingkup produk dan lingkup proyek?</li><li>Sebutkan empat unsur scope statement yang dinilai di indikator 2.</li><li>Mengapa bagian \"tidak termasuk\" penting ditulis?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari scope statement ke WBS</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen lingkup: mengumpulkan kebutuhan dan scope statement sudah dibahas di Pertemuan 4; membuat WBS serta validasi dan pengendalian lingkup dibahas hari ini di Pertemuan 5.\"><defs><marker id=\"ps5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-box\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kumpulkan kebutuhan</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dibutuhkan?</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps5)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-box\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope statement</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dikerjakan dan tidak?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps5)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Buat WBS</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">pecah menjadi paket kerja</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps5)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Validasi &amp; kendalikan</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">terima hasil, jaga batas</text><text x=\"10\" y=\"150\" class=\"s-s\">PERTEMUAN 4 ··········································</text><text x=\"446\" y=\"150\" class=\"s-hd\">PERTEMUAN 5 (HARI INI) ·································</text></svg><figcaption>Alur manajemen lingkup dalam mata kuliah ini, dirangkum dari pembahasan scope management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"wbs\">WBS</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A hierarchical decomposition of the total scope of work to be carried out by the project team to accomplish the project objectives and create the required deliverables.\"</p><p class=\"tr\">\"Suatu dekomposisi hierarkis dari keseluruhan lingkup pekerjaan yang akan dilaksanakan oleh tim proyek untuk mencapai tujuan proyek dan menciptakan deliverable yang disyaratkan.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><ul><li><b>Hierarkis</b>: dari proyek, ke deliverable, ke paket kerja.</li><li><b>Keseluruhan lingkup</b>: semua pekerjaan, termasuk yang bukan coding.</li><li>Berisi <b>hasil (kata benda)</b>, bukan urutan kegiatan.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"work-package\">Work package</button></h3><p>Tingkat terendah WBS: cukup kecil untuk diestimasi biaya dan durasinya, dan bisa diserahkan kepada satu penanggung jawab.</p><p class=\"muted\" style=\"margin:0;font-size:.85em\">Diadaptasi dari PMI (2025).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Dua bentuk WBS</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Berdasarkan deliverable</h3><p>Tingkat kedua berisi hasil proyek.</p><p class=\"muted\" style=\"margin:0\">1.2 Modul pendaftaran · 1.3 Modul tagihan SPP · 1.4 Modul rapor · …</p><p style=\"margin-top:.5em\">Cocok bila lingkup produknya jelas dan tiap hasil dapat diserahkan terpisah.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Berdasarkan fase</h3><p>Tingkat kedua berisi fase siklus hidup.</p><p class=\"muted\" style=\"margin:0\">1.1 Analisis · 1.2 Desain · 1.3 Pembuatan · 1.4 Pengujian · 1.5 Implementasi</p><p style=\"margin-top:.5em\">Cocok bila organisasi sudah memakai metodologi bertahap yang baku.</p></div></div><p class=\"muted\" style=\"margin-top:.7em;font-size:.85em\">Kedua bentuk dibahas dalam Schwalbe (2019). Mata kuliah ini memakai pengelompokan berdasarkan deliverable untuk Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses</span><span>Indikator 3 · tekan Play</span></div><h2><button type=\"button\" class=\"term\" data-term=\"decomposition\">Dekomposisi</button> top-down langkah demi langkah</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p5-wbs&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Mulai dari scope statement&quot;,&quot;en&quot;:&quot;input&quot;,&quot;d&quot;:&quot;Ambil uraian lingkup, daftar deliverable, dan bagian tidak termasuk dari Pertemuan 4.&quot;,&quot;ex&quot;:&quot;Lima deliverable SI Pesantren Al-Hikmah: pendaftaran, tagihan SPP, rapor, dasbor pengasuh, manual dan pelatihan.&quot;},{&quot;t&quot;:&quot;Tingkat 1: proyek&quot;,&quot;en&quot;:&quot;level 1&quot;,&quot;d&quot;:&quot;Puncak WBS adalah nama proyek, mewakili 100% pekerjaan.&quot;,&quot;ex&quot;:&quot;1.0 SI Pesantren Al-Hikmah.&quot;},{&quot;t&quot;:&quot;Tingkat 2: deliverable&quot;,&quot;en&quot;:&quot;level 2&quot;,&quot;d&quot;:&quot;Setiap deliverable menjadi satu cabang. Tambahkan cabang manajemen proyek untuk pekerjaan mengelola proyek.&quot;,&quot;ex&quot;:&quot;1.1 Manajemen proyek, 1.2 Modul pendaftaran, … 1.6 Manual dan pelatihan.&quot;},{&quot;t&quot;:&quot;Tingkat 3: pecah lagi&quot;,&quot;en&quot;:&quot;decompose&quot;,&quot;d&quot;:&quot;Pecah tiap deliverable menjadi bagian yang lebih kecil sampai bisa diestimasi dan diberi satu penanggung jawab.&quot;,&quot;ex&quot;:&quot;1.3 Modul tagihan SPP → 1.3.1 Analisis dan desain, 1.3.2 Fitur tagihan bulanan, 1.3.3 Pencatatan pembayaran, 1.3.4 Uji modul.&quot;},{&quot;t&quot;:&quot;Berhenti di work package&quot;,&quot;en&quot;:&quot;work package&quot;,&quot;d&quot;:&quot;Berhenti memecah bila bagian itu sudah bisa diperkirakan biaya dan durasinya. Tidak semua cabang harus sama dalam.&quot;,&quot;ex&quot;:&quot;1.6 Manual dan pelatihan cukup dua work package: 1.6.1 Manual pengguna, 1.6.2 Dua sesi pelatihan.&quot;},{&quot;t&quot;:&quot;Beri kode&quot;,&quot;en&quot;:&quot;numbering&quot;,&quot;d&quot;:&quot;Beri nomor bertingkat agar tiap komponen mudah dirujuk di jadwal, biaya, dan WBS dictionary.&quot;,&quot;ex&quot;:&quot;1.3.2 selalu berarti fitur tagihan bulanan otomatis.&quot;},{&quot;t&quot;:&quot;Cek aturan 100%&quot;,&quot;en&quot;:&quot;100% rule&quot;,&quot;d&quot;:&quot;Apakah semua pekerjaan sudah tercakup, dan tidak ada yang di luar lingkup ikut masuk?&quot;,&quot;ex&quot;:&quot;Migrasi data santri lama dari Excel belum ada. Tambahkan sebagai 1.2.4. Modul perpustakaan tidak boleh masuk karena tidak termasuk lingkup.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>WBS tiga tingkat</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 330\" role=\"img\" aria-label=\"WBS tiga tingkat SI Pesantren Al-Hikmah. Tingkat 1: proyek. Tingkat 2: manajemen proyek, modul pendaftaran, modul tagihan SPP, modul rapor, dasbor pengasuh, manual dan pelatihan. Tingkat 3 untuk modul tagihan SPP: analisis dan desain alur tagihan, fitur tagihan bulanan otomatis, pencatatan pembayaran, uji modul tagihan.\"><rect x=\"300\" y=\"8\" width=\"280\" height=\"52\" rx=\"8\" class=\"s-hl\" style=\"stroke:currentColor;stroke-width:2.5\"/><text x=\"440\" y=\"30\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px;fill:#111827\">1.0</text><text x=\"440\" y=\"49\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px;f 96\" class=\"s-line\"/><rect x=\"590\" y=\"96\" width=\"130\" height=\"66\" rx=\"8\" class=\"s-box\"/><text x=\"655\" y=\"116\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.5</text><text x=\"655\" y=\"135\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Dasbor</text><text x=\"655\" y=\"152\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">pengasuh</text><line x1=\"800\" y1=\"80\" x2=\"800\" y2=\"96\" class=\"s-line\"/><rect x=\"735\" y=\"96\" width=\"130\" height=\"66\" rx=\"8\" class=\"s-box\"/><text x=\"800\" y=\"116\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.6</text><text x=\"800\" y=\"135\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Manual &amp;</text><text x=\"800\" y=\"152\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">pelatihan</text><line x1=\"365\" y1=\"162\" x2=\"365\" y2=\"190\" class=\"s-line\"/><line x1=\"110\" y1=\"190\" x2=\"770\" y2=\"190\" class=\"s-line\"/><line x1=\"110\" y1=\"190\" x2=\"110\" y2=\"206\" class=\"s-line\"/><rect x=\"10\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"110\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.1 · work package</text><text x=\"110\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Analisis &amp; desain</text><text x=\"110\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">alur tagihan</text><line x1=\"330\" y1=\"190\" x2=\"330\" y2=\"206\" class=\"s-line\"/><rect x=\"230\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"330\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.2 · work package</text><text x=\"330\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fitur tagihan</text><text x=\"330\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">bulanan otomatis</text><line x1=\"550\" y1=\"190\" x2=\"550\" y2=\"206\" class=\"s-line\"/><rect x=\"450\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"550\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.3 · work package</text><text x=\"550\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Pencatatan</text><text x=\"550\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">pembayaran</text><line x1=\"770\" y1=\"190\" x2=\"770\" y2=\"206\" class=\"s-line\"/><rect x=\"670\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"770\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.4 · work package</text><text x=\"770\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Uji modul</text><text x=\"770\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">tagihan</text><text x=\"10\" y=\"300\" class=\"s-hd\" style=\"font-size:12px\">TINGKAT 1: PROYEK · TINGKAT 2: DELIVERABLE · TINGKAT 3: WORK PACKAGE</text><text x=\"10\" y=\"320\" class=\"s-s\" style=\"font-size:12px\">Cabang lain dipecah dengan cara yang sama.</text></svg><figcaption>Kasus ilustrasi. WBS berorientasi deliverable, disusun dari scope statement Pertemuan 4; cabang manajemen proyek ditambahkan karena pekerjaannya nyata (Schwalbe, 2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 3</span></div><h2>Ciri WBS yang baik</h2><div class=\"grid3\"><div class=\"card ok\"><h3><button type=\"button\" class=\"term\" data-term=\"rule-100\">Aturan 100%</button></h3><p>Semua pekerjaan tercakup; anak-anak satu cabang menjumlah tepat 100% induknya, tanpa pekerjaan di luar lingkup.</p></div><div class=\"card\"><h3>Kata benda</h3><p>Tulis hasil (\"Fitur tagihan bulanan\"), bukan kegiatan berurutan (\"lalu membuat…\").</p></div><div class=\"card\"><h3>Tidak tumpang tindih</h3><p>Satu pekerjaan hanya muncul di satu tempat.</p></div><div class=\"card\"><h3>Work package terkelola</h3><p>Bisa diestimasi dan punya satu penanggung jawab.</p></div><div class=\"card\"><h3>Kedalaman secukupnya</h3><p>Tidak semua cabang harus sama dalam.</p></div><div class=\"card warn\"><h3>Bukan jadwal</h3><p>Urutan dan durasi dibahas di Pertemuan 6.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Definisi kerja mata kuliah ini, dirangkum dari pembahasan WBS dalam Schwalbe (2019) dan PMI (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknik</span><span>Indikator 3</span></div><h2>Lima pendekatan menyusun WBS</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Pendekatan</th><th>Caranya</th><th>Kapan dipakai</th></tr></thead><tbody><tr><td><b>Pedoman</b></td><td>Memakai templat WBS yang ditetapkan organisasi</td><td>Organisasi sudah punya standar</td></tr><tr><td><b>Analogi</b></td><td>Mengadaptasi WBS proyek serupa</td><td>Pernah ada proyek mirip</td></tr><tr><td><b>Top-down</b></td><td>Dari tingkat terbesar dipecah ke bawah</td><td>Tim paham gambaran besar</td></tr><tr><td><b>Bottom-up</b></td><td>Kumpulkan tugas rinci, lalu kelompokkan</td><td>Proyek baru dan tim paham teknis</td></tr><tr><td><b>Mind mapping</b></td><td>Cabang-cabang digambar bebas dari pusat</td><td>Curah gagasan bersama tim</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Diadaptasi dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumentasi</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"wbs-dictionary\">WBS dictionary</button></h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A document that provides detailed deliverable, activity, and scheduling information about each component in the work breakdown structure.\"</p><p class=\"tr\">\"Suatu dokumen yang menyediakan informasi rinci tentang deliverable, aktivitas, dan penjadwalan mengenai setiap komponen dalam work breakdown structure.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><tbody><tr><td style=\"width:34%\"><b>Kode · nama</b></td><td>1.3.2 Fitur tagihan bulanan otomatis</td></tr><tr><td><b>Uraian</b></td><td>Membuat fitur yang menerbitkan tagihan SPP untuk setiap santri aktif pada tanggal 1 tiap bulan.</td></tr><tr><td><b>Penanggung jawab</b></td><td>Programmer backend</td></tr><tr><td><b>Kebutuhan terkait</b></td><td>K-02</td></tr><tr><td><b>Kriteria penerimaan</b></td><td>Tagihan terbit untuk 100% santri aktif pada uji data satu semester.</td></tr><tr><td><b>Asumsi</b></td><td>Daftar santri aktif sudah dimigrasi (1.2.4).</td></tr><tr><td><b>Estimasi</b></td><td>[diisi di Pertemuan 6 dan 9]</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3–4</span></div><h2>Validasi lingkup: deliverable diterima resmi</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The process of formalizing acceptance of the completed project deliverables.\"</p><p class=\"tr\">\"Proses memformalkan penerimaan atas deliverable proyek yang telah selesai.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><table class=\"t\"><thead><tr><th></th><th>Kendali mutu</th><th><button type=\"button\" class=\"term\" data-term=\"validate-scope\">Validasi lingkup</button></th></tr></thead><tbody><tr><td>Oleh</td><td>tim proyek</td><td>sponsor/mitra</td></tr><tr><td>Pertanyaan</td><td>Sudah benar?</td><td>Diterima?</td></tr><tr><td>Bukti</td><td>hasil uji internal</td><td>berita acara serah terima</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Di proyek Anda</h3><ul><li>Pakai <b>kriteria penerimaan</b> dari scope statement.</li><li>Uji bersama pengguna kunci.</li><li>Tutup dengan <b>berita acara serah terima</b> bertanda tangan.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 4</span></div><h2><button type=\"button\" class=\"term\" data-term=\"scope-creep\">Scope creep</button></h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The uncontrolled expansion to product or project scope without adjustments to time, cost, and resources.\"</p><p class=\"tr\">\"Perluasan yang tidak terkendali terhadap lingkup produk atau proyek tanpa penyesuaian terhadap waktu, biaya, dan sumber daya.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Sumbernya dua arah:</p><ul><li><b>Dari pemangku kepentingan</b>: \"Sekalian ditambah, ya. Sebentar kok.\"</li><li><b>Dari tim</b> (<button type=\"button\" class=\"term\" data-term=\"gold-plating\">gold plating</button>): menambah fitur yang tidak diminta.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Tanda-tanda awal</h3><ul><li>Permintaan lewat obrolan, tidak tertulis</li><li>Kata \"sekalian\", \"cuma\", \"sebentar\"</li><li>Kebutuhan tanpa sumber jelas</li><li>Scope statement tidak punya bagian \"tidak termasuk\"</li><li>Tidak ada yang berwenang memutuskan perubahan</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Indikator 4 · kasus ilustrasi</span></div><h2>\"Sekalian tambah modul perpustakaan, ya\"</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;p5-creep&quot;,&quot;start&quot;:&quot;s&quot;,&quot;ask&quot;:&quot;Apa yang Anda lakukan sebagai manajer proyek?&quot;,&quot;nodes&quot;:{&quot;s&quot;:{&quot;text&quot;:&quot;Minggu ke-6 proyek SI Pesantren Al-Hikmah. Modul tagihan sedang dibuat. Bagian \\&quot;tidak termasuk\\&quot; di scope statement menyebut modul perpustakaan.&quot;,&quot;say&quot;:[[&quot;Pengasuh&quot;,&quot;Mas, sekalian tambahkan modul perpustakaan, ya. Santri banyak pinjam kitab. Sebentar kok, kan sudah ada datanya.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Langsung menyanggupi agar pengasuh senang.&quot;,&quot;tag&quot;:&quot;Sanggupi langsung&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Pengasuh senang hari ini, tetapi lingkup bertambah tanpa penyesuaian waktu dan biaya. Inilah scope creep.&quot;,&quot;to&quot;:&quot;a&quot;},{&quot;t&quot;:&quot;Menolak: \\&quot;Itu tidak ada di scope statement, Pak.\\&quot;&quot;,&quot;tag&quot;:&quot;Tolak kaku&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Secara aturan benar, tetapi pengasuh adalah sponsor dengan pengaruh besar. Penolakan tanpa jalan keluar merusak hubungan.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Berterima kasih, mencatatnya sebagai permintaan perubahan, dan berjanji memberi analisis dampak dalam dua hari.&quot;,&quot;tag&quot;:&quot;Catat sebagai change request&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Permintaan diterima dengan baik tanpa langsung disanggupi, lalu dianalisis dampaknya.&quot;,&quot;to&quot;:&quot;c&quot;}]},&quot;a&quot;:{&quot;text&quot;:&quot;Dua minggu kemudian modul perpustakaan setengah jadi, modul tagihan terlambat. Bagian keuangan menanyakan tagihan bulan depan.&quot;,&quot;say&quot;:[[&quot;Bag. keuangan&quot;,&quot;Katanya tagihan bisa otomatis bulan ini. Kenapa belum?&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Melapor jujur kepada pengasuh dan mengajukan perubahan resmi: geser tenggat atau tunda perpustakaan.&quot;,&quot;tag&quot;:&quot;Lapor dan ajukan perubahan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Langkah perbaikan yang benar, meskipun terlambat. Kepercayaan masih bisa dipulihkan.&quot;,&quot;to&quot;:&quot;endMid&quot;},{&quot;t&quot;:&quot;Lembur diam-diam tanpa memberi tahu siapa pun.&quot;,&quot;tag&quot;:&quot;Lembur diam-diam&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Masalah ditutupi. Mutu turun, tim kelelahan, dan risiko keterlambatan tetap ada.&quot;,&quot;to&quot;:&quot;endBad&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Pengasuh terdiam. Beberapa hari kemudian beliau jarang membalas pesan tim.&quot;,&quot;say&quot;:[[&quot;Pengasuh&quot;,&quot;Ya sudah, kalau tidak bisa.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Menemui pengasuh, menjelaskan alasan, dan menawarkan proses perubahan atau fase berikutnya.&quot;,&quot;tag&quot;:&quot;Jelaskan dan tawarkan jalan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Batas lingkup tetap terjaga, dan sponsor mendapat pilihan yang jelas.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Membiarkan saja; yang penting lingkup aman.&quot;,&quot;tag&quot;:&quot;Biarkan&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Lingkup aman, tetapi dukungan sponsor melemah. Proyek bisa macet saat butuh keputusan.&quot;,&quot;to&quot;:&quot;endBad&quot;}]},&quot;c&quot;:{&quot;text&quot;:&quot;Hasil analisis tim: modul perpustakaan butuh sekitar 12 hari kerja dan Rp6 juta (data ilustrasi). Sisa ruang jadwal hanya 10 hari.&quot;,&quot;ask&quot;:&quot;Bagaimana Anda menyampaikannya?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Memberi pengasuh tiga pilihan: fase 2 setelah serah terima, tambah anggaran dan geser tenggat, atau tukar dengan fitur prioritas Could.&quot;,&quot;tag&quot;:&quot;Beri pilihan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Sponsor memutuskan dengan informasi dampak yang jelas. Bila disetujui, scope statement, WBS, jadwal, dan biaya diperbarui.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Memutuskan sendiri untuk menunda tanpa bertanya.&quot;,&quot;tag&quot;:&quot;Putuskan sendiri&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Keputusannya mungkin benar, tetapi manajer proyek tidak berwenang mengubah lingkup tanpa sponsor.&quot;,&quot;to&quot;:&quot;endMid&quot;}]},&quot;endGood&quot;:{&quot;title&quot;:&quot;Lingkup terkendali&quot;,&quot;k&quot;:&quot;good&quot;,&quot;end&quot;:&quot;Perubahan masuk lewat jalur resmi. Sponsor tetap mendukung, dan baseline diperbarui bila perubahan disetujui.&quot;},&quot;endMid&quot;:{&quot;title&quot;:&quot;Selamat, dengan catatan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;end&quot;:&quot;Proyek kembali ke jalur, tetapi ada keterlambatan atau kepercayaan yang perlu dipulihkan. Lain kali, catat permintaan sejak awal.&quot;},&quot;endBad&quot;:{&quot;title&quot;:&quot;Scope creep terjadi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;end&quot;:&quot;Lingkup bertambah tanpa penyesuaian waktu dan biaya. Tenggat terlewat dan mutu turun.&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 4 · data ilustrasi</span></div><h2>\"Cuma sedikit, kok\"</h2><div class=\"sim sim-creep\" data-sim=\"creep\" data-cfg=\"{&quot;id&quot;:&quot;p5-sim&quot;,&quot;ask&quot;:&quot;Klik permintaan \\&quot;kecil\\&quot; yang Anda sanggupi tanpa proses perubahan:&quot;,&quot;room&quot;:{&quot;d&quot;:10,&quot;b&quot;:3},&quot;unitD&quot;:&quot;hari kerja&quot;,&quot;unitB&quot;:&quot;juta&quot;,&quot;lblN&quot;:&quot;permintaan diterima&quot;,&quot;lblD&quot;:&quot;Tambahan waktu&quot;,&quot;lblB&quot;:&quot;Tambahan biaya&quot;,&quot;msg0&quot;:&quot;Belum ada permintaan tambahan. Jadwal dan anggaran sesuai baseline.&quot;,&quot;msgOk&quot;:&quot;Masih muat, tetapi sisa ruang untuk risiko lain makin tipis. Tetap catat sebagai permintaan perubahan.&quot;,&quot;msgOver&quot;:&quot;Melewati sisa ruang jadwal atau anggaran. Inilah scope creep: tiap permintaan kecil, tetapi jumlahnya besar.&quot;,&quot;items&quot;:[{&quot;t&quot;:&quot;Tambah kolom data wali di formulir&quot;,&quot;d&quot;:0.5,&quot;b&quot;:0},{&quot;t&quot;:&quot;Ganti warna tema aplikasi&quot;,&quot;d&quot;:1,&quot;b&quot;:0},{&quot;t&quot;:&quot;Ekspor rapor PDF dengan kop baru&quot;,&quot;d&quot;:1,&quot;b&quot;:0},{&quot;t&quot;:&quot;Cetak kartu santri ber-QR&quot;,&quot;d&quot;:2,&quot;b&quot;:0.8},{&quot;t&quot;:&quot;Laporan infak dan donatur&quot;,&quot;d&quot;:3,&quot;b&quot;:0.5},{&quot;t&quot;:&quot;Notifikasi tagihan lewat WhatsApp&quot;,&quot;d&quot;:4,&quot;b&quot;:1.5},{&quot;t&quot;:&quot;Modul izin pulang santri&quot;,&quot;d&quot;:5,&quot;b&quot;:1}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.82em\">Angka ilustrasi: sisa ruang jadwal 10 hari kerja dan sisa anggaran Rp3 juta sebelum tenggat. Penyederhanaan untuk simulasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses</span><span>Indikator 4</span></div><h2>Mengendalikan lingkup: jalur <button type=\"button\" class=\"term\" data-term=\"change-request\">permintaan perubahan</button></h2><div class=\"grid5\"><div class=\"card\"><h3>1. Ajukan tertulis</h3><p>Siapa, apa, mengapa.</p></div><div class=\"card\"><h3>2. Analisis dampak</h3><p>Lingkup, waktu, biaya, risiko, mutu.</p></div><div class=\"card hl\"><h3>3. Putuskan</h3><p>Oleh sponsor atau pihak berwenang.</p></div><div class=\"card\"><h3>4. Perbarui baseline</h3><p>Scope statement, WBS, jadwal, biaya.</p></div><div class=\"card\"><h3>5. Komunikasikan</h3><p>Ke tim dan pemangku kepentingan.</p></div></div><p style=\"margin-top:.8em\">Perubahan bukan musuh. Yang berbahaya adalah perubahan <b>tanpa jalur</b>. <button type=\"button\" class=\"term\" data-term=\"control-scope\">Pengendalian lingkup</button> membandingkan pekerjaan dengan <button type=\"button\" class=\"term\" data-term=\"scope-baseline\">scope baseline</button>.</p><p class=\"muted\" style=\"font-size:.85em\">Langkah diringkas dosen dari pembahasan pengendalian lingkup (PMI, 2025; Schwalbe, 2019). Pengendalian perubahan terpadu dibahas lagi di Pertemuan 15.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 25 menit</span></div><h2>WBS proyek kelompok Anda</h2><div class=\"cols\"><div><p><b>Dari scope statement Pertemuan 4:</b></p><ol><li>Tulis tingkat 1 (proyek) dan tingkat 2 (deliverable + manajemen proyek).</li><li>Pecah tiap cabang sampai work package, beri kode.</li><li>Cek aturan 100%: ada yang terlupa? ada yang di luar lingkup?</li><li>Isi WBS dictionary untuk dua work package terpenting.</li><li>Tulis dua potensi scope creep dan siapa yang berwenang memutuskan perubahan.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dinilai rekan</h3><ul><li>Semua deliverable scope statement ada</li><li>Kata benda, bukan urutan kegiatan</li><li>Ada cabang manajemen proyek dan pelatihan</li><li>Tidak ada yang tercantum di \"tidak termasuk\"</li><li>Kode bertingkat konsisten</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai WBS kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p5-wbs-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · WBS proyek kelompok (MPSI P5)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 3 · SI Koperasi Pesantren&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di WBS mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. Cabang 1.4 masih berupa kata kerja…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:9,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:13,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:17,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Kelengkapan (aturan 100%)&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Banyak deliverable scope statement tidak muncul.&quot;,&quot;Sebagian deliverable ada; pekerjaan pendukung (manajemen proyek, pelatihan) terlupa.&quot;,&quot;Semua deliverable ada; satu atau dua pekerjaan kecil terlupa.&quot;,&quot;Semua pekerjaan tercakup dan tidak ada yang di luar lingkup.&quot;]},{&quot;t&quot;:&quot;Ketepatan dekomposisi&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Masih berupa daftar tugas tanpa tingkat.&quot;,&quot;Ada tingkat, tetapi banyak kata kerja atau tumpang tindih.&quot;,&quot;Bertingkat dan berupa hasil; sedikit tumpang tindih.&quot;,&quot;Bertingkat rapi, berupa hasil, tanpa tumpang tindih.&quot;]},{&quot;t&quot;:&quot;Work package terkelola&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Tidak jelas mana work package.&quot;,&quot;Work package terlalu besar untuk diestimasi.&quot;,&quot;Sebagian besar bisa diestimasi dan punya penanggung jawab.&quot;,&quot;Semua bisa diestimasi dan punya satu penanggung jawab.&quot;]},{&quot;t&quot;:&quot;WBS dictionary&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Belum ada.&quot;,&quot;Ada, tetapi hanya nama dan uraian singkat.&quot;,&quot;Ada untuk dua work package dengan kriteria penerimaan.&quot;,&quot;Lengkap, terukur, dan terlacak ke kebutuhan.&quot;]},{&quot;t&quot;:&quot;Potensi scope creep&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak disebutkan.&quot;,&quot;Disebut umum (\\&quot;mitra minta tambah\\&quot;).&quot;,&quot;Dua potensi spesifik dari proyek mitra.&quot;,&quot;Spesifik, disertai pihak yang berwenang memutuskan perubahan.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>WBS</b> memecah seluruh lingkup secara bertingkat sampai <b>work package</b>.</li><li>Kelompokkan berdasarkan deliverable; cek dengan <b>aturan 100%</b>.</li><li><b>WBS dictionary</b> merinci tiap komponen dan menautkannya ke kebutuhan.</li><li><b>Validasi lingkup</b> = penerimaan resmi deliverable oleh sponsor/mitra.</li><li><b>Scope creep</b> dicegah dengan jalur permintaan perubahan, bukan dengan menolak semua perubahan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p5-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Tingkat kedua WBS yang berorientasi deliverable berisi…&quot;,&quot;o&quot;:[&quot;Urutan kegiatan per minggu&quot;,&quot;Hasil utama proyek seperti modul pendaftaran dan modul tagihan&quot;,&quot;Nama anggota tim&quot;,&quot;Daftar risiko proyek&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;WBS berorientasi deliverable mengelompokkan pekerjaan menurut hasil, bukan waktu atau orang.&quot;},{&quot;q&quot;:&quot;Work package adalah…&quot;,&quot;o&quot;:[&quot;Seluruh pekerjaan proyek&quot;,&quot;Pekerjaan di tingkat terendah WBS yang biaya dan durasinya diestimasi&quot;,&quot;Dokumen persetujuan sponsor&quot;,&quot;Rapat koordinasi mingguan&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Work package cukup kecil untuk diestimasi dan diberi satu penanggung jawab.&quot;},{&quot;q&quot;:&quot;WBS kelompok tidak memuat migrasi data santri lama, padahal pekerjaan itu diperlukan. Aturan yang dilanggar adalah…&quot;,&quot;o&quot;:[&quot;Aturan 100%&quot;,&quot;Prioritas MoSCoW&quot;,&quot;Kriteria penerimaan&quot;,&quot;Power/interest grid&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Aturan 100% meminta seluruh pekerjaan proyek tercakup di WBS.&quot;},{&quot;q&quot;:&quot;Siapa yang melakukan validasi lingkup?&quot;,&quot;o&quot;:[&quot;Programmer saat menguji kodenya&quot;,&quot;Sponsor atau mitra yang menerima deliverable secara resmi&quot;,&quot;Dosen pengampu&quot;,&quot;Penyedia hosting&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Validasi lingkup adalah penerimaan resmi deliverable oleh sponsor atau pelanggan; uji internal tim termasuk kendali mutu.&quot;},{&quot;q&quot;:&quot;Di tengah proyek, mitra meminta fitur yang tidak ada di scope statement. Langkah paling tepat adalah…&quot;,&quot;o&quot;:[&quot;Langsung mengerjakannya agar mitra senang&quot;,&quot;Menolak tanpa penjelasan&quot;,&quot;Mencatatnya sebagai permintaan perubahan, menganalisis dampaknya, dan meminta keputusan sponsor&quot;,&quot;Mengerjakannya diam-diam di luar jam kerja&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Perubahan boleh terjadi asalkan lewat jalur resmi dengan penyesuaian waktu, biaya, dan persetujuan.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian membuat WBS, validasi, dan pengendalian lingkup dalam Schwalbe (2019); bagian WBS dalam Kerzner (2025). Pertemuan 6 membahas penjadwalan: dari work package ke aktivitas.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · scope statement dan WBS)</h3><ul><li>Finalkan <b>scope statement</b> dari Pertemuan 4.</li><li>Susun <b>WBS</b> minimal tiga tingkat dengan kode, sesuai umpan balik rekan.</li><li>Lengkapi <b>WBS dictionary</b> untuk work package utama.</li><li>Tulis jalur <b>permintaan perubahan</b> dan pihak yang berwenang.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Dinilai dengan <b>Penilaian Hasil Produk</b> memakai bobot blok Pertemuan 4–5 (Tugas 1: 10%; UTS: 5%). Tenggat: <b>[PERLU DIISI]</b>. Format dan rubrik ada di lembar Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Work Breakdown Structure (WBS)</span></dt><dd>Pemecahan seluruh lingkup pekerjaan proyek secara bertingkat menjadi bagian-bagian yang lebih kecil dan dapat dikelola. <i>(struktur rincian kerja)</i></dd></div><div><dt><span class=\"en\">Decomposition</span></dt><dd>Teknik memecah lingkup dan deliverable menjadi bagian yang lebih kecil sampai dapat diestimasi dan dikelola. <i>(dekomposisi)</i></dd></div><div><dt><span class=\"en\">Work package</span></dt><dd>Pekerjaan di tingkat terendah WBS yang biaya dan durasinya diestimasi dan dikelola. <i>(paket kerja)</i></dd></div><div><dt><span class=\"en\">100% rule</span></dt><dd>Prinsip bahwa WBS mencakup seluruh pekerjaan proyek, dan jumlah pekerjaan pada tingkat anak sama dengan pekerjaan induknya, tidak kurang dan tidak lebih. <i>(aturan 100%)</i></dd></div><div><dt><span class=\"en\">WBS dictionary</span></dt><dd>Dokumen yang merinci setiap komponen WBS: uraian, deliverable, penanggung jawab, kriteria penerimaan, dan informasi jadwal. <i>(kamus WBS)</i></dd></div><div><dt><span class=\"en\">Scope baseline</span></dt><dd>Versi lingkup yang sudah disetujui (scope statement, WBS, dan WBS dictionary) sebagai pembanding selama proyek. <i>(baseline lingkup)</i></dd></div><div><dt><span class=\"en\">Validate scope</span></dt><dd>Penerimaan resmi deliverable yang sudah selesai oleh sponsor atau pelanggan. <i>(validasi lingkup)</i></dd></div><div><dt><span class=\"en\">Control scope</span></dt><dd>Memantau status lingkup dan mengelola perubahan terhadap scope baseline. <i>(pengendalian lingkup)</i></dd></div><div><dt><span class=\"en\">Scope creep</span></dt><dd>Bertambahnya lingkup secara tidak terkendali tanpa penyesuaian waktu, biaya, dan sumber daya. <i>(pemekaran lingkup)</i></dd></div><div><dt><span class=\"en\">Gold plating</span></dt><dd>Tim menambahkan fitur atau hasil yang tidak diminta, dengan anggapan akan menyenangkan pelanggan. <i>(penambahan berlebihan oleh tim)</i></dd></div><div><dt><span class=\"en\">Change request</span></dt><dd>Usulan resmi untuk mengubah lingkup, jadwal, biaya, atau dokumen proyek lainnya, yang dianalisis dan diputuskan sebelum dikerjakan. <i>(permintaan perubahan)</i></dd></div><div><dt><span class=\"en\">Acceptance criteria</span></dt><dd>Syarat yang harus dipenuhi sebelum deliverable diterima oleh sponsor atau pelanggan. <i>(kriteria penerimaan)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Project scope statement</span></dt><dd>Dokumen yang menguraikan lingkup, deliverable utama, asumsi, dan batasan proyek, sebagai dasar kesepakatan bersama. <i>(pernyataan lingkup proyek)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 6.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":6,"title":"Penjadwalan Proyek (1)","subtitle":"Aktivitas, network diagram (PDM), estimasi durasi, Critical Path Method","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-1 · CPL-4</span></div><h1>Penjadwalan Proyek (1)</h1><p class=\"lead\">Aktivitas, network diagram (PDM), estimasi durasi, Critical Path Method</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menyusun jadwal proyek dan menganalisis jalur kritis (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":7,"title":"Penjadwalan Proyek (2)","subtitle":"Gantt chart di ProjectLibre/MS Project, kompresi jadwal · presentasi Tugas 1","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag s "><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 10</span><span>Sub-CPMK-6 · CPMK-2 · CPL-2</span></div><h1>Manajemen Risiko</h1><p class=\"lead\">Identifikasi, analisis kualitatif dan kuantitatif (EMV), respons, risk register</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi risiko proyek SI dan merumuskan strategi responsnya (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":11,"title":"Manajemen Mutu","subtitle":"QA/QC, ISO/IEC 25010, User Acceptance Testing, kriteria penerimaan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 11</span><span>Sub-CPMK-7 · CPMK-3 · CPL-10</span></div><h1>Manajemen Mutu</h1><p class=\"lead\">QA/QC, ISO/IEC 25010, User Acceptance Testing, kriteria penerimaan</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu merancang rencana mutu dan mengevaluasi solusi SI hasil proyek terhadap kebutuhan organisasi (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":12,"title":"Pengadaan, Legal & Etika Proyek TI","subtitle":"Make-or-buy, jenis kontrak, pengadaan pemerintah, pelindungan data, green IT","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 12</span><span>Sub-CPMK-8 · CPMK-2 · CPL-2</span></div><h1>Pengadaan, Legal & Etika Proyek TI</h1><p class=\"lead\">Make-or-buy, jenis kontrak, pengadaan pemerintah, pelindungan data, green IT</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi strategi pengadaan dan kontrak proyek TI dengan memperhatikan aspek legal, etika, dan keberlanjutan (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":13,"title":"Tim, Komunikasi & Agile","subtitle":"Matriks RACI, rencana komunikasi, nilai dan prinsip agile, Scrum","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 13</span><span>Sub-CPMK-9 (Pertemuan 13–14) · CPMK-3 · CPL-10</span></div><h1>Tim, Komunikasi & Agile</h1><p class=\"lead\">Matriks RACI, rencana komunikasi, nilai dan prinsip agile, Scrum</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengelola pengembangan solusi SI secara iteratif dengan Scrum, termasuk tim, komunikasi, dan evaluasi increment bersama pemangku kepentingan (C3–C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":14,"title":"Simulasi Sprint Scrum","subtitle":"Product backlog, user story, definition of done, sprint review, hybrid","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 14</span><span>Sub-CPMK-9 (Pertemuan 13–14) · CPMK-3 · CPL-10</span></div><h1>Simulasi Sprint Scrum</h1><p class=\"lead\">Product backlog, user story, definition of done, sprint review, hybrid</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengelola pengembangan solusi SI secara iteratif dengan Scrum, termasuk tim, komunikasi, dan evaluasi increment bersama pemangku kepentingan (C3–C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":15,"title":"Pengendalian & Penutupan Proyek","subtitle":"Earned value management, pengendalian perubahan, lessons learned · presentasi akhir","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 15</span><span>Sub-CPMK-10 · CPMK-2 · CPL-2</span></div><h1>Pengendalian & Penutupan Proyek</h1><p class=\"lead\">Earned value management, pengendalian perubahan, lessons learned · presentasi akhir</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi kinerja proyek dengan earned value management serta menyusun laporan penutupan proyek (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":16,"title":"Ujian Akhir Semester (UAS)","subtitle":"Materi Pertemuan 9–15 · Sub-CPMK-5 s.d. Sub-CPMK-10","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 16</span></div><h1>Ujian Akhir Semester (UAS)</h1><p class=\"lead\">Materi Pertemuan 9–15 · Sub-CPMK-5 s.d. Sub-CPMK-10</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]}];
const SIMS={creep(el, cfg, s){
    const I=cfg.items||[]; if(!s.on) s.on={};
    const fmt=v=>String(Math.round(v*10)/10).replace('.',',');
    const draw=()=>{
      let d=0,b=0,n=0; I.forEach((it,i)=>{ if(s.on[i]){ d+=it.d; b+=it.b; n++; } });
      const pd=Math.min(100,d/cfg.room.d*100), pb=Math.min(100,b/cfg.room.b*100);
      const overD=d>cfg.room.d, overB=b>cfg.room.b;
      el.innerHTML='<div class="cols" style="align-items:start">'+
        '<div><p style="margin:0 0 .4em;font-weight:700;color:var(--ink)">'+cfg.ask+'</p><div style="display:grid;gap:.35em">'+
        I.map((it,i)=>'<button type="button" class="wbtn" data-i="'+i+'" aria-pressed="'+(!!s.on[i])+'" style="text-align:left;display:flex;justify-content:space-between;gap:.6em;'+(s.on[i]?'background:var(--coral);color:#111827':'')+'"><span>'+(s.on[i]?'✔ ':'+ ')+it.t+'</span><span style="font-family:var(--mono);white-space:nowrap">'+fmt(it.d)+' hr</span></button>').join('')+
        '</div></div>'+
        '<div style="border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:4px 4px 0 var(--line);padding:.6em .8em;color:var(--ink)" aria-live="polite">'+
        '<div style="font-family:var(--mono);font-size:.72em;font-weight:700;text-transform:uppercase">'+n+' '+cfg.lblN+'</div>'+
        '<div style="margin:.5em 0 .15em;font-size:.85em;font-weight:700">'+cfg.lblD+': '+fmt(d)+' / '+fmt(cfg.room.d)+' '+cfg.unitD+'</div>'+
        '<div style="height:.8em;border:2px solid var(--line);border-radius:2px;background:var(--surface-2);overflow:hidden"><i style="display:block;height:100%;width:'+pd+'%;background:'+(overD?'var(--bad)':'var(--mustard)')+';transition:width .5s ease"></i></div>'+
        '<div style="margin:.5em 0 .15em;font-size:.85em;font-weight:700">'+cfg.lblB+': Rp'+fmt(b)+' / Rp'+fmt(cfg.room.b)+' '+cfg.unitB+'</div>'+
        '<div style="height:.8em;border:2px solid var(--line);border-radius:2px;background:var(--surface-2);overflow:hidden"><i style="display:block;height:100%;width:'+pb+'%;background:'+(overB?'var(--bad)':'var(--mustard)')+';transition:width .5s ease"></i></div>'+
        '<p style="margin:.6em 0 .4em;font-size:.85em;line-height:1.4">'+(n===0?cfg.msg0:(overD||overB)?'<b style="color:var(--bad)">'+cfg.msgOver+'</b>':cfg.msgOk)+'</p>'+
        '<button type="button" class="wbtn" data-act="reset">↺ Reset</button></div></div>';
    };
    el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.i!==undefined){ const i=+b.dataset.i; s.on[i]=!s.on[i]; draw(); if(e.detail===0){const f=el.querySelector('[data-i="'+i+'"]'); if(f) f.focus({preventScroll:true});} return; }
      if(b.dataset.act==='reset'){ s.on={}; draw(); }
    };
