96\" class=\"s-line\"/><rect x=\"590\" y=\"96\" width=\"130\" height=\"66\" rx=\"8\" class=\"s-box\"/><text x=\"655\" y=\"116\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.5</text><text x=\"655\" y=\"135\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Dasbor</text><text x=\"655\" y=\"152\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">pengasuh</text><line x1=\"800\" y1=\"80\" x2=\"800\" y2=\"96\" class=\"s-line\"/><rect x=\"735\" y=\"96\" width=\"130\" height=\"66\" rx=\"8\" class=\"s-box\"/><text x=\"800\" y=\"116\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.6</text><text x=\"800\" y=\"135\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Manual &amp;</text><text x=\"800\" y=\"152\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">pelatihan</text><line x1=\"365\" y1=\"162\" x2=\"365\" y2=\"190\" class=\"s-line\"/><line x1=\"110\" y1=\"190\" x2=\"770\" y2=\"190\" class=\"s-line\"/><line x1=\"110\" y1=\"190\" x2=\"110\" y2=\"206\" class=\"s-line\"/><rect x=\"10\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"110\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.1 · work package</text><text x=\"110\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Analisis &amp; desain</text><text x=\"110\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">alur tagihan</text><line x1=\"330\" y1=\"190\" x2=\"330\" y2=\"206\" class=\"s-line\"/><rect x=\"230\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"330\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.2 · work package</text><text x=\"330\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fitur tagihan</text><text x=\"330\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">bulanan otomatis</text><line x1=\"550\" y1=\"190\" x2=\"550\" y2=\"206\" class=\"s-line\"/><rect x=\"450\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"550\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.3 · work package</text><text x=\"550\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Pencatatan</text><text x=\"550\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">pembayaran</text><line x1=\"770\" y1=\"190\" x2=\"770\" y2=\"206\" class=\"s-line\"/><rect x=\"670\" y=\"206\" width=\"200\" height=\"66\" rx=\"8\" class=\"s-soft\"/><text x=\"770\" y=\"226\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">1.3.4 · work package</text><text x=\"770\" y=\"245\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Uji modul</text><text x=\"770\" y=\"262\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">tagihan</text><text x=\"10\" y=\"300\" class=\"s-hd\" style=\"font-size:12px\">TINGKAT 1: PROYEK · TINGKAT 2: DELIVERABLE · TINGKAT 3: WORK PACKAGE</text><text x=\"10\" y=\"320\" class=\"s-s\" style=\"font-size:12px\">Cabang lain dipecah dengan cara yang sama.</text></svg><figcaption>Kasus ilustrasi. WBS berorientasi deliverable, disusun dari scope statement Pertemuan 4; cabang manajemen proyek ditambahkan karena pekerjaannya nyata (Schwalbe, 2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 3</span></div><h2>Ciri WBS yang baik</h2><div class=\"grid3\"><div class=\"card ok\"><h3><button type=\"button\" class=\"term\" data-term=\"rule-100\">Aturan 100%</button></h3><p>Semua pekerjaan tercakup; anak-anak satu cabang menjumlah tepat 100% induknya, tanpa pekerjaan di luar lingkup.</p></div><div class=\"card\"><h3>Kata benda</h3><p>Tulis hasil (\"Fitur tagihan bulanan\"), bukan kegiatan berurutan (\"lalu membuat…\").</p></div><div class=\"card\"><h3>Tidak tumpang tindih</h3><p>Satu pekerjaan hanya muncul di satu tempat.</p></div><div class=\"card\"><h3>Work package terkelola</h3><p>Bisa diestimasi dan punya satu penanggung jawab.</p></div><div class=\"card\"><h3>Kedalaman secukupnya</h3><p>Tidak semua cabang harus sama dalam.</p></div><div class=\"card warn\"><h3>Bukan jadwal</h3><p>Urutan dan durasi dibahas di Pertemuan 6.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Definisi kerja mata kuliah ini, dirangkum dari pembahasan WBS dalam Schwalbe (2019) dan PMI (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknik</span><span>Indikator 3</span></div><h2>Lima pendekatan menyusun WBS</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Pendekatan</th><th>Caranya</th><th>Kapan dipakai</th></tr></thead><tbody><tr><td><b>Pedoman</b></td><td>Memakai templat WBS yang ditetapkan organisasi</td><td>Organisasi sudah punya standar</td></tr><tr><td><b>Analogi</b></td><td>Mengadaptasi WBS proyek serupa</td><td>Pernah ada proyek mirip</td></tr><tr><td><b>Top-down</b></td><td>Dari tingkat terbesar dipecah ke bawah</td><td>Tim paham gambaran besar</td></tr><tr><td><b>Bottom-up</b></td><td>Kumpulkan tugas rinci, lalu kelompokkan</td><td>Proyek baru dan tim paham teknis</td></tr><tr><td><b>Mind mapping</b></td><td>Cabang-cabang digambar bebas dari pusat</td><td>Curah gagasan bersama tim</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Diadaptasi dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumentasi</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"wbs-dictionary\">WBS dictionary</button></h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A document that provides detailed deliverable, activity, and scheduling information about each component in the work breakdown structure.\"</p><p class=\"tr\">\"Suatu dokumen yang menyediakan informasi rinci tentang deliverable, aktivitas, dan penjadwalan mengenai setiap komponen dalam work breakdown structure.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><tbody><tr><td style=\"width:34%\"><b>Kode · nama</b></td><td>1.3.2 Fitur tagihan bulanan otomatis</td></tr><tr><td><b>Uraian</b></td><td>Membuat fitur yang menerbitkan tagihan SPP untuk setiap santri aktif pada tanggal 1 tiap bulan.</td></tr><tr><td><b>Penanggung jawab</b></td><td>Programmer backend</td></tr><tr><td><b>Kebutuhan terkait</b></td><td>K-02</td></tr><tr><td><b>Kriteria penerimaan</b></td><td>Tagihan terbit untuk 100% santri aktif pada uji data satu semester.</td></tr><tr><td><b>Asumsi</b></td><td>Daftar santri aktif sudah dimigrasi (1.2.4).</td></tr><tr><td><b>Estimasi</b></td><td>[diisi di Pertemuan 6 dan 9]</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3–4</span></div><h2>Validasi lingkup: deliverable diterima resmi</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The process of formalizing acceptance of the completed project deliverables.\"</p><p class=\"tr\">\"Proses memformalkan penerimaan atas deliverable proyek yang telah selesai.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><table class=\"t\"><thead><tr><th></th><th>Kendali mutu</th><th><button type=\"button\" class=\"term\" data-term=\"validate-scope\">Validasi lingkup</button></th></tr></thead><tbody><tr><td>Oleh</td><td>tim proyek</td><td>sponsor/mitra</td></tr><tr><td>Pertanyaan</td><td>Sudah benar?</td><td>Diterima?</td></tr><tr><td>Bukti</td><td>hasil uji internal</td><td>berita acara serah terima</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Di proyek Anda</h3><ul><li>Pakai <b>kriteria penerimaan</b> dari scope statement.</li><li>Uji bersama pengguna kunci.</li><li>Tutup dengan <b>berita acara serah terima</b> bertanda tangan.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 4</span></div><h2><button type=\"button\" class=\"term\" data-term=\"scope-creep\">Scope creep</button></h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The uncontrolled expansion to product or project scope without adjustments to time, cost, and resources.\"</p><p class=\"tr\">\"Perluasan yang tidak terkendali terhadap lingkup produk atau proyek tanpa penyesuaian terhadap waktu, biaya, dan sumber daya.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Sumbernya dua arah:</p><ul><li><b>Dari pemangku kepentingan</b>: \"Sekalian ditambah, ya. Sebentar kok.\"</li><li><b>Dari tim</b> (<button type=\"button\" class=\"term\" data-term=\"gold-plating\">gold plating</button>): menambah fitur yang tidak diminta.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Tanda-tanda awal</h3><ul><li>Permintaan lewat obrolan, tidak tertulis</li><li>Kata \"sekalian\", \"cuma\", \"sebentar\"</li><li>Kebutuhan tanpa sumber jelas</li><li>Scope statement tidak punya bagian \"tidak termasuk\"</li><li>Tidak ada yang berwenang memutuskan perubahan</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Indikator 4 · kasus ilustrasi</span></div><h2>\"Sekalian tambah modul perpustakaan, ya\"</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;p5-creep&quot;,&quot;start&quot;:&quot;s&quot;,&quot;ask&quot;:&quot;Apa yang Anda lakukan sebagai manajer proyek?&quot;,&quot;nodes&quot;:{&quot;s&quot;:{&quot;text&quot;:&quot;Minggu ke-6 proyek SI Pesantren Al-Hikmah. Modul tagihan sedang dibuat. Bagian \\&quot;tidak termasuk\\&quot; di scope statement menyebut modul perpustakaan.&quot;,&quot;say&quot;:[[&quot;Pengasuh&quot;,&quot;Mas, sekalian tambahkan modul perpustakaan, ya. Santri banyak pinjam kitab. Sebentar kok, kan sudah ada datanya.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Langsung menyanggupi agar pengasuh senang.&quot;,&quot;tag&quot;:&quot;Sanggupi langsung&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Pengasuh senang hari ini, tetapi lingkup bertambah tanpa penyesuaian waktu dan biaya. Inilah scope creep.&quot;,&quot;to&quot;:&quot;a&quot;},{&quot;t&quot;:&quot;Menolak: \\&quot;Itu tidak ada di scope statement, Pak.\\&quot;&quot;,&quot;tag&quot;:&quot;Tolak kaku&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Secara aturan benar, tetapi pengasuh adalah sponsor dengan pengaruh besar. Penolakan tanpa jalan keluar merusak hubungan.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Berterima kasih, mencatatnya sebagai permintaan perubahan, dan berjanji memberi analisis dampak dalam dua hari.&quot;,&quot;tag&quot;:&quot;Catat sebagai change request&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Permintaan diterima dengan baik tanpa langsung disanggupi, lalu dianalisis dampaknya.&quot;,&quot;to&quot;:&quot;c&quot;}]},&quot;a&quot;:{&quot;text&quot;:&quot;Dua minggu kemudian modul perpustakaan setengah jadi, modul tagihan terlambat. Bagian keuangan menanyakan tagihan bulan depan.&quot;,&quot;say&quot;:[[&quot;Bag. keuangan&quot;,&quot;Katanya tagihan bisa otomatis bulan ini. Kenapa belum?&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Melapor jujur kepada pengasuh dan mengajukan perubahan resmi: geser tenggat atau tunda perpustakaan.&quot;,&quot;tag&quot;:&quot;Lapor dan ajukan perubahan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Langkah perbaikan yang benar, meskipun terlambat. Kepercayaan masih bisa dipulihkan.&quot;,&quot;to&quot;:&quot;endMid&quot;},{&quot;t&quot;:&quot;Lembur diam-diam tanpa memberi tahu siapa pun.&quot;,&quot;tag&quot;:&quot;Lembur diam-diam&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Masalah ditutupi. Mutu turun, tim kelelahan, dan risiko keterlambatan tetap ada.&quot;,&quot;to&quot;:&quot;endBad&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Pengasuh terdiam. Beberapa hari kemudian beliau jarang membalas pesan tim.&quot;,&quot;say&quot;:[[&quot;Pengasuh&quot;,&quot;Ya sudah, kalau tidak bisa.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Menemui pengasuh, menjelaskan alasan, dan menawarkan proses perubahan atau fase berikutnya.&quot;,&quot;tag&quot;:&quot;Jelaskan dan tawarkan jalan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Batas lingkup tetap terjaga, dan sponsor mendapat pilihan yang jelas.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Membiarkan saja; yang penting lingkup aman.&quot;,&quot;tag&quot;:&quot;Biarkan&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Lingkup aman, tetapi dukungan sponsor melemah. Proyek bisa macet saat butuh keputusan.&quot;,&quot;to&quot;:&quot;endBad&quot;}]},&quot;c&quot;:{&quot;text&quot;:&quot;Hasil analisis tim: modul perpustakaan butuh sekitar 12 hari kerja dan Rp6 juta (data ilustrasi). Sisa ruang jadwal hanya 10 hari.&quot;,&quot;ask&quot;:&quot;Bagaimana Anda menyampaikannya?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Memberi pengasuh tiga pilihan: fase 2 setelah serah terima, tambah anggaran dan geser tenggat, atau tukar dengan fitur prioritas Could.&quot;,&quot;tag&quot;:&quot;Beri pilihan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Sponsor memutuskan dengan informasi dampak yang jelas. Bila disetujui, scope statement, WBS, jadwal, dan biaya diperbarui.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Memutuskan sendiri untuk menunda tanpa bertanya.&quot;,&quot;tag&quot;:&quot;Putuskan sendiri&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Keputusannya mungkin benar, tetapi manajer proyek tidak berwenang mengubah lingkup tanpa sponsor.&quot;,&quot;to&quot;:&quot;endMid&quot;}]},&quot;endGood&quot;:{&quot;title&quot;:&quot;Lingkup terkendali&quot;,&quot;k&quot;:&quot;good&quot;,&quot;end&quot;:&quot;Perubahan masuk lewat jalur resmi. Sponsor tetap mendukung, dan baseline diperbarui bila perubahan disetujui.&quot;},&quot;endMid&quot;:{&quot;title&quot;:&quot;Selamat, dengan catatan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;end&quot;:&quot;Proyek kembali ke jalur, tetapi ada keterlambatan atau kepercayaan yang perlu dipulihkan. Lain kali, catat permintaan sejak awal.&quot;},&quot;endBad&quot;:{&quot;title&quot;:&quot;Scope creep terjadi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;end&quot;:&quot;Lingkup bertambah tanpa penyesuaian waktu dan biaya. Tenggat terlewat dan mutu turun.&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 4 · data ilustrasi</span></div><h2>\"Cuma sedikit, kok\"</h2><div class=\"sim sim-creep\" data-sim=\"creep\" data-cfg=\"{&quot;id&quot;:&quot;p5-sim&quot;,&quot;ask&quot;:&quot;Klik permintaan \\&quot;kecil\\&quot; yang Anda sanggupi tanpa proses perubahan:&quot;,&quot;room&quot;:{&quot;d&quot;:10,&quot;b&quot;:3},&quot;unitD&quot;:&quot;hari kerja&quot;,&quot;unitB&quot;:&quot;juta&quot;,&quot;lblN&quot;:&quot;permintaan diterima&quot;,&quot;lblD&quot;:&quot;Tambahan waktu&quot;,&quot;lblB&quot;:&quot;Tambahan biaya&quot;,&quot;msg0&quot;:&quot;Belum ada permintaan tambahan. Jadwal dan anggaran sesuai baseline.&quot;,&quot;msgOk&quot;:&quot;Masih muat, tetapi sisa ruang untuk risiko lain makin tipis. Tetap catat sebagai permintaan perubahan.&quot;,&quot;msgOver&quot;:&quot;Melewati sisa ruang jadwal atau anggaran. Inilah scope creep: tiap permintaan kecil, tetapi jumlahnya besar.&quot;,&quot;items&quot;:[{&quot;t&quot;:&quot;Tambah kolom data wali di formulir&quot;,&quot;d&quot;:0.5,&quot;b&quot;:0},{&quot;t&quot;:&quot;Ganti warna tema aplikasi&quot;,&quot;d&quot;:1,&quot;b&quot;:0},{&quot;t&quot;:&quot;Ekspor rapor PDF dengan kop baru&quot;,&quot;d&quot;:1,&quot;b&quot;:0},{&quot;t&quot;:&quot;Cetak kartu santri ber-QR&quot;,&quot;d&quot;:2,&quot;b&quot;:0.8},{&quot;t&quot;:&quot;Laporan infak dan donatur&quot;,&quot;d&quot;:3,&quot;b&quot;:0.5},{&quot;t&quot;:&quot;Notifikasi tagihan lewat WhatsApp&quot;,&quot;d&quot;:4,&quot;b&quot;:1.5},{&quot;t&quot;:&quot;Modul izin pulang santri&quot;,&quot;d&quot;:5,&quot;b&quot;:1}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.82em\">Angka ilustrasi: sisa ruang jadwal 10 hari kerja dan sisa anggaran Rp3 juta sebelum tenggat. Penyederhanaan untuk simulasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses</span><span>Indikator 4</span></div><h2>Mengendalikan lingkup: jalur <button type=\"button\" class=\"term\" data-term=\"change-request\">permintaan perubahan</button></h2><div class=\"grid5\"><div class=\"card\"><h3>1. Ajukan tertulis</h3><p>Siapa, apa, mengapa.</p></div><div class=\"card\"><h3>2. Analisis dampak</h3><p>Lingkup, waktu, biaya, risiko, mutu.</p></div><div class=\"card hl\"><h3>3. Putuskan</h3><p>Oleh sponsor atau pihak berwenang.</p></div><div class=\"card\"><h3>4. Perbarui baseline</h3><p>Scope statement, WBS, jadwal, biaya.</p></div><div class=\"card\"><h3>5. Komunikasikan</h3><p>Ke tim dan pemangku kepentingan.</p></div></div><p style=\"margin-top:.8em\">Perubahan bukan musuh. Yang berbahaya adalah perubahan <b>tanpa jalur</b>. <button type=\"button\" class=\"term\" data-term=\"control-scope\">Pengendalian lingkup</button> membandingkan pekerjaan dengan <button type=\"button\" class=\"term\" data-term=\"scope-baseline\">scope baseline</button>.</p><p class=\"muted\" style=\"font-size:.85em\">Langkah diringkas dosen dari pembahasan pengendalian lingkup (PMI, 2025; Schwalbe, 2019). Pengendalian perubahan terpadu dibahas lagi di Pertemuan 15.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 25 menit</span></div><h2>WBS proyek kelompok Anda</h2><div class=\"cols\"><div><p><b>Dari scope statement Pertemuan 4:</b></p><ol><li>Tulis tingkat 1 (proyek) dan tingkat 2 (deliverable + manajemen proyek).</li><li>Pecah tiap cabang sampai work package, beri kode.</li><li>Cek aturan 100%: ada yang terlupa? ada yang di luar lingkup?</li><li>Isi WBS dictionary untuk dua work package terpenting.</li><li>Tulis dua potensi scope creep dan siapa yang berwenang memutuskan perubahan.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dinilai rekan</h3><ul><li>Semua deliverable scope statement ada</li><li>Kata benda, bukan urutan kegiatan</li><li>Ada cabang manajemen proyek dan pelatihan</li><li>Tidak ada yang tercantum di \"tidak termasuk\"</li><li>Kode bertingkat konsisten</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai WBS kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p5-wbs-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · WBS proyek kelompok (MPSI P5)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 3 · SI Koperasi Pesantren&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di WBS mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. Cabang 1.4 masih berupa kata kerja…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:9,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:13,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:17,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Kelengkapan (aturan 100%)&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Banyak deliverable scope statement tidak muncul.&quot;,&quot;Sebagian deliverable ada; pekerjaan pendukung (manajemen proyek, pelatihan) terlupa.&quot;,&quot;Semua deliverable ada; satu atau dua pekerjaan kecil terlupa.&quot;,&quot;Semua pekerjaan tercakup dan tidak ada yang di luar lingkup.&quot;]},{&quot;t&quot;:&quot;Ketepatan dekomposisi&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Masih berupa daftar tugas tanpa tingkat.&quot;,&quot;Ada tingkat, tetapi banyak kata kerja atau tumpang tindih.&quot;,&quot;Bertingkat dan berupa hasil; sedikit tumpang tindih.&quot;,&quot;Bertingkat rapi, berupa hasil, tanpa tumpang tindih.&quot;]},{&quot;t&quot;:&quot;Work package terkelola&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Tidak jelas mana work package.&quot;,&quot;Work package terlalu besar untuk diestimasi.&quot;,&quot;Sebagian besar bisa diestimasi dan punya penanggung jawab.&quot;,&quot;Semua bisa diestimasi dan punya satu penanggung jawab.&quot;]},{&quot;t&quot;:&quot;WBS dictionary&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Belum ada.&quot;,&quot;Ada, tetapi hanya nama dan uraian singkat.&quot;,&quot;Ada untuk dua work package dengan kriteria penerimaan.&quot;,&quot;Lengkap, terukur, dan terlacak ke kebutuhan.&quot;]},{&quot;t&quot;:&quot;Potensi scope creep&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak disebutkan.&quot;,&quot;Disebut umum (\\&quot;mitra minta tambah\\&quot;).&quot;,&quot;Dua potensi spesifik dari proyek mitra.&quot;,&quot;Spesifik, disertai pihak yang berwenang memutuskan perubahan.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>WBS</b> memecah seluruh lingkup secara bertingkat sampai <b>work package</b>.</li><li>Kelompokkan berdasarkan deliverable; cek dengan <b>aturan 100%</b>.</li><li><b>WBS dictionary</b> merinci tiap komponen dan menautkannya ke kebutuhan.</li><li><b>Validasi lingkup</b> = penerimaan resmi deliverable oleh sponsor/mitra.</li><li><b>Scope creep</b> dicegah dengan jalur permintaan perubahan, bukan dengan menolak semua perubahan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p5-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Tingkat kedua WBS yang berorientasi deliverable berisi…&quot;,&quot;o&quot;:[&quot;Urutan kegiatan per minggu&quot;,&quot;Hasil utama proyek seperti modul pendaftaran dan modul tagihan&quot;,&quot;Nama anggota tim&quot;,&quot;Daftar risiko proyek&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;WBS berorientasi deliverable mengelompokkan pekerjaan menurut hasil, bukan waktu atau orang.&quot;},{&quot;q&quot;:&quot;Work package adalah…&quot;,&quot;o&quot;:[&quot;Seluruh pekerjaan proyek&quot;,&quot;Pekerjaan di tingkat terendah WBS yang biaya dan durasinya diestimasi&quot;,&quot;Dokumen persetujuan sponsor&quot;,&quot;Rapat koordinasi mingguan&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Work package cukup kecil untuk diestimasi dan diberi satu penanggung jawab.&quot;},{&quot;q&quot;:&quot;WBS kelompok tidak memuat migrasi data santri lama, padahal pekerjaan itu diperlukan. Aturan yang dilanggar adalah…&quot;,&quot;o&quot;:[&quot;Aturan 100%&quot;,&quot;Prioritas MoSCoW&quot;,&quot;Kriteria penerimaan&quot;,&quot;Power/interest grid&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Aturan 100% meminta seluruh pekerjaan proyek tercakup di WBS.&quot;},{&quot;q&quot;:&quot;Siapa yang melakukan validasi lingkup?&quot;,&quot;o&quot;:[&quot;Programmer saat menguji kodenya&quot;,&quot;Sponsor atau mitra yang menerima deliverable secara resmi&quot;,&quot;Dosen pengampu&quot;,&quot;Penyedia hosting&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Validasi lingkup adalah penerimaan resmi deliverable oleh sponsor atau pelanggan; uji internal tim termasuk kendali mutu.&quot;},{&quot;q&quot;:&quot;Di tengah proyek, mitra meminta fitur yang tidak ada di scope statement. Langkah paling tepat adalah…&quot;,&quot;o&quot;:[&quot;Langsung mengerjakannya agar mitra senang&quot;,&quot;Menolak tanpa penjelasan&quot;,&quot;Mencatatnya sebagai permintaan perubahan, menganalisis dampaknya, dan meminta keputusan sponsor&quot;,&quot;Mengerjakannya diam-diam di luar jam kerja&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Perubahan boleh terjadi asalkan lewat jalur resmi dengan penyesuaian waktu, biaya, dan persetujuan.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian membuat WBS, validasi, dan pengendalian lingkup dalam Schwalbe (2019); bagian WBS dalam Kerzner (2025). Pertemuan 6 membahas penjadwalan: dari work package ke aktivitas.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · scope statement dan WBS)</h3><ul><li>Finalkan <b>scope statement</b> dari Pertemuan 4.</li><li>Susun <b>WBS</b> minimal tiga tingkat dengan kode, sesuai umpan balik rekan.</li><li>Lengkapi <b>WBS dictionary</b> untuk work package utama.</li><li>Tulis jalur <b>permintaan perubahan</b> dan pihak yang berwenang.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Dinilai dengan <b>Penilaian Hasil Produk</b> memakai bobot blok Pertemuan 4–5 (Tugas 1: 10%; UTS: 5%). Tenggat: <b>[PERLU DIISI]</b>. Format dan rubrik ada di lembar Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Work Breakdown Structure (WBS)</span></dt><dd>Pemecahan seluruh lingkup pekerjaan proyek secara bertingkat menjadi bagian-bagian yang lebih kecil dan dapat dikelola. <i>(struktur rincian kerja)</i></dd></div><div><dt><span class=\"en\">Decomposition</span></dt><dd>Teknik memecah lingkup dan deliverable menjadi bagian yang lebih kecil sampai dapat diestimasi dan dikelola. <i>(dekomposisi)</i></dd></div><div><dt><span class=\"en\">Work package</span></dt><dd>Pekerjaan di tingkat terendah WBS yang biaya dan durasinya diestimasi dan dikelola. <i>(paket kerja)</i></dd></div><div><dt><span class=\"en\">100% rule</span></dt><dd>Prinsip bahwa WBS mencakup seluruh pekerjaan proyek, dan jumlah pekerjaan pada tingkat anak sama dengan pekerjaan induknya, tidak kurang dan tidak lebih. <i>(aturan 100%)</i></dd></div><div><dt><span class=\"en\">WBS dictionary</span></dt><dd>Dokumen yang merinci setiap komponen WBS: uraian, deliverable, penanggung jawab, kriteria penerimaan, dan informasi jadwal. <i>(kamus WBS)</i></dd></div><div><dt><span class=\"en\">Scope baseline</span></dt><dd>Versi lingkup yang sudah disetujui (scope statement, WBS, dan WBS dictionary) sebagai pembanding selama proyek. <i>(baseline lingkup)</i></dd></div><div><dt><span class=\"en\">Validate scope</span></dt><dd>Penerimaan resmi deliverable yang sudah selesai oleh sponsor atau pelanggan. <i>(validasi lingkup)</i></dd></div><div><dt><span class=\"en\">Control scope</span></dt><dd>Memantau status lingkup dan mengelola perubahan terhadap scope baseline. <i>(pengendalian lingkup)</i></dd></div><div><dt><span class=\"en\">Scope creep</span></dt><dd>Bertambahnya lingkup secara tidak terkendali tanpa penyesuaian waktu, biaya, dan sumber daya. <i>(pemekaran lingkup)</i></dd></div><div><dt><span class=\"en\">Gold plating</span></dt><dd>Tim menambahkan fitur atau hasil yang tidak diminta, dengan anggapan akan menyenangkan pelanggan. <i>(penambahan berlebihan oleh tim)</i></dd></div><div><dt><span class=\"en\">Change request</span></dt><dd>Usulan resmi untuk mengubah lingkup, jadwal, biaya, atau dokumen proyek lainnya, yang dianalisis dan diputuskan sebelum dikerjakan. <i>(permintaan perubahan)</i></dd></div><div><dt><span class=\"en\">Acceptance criteria</span></dt><dd>Syarat yang harus dipenuhi sebelum deliverable diterima oleh sponsor atau pelanggan. <i>(kriteria penerimaan)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Project scope statement</span></dt><dd>Dokumen yang menguraikan lingkup, deliverable utama, asumsi, dan batasan proyek, sebagai dasar kesepakatan bersama. <i>(pernyataan lingkup proyek)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 6.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":6,"title":"Penjadwalan Proyek (1)","subtitle":"Aktivitas, dependensi, network diagram (PDM), estimasi durasi, dan Critical Path Method","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Penjadwalan Proyek (1)</h1><p class=\"lead\">Aktivitas, dependensi, network diagram, estimasi durasi, dan jalur kritis</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>WBS → aktivitas → jalur kritis</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun jadwal proyek dan menganalisis jalur kritis (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1, 2, dan 3)</span></h3><ol><li>Ketepatan menurunkan aktivitas dari WBS dan menentukan dependensinya.</li><li>Ketepatan estimasi durasi (analogous, parametric, three-point/PERT).</li><li>Ketepatan menghitung jalur kritis dan float.</li><li>Kelengkapan Gantt chart pada aplikasi manajemen proyek. <span class=\"muted\">(Pertemuan 7)</span></li><li>Ketepatan menerapkan crashing atau fast tracking. <span class=\"muted\">(Pertemuan 7)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 5 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa itu work package?</li><li>Apa isi aturan 100% pada WBS?</li><li>Mengapa WBS bukan jadwal?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari WBS ke jadwal</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen jadwal: dari WBS, definisikan aktivitas, urutkan aktivitas, estimasi durasi, dan susun jadwal dengan CPM dibahas hari ini di Pertemuan 6; Gantt chart di aplikasi dan kompresi jadwal di Pertemuan 7.\"><defs><marker id=\"ps6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"87\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Definisikan aktivitas</text><text x=\"87\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">work package → aktivitas</text><line x1=\"165\" y1=\"72\" x2=\"181\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps6)\"/><rect x=\"184\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"261\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Urutkan aktivitas</text><text x=\"261\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">dependensi, PDM</text><line x1=\"339\" y1=\"72\" x2=\"355\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps6)\"/><rect x=\"358\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"435\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Estimasi durasi</text><text x=\"435\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">analogi, parametrik, PERT</text><line x1=\"513\" y1=\"72\" x2=\"529\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps6)\"/><rect x=\"532\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"609\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Susun jadwal</text><text x=\"609\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">CPM, jalur kritis, float</text><line x1=\"687\" y1=\"72\" x2=\"703\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps6)\"/><rect x=\"706\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"783\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Gantt &amp; kompresi</text><text x=\"783\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">aplikasi, crashing, fast tracking</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 6 (HARI INI) ·······································································</text><text x=\"706\" y=\"150\" class=\"s-s\">PERTEMUAN 7</text></svg><figcaption>Alur manajemen jadwal dalam mata kuliah ini, dirangkum dari pembahasan project schedule management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>\"Modul tagihan selesai kapan, Mas?\"</h2><div class=\"cols w\"><div><p class=\"lead\">Kelompok sudah memecah modul tagihan menjadi delapan aktivitas. Durasinya bila dijumlahkan:</p><p style=\"font-family:var(--mono);font-size:1.05em\">5 + 4 + 3 + 4 + 6 + 5 + 3 + 2 = <b>32 hari kerja</b></p><p>Ketua kelompok langsung menjawab pengasuh: \"32 hari kerja, Pak.\"</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Diskusikan 3 menit</h3><ol><li>Apakah jawaban 32 hari pasti benar?</li><li>Kapan durasi proyek bisa lebih pendek dari jumlah semua durasi?</li><li>Informasi apa yang kurang?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Dari work package ke <button type=\"button\" class=\"term\" data-term=\"activity\">aktivitas</button></h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A distinct, scheduled portion of work performed during the course of a project.\"</p><p class=\"tr\">\"Suatu bagian pekerjaan yang tersendiri dan terjadwal yang dilaksanakan selama berlangsungnya suatu proyek.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><ul><li>WBS berisi <b>hasil</b> (kata benda); aktivitas berisi <b>pekerjaan</b> (kata kerja) yang punya durasi.</li><li>Satu work package bisa menjadi beberapa aktivitas.</li><li>Catat dalam <b>daftar aktivitas</b>: ID, nama, work package asal, durasi, pendahulu.</li><li><button type=\"button\" class=\"term\" data-term=\"milestone\">Milestone</button> berdurasi nol, menandai titik penting.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Contoh: WBS 1.3.1</h3><p><b>Analisis &amp; desain alur tagihan</b> (work package) diturunkan menjadi:</p><ul style=\"margin:0\"><li>A · Analisis kebutuhan rinci tagihan</li><li>B · Desain basis data</li><li>C · Desain antarmuka tagihan</li></ul><p class=\"muted\" style=\"margin:.5em 0 0;font-size:.85em\">Milestone: \"Modul tagihan diterima\" setelah uji dan pelatihan.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Indikator 1 · kasus ilustrasi</span></div><h2>Daftar aktivitas modul tagihan</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>ID</th><th>Aktivitas</th><th>Work package</th><th>Durasi (hari kerja)</th><th>Pendahulu</th></tr></thead><tbody><tr><td>A</td><td>Analisis kebutuhan rinci tagihan</td><td>1.3.1</td><td>5</td><td>–</td></tr><tr><td>B</td><td>Desain basis data</td><td>1.3.1</td><td>4</td><td>A</td></tr><tr><td>C</td><td>Desain antarmuka tagihan</td><td>1.3.1</td><td>3</td><td>A</td></tr><tr><td>D</td><td>Migrasi data santri lama</td><td>1.2.4</td><td>4</td><td>B</td></tr><tr><td>E</td><td>Pembuatan fitur tagihan bulanan</td><td>1.3.2</td><td>6</td><td>B, C</td></tr><tr><td>F</td><td>Pembuatan pencatatan pembayaran</td><td>1.3.3</td><td>5</td><td>E</td></tr><tr><td>G</td><td>Uji modul tagihan</td><td>1.3.4</td><td>3</td><td>D, F</td></tr><tr><td>H</td><td>Pelatihan bagian keuangan</td><td>1.6.2</td><td>2</td><td>G</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.4em;font-size:.82em\">Kasus ilustrasi. D (migrasi data) berasal dari work package 1.2.4 yang ditambahkan saat cek aturan 100% di Pertemuan 5; H dari 1.6.2.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Jenis <button type=\"button\" class=\"term\" data-term=\"dependency\">dependensi</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 880 190\" role=\"img\" aria-label=\"Empat jenis dependensi: finish-to-start, start-to-start, finish-to-finish, start-to-finish. Masing-masing digambar sebagai dua batang A dan B dengan panah penghubung.\"><defs><marker id=\"pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"5\" y=\"5\" width=\"210\" height=\"180\" rx=\"8\" class=\"s-acc\"/><text x=\"110\" y=\"30\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">FS · Finish-to-Start</text><rect x=\"20\" y=\"48\" width=\"90\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"28\" y=\"64\" class=\"s-t\" style=\"font-size:12px\">A</text><rect x=\"110\" y=\"104\" width=\"90\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"118\" y=\"120\" class=\"s-t\" style=\"font-size:12px\">B</text><path d=\"M110 70 L110 87 L110 87 L110 101\" class=\"s-line\" marker-end=\"url(#pd)\"/><text x=\"110\" y=\"160\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">B mulai setelah A selesai</text><rect x=\"225\" y=\"5\" width=\"210\" height=\"180\" rx=\"8\" class=\"s-box\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">SS · Start-to-Start</text><rect x=\"240\" y=\"48\" width=\"110\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"248\" y=\"64\" class=\"s-t\" style=\"font-size:12px\">A</text><rect x=\"240\" y=\"104\" width=\"90\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"248\" y=\"120\" class=\"s-t\" style=\"font-size:12px\">B</text><path d=\"M240 70 L240 87 L240 87 L240 101\" class=\"s-line\" marker-end=\"url(#pd)\"/><text x=\"330\" y=\"160\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">B mulai setelah A mulai</text><rect x=\"445\" y=\"5\" width=\"210\" height=\"180\" rx=\"8\" class=\"s-box\"/><text x=\"550\" y=\"30\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">FF · Finish-to-Finish</text><rect x=\"460\" y=\"48\" width=\"130\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"468\" y=\"64\" class=\"s-t\" style=\"font-size:12px\">A</text><rect x=\"510\" y=\"104\" width=\"80\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"518\" y=\"120\" class=\"s-t\" style=\"font-size:12px\">B</text><path d=\"M590 70 L590 87 L590 87 L590 101\" class=\"s-line\" marker-end=\"url(#pd)\"/><text x=\"550\" y=\"160\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">B selesai setelah A selesai</text><rect x=\"665\" y=\"5\" width=\"210\" height=\"180\" rx=\"8\" class=\"s-box\"/><text x=\"770\" y=\"30\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">SF · Start-to-Finish</text><rect x=\"770\" y=\"48\" width=\"90\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"778\" y=\"64\" class=\"s-t\" style=\"font-size:12px\">A</text><rect x=\"680\" y=\"104\" width=\"90\" height=\"22\" rx=\"3\" class=\"s-soft\"/><text x=\"688\" y=\"120\" class=\"s-t\" style=\"font-size:12px\">B</text><path d=\"M770 70 L770 87 L770 87 L770 101\" class=\"s-line\" marker-end=\"url(#pd)\"/><text x=\"770\" y=\"160\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">B selesai setelah A mulai</text></svg><figcaption>Empat jenis dependensi pada PDM, digambar ulang dari pembahasan Schwalbe (2019). FS adalah yang paling umum.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><h3>Wajib</h3><p>Melekat pada sifat pekerjaan: tidak bisa menguji sebelum kode ada.</p></div><div class=\"card\"><h3>Pilihan</h3><p>Ditentukan tim berdasarkan praktik baik; bisa diubah bila perlu.</p></div><div class=\"card\"><h3>Eksternal</h3><p>Bergantung pada pihak luar: izin, vendor, data dari instansi.</p></div></div><p class=\"muted\" style=\"margin-top:.4em;font-size:.82em\"><button type=\"button\" class=\"term\" data-term=\"lead-lag\">Lead dan lag</button> menggeser awal aktivitas penerus lebih cepat atau lebih lambat. Kategori diadaptasi dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diagram</span><span>Indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"network-diagram\">Network diagram</button> dengan <button type=\"button\" class=\"term\" data-term=\"pdm\">PDM</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 880 286\" role=\"img\" aria-label=\"Diagram jaringan PDM modul tagihan SI Pesantren Al-Hikmah: A analisis menuju B desain basis data dan C desain antarmuka; B menuju D migrasi data dan E fitur tagihan; C menuju E; E menuju F pencatatan pembayaran; D dan F menuju G uji modul; G menuju H pelatihan.\"><defs><marker id=\"pn1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><defs><marker id=\"pn1c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"4.5\" markerHeight=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" style=\"fill:var(--primary)\"/></marker></defs><line x1=\"120\" y1=\"151\" x2=\"158\" y2=\"76\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"120\" y1=\"151\" x2=\"158\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"270\" y1=\"76\" x2=\"308\" y2=\"76\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"270\" y1=\"76\" x2=\"308\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"270\" y1=\"226\" x2=\"308\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"420\" y1=\"226\" x2=\"458\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"420\" y1=\"76\" x2=\"608\" y2=\"151\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"570\" y1=\"226\" x2=\"608\" y2=\"151\" class=\"s-line\" marker-end=\"url(#pn1)\"/><line x1=\"720\" y1=\"151\" x2=\"758\" y2=\"151\" class=\"s-line\" marker-end=\"url(#pn1)\"/><rect x=\"10\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"65\" y=\"145\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">A · Analisis</text><text x=\"65\" y=\"167\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">5 hari</text><rect x=\"160\" y=\"40\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"215\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">B · Desain DB</text><text x=\"215\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">4 hari</text><rect x=\"160\" y=\"190\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"215\" y=\"220\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">C · Desain UI</text><text x=\"215\" y=\"242\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">3 hari</text><rect x=\"310\" y=\"40\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"365\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">D · Migrasi data</text><text x=\"365\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">4 hari</text><rect x=\"310\" y=\"190\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"365\" y=\"220\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">E · Fitur tagihan</text><text x=\"365\" y=\"242\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">6 hari</text><rect x=\"460\" y=\"190\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"515\" y=\"220\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">F · Catat bayar</text><text x=\"515\" y=\"242\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">5 hari</text><rect x=\"610\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"665\" y=\"145\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">G · Uji modul</text><text x=\"665\" y=\"167\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">3 hari</text><rect x=\"760\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-box\"/><text x=\"815\" y=\"145\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">H · Pelatihan</text><text x=\"815\" y=\"167\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">2 hari</text><text x=\"10\" y=\"280\" class=\"s-hd\" style=\"font-size:12px\">KOTAK = AKTIVITAS · PANAH = DEPENDENSI FINISH-TO-START</text></svg><figcaption>Kasus ilustrasi. Diagram jaringan dengan metode PDM (activity on node) sebagaimana dibahas Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknik</span><span>Indikator 2</span></div><h2>Tiga teknik estimasi durasi</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Teknik</th><th>Cara</th><th>Contoh di modul tagihan</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"analogous\">Analogous</button></b></td><td>Memakai durasi aktivitas serupa di proyek lalu; cepat, kurang akurat.</td><td>B desain basis data = 4 hari, sama dengan proyek SI madrasah tahun lalu yang skalanya mirip.</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"parametric\">Parametric</button></b></td><td>Jumlah pekerjaan × produktivitas.</td><td>D migrasi: 1.200 data santri ÷ 300 data per hari = 4 hari.</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"three-point\">Three-point (PERT)</button></b></td><td>Tiga nilai: optimistis (o), paling mungkin (m), pesimistis (p).<br><span style=\"font-family:var(--mono)\">t<sub>E</sub> = (o + 4m + p) / 6</span></td><td>E fitur tagihan: o = 4, m = 6, p = 8 → (4 + 24 + 8) / 6 = 6 hari.</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.4em;font-size:.82em\">Diadaptasi dari Kerzner (2025) dan Schwalbe (2019). Angka contoh adalah data ilustrasi. Durasi = lama waktu kalender kerja, berbeda dengan effort (jumlah jam-orang).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 2 · geser nilai o, m, p</span></div><h2>Kalkulator estimasi tiga titik (PERT)</h2><div class=\"sim sim-pert\" data-sim=\"pert\" data-cfg=\"{&quot;id&quot;:&quot;p6-pert&quot;,&quot;o&quot;:4,&quot;m&quot;:6,&quot;p&quot;:8,&quot;max&quot;:20,&quot;unit&quot;:&quot;hari&quot;,&quot;name&quot;:&quot;E · Fitur tagihan bulanan&quot;,&quot;lo&quot;:&quot;Optimistis (o)&quot;,&quot;mo&quot;:&quot;Paling mungkin (m)&quot;,&quot;pe&quot;:&quot;Pesimistis (p)&quot;,&quot;note&quot;:&quot;Data ilustrasi. Coba p = 14: estimasi naik, tetapi tidak sebesar rata-rata sederhana.&quot;,&quot;lblRange&quot;:&quot;Rentang ±1σ&quot;,&quot;lblAvg&quot;:&quot;Pembanding rata-rata sederhana&quot;,&quot;msgBad&quot;:&quot;Periksa urutan: seharusnya o ≤ m ≤ p.&quot;}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"cpm\">Critical Path Method</button></h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The sequence of activities that represents the longest path through a project, which determines the shortest possible duration.\"</p><p class=\"tr\">\"Rangkaian aktivitas yang merupakan jalur terpanjang melalui suatu proyek, yang menentukan durasi tersingkat yang mungkin.\"</p><div class=\"src\">PMI (2025), definisi critical path; terjemahan harfiah penyusun</div></blockquote><p>Empat angka untuk setiap aktivitas: <b>ES</b> (mulai paling awal), <b>EF</b> (selesai paling awal), <b>LS</b> (mulai paling lambat), <b>LF</b> (selesai paling lambat).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Aturan hitung</h3><p><b><button type=\"button\" class=\"term\" data-term=\"forward-pass\">Forward pass</button></b><br><span style=\"font-family:var(--mono);font-size:.9em\">ES = EF terbesar dari pendahulu<br>EF = ES + durasi</span></p><p><b><button type=\"button\" class=\"term\" data-term=\"backward-pass\">Backward pass</button></b><br><span style=\"font-family:var(--mono);font-size:.9em\">LF = LS terkecil dari penerus<br>LS = LF − durasi</span></p><p style=\"margin:0\"><b>Float</b> = LS − ES. <button type=\"button\" class=\"term\" data-term=\"critical-path\">Jalur kritis</button>: float 0.</p></div></div><p class=\"muted\" style=\"margin-top:.3em;font-size:.82em\">Konvensi mata kuliah ini: aktivitas awal mulai hari ke-0.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 3 · tekan Play</span></div><h2>Forward pass dan backward pass</h2><p class=\"muted\" style=\"margin:-.2em 0 .5em;font-size:.82em;font-family:var(--mono)\">A(5) → B(4), C(3) · B → D(4), E(6) · C → E · E → F(5) · D, F → G(3) · G → H(2)</p><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p6-cpm&quot;,&quot;ms&quot;:3600,&quot;steps&quot;:[{&quot;t&quot;:&quot;Mulai di A&quot;,&quot;en&quot;:&quot;forward&quot;,&quot;d&quot;:&quot;Aktivitas tanpa pendahulu mulai hari ke-0. EF = ES + durasi.&quot;,&quot;ex&quot;:&quot;A: ES 0, EF 0 + 5 = 5.&quot;},{&quot;t&quot;:&quot;B dan C&quot;,&quot;en&quot;:&quot;forward&quot;,&quot;d&quot;:&quot;Pendahulu B dan C hanya A, jadi ES = EF A.&quot;,&quot;ex&quot;:&quot;B: ES 5, EF 9. C: ES 5, EF 8.&quot;},{&quot;t&quot;:&quot;Gabung di E&quot;,&quot;en&quot;:&quot;merge&quot;,&quot;d&quot;:&quot;E punya dua pendahulu. Ambil EF yang terbesar.&quot;,&quot;ex&quot;:&quot;E: ES = maks(9, 8) = 9, EF 15. D: ES 9, EF 13.&quot;},{&quot;t&quot;:&quot;Sampai H&quot;,&quot;en&quot;:&quot;forward&quot;,&quot;d&quot;:&quot;Lanjutkan sampai aktivitas terakhir. EF terbesar = durasi proyek.&quot;,&quot;ex&quot;:&quot;F: 15–20. G: ES = maks(13, 20) = 20, EF 23. H: 23–25. Durasi proyek 25 hari.&quot;},{&quot;t&quot;:&quot;Mundur dari H&quot;,&quot;en&quot;:&quot;backward&quot;,&quot;d&quot;:&quot;LF aktivitas terakhir = durasi proyek. LS = LF − durasi.&quot;,&quot;ex&quot;:&quot;H: LF 25, LS 23. G: LF 23, LS 20.&quot;},{&quot;t&quot;:&quot;F, D, E&quot;,&quot;en&quot;:&quot;backward&quot;,&quot;d&quot;:&quot;LF = LS terkecil dari penerus.&quot;,&quot;ex&quot;:&quot;F: LF 20, LS 15. D: LF 20, LS 16. E: LF 15, LS 9.&quot;},{&quot;t&quot;:&quot;Pisah di B dan A&quot;,&quot;en&quot;:&quot;burst&quot;,&quot;d&quot;:&quot;B dan A punya dua penerus. Ambil LS yang terkecil.&quot;,&quot;ex&quot;:&quot;C: LF 9, LS 6. B: LF = min(16, 9) = 9, LS 5. A: LF = min(5, 6) = 5, LS 0.&quot;},{&quot;t&quot;:&quot;Float&quot;,&quot;en&quot;:&quot;total float&quot;,&quot;d&quot;:&quot;Float = LS − ES. Aktivitas dengan float 0 membentuk jalur kritis.&quot;,&quot;ex&quot;:&quot;Float A, B, E, F, G, H = 0 → jalur kritis A–B–E–F–G–H (25 hari). C = 1, D = 7.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil</span><span>Indikator 3</span></div><h2>Jalur kritis: 25 hari, bukan 32</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 300\" role=\"img\" aria-label=\"Diagram jaringan PDM modul tagihan SI Pesantren Al-Hikmah: A analisis menuju B desain basis data dan C desain antarmuka; B menuju D migrasi data dan E fitur tagihan; C menuju E; E menuju F pencatatan pembayaran; D dan F menuju G uji modul; G menuju H pelatihan. Jalur kritis A, B, E, F, G, H dengan durasi 25 hari; float C 1 hari, D 7 hari.\"><defs><marker id=\"pn2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><defs><marker id=\"pn2c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"4.5\" markerHeight=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" style=\"fill:var(--primary)\"/></marker></defs><line x1=\"120\" y1=\"151\" x2=\"158\" y2=\"76\" class=\"s-line\" marker-end=\"url(#pn2c)\" style=\"stroke:var(--primary);stroke-width:3.5\"/><line x1=\"120\" y1=\"151\" x2=\"158\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn2)\"/><line x1=\"270\" y1=\"76\" x2=\"308\" y2=\"76\" class=\"s-line\" marker-end=\"url(#pn2)\"/><line x1=\"270\" y1=\"76\" x2=\"308\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn2c)\" style=\"stroke:var(--primary);stroke-width:3.5\"/><line x1=\"270\" y1=\"226\" x2=\"308\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn2)\"/><line x1=\"420\" y1=\"226\" x2=\"458\" y2=\"226\" class=\"s-line\" marker-end=\"url(#pn2c)\" style=\"stroke:var(--primary);stroke-width:3.5\"/><line x1=\"420\" y1=\"76\" x2=\"608\" y2=\"151\" class=\"s-line\" marker-end=\"url(#pn2)\"/><line x1=\"570\" y1=\"226\" x2=\"608\" y2=\"151\" class=\"s-line\" marker-end=\"url(#pn2c)\" style=\"stroke:var(--primary);stroke-width:3.5\"/><line x1=\"720\" y1=\"151\" x2=\"758\" y2=\"151\" class=\"s-line\" marker-end=\"url(#pn2c)\" style=\"stroke:var(--primary);stroke-width:3.5\"/><rect x=\"10\" y=\"115\" w \" style=\"font-size:11px\">3</text><text x=\"712\" y=\"130\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"665\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">G · Uji modul</text><text x=\"618\" y=\"181\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"665\" y=\"181\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"712\" y=\"181\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">23</text><rect x=\"760\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"760\" y1=\"135\" x2=\"870\" y2=\"135\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"760\" y1=\"167\" x2=\"870\" y2=\"167\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"768\" y=\"130\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"815\" y=\"130\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">2</text><text x=\"862\" y=\"130\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"815\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">H · Pelatihan</text><text x=\"768\" y=\"181\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"815\" y=\"181\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"862\" y=\"181\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"10\" y=\"284\" class=\"s-hd\" style=\"font-size:12px\">ATAS: ES · DURASI · EF  ·  BAWAH: LS · FLOAT · LF  ·  GARIS TEBAL = JALUR KRITIS (25 HARI)</text></svg><figcaption>Kasus ilustrasi. Diagram jaringan dengan metode PDM (activity on node) sebagaimana dibahas Schwalbe (2019); ES, EF, LS, LF, dan float dihitung dengan CPM, konvensi mulai hari ke-0.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Membaca float</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The amount of time that a schedule activity can be delayed or extended from its early start date without delaying the project finish date or violating a schedule constraint.\"</p><p class=\"tr\">\"Lamanya waktu suatu aktivitas jadwal dapat ditunda atau diperpanjang dari tanggal mulai paling awalnya tanpa menunda tanggal selesai proyek atau melanggar suatu batasan jadwal.\"</p><div class=\"src\">PMI (2025), definisi total float; terjemahan harfiah penyusun</div></blockquote><ul><li><button type=\"button\" class=\"term\" data-term=\"total-float\">Total float</button> = LS − ES.</li><li><button type=\"button\" class=\"term\" data-term=\"free-float\">Free float</button> = ES penerus terkecil − EF.</li><li>Float milik <b>jalur</b>, bukan jatah santai satu aktivitas.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Di modul tagihan</h3><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th></th><th>Total</th><th>Free</th></tr></thead><tbody><tr><td>C · Desain UI</td><td>1</td><td>9 − 8 = 1</td></tr><tr><td>D · Migrasi</td><td>7</td><td>20 − 13 = 7</td></tr><tr><td>E · Fitur tagihan</td><td>0</td><td>0</td></tr></tbody></table><p style=\"margin:.5em 0 0;font-size:.9em\">D boleh mundur sampai 7 hari tanpa memundurkan proyek. E terlambat 1 hari = proyek terlambat 1 hari.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 3 · ubah durasi dengan − dan +</span></div><h2>Apa yang terjadi bila durasi berubah?</h2><div class=\"sim sim-cpm\" data-sim=\"cpm\" data-cfg=\"{&quot;id&quot;:&quot;p6-sim&quot;,&quot;acts&quot;:[{&quot;id&quot;:&quot;A&quot;,&quot;t&quot;:&quot;Analisis&quot;,&quot;d&quot;:5,&quot;pre&quot;:[]},{&quot;id&quot;:&quot;B&quot;,&quot;t&quot;:&quot;Desain DB&quot;,&quot;d&quot;:4,&quot;pre&quot;:[&quot;A&quot;]},{&quot;id&quot;:&quot;C&quot;,&quot;t&quot;:&quot;Desain UI&quot;,&quot;d&quot;:3,&quot;pre&quot;:[&quot;A&quot;]},{&quot;id&quot;:&quot;D&quot;,&quot;t&quot;:&quot;Migrasi data&quot;,&quot;d&quot;:4,&quot;pre&quot;:[&quot;B&quot;]},{&quot;id&quot;:&quot;E&quot;,&quot;t&quot;:&quot;Fitur tagihan&quot;,&quot;d&quot;:6,&quot;pre&quot;:[&quot;B&quot;,&quot;C&quot;]},{&quot;id&quot;:&quot;F&quot;,&quot;t&quot;:&quot;Catat bayar&quot;,&quot;d&quot;:5,&quot;pre&quot;:[&quot;E&quot;]},{&quot;id&quot;:&quot;G&quot;,&quot;t&quot;:&quot;Uji modul&quot;,&quot;d&quot;:3,&quot;pre&quot;:[&quot;D&quot;,&quot;F&quot;]},{&quot;id&quot;:&quot;H&quot;,&quot;t&quot;:&quot;Pelatihan&quot;,&quot;d&quot;:2,&quot;pre&quot;:[&quot;G&quot;]}],&quot;min&quot;:1,&quot;max&quot;:15,&quot;unit&quot;:&quot;hari&quot;,&quot;hd&quot;:[&quot;ID&quot;,&quot;Durasi&quot;,&quot;ES&quot;,&quot;EF&quot;,&quot;LS&quot;,&quot;LF&quot;,&quot;Float&quot;,&quot;Bagan&quot;],&quot;lblT&quot;:&quot;Durasi proyek&quot;,&quot;lblCrit&quot;:&quot;Aktivitas kritis&quot;,&quot;msg0&quot;:&quot;Ini jadwal awal. Coba tambah durasi D sampai 9, lalu kembalikan dan tambah durasi E sebanyak 1.&quot;,&quot;msgLate&quot;:&quot;Proyek mundur {n} hari karena aktivitas di jalur kritis bertambah lama atau float sebuah aktivitas habis.&quot;,&quot;msgEarly&quot;:&quot;Proyek maju {n} hari karena jalur kritis memendek. Perhatikan apakah jalur kritisnya berpindah.&quot;,&quot;msgSame&quot;:&quot;Durasi proyek tetap: perubahan terserap float. Perhatikan float aktivitas lain yang ikut berkurang.&quot;}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"margin-top:.35em;font-size:.8em\">Data ilustrasi. Batang berwarna = waktu aktivitas; kotak putus-putus = float.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok · 15 menit · kasus ilustrasi</span></div><h2>Portal layanan Desa Sukamaju</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>ID</th><th>Aktivitas</th><th>Durasi</th><th>Pendahulu</th></tr></thead><tbody><tr><td>P</td><td>Analisis proses layanan surat</td><td>3</td><td>–</td></tr><tr><td>Q</td><td>Desain formulir daring</td><td>2</td><td>P</td></tr><tr><td>R</td><td>Desain basis data</td><td>3</td><td>P</td></tr><tr><td>S</td><td>Pembuatan fitur pengajuan surat</td><td>5</td><td>Q, R</td></tr><tr><td>T</td><td>Pembuatan fitur cetak surat</td><td>4</td><td>R</td></tr><tr><td>U</td><td>Uji fungsi</td><td>2</td><td>S, T</td></tr><tr><td>V</td><td>Pelatihan operator desa</td><td>1</td><td>U</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Kerjakan</h3><ol><li>Gambar network diagram PDM.</li><li>Hitung ES, EF, LS, LF, dan float setiap aktivitas.</li><li>Tentukan jalur kritis dan durasi proyek.</li><li>Bila T terlambat 2 hari, apa dampaknya?</li></ol><p class=\"muted\" style=\"margin:0;font-size:.85em\">Durasi dalam hari kerja. Mulai hari ke-0.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 30 menit</span></div><h2>Jaringan dan jalur kritis proyek Anda</h2><div class=\"cols\"><div><p><b>Dari WBS Pertemuan 5:</b></p><ol><li>Turunkan 10–15 aktivitas dari work package (cantumkan kode WBS).</li><li>Tentukan pendahulu setiap aktivitas, termasuk dependensi eksternal dari mitra.</li><li>Estimasi durasi; pakai minimal dua teknik berbeda dan tulis alasannya.</li><li>Gambar network diagram PDM.</li><li>Hitung ES, EF, LS, LF, float, dan jalur kritis.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dinilai rekan</h3><ul><li>Setiap work package punya aktivitas</li><li>Tidak ada aktivitas \"menggantung\" tanpa penerus</li><li>Tidak ada lingkaran dependensi</li><li>Asumsi estimasi tertulis</li><li>Forward dan backward pass konsisten (float ≥ 0)</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai jaringan kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p6-net-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · jaringan dan jalur kritis (MPSI P6)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · SI Kasir UMKM&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di jaringan mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. ES aktivitas 7 seharusnya dari EF terbesar…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:7,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:10,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Aktivitas dari WBS&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Aktivitas tidak terkait WBS.&quot;,&quot;Sebagian work package belum punya aktivitas.&quot;,&quot;Hampir semua work package diturunkan; kode WBS dicantumkan.&quot;,&quot;Semua work package diturunkan menjadi aktivitas berkata kerja yang terlacak.&quot;]},{&quot;t&quot;:&quot;Dependensi dan diagram&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Tidak ada dependensi.&quot;,&quot;Banyak dependensi tidak logis atau ada aktivitas menggantung.&quot;,&quot;Dependensi umumnya logis; satu atau dua keliru.&quot;,&quot;Dependensi logis, termasuk dependensi eksternal; diagram rapi tanpa lingkaran.&quot;]},{&quot;t&quot;:&quot;Estimasi durasi&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Durasi tanpa dasar.&quot;,&quot;Durasi ditebak; teknik tidak disebut.&quot;,&quot;Satu teknik dipakai dengan alasan.&quot;,&quot;Minimal dua teknik berbeda, asumsi tertulis, hitungan PERT benar.&quot;]},{&quot;t&quot;:&quot;CPM dan float&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Belum dihitung.&quot;,&quot;ES/EF ada, LS/LF dan float belum.&quot;,&quot;Perhitungan lengkap dengan satu atau dua salah hitung.&quot;,&quot;ES, EF, LS, LF, float benar; jalur kritis dan durasi proyek tepat.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Aktivitas diturunkan dari <b>work package</b>, lalu diurutkan dengan <b>dependensi</b> (FS paling umum).</li><li><b>Network diagram PDM</b>: kotak = aktivitas, panah = dependensi.</li><li>Estimasi durasi: <b>analogous</b>, <b>parametric</b>, <b>PERT</b> (o + 4m + p) / 6.</li><li><b>CPM</b>: forward pass (ES, EF), backward pass (LS, LF), float = LS − ES.</li><li><b>Jalur kritis</b> = jalur terpanjang dengan float 0; durasi proyek bukan jumlah semua durasi.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p6-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;\\&quot;Fitur tagihan baru bisa mulai dikerjakan setelah desain basis data selesai.\\&quot; Jenis dependensinya adalah…&quot;,&quot;o&quot;:[&quot;Finish-to-Start (FS)&quot;,&quot;Start-to-Start (SS)&quot;,&quot;Finish-to-Finish (FF)&quot;,&quot;Start-to-Finish (SF)&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Aktivitas penerus mulai setelah pendahulu selesai: finish-to-start, jenis yang paling umum.&quot;},{&quot;q&quot;:&quot;Estimasi tiga titik: o = 2, m = 5, p = 14 hari. Berapa t&lt;sub&gt;E&lt;/sub&gt; menurut rumus PERT?&quot;,&quot;o&quot;:[&quot;5 hari&quot;,&quot;6 hari&quot;,&quot;7 hari&quot;,&quot;7,5 hari&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;(2 + 4×5 + 14) / 6 = 36 / 6 = 6 hari. Angka 7 adalah rata-rata sederhana (2 + 5 + 14) / 3.&quot;},{&quot;q&quot;:&quot;Aktivitas G punya dua pendahulu dengan EF 13 dan 20. Pada forward pass, ES aktivitas G adalah…&quot;,&quot;o&quot;:[&quot;13&quot;,&quot;16,5&quot;,&quot;20&quot;,&quot;33&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;ES = EF terbesar dari semua pendahulu, karena G baru bisa mulai setelah keduanya selesai.&quot;},{&quot;q&quot;:&quot;Aktivitas C: ES = 5, EF = 8, LS = 6, LF = 9. Total float C adalah…&quot;,&quot;o&quot;:[&quot;0 hari&quot;,&quot;1 hari&quot;,&quot;3 hari&quot;,&quot;4 hari&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Total float = LS − ES = 6 − 5 = 1 hari (sama dengan LF − EF = 9 − 8).&quot;},{&quot;q&quot;:&quot;Aktivitas D punya total float 7 hari dan terlambat 3 hari. Bila aktivitas lain sesuai rencana, durasi proyek…&quot;,&quot;o&quot;:[&quot;Mundur 3 hari&quot;,&quot;Mundur 7 hari&quot;,&quot;Tidak berubah&quot;,&quot;Maju 4 hari&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Keterlambatan 3 hari masih lebih kecil dari float 7 hari, sehingga terserap tanpa memundurkan proyek.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1C)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca dan menyiapkan</h3><p>Bagian penjadwalan proyek (dependensi, network diagram, estimasi durasi, CPM) dalam Schwalbe (2019) dan Kerzner (2025).</p><p>Pasang <b>ProjectLibre</b> (gratis) atau siapkan <b>MS Project</b> di laptop sebelum Pertemuan 7.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1C · jadwal dan rencana proyek)</h3><ul><li>Lengkapi <b>daftar aktivitas</b>, dependensi, dan <b>network diagram</b>.</li><li>Estimasi durasi dengan minimal <b>dua teknik</b> beserta tabel hitungannya.</li><li>Hitung <b>ES, EF, LS, LF, float</b>, dan <b>jalur kritis</b>.</li><li>Mulai menggabungkan Tugas 1A dan 1B menjadi rencana proyek terpadu.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.7em\">Tugas 1B (scope statement dan WBS): Jumat, 30 Oktober 2026, 23.59 WIB. Tugas 1C dikumpulkan di Elin paling lambat <b>Senin, 2 November 2026, 23.59 WIB</b> dan dipresentasikan di Pertemuan 7. Rincian dan rubrik ada di Elin.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Activity</span></dt><dd>Bagian pekerjaan terjadwal yang jelas batasnya, diturunkan dari work package, dan punya durasi. <i>(aktivitas)</i></dd></div><div><dt><span class=\"en\">Dependency</span></dt><dd>Hubungan logis antara dua aktivitas yang menentukan urutan pengerjaannya, mis. B baru mulai setelah A selesai. <i>(ketergantungan / dependensi)</i></dd></div><div><dt><span class=\"en\">Project network diagram</span></dt><dd>Gambar urutan dan hubungan logis antaraktivitas proyek. <i>(diagram jaringan proyek)</i></dd></div><div><dt><span class=\"en\">Precedence Diagramming Method (PDM)</span></dt><dd>Cara menggambar jaringan dengan aktivitas di dalam kotak (activity on node) dan panah sebagai dependensi; mendukung empat jenis hubungan FS, SS, FF, SF. <i>(metode diagram preseden)</i></dd></div><div><dt><span class=\"en\">Lead dan lag</span></dt><dd>Lead: aktivitas penerus boleh mulai lebih awal sebelum pendahulu selesai. Lag: ada jeda tunggu antara dua aktivitas. <i>(percepatan dan jeda)</i></dd></div><div><dt><span class=\"en\">Analogous estimating</span></dt><dd>Estimasi dari durasi atau biaya proyek serupa di masa lalu; cepat, tetapi kurang akurat. <i>(estimasi analogi)</i></dd></div><div><dt><span class=\"en\">Parametric estimating</span></dt><dd>Estimasi dari hubungan statistik antara jumlah pekerjaan dan produktivitas, mis. jumlah data dibagi laju per hari. <i>(estimasi parametrik)</i></dd></div><div><dt><span class=\"en\">Three-point estimating (PERT)</span></dt><dd>Estimasi memakai tiga nilai, yaitu optimistis, paling mungkin, dan pesimistis; versi PERT memakai (o + 4m + p) / 6. <i>(estimasi tiga titik)</i></dd></div><div><dt><span class=\"en\">Critical Path Method (CPM)</span></dt><dd>Teknik analisis jaringan untuk menghitung waktu mulai dan selesai paling awal dan paling lambat setiap aktivitas, lalu menemukan jalur kritis. <i>(metode jalur kritis)</i></dd></div><div><dt><span class=\"en\">Critical path</span></dt><dd>Rangkaian aktivitas terpanjang dalam jaringan proyek; panjangnya menentukan durasi proyek tersingkat. <i>(jalur kritis)</i></dd></div><div><dt><span class=\"en\">Forward pass</span></dt><dd>Perhitungan dari awal ke akhir jaringan untuk mencari ES dan EF setiap aktivitas. <i>(hitung maju)</i></dd></div><div><dt><span class=\"en\">Backward pass</span></dt><dd>Perhitungan dari akhir ke awal jaringan untuk mencari LF dan LS setiap aktivitas. <i>(hitung mundur)</i></dd></div><div><dt><span class=\"en\">Total float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan tanggal selesai proyek; dihitung LS − ES. <i>(kelonggaran total)</i></dd></div><div><dt><span class=\"en\">Free float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan ES aktivitas penerusnya. <i>(kelonggaran bebas)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Penjadwalan Proyek (2)","subtitle":"Gantt chart di ProjectLibre/MS Project, kompresi jadwal · presentasi Tugas 1","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-1 · CPL-4</span></div><h1>Penjadwalan Proyek (2)</h1><p class=\"lead\">Gantt chart di ProjectLibre/MS Project, kompresi jadwal · presentasi Tugas 1</p><div class=\ const SIMS={creep(el, cfg, s){
    const I=cfg.items||[]; if(!s.on) s.on={};
    const fmt=v=>String(Math.round(v*10)/10).replace('.',',');
    const draw=()=>{

        '<div style="margin:.5em 0 .15em;font-size:.85em;font-weight:700">'+cfg.lblB+': Rp'+fmt(b)+' / Rp'+fmt(cfg.room.b)+' '+cfg.unitB+'</div>'+

pert(el, cfg, s){
    if(s.o===undefined){ s.o=cfg.o; s.m=cfg.m; s.p=cfg.p; }
    const f=v=>String(Math.round(v*100)/100).replace('.',','), mx=cfg.max||20;

    const out=()=>{

    };

    out();

cpm(el, cfg, s){
    const A=cfg.acts||[]; if(!s.d) s.d=A.map(a=>a.d);
    const calc=d=>{ const ix={}; A.forEach((a,i)=>ix[a.id]=i); const ES=[],EF=[],LS=[],LF=[];
      A.forEach((a,i)=>{ ES[i]=Math.max(0,...a.pre.map(p=>EF[ix[p]])); EF[i]=ES[i]+d[i]; });
      const T=Math.max(...EF);
      for(let i=A.length-1;i>=0;i--){ const su=[]; A.forEach((b,j)=>{ if(b.pre.indexOf(A[i].id)>=0) su.push(LS[j]); }); LF[i]=su.length?Math.min(...su):T; LS[i]=LF[i]-d[i]; }
      return {ES,EF,LS,LF,T}; };
