style=\"font-size:11px\">9</text><text x=\"365\" y=\"205\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">6</text><text x=\"412\" y=\"205\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">15</text><text x=\"365\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">E · Fitur tagihan</text><text x=\"318\" y=\"256\" class=\"s-s\" style=\"font-size:11px\">9</text><text x=\"365\" y=\"256\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"412\" y=\"256\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">15</text><rect x=\"460\" y=\"190\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"460\" y1=\"210\" x2=\"570\" y2=\"210\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"460\" y1=\"242\" x2=\"570\" y2=\"242\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"468\" y=\"205\" class=\"s-s\" style=\"font-size:11px\">15</text><text x=\"515\" y=\"205\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">5</text><text x=\"562\" y=\"205\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"515\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F · Catat bayar</text><text x=\"468\" y=\"256\" class=\"s-s\" style=\"font-size:11px\">15</text><text x=\"515\" y=\"256\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"562\" y=\"256\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">20</text><rect x=\"610\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"610\" y1=\"135\" x2=\"720\" y2=\"135\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"610\" y1=\"167\" x2=\"720\" y2=\"167\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"618\" y=\"130\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"665\" y=\"130\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">3</text><text x=\"712\" y=\"130\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"665\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">G · Uji modul</text><text x=\"618\" y=\"181\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"665\" y=\"181\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"712\" y=\"181\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">23</text><rect x=\"760\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"760\" y1=\"135\" x2=\"870\" y2=\"135\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"760\" y1=\"167\" x2=\"870\" y2=\"167\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"768\" y=\"130\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"815\" y=\"130\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">2</text><text x=\"862\" y=\"130\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"815\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">H · Pelatihan</text><text x=\"768\" y=\"181\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"815\" y=\"181\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"862\" y=\"181\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"10\" y=\"284\" class=\"s-hd\" style=\"font-size:12px\">ATAS: ES · DURASI · EF  ·  BAWAH: LS · FLOAT · LF  ·  GARIS TEBAL = JALUR KRITIS (25 HARI)</text></svg><figcaption>Kasus ilustrasi. Diagram jaringan dengan metode PDM (activity on node) sebagaimana dibahas Schwalbe (2019); ES, EF, LS, LF, dan float dihitung dengan CPM, konvensi mulai hari ke-0.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Membaca float</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The amount of time that a schedule activity can be delayed or extended from its early start date without delaying the project finish date or violating a schedule constraint.\"</p><p class=\"tr\">\"Lamanya waktu suatu aktivitas jadwal dapat ditunda atau diperpanjang dari tanggal mulai paling awalnya tanpa menunda tanggal selesai proyek atau melanggar suatu batasan jadwal.\"</p><div class=\"src\">PMI (2025), definisi total float; terjemahan harfiah penyusun</div></blockquote><ul><li><button type=\"button\" class=\"term\" data-term=\"total-float\">Total float</button> = LS − ES.</li><li><button type=\"button\" class=\"term\" data-term=\"free-float\">Free float</button> = ES penerus terkecil − EF.</li><li>Float milik <b>jalur</b>, bukan jatah santai satu aktivitas.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Di modul tagihan</h3><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th></th><th>Total</th><th>Free</th></tr></thead><tbody><tr><td>C · Desain UI</td><td>1</td><td>9 − 8 = 1</td></tr><tr><td>D · Migrasi</td><td>7</td><td>20 − 13 = 7</td></tr><tr><td>E · Fitur tagihan</td><td>0</td><td>0</td></tr></tbody></table><p style=\"margin:.5em 0 0;font-size:.9em\">D boleh mundur sampai 7 hari tanpa memundurkan proyek. E terlambat 1 hari = proyek terlambat 1 hari.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 3 · ubah durasi dengan − dan +</span></div><h2>Apa yang terjadi bila durasi berubah?</h2><div class=\"sim sim-cpm\" data-sim=\"cpm\" data-cfg=\"{&quot;id&quot;:&quot;p6-sim&quot;,&quot;acts&quot;:[{&quot;id&quot;:&quot;A&quot;,&quot;t&quot;:&quot;Analisis&quot;,&quot;d&quot;:5,&quot;pre&quot;:[]},{&quot;id&quot;:&quot;B&quot;,&quot;t&quot;:&quot;Desain DB&quot;,&quot;d&quot;:4,&quot;pre&quot;:[&quot;A&quot;]},{&quot;id&quot;:&quot;C&quot;,&quot;t&quot;:&quot;Desain UI&quot;,&quot;d&quot;:3,&quot;pre&quot;:[&quot;A&quot;]},{&quot;id&quot;:&quot;D&quot;,&quot;t&quot;:&quot;Migrasi data&quot;,&quot;d&quot;:4,&quot;pre&quot;:[&quot;B&quot;]},{&quot;id&quot;:&quot;E&quot;,&quot;t&quot;:&quot;Fitur tagihan&quot;,&quot;d&quot;:6,&quot;pre&quot;:[&quot;B&quot;,&quot;C&quot;]},{&quot;id&quot;:&quot;F&quot;,&quot;t&quot;:&quot;Catat bayar&quot;,&quot;d&quot;:5,&quot;pre&quot;:[&quot;E&quot;]},{&quot;id&quot;:&quot;G&quot;,&quot;t&quot;:&quot;Uji modul&quot;,&quot;d&quot;:3,&quot;pre&quot;:[&quot;D&quot;,&quot;F&quot;]},{&quot;id&quot;:&quot;H&quot;,&quot;t&quot;:&quot;Pelatihan&quot;,&quot;d&quot;:2,&quot;pre&quot;:[&quot;G&quot;]}],&quot;min&quot;:1,&quot;max&quot;:15,&quot;unit&quot;:&quot;hari&quot;,&quot;hd&quot;:[&quot;ID&quot;,&quot;Durasi&quot;,&quot;ES&quot;,&quot;EF&quot;,&quot;LS&quot;,&quot;LF&quot;,&quot;Float&quot;,&quot;Bagan&quot;],&quot;lblT&quot;:&quot;Durasi proyek&quot;,&quot;lblCrit&quot;:&quot;Aktivitas kritis&quot;,&quot;msg0&quot;:&quot;Ini jadwal awal. Coba tambah durasi D sampai 9, lalu kembalikan dan tambah durasi E sebanyak 1.&quot;,&quot;msgLate&quot;:&quot;Proyek mundur {n} hari karena aktivitas di jalur kritis bertambah lama atau float sebuah aktivitas habis.&quot;,&quot;msgEarly&quot;:&quot;Proyek maju {n} hari karena jalur kritis memendek. Perhatikan apakah jalur kritisnya berpindah.&quot;,&quot;msgSame&quot;:&quot;Durasi proyek tetap: perubahan terserap float. Perhatikan float aktivitas lain yang ikut berkurang.&quot;}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"margin-top:.35em;font-size:.8em\">Data ilustrasi. Batang berwarna = waktu aktivitas; kotak putus-putus = float.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok · 15 menit · kasus ilustrasi</span></div><h2>Portal layanan Desa Sukamaju</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>ID</th><th>Aktivitas</th><th>Durasi</th><th>Pendahulu</th></tr></thead><tbody><tr><td>P</td><td>Analisis proses layanan surat</td><td>3</td><td>–</td></tr><tr><td>Q</td><td>Desain formulir daring</td><td>2</td><td>P</td></tr><tr><td>R</td><td>Desain basis data</td><td>3</td><td>P</td></tr><tr><td>S</td><td>Pembuatan fitur pengajuan surat</td><td>5</td><td>Q, R</td></tr><tr><td>T</td><td>Pembuatan fitur cetak surat</td><td>4</td><td>R</td></tr><tr><td>U</td><td>Uji fungsi</td><td>2</td><td>S, T</td></tr><tr><td>V</td><td>Pelatihan operator desa</td><td>1</td><td>U</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Kerjakan</h3><ol><li>Gambar network diagram PDM.</li><li>Hitung ES, EF, LS, LF, dan float setiap aktivitas.</li><li>Tentukan jalur kritis dan durasi proyek.</li><li>Bila T terlambat 2 hari, apa dampaknya?</li></ol><p class=\"muted\" style=\"margin:0;font-size:.85em\">Durasi dalam hari kerja. Mulai hari ke-0.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 30 menit</span></div><h2>Jaringan dan jalur kritis proyek Anda</h2><div class=\"cols\"><div><p><b>Dari WBS Pertemuan 5:</b></p><ol><li>Turunkan 10–15 aktivitas dari work package (cantumkan kode WBS).</li><li>Tentukan pendahulu setiap aktivitas, termasuk dependensi eksternal dari mitra.</li><li>Estimasi durasi; pakai minimal dua teknik berbeda dan tulis alasannya.</li><li>Gambar network diagram PDM.</li><li>Hitung ES, EF, LS, LF, float, dan jalur kritis.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dinilai rekan</h3><ul><li>Setiap work package punya aktivitas</li><li>Tidak ada aktivitas \"menggantung\" tanpa penerus</li><li>Tidak ada lingkaran dependensi</li><li>Asumsi estimasi tertulis</li><li>Forward dan backward pass konsisten (float ≥ 0)</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai jaringan kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p6-net-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · jaringan dan jalur kritis (MPSI P6)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · SI Kasir UMKM&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di jaringan mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. ES aktivitas 7 seharusnya dari EF terbesar…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:7,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:10,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Aktivitas dari WBS&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Aktivitas tidak terkait WBS.&quot;,&quot;Sebagian work package belum punya aktivitas.&quot;,&quot;Hampir semua work package diturunkan; kode WBS dicantumkan.&quot;,&quot;Semua work package diturunkan menjadi aktivitas berkata kerja yang terlacak.&quot;]},{&quot;t&quot;:&quot;Dependensi dan diagram&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Tidak ada dependensi.&quot;,&quot;Banyak dependensi tidak logis atau ada aktivitas menggantung.&quot;,&quot;Dependensi umumnya logis; satu atau dua keliru.&quot;,&quot;Dependensi logis, termasuk dependensi eksternal; diagram rapi tanpa lingkaran.&quot;]},{&quot;t&quot;:&quot;Estimasi durasi&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Durasi tanpa dasar.&quot;,&quot;Durasi ditebak; teknik tidak disebut.&quot;,&quot;Satu teknik dipakai dengan alasan.&quot;,&quot;Minimal dua teknik berbeda, asumsi tertulis, hitungan PERT benar.&quot;]},{&quot;t&quot;:&quot;CPM dan float&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Belum dihitung.&quot;,&quot;ES/EF ada, LS/LF dan float belum.&quot;,&quot;Perhitungan lengkap dengan satu atau dua salah hitung.&quot;,&quot;ES, EF, LS, LF, float benar; jalur kritis dan durasi proyek tepat.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Aktivitas diturunkan dari <b>work package</b>, lalu diurutkan dengan <b>dependensi</b> (FS paling umum).</li><li><b>Network diagram PDM</b>: kotak = aktivitas, panah = dependensi.</li><li>Estimasi durasi: <b>analogous</b>, <b>parametric</b>, <b>PERT</b> (o + 4m + p) / 6.</li><li><b>CPM</b>: forward pass (ES, EF), backward pass (LS, LF), float = LS − ES.</li><li><b>Jalur kritis</b> = jalur terpanjang dengan float 0; durasi proyek bukan jumlah semua durasi.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p6-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;\\&quot;Fitur tagihan baru bisa mulai dikerjakan setelah desain basis data selesai.\\&quot; Jenis dependensinya adalah…&quot;,&quot;o&quot;:[&quot;Finish-to-Start (FS)&quot;,&quot;Start-to-Start (SS)&quot;,&quot;Finish-to-Finish (FF)&quot;,&quot;Start-to-Finish (SF)&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Aktivitas penerus mulai setelah pendahulu selesai: finish-to-start, jenis yang paling umum.&quot;},{&quot;q&quot;:&quot;Estimasi tiga titik: o = 2, m = 5, p = 14 hari. Berapa t&lt;sub&gt;E&lt;/sub&gt; menurut rumus PERT?&quot;,&quot;o&quot;:[&quot;5 hari&quot;,&quot;6 hari&quot;,&quot;7 hari&quot;,&quot;7,5 hari&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;(2 + 4×5 + 14) / 6 = 36 / 6 = 6 hari. Angka 7 adalah rata-rata sederhana (2 + 5 + 14) / 3.&quot;},{&quot;q&quot;:&quot;Aktivitas G punya dua pendahulu dengan EF 13 dan 20. Pada forward pass, ES aktivitas G adalah…&quot;,&quot;o&quot;:[&quot;13&quot;,&quot;16,5&quot;,&quot;20&quot;,&quot;33&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;ES = EF terbesar dari semua pendahulu, karena G baru bisa mulai setelah keduanya selesai.&quot;},{&quot;q&quot;:&quot;Aktivitas C: ES = 5, EF = 8, LS = 6, LF = 9. Total float C adalah…&quot;,&quot;o&quot;:[&quot;0 hari&quot;,&quot;1 hari&quot;,&quot;3 hari&quot;,&quot;4 hari&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Total float = LS − ES = 6 − 5 = 1 hari (sama dengan LF − EF = 9 − 8).&quot;},{&quot;q&quot;:&quot;Aktivitas D punya total float 7 hari dan terlambat 3 hari. Bila aktivitas lain sesuai rencana, durasi proyek…&quot;,&quot;o&quot;:[&quot;Mundur 3 hari&quot;,&quot;Mundur 7 hari&quot;,&quot;Tidak berubah&quot;,&quot;Maju 4 hari&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Keterlambatan 3 hari masih lebih kecil dari float 7 hari, sehingga terserap tanpa memundurkan proyek.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1C)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca dan menyiapkan</h3><p>Bagian penjadwalan proyek (dependensi, network diagram, estimasi durasi, CPM) dalam Schwalbe (2019) dan Kerzner (2025).</p><p>Pasang <b>ProjectLibre</b> (gratis) atau siapkan <b>MS Project</b> di laptop sebelum Pertemuan 7.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1C · jadwal dan rencana proyek)</h3><ul><li>Lengkapi <b>daftar aktivitas</b>, dependensi, dan <b>network diagram</b>.</li><li>Estimasi durasi dengan minimal <b>dua teknik</b> beserta tabel hitungannya.</li><li>Hitung <b>ES, EF, LS, LF, float</b>, dan <b>jalur kritis</b>.</li><li>Mulai menggabungkan Tugas 1A dan 1B menjadi rencana proyek terpadu.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.7em\">Tugas 1B (scope statement dan WBS): Jumat, 30 Oktober 2026, 23.59 WIB. Tugas 1C dikumpulkan di Elin paling lambat <b>Senin, 2 November 2026, 23.59 WIB</b> dan dipresentasikan di Pertemuan 7. Rincian dan rubrik ada di Elin.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Activity</span></dt><dd>Bagian pekerjaan terjadwal yang jelas batasnya, diturunkan dari work package, dan punya durasi. <i>(aktivitas)</i></dd></div><div><dt><span class=\"en\">Dependency</span></dt><dd>Hubungan logis antara dua aktivitas yang menentukan urutan pengerjaannya, mis. B baru mulai setelah A selesai. <i>(ketergantungan / dependensi)</i></dd></div><div><dt><span class=\"en\">Project network diagram</span></dt><dd>Gambar urutan dan hubungan logis antaraktivitas proyek. <i>(diagram jaringan proyek)</i></dd></div><div><dt><span class=\"en\">Precedence Diagramming Method (PDM)</span></dt><dd>Cara menggambar jaringan dengan aktivitas di dalam kotak (activity on node) dan panah sebagai dependensi; mendukung empat jenis hubungan FS, SS, FF, SF. <i>(metode diagram preseden)</i></dd></div><div><dt><span class=\"en\">Lead dan lag</span></dt><dd>Lead: aktivitas penerus boleh mulai lebih awal sebelum pendahulu selesai. Lag: ada jeda tunggu antara dua aktivitas. <i>(percepatan dan jeda)</i></dd></div><div><dt><span class=\"en\">Analogous estimating</span></dt><dd>Estimasi dari durasi atau biaya proyek serupa di masa lalu; cepat, tetapi kurang akurat. <i>(estimasi analogi)</i></dd></div><div><dt><span class=\"en\">Parametric estimating</span></dt><dd>Estimasi dari hubungan statistik antara jumlah pekerjaan dan produktivitas, mis. jumlah data dibagi laju per hari. <i>(estimasi parametrik)</i></dd></div><div><dt><span class=\"en\">Three-point estimating (PERT)</span></dt><dd>Estimasi memakai tiga nilai, yaitu optimistis, paling mungkin, dan pesimistis; versi PERT memakai (o + 4m + p) / 6. <i>(estimasi tiga titik)</i></dd></div><div><dt><span class=\"en\">Critical Path Method (CPM)</span></dt><dd>Teknik analisis jaringan untuk menghitung waktu mulai dan selesai paling awal dan paling lambat setiap aktivitas, lalu menemukan jalur kritis. <i>(metode jalur kritis)</i></dd></div><div><dt><span class=\"en\">Critical path</span></dt><dd>Rangkaian aktivitas terpanjang dalam jaringan proyek; panjangnya menentukan durasi proyek tersingkat. <i>(jalur kritis)</i></dd></div><div><dt><span class=\"en\">Forward pass</span></dt><dd>Perhitungan dari awal ke akhir jaringan untuk mencari ES dan EF setiap aktivitas. <i>(hitung maju)</i></dd></div><div><dt><span class=\"en\">Backward pass</span></dt><dd>Perhitungan dari akhir ke awal jaringan untuk mencari LF dan LS setiap aktivitas. <i>(hitung mundur)</i></dd></div><div><dt><span class=\"en\">Total float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan tanggal selesai proyek; dihitung LS − ES. <i>(kelonggaran total)</i></dd></div><div><dt><span class=\"en\">Free float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan ES aktivitas penerusnya. <i>(kelonggaran bebas)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Penjadwalan Proyek (2)","subtitle":"Gantt chart di ProjectLibre/MS Project, crashing, fast tracking, dan presentasi Tugas 1","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Penjadwalan Proyek (2)</h1><p class=\"lead\">Gantt chart di aplikasi, kompresi jadwal, dan presentasi rencana proyek</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Praktik aplikasi + presentasi Tugas 1</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun jadwal proyek dan menganalisis jalur kritis (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 4 dan 5)</span></h3><ol><li>Ketepatan menurunkan aktivitas dari WBS dan menentukan dependensinya. <span class=\"muted\">(Pertemuan 6)</span></li><li>Ketepatan estimasi durasi (analogous, parametric, three-point/PERT). <span class=\"muted\">(Pertemuan 6)</span></li><li>Ketepatan menghitung jalur kritis dan float. <span class=\"muted\">(Pertemuan 6)</span></li><li>Kelengkapan Gantt chart pada aplikasi manajemen proyek.</li><li>Ketepatan menerapkan crashing atau fast tracking.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 6 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Mengapa modul tagihan butuh 25 hari, bukan 32?</li><li>Bagaimana menghitung ES aktivitas yang punya dua pendahulu?</li><li>Aktivitas D punya float 7 hari. Apa artinya?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari jalur kritis ke Gantt chart</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen jadwal: definisikan aktivitas, urutkan, estimasi durasi, dan susun jadwal dengan CPM sudah dibahas di Pertemuan 6; Gantt chart di aplikasi dan kompresi jadwal dibahas hari ini di Pertemuan 7.\"><defs><marker id=\"ps7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"87\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Definisikan aktivitas</text><text x=\"87\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">work package → aktivitas</text><line x1=\"165\" y1=\"72\" x2=\"181\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps7)\"/><rect x=\"184\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"261\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Urutkan aktivitas</text><text x=\"261\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">dependensi, PDM</text><line x1=\"339\" y1=\"72\" x2=\"355\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps7)\"/><rect x=\"358\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"435\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Estimasi durasi</text><text x=\"435\" y=\"90\" text-anchor=\"middle\" class= 3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Aktivitas</h3><p>Diturunkan dari WBS; <button type=\"button\" class=\"term\" data-term=\"summary-task\">summary task</button> mengikuti cabang WBS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Durasi dan tanggal</h3><p>Durasi hasil estimasi; tanggal dihitung dari <button type=\"button\" class=\"term\" data-term=\"project-calendar\">kalender proyek</button>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Dependensi</h3><p>Pendahulu sama dengan network diagram (FS, SS, <button type=\"button\" class=\"term\" data-term=\"lead-lag\">lead/lag</button>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"milestone\">Milestone</button></h3><p>Durasi nol: serah terima, pengesahan, presentasi.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg><button type=\"button\" class=\"term\" data-term=\"critical-path\">Jalur kritis</button></h3><p>Ditandai berbeda; sama dengan hitungan manual.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"schedule-baseline\">Baseline</button></h3><p>Disimpan setelah disetujui, sebagai pembanding kemajuan.</p></div></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.84em\">Lima unsur pertama sesuai rubrik Tugas 1C (kriteria C4); baseline dipakai lagi di Pertemuan 15. Dirangkum dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Siapkan lingkungan</span><span>Pilih salah satu · hasilnya setara</span></div><h2>ProjectLibre atau MS Project</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Opsi 1 · ProjectLibre</h3><ul><li>Gratis dan sumber terbuka; unduh dari situs resmi projectlibre.com.</li><li>Tersedia untuk Windows, macOS, dan Linux.</li><li>Buka, lalu buat proyek baru dan isi tanggal mulai.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M8 21h8M12 17v4\"/></svg>Opsi 2 · MS Project</h3><ul><li>Berbayar; pakai bila Anda punya lisensi.</li><li>Langkah dan istilahnya mirip ProjectLibre.</li><li>Buka proyek kosong, lalu isi tanggal mulai di informasi proyek.</li></ul></div></div><div class=\"callout\" style=\"margin-top:.7em\">Tidak punya laptop? Kerjakan berpasangan di laptop anggota kelompok. Nama menu bisa sedikit berbeda menurut versi aplikasi.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum</span><span>Indikator 4 · tekan Play atau klik langkah</span></div><h2>Dari tabel ke Gantt chart di aplikasi</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p7-app&quot;,&quot;ms&quot;:3800,&quot;steps&quot;:[{&quot;t&quot;:&quot;Proyek baru&quot;,&quot;en&quot;:&quot;start date&quot;,&quot;d&quot;:&quot;Buat proyek baru dan isi tanggal mulai di informasi proyek. Pastikan kalender hari kerja Senin–Jumat.&quot;,&quot;ex&quot;:&quot;Mulai Senin, 2 November 2026 (kasus ilustrasi).&quot;},{&quot;t&quot;:&quot;Ketik aktivitas&quot;,&quot;en&quot;:&quot;task name&quot;,&quot;d&quot;:&quot;Ketik nama aktivitas A–H berurutan sesuai berkas jadwal_modul_tagihan.csv. Nomor baris di aplikasi menjadi ID aktivitas.&quot;,&quot;ex&quot;:&quot;Baris 1 = A Analisis kebutuhan rinci tagihan … baris 8 = H Pelatihan bagian keuangan.&quot;},{&quot;t&quot;:&quot;Isi durasi&quot;,&quot;en&quot;:&quot;duration&quot;,&quot;d&quot;:&quot;Isi kolom durasi dalam hari kerja sesuai kolom durasi_hari.&quot;,&quot;ex&quot;:&quot;A 5 hari, B 4 hari, E 6 hari.&quot;},{&quot;t&quot;:&quot;Isi pendahulu&quot;,&quot;en&quot;:&quot;predecessors&quot;,&quot;d&quot;:&quot;Isi kolom pendahulu dengan nomor baris (kolom pendahulu_no), atau pilih dua aktivitas lalu tekan tombol Link (finish-to-start).&quot;,&quot;ex&quot;:&quot;E pendahulunya baris 2 dan 3; G pendahulunya baris 4 dan 6.&quot;},{&quot;t&quot;:&quot;Tambah milestone&quot;,&quot;en&quot;:&quot;milestone&quot;,&quot;d&quot;:&quot;Tambah baris \\&quot;Modul diterima\\&quot; berdurasi 0 dengan pendahulu baris 8, atau tandai sebagai milestone.&q l);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"246\" class=\"s-t\" style=\"font-size:12px\">H · Pelatihan</text><rect x=\"730\" y=\"234\" width=\"54\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"273\" class=\"s-t\" style=\"font-size:12px\">◆ Modul diterima</text><path d=\"M784 260 l9 9 -9 9 -9 -9z\" style=\"fill:var(--ink)\"/><rect x=\"10\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--coral);stroke:var(--line)\"/><text x=\"34\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">kritis</text><rect x=\"90\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--mustard);stroke:var(--line)\"/><text x=\"114\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">tidak kritis</text><rect x=\"200\" y=\"301\" width=\"18\" height=\"9\" style=\"fill:none;stroke:var(--muted);stroke-dasharray:4 3\"/><text x=\"224\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">float (slack)</text><text x=\"320\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">proyek selesai hari ke-22</text></svg><figcaption>Kasus ilustrasi. Fast tracking: hubungan E → F diubah dari FS menjadi SS dengan lag 3 hari. Float aktivitas lain tidak digambar.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok · 15 menit</span></div><h2>Jadwal proyek mitra di aplikasi</h2><div class=\"cols\"><div><ol><li>Masukkan aktivitas, durasi, dan pendahulu proyek mitra (dari Pertemuan 6) ke aplikasi.</li><li>Tambahkan summary task sesuai WBS dan milestone penting.</li><li>Cocokkan jalur kritis aplikasi dengan hitungan manual.</li><li>Bandingkan tanggal selesai dengan batas waktu di charter.</li><li>Bila melewati batas: pilih crashing atau fast tracking, tulis dampaknya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Masuk ke laporan Tugas 1C</h3><ul><li>Gantt chart (ekspor PDF/gambar yang terbaca)</li><li>Tabel ES, EF, LS, LF, float</li><li>Kompresi: durasi baru dan dampak biaya atau risiko</li><li>Konsisten dengan charter dan WBS</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Presentasi</span><span>Tugas 1C · rencana proyek terpadu</span></div><h2>Presentasi rencana proyek</h2><div class=\"cols\"><div><p><b>Alur yang disarankan</b> (maks. 10 slide):</p><ol><li>Mitra, masalah, dan business case</li><li>Charter: tujuan, kriteria keberhasilan, anggaran</li><li>Lingkup dan WBS</li><li>Jaringan, jalur kritis, Gantt chart</li><li>Kompresi jadwal dan risikonya</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Ketentuan</h3><ul><li>Waktu per kelompok diumumkan dosen sesuai jumlah kelompok.</li><li>Semua anggota siap menjawab.</li><li>Kelompok lain menilai dengan lembar sejawat (formatif).</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai presentasi kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p7-pres-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · presentasi rencana proyek Tugas 1 (MPSI P7)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 4 · SI Koperasi Pesantren&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik dari presentasi&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. Tanggal selesai di Gantt berbeda dengan charter…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:9,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:13,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:17,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Rencana terpadu dan konsisten&quot;,&quot;ind&quot;:&quot;Tugas 1 (C6)&quot;,&quot;d&quot;:[&quot;Bagian-bagian tidak berhubungan.&quot;,&quot;Ada beberapa angka atau tanggal yang bertentangan.&quot;,&quot;Umumnya konsisten; satu ketidakcocokan kecil.&quot;,&quot;Masalah, tujuan, lingkup, anggaran, dan tanggal konsisten.&quot;]},{&quot;t&quot;:&quot;Jaringan dan jalur kritis&quot;,&quot;ind&quot;:&quot;Indikator 1–3&quot;,&quot;d&quot;:[&quot;Tidak ditunjukkan.&quot;,&quot;Ditunjukkan tanpa penjelasan hitungan.&quot;,&quot;Jalur kritis benar; float belum dijelaskan.&quot;,&quot;Jalur kritis dan float benar serta dijelaskan artinya.&quot;]},{&quot;t&quot;:&quot;Gantt chart di aplikasi&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak ada atau bukan dari aplikasi.&quot;,&quot;Ada, tetapi tidak terbaca atau tidak lengkap.&quot;,&quot;Lengkap; satu unsur kurang (mis. milestone).&quot;,&quot;Lengkap, terbaca, dan sama dengan hitungan manual.&quot;]},{&quot;t&quot;:&quot;Kompresi jadwal&quot;,&quot;ind&quot;:&quot;Indikator 5&quot;,&quot;d&quot;:[&quot;Tidak dibahas.&quot;,&quot;Disebut tanpa dasar.&quot;,&quot;Diterapkan pada jalur kritis; dampak kurang jelas.&quot;,&quot;Diterapkan pada jalur kritis dengan durasi baru dan dampak biaya atau risiko.&quot;]},{&quot;t&quot;:&quot;Penyampaian dan tanya jawab&quot;,&quot;ind&quot;:&quot;Tugas 1 (C6)&quot;,&quot;d&quot;:[&quot;Membaca slide; pertanyaan tidak terjawab.&quot;,&quot;Kurang runtut; jawaban kurang tepat.&quot;,&quot;Runtut; sebagian jawaban kurang tepat.&quot;,&quot;Runtut, tepat waktu, dan menjawab dengan tepat.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Gantt chart</b> menampilkan aktivitas, durasi, dependensi, milestone, dan jalur kritis pada sumbu waktu.</li><li>Aplikasi menghitung tanggal dari <b>kalender proyek</b>; hasilnya harus sama dengan hitungan manual.</li><li><b>Baseline</b> disimpan sebagai pembanding kemajuan.</li><li><b>Crashing</b>: tekan aktivitas kritis termurah, hitung ulang tiap langkah; biaya naik.</li><li><b>Fast tracking</b>: tumpang tindihkan aktivitas kritis; risiko pengerjaan ulang naik.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p7-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Gantt chart menampilkan…&quot;,&quot;o&quot;:[&quot;Aktivitas sebagai batang pada sumbu waktu&quot;,&quot;Hanya urutan aktivitas tanpa waktu&quot;,&quot;Struktur pemecahan lingkup proyek&quot;,&quot;Daftar pemangku kepentingan&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Gantt chart menampilkan aktivitas sebagai batang sesuai tanggal mulai dan selesainya; urutan logis lebih jelas di network diagram, pemecahan lingkup di WBS.&quot;},{&quot;q&quot;:&quot;Crashing adalah…&quot;,&quot;o&quot;:[&quot;Mengurangi lingkup agar cepat selesai&quot;,&quot;Menambah sumber daya pada aktivitas kritis untuk memperpendek durasinya dengan biaya tambahan&quot;,&quot;Menumpangtindihkan aktivitas yang biasanya berurutan&quot;,&quot;Menunda aktivitas yang punya float&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Crashing memperpendek aktivitas kritis dengan menambah sumber daya; biaya naik, lingkup tetap.&quot;},{&quot;q&quot;:&quot;Aktivitas kritis A (Rp1,5 jt/hari), B (Rp1,0 jt/hari), E (Rp0,8 jt/hari), dan aktivitas tidak kritis D (Rp0,3 jt/hari). Mana yang ditekan lebih dulu?&quot;,&quot;o&quot;:[&quot;D&quot;,&quot;E&quot;,&quot;B&quot;,&quot;A&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Pilih aktivitas kritis termurah. D lebih murah, tetapi tidak kritis sehingga tidak mempercepat proyek.&quot;},{&quot;q&quot;:&quot;Risiko utama fast tracking adalah…&quot;,&quot;o&quot;:[&quot;Biaya lembur pasti naik&quot;,&quot;Pengerjaan ulang karena aktivitas dikerjakan sebelum pendahulunya selesai&quot;,&quot;Jalur kritis hilang&quot;,&quot;Lingkup proyek bertambah&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Fast tracking mengerjakan aktivitas secara tumpang tindih; bila hasil pendahulu berubah, pekerjaan penerus harus diulang.&quot;},{&quot;q&quot;:&quot;Aktivitas D punya float 7 hari. Bila D dipangkas 1 hari dengan crashing, durasi proyek…&quot;,&quot;o&quot;:[&quot;Turun 1 hari&quot;,&quot;Turun 7 hari&quot;,&quot;Tidak berubah, biaya naik&quot;,&quot;Naik 1 hari&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;D tidak kritis, jadi memangkasnya hanya menambah biaya tanpa mempercepat proyek.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas 1C dan persiapan UTS</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Kumpulkan Tugas 1C</h3><ul><li>Laporan rencana proyek terpadu (PDF, maks. 35 halaman) dan slide presentasi.</li><li>Gantt chart dari aplikasi, tabel CPM, dan kompresi jadwal.</li><li>Tugas 1A dan 1B yang sudah disempurnakan.</li></ul><p style=\"margin:.4em 0 0\">Tenggat di Elin: <b>Senin, 2 November 2026, 23.59 WIB</b>. Setiap anggota mengunggah berkas yang sama.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Persiapan UTS (Pertemuan 8)</h3><p>Materi Pertemuan 1–7 (Sub-CPMK-1 sampai 4). Ulangi rangkuman dan kuis tiap pertemuan, latihan NPV/ROI/payback, WBS, dan CPM.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Gantt chart</span></dt><dd>Bagan batang yang menampilkan aktivitas proyek beserta tanggal mulai dan selesainya pada sumbu waktu. <i>(bagan Gantt)</i></dd></div><div><dt><span class=\"en\">Summary task</span></dt><dd>Baris induk di aplikasi jadwal yang merangkum beberapa aktivitas di bawahnya, biasanya sesuai cabang WBS. <i>(tugas ringkasan)</i></dd></div><div><dt><span class=\"en\">Milestone</span></dt><dd>Titik penting dalam jadwal proyek yang menandai selesainya hasil atau fase tertentu; durasinya nol. <i>(tonggak proyek)</i></dd></div><div><dt><span class=\"en\">Project calendar</span></dt><dd>Kalender hari dan jam kerja yang dipakai aplikasi untuk mengubah durasi menjadi tanggal. <i>(kalender proyek)</i></dd></div><div><dt><span class=\"en\">Schedule baseline</span></dt><dd>Versi jadwal yang sudah disetujui dan disimpan sebagai pembanding untuk memantau kemajuan. <i>(baseline jadwal)</i></dd></div><div><dt><span class=\"en\">Slack</span></dt><dd>Istilah lain untuk float di aplikasi seperti MS Project dan ProjectLibre: kelonggaran waktu sebuah aktivitas. <i>(kelonggaran (float))</i></dd></div><div><dt><span class=\"en\">Critical path</span></dt><dd>Rangkaian aktivitas terpanjang dalam jaringan proyek; panjangnya menentukan durasi proyek tersingkat. <i>(jalur kritis)</i></dd></div><div><dt><span class=\"en\">Schedule compression</span></dt><dd>Teknik memperpendek jadwal tanpa mengurangi lingkup, terutama crashing dan fast tracking. <i>(kompresi jadwal)</i></dd></div><div><dt><span class=\"en\">Crashing</span></dt><dd>Memperpendek durasi aktivitas di jalur kritis dengan menambah sumber daya, dengan biaya tambahan sekecil mungkin. <i>(percepatan dengan tambahan sumber daya)</i></dd></div><div><dt><span class=\"en\">Crash cost per day</span></dt><dd>Tambahan biaya untuk memperpendek satu aktivitas sebanyak satu hari; dipakai untuk memilih aktivitas yang ditekan lebih dulu. <i>(biaya percepatan per hari)</i></dd></div><div><dt><span class=\"en\">Fast tracking</span></dt><dd>Mengerjakan sebagian aktivitas secara paralel atau tumpang tindih padahal biasanya berurutan; risikonya pengerjaan ulang. <i>(pengerjaan tumpang tindih)</i></dd></div><div><dt><span class=\"en\">Rework</span></dt><dd>Pekerjaan yang harus diulang karena hasil sebelumnya salah atau berubah. <i>(pengerjaan ulang)</i></dd></div><div><dt><span class=\"en\">Lead dan lag</span></dt><dd>Lead: aktivitas penerus boleh mulai lebih awal sebelum pendahulu selesai. Lag: ada jeda tunggu antara dua aktivitas. <i>(percepatan dan jeda)</i></dd></div><div><dt><span class=\"en\">Total float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan tanggal selesai proyek; dihitung LS − ES. <i>(kelonggaran total)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 8 (UTS).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"Manajemen Biaya","subtitle":"Teknik estimasi, komponen biaya proyek SI, cost baseline, cadangan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 9</span><span>Sub-CPMK-5 · CPMK-1 · CPL-4</span></div><h1>Manajemen Biaya</h1><p class=\"lead\">Teknik estimasi, komponen biaya proyek SI, cost baseline, cadangan</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menyusun estimasi biaya dan cost baseline proyek SI (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":10,"title":"Manajemen Risiko","subtitle":"Identifikasi, analisis kualitatif dan kuantitatif (EMV), respons, risk register","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 10</span><span>Sub-CPMK-6 · CPMK-2 · CPL-2</span></div><h1>Manajemen Risiko</h1><p class=\"lead\">Identifikasi, analisis kualitatif dan kuantitatif (EMV), respons, risk register</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi risiko proyek SI dan merumuskan strategi responsnya (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":11,"title":"Manajemen Mutu","subtitle":"QA/QC, ISO/IEC 25010, User Acceptance Testing, kriteria penerimaan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 11</span><span>Sub-CPMK-7 · CPMK-3 · CPL-10</span></div><h1>Manajemen Mutu</h1><p class=\"lead\">QA/QC, ISO/IEC 25010, User Acceptance Testing, kriteria penerimaan</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu merancang rencana mutu dan mengevaluasi solusi SI hasil proyek terhadap kebutuhan organisasi (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":12,"title":"Pengadaan, Legal & Etika Proyek TI","subtitle":"Make-or-buy, jenis kontrak, pengadaan pemerintah, pelindungan data, green IT","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 12</span><span>Sub-CPMK-8 · CPMK-2 · CPL-2</span></div><h1>Pengadaan, Legal & Etika Proyek TI</h1><p class=\"lead\">Make-or-buy, jenis kontrak, pengadaan pemerintah, pelindungan data, green IT</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi strategi pengadaan dan kontrak proyek TI dengan memperhatikan aspek legal, etika, dan keberlanjutan (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":13,"title":"Tim, Komunikasi & Agile","subtitle":"Matriks RACI, rencana komunikasi, nilai dan prinsip agile, Scrum","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 13</span><span>Sub-CPMK-9 (Pertemuan 13–14) · CPMK-3 · CPL-10</span></div><h1>Tim, Komunikasi & Agile</h1><p class=\"lead\">Matriks RACI, rencana komunikasi, nilai dan prinsip agile, Scrum</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengelola pengembangan solusi SI secara iteratif dengan Scrum, termasuk tim, komunikasi, dan evaluasi increment bersama pemangku kepentingan (C3–C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":14,"title":"Simulasi Sprint Scrum","subtitle":"Product backlog, user story, definition of done, sprint review, hybrid","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 14</span><span>Sub-CPMK-9 (Pertemuan 13–14) · CPMK-3 · CPL-10</span></div><h1>Simulasi Sprint Scrum</h1><p class=\"lead\">Product backlog, user story, definition of done, sprint review, hybrid</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengelola pengembangan solusi SI secara iteratif dengan Scrum, termasuk tim, komunikasi, dan evaluasi increment bersama pemangku kepentingan (C3–C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":15,"title":"Pengendalian & Penutupan Proyek","subtitle":"Earned value management, pengendalian perubahan, lessons learned · presentasi akhir","status":"soon","slides":[{"cls":"","html":"<div (function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea,select'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,a,summary'))return; /* let focused buttons work */
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage')&&!e.target.closest('input,textarea,.g2-svg'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Interactive widgets (v4.4) ----------
   Slide HTML holds <div class="sim" data-sim="type" data-cfg="{json}">, made by W() in data.js.
   Built-in types: quizset, stepper, grid2, scenario, peer. Course-specific types: SIMS in data.js.
   UI labels in English; all content comes from cfg (Indonesian). State lives in memory per widget id. */
const WST={};
let wTimers=[];
const WIDGETS={quizset:wQuiz,stepper:wStep,grid2:wGrid,scenario:wScen,peer:wPeer};
function mountW(scope){
  wTimers.forEach(clearInterval); wTimers=[];
  scope.querySelectorAll('[data-sim]').forEach(el=>{
    let cfg={}; try{cfg=JSON.parse(el.getAttribute('data-cfg')||'{}');}catch(e){}
    const id=cfg.id||'w'; if(!WST[id]) WST[id]={};
    const f=WIDGETS[el.dataset.sim]||(typeof SIMS!=='undefined'&&SIMS[el.dataset.sim]);
    if(!f){el.innerHTML='<p class="muted">Unknown widget.</p>';return;}
    try{f(el,cfg,WST[id]);}catch(e){el.innerHTML='<p class="muted">This simulation could not be loaded.</p>';if(window.console)console.error(e);}
  });
}
const kb=e=>e&&e.detail===0; // activated from keyboard
function refocus(el,sel){const b=el.querySelector(sel);if(b)b.focus({preventScroll:true});}

/* Quiz, one question at a time, with score */
function wQuiz(el,cfg,s){
  const Q=cfg.items||[]; if(s.i===undefined){s.i=0;s.ans=[];}
  const L='ABCDEF';
  const draw=()=>{
    if(s.i>=Q.length){
      const ok=Q.filter((q,i)=>s.ans[i]===q.a).length;
      el.innerHTML='<div class="qs-end"><div class="qs-score" aria-live="polite"><b>'+ok+'</b><span>/ '+Q.length+'</span></div><div><p class="qs-msg">'+(ok===Q.length?'Excellent!':ok>=Math.ceil(Q.length*.6)?'Good work.':'Review the material and try again.')+'</p>'+
        '<ol class="qs-rev">'+Q.map((q,i)=>'<li class="'+(s.ans[i]===q.a?'ok':'no')+'"><span>'+q.q+'</span><small>'+L[q.a]+'. '+q.o[q.a]+'</small></li>').join('')+'</ol>'+
        '<button type="button" class="wbtn" data-act="again">↺ Try again</button></div></div>';
      return;
    }
    const q=Q[s.i], a=s.ans[s.i], done=a!==undefined;
    el.innerHTML='<div class="qs-top"><span>Question '+(s.i+1)+' of '+Q.length+'</span><span class="qs-dots" aria-hidden="true">'+
      Q.map((x,i)=>'<i class="'+(i===s.i?'cur ':'')+(s.ans[i]===undefined?'':(s.ans[i]===x.a?'ok':'no'))+'"></i>').join('')+'</span></div>'+
      '<p class="q">'+q.q+'</p><div class="opts">'+q.o.map((o,i)=>'<button type="button" data-o="'+i+'" class="'+(done&&i===q.a?'right':'')+(done&&i===a&&i!==q.a?' wrong':'')+'"'+(done?' aria-disabled="true"':'')+'>'+L[i]+'. '+o+'</button>').join('')+'</div>'+
      '<p class="fb" aria-live="polite">'+(done?(a===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why:'')+'</p>'+
      '<div class="qs-nav"><button type="button" class="wbtn" data-act="prev"'+(s.i?'':' disabled')+'>← Back</button><button type="button" class="wbtn pri" data-act="next"'+(done?'':' disabled')+'>'+(s.i===Q.length-1?'See score':'Next question')+' →</button></div>';
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.o!==undefined){ if(s.ans[s.i]!==undefined) return; s.ans[s.i]=+b.dataset.o; draw(); if(kb(e)) refocus(el,'[data-act=next]'); return; }
    const act=b.dataset.act;
    if(act==='next') s.i++; else if(act==='prev') s.i=Math.max(0,s.i-1); else if(act==='again'){s.i=0;s.ans=[];}
    draw(); if(kb(e)) refocus(el,s.i>=Q.length?'[data-act=again]':'.opts button');
  };
  draw();
}

/* Animated step-by-step process (Play / ← →) */
function wStep(el,cfg,s){
  const S=cfg.steps||[]; if(s.i===undefined) s.i=0;
  el.innerHTML='<ol class="st-row" style="--n:'+S.length+'">'+S.map((x,i)=>'<li><button type="button" data-i="'+i+'"><span class="st-no">'+(i+1)+'</span><span class="st-t">'+x.t+'</span>'+(x.en?'<span class="st-en">'+x.en+'</span>':'')+'</button></li>').join('')+'</ol>'+
    '<div class="st-bar" aria-hidden="true"><i></i></div><div class="st-panel" aria-live="polite"></div>'+
    '<div class="st-nav"><button type="button" class="wbtn" data-act="prev" aria-label="Previous step">←</button><button type="button" class="wbtn pri" data-act="play">▶ Play</button><button type="button" class="wbtn" data-act="next" aria-label="Next step">→</button></div>';
  let timer=null;
  const playBtn=el.querySelector('[data-act=play]');
  const show=()=>{
    el.querySelectorAll('.st-row button').forEach((b,i)=>{b.classList.toggle('on',i===s.i);b.classList.toggle('done',i<s.i);b.setAttribute('aria-current',i===s.i?'step':'false');});
    el.querySelector('.st-bar i').style.width=(S.length>1?s.i/(S.length-1)*100:100)+'%';
    const p=el.querySelector('.st-panel'), x=S[s.i];
    p.classList.remove('in'); void p.offsetWidth;
    p.innerHTML='<h4>'+(s.i+1)+'. '+x.t+(x.en?' <span class="st-en">'+x.en+'</span>':'')+'</h4><p>'+x.d+'</p>'+(x.ex?'<p class="st-ex">'+x.ex+'</p>':'');
    p.classList.add('in');
  };
  const stop=()=>{ if(timer){clearInterval(timer);timer=null;} playBtn.textContent='▶ Play'; };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.i!==undefined){ stop(); s.i=+b.dataset.i; show(); return; }
    const act=b.dataset.act;
    if(act==='prev'){ stop(); s.i=Math.max(0,s.i-1); show(); }
    else if(act==='next'){ stop(); s.i=Math.min(S.length-1,s.i+1); show(); }
    else if(act==='play'){
      if(timer){ stop(); return; }
      if(s.i>=S.length-1){ s.i=0; show(); }
      playBtn.textContent='❚❚ Pause';
      timer=setInterval(()=>{ if(!el.isConnected||s.i>=S.length-1){ stop(); return; } s.i++; show(); }, cfg.ms||2800);
      wTimers.push(timer);
    }
  };
  show();
}

/* Two-axis simulation: sliders (or click/drag) move a point across labelled zones */
function wGrid(el,cfg,s){
  const Z=cfg.zones||[], max=cfg.max||10;
  if(s.x===undefined){ s.x=(cfg.init||[max/2,max/2])[0]; s.y=(cfg.init||[max/2,max/2])[1]; }
  const W=320,H=320,PL=40,PB=40,PT=10,PR=10;
  const X=v=>PL+v/max*(W-PL-PR), Y=v=>H-PB-v/max*(H-PB-PT);
  const zoneOf=()=>Z.find(z=>s.x>=z.r[0]&&s.x<=z.r[1]&&s.y>=z.r[2]&&s.y<=z.r[3])||Z[Z.length-1];
  const rects=Z.slice().reverse().map(z=>{const v=z.v||z.r, x0=X(v[0]),x1=X(v[1]),y0=Y(v[3]),y1=Y(v[2]); /* v: optional visual rect */
    return '<g class="g2-z" data-z="'+z.k+'"><rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" class="'+(z.cls||'s-box')+'"/><text x="'+((x0+x1)/2)+'" y="'+((y0+y1)/2+4)+'" text-anchor="middle" class="s-t" style="font-size:'+Math.min(13,Math.max(8,(x1-x0-6)/(String(z.en).length*.6))).toFixed(1)+'px">'+z.en+'</text></g>';}).join('');
  el.innerHTML='<div class="g2"><div class="g2-fig"><svg class="g2-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(cfg.aria||'Interactive grid')+'">'+rects+
    '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" class="s-line"/><line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" class="s-line"/>'+
    '<text x="'+((PL+W-PR)/2)+'" y="'+(H-12)+'" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.x.label+' →</text>'+
    '<text transform="translate(16 '+((PT+H-PB)/2)+') rotate(-90)" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.y.label+' →</text>'+
    '<text x="'+PL+'" y="'+(H-PB+16)+'" class="s-s" style="font-size:10px">'+(cfg.x.lo||'rendah')+'</text><text x="'+(W-PR)+'" y="'+(H-PB+16)+'" text-anchor="end" class="s-s" style="font-size:10px">'+(cfg.x.hi||'tinggi')+'</text>'+
    '<circle class="g2-dot" r="11" cx="'+X(s.x)+'" cy="'+Y(s.y)+'"/></svg></div>'+
    '<div class="g2-side"><label class="g2-sl"><span>'+cfg.x.label+' <b data-v="x">'+s.x+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.x+'" data-ax="x" aria-label="'+cfg.x.label+'"></label>'+
    '<label class="g2-sl"><span>'+cfg.y.label+' <b data-v="y">'+s.y+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.y+'" data-ax="y" aria-label="'+cfg.y.label+'"></label>'+
    '<div class="g2-out" aria-live="polite"></div></div></div>';
  const dot=el.querySelector('.g2-dot'), out=el.querySelector('.g2-out'); let last=null;
  const upd=()=>{
    dot.setAttribute('cx',X(s.x)); dot.setAttribute('cy',Y(s.y));
    el.querySelector('[data-v=x]').textContent=s.x; el.querySelector('[data-v=y]').textContent=s.y;
    el.querySelector('[data-ax=x]').value=s.x; el.querySelector('[data-ax=y]').value=s.y;
    const z=zoneOf(); el.querySelectorAll('.g2-z').forEach(g=>g.classList.toggle('on',g.dataset.z===z.k));
    if(last!==z.k){ last=z.k; out.classList.remove('in'); void out.offsetWidth;
      out.innerHTML='<div class="g2-name">'+z.name+(z.en?' <span>'+z.en+'</span>':'')+'</div>'+(z.tag?'<div class="g2-tag">'+z.tag+'</div>':'')+'<p>'+z.d+'</p>'+(z.ex?'<p class="g2-ex">'+z.ex+'</p>':'');
      out.classList.add('in'); }
  };
  el.oninput=e=>{const r=e.target.closest('input[type=range]'); if(!r) return; s[r.dataset.ax]=+r.value; upd();};
  const svg=el.querySelector('svg'); let drag=false;
  const fromPt=e=>{const m=svg.getScreenCTM(); if(!m) return; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(m.inverse());
    s.x=Math.max(0,Math.min(max,Math.round((q.x-PL)/(W-PL-PR)*max))); s.y=Math.max(0,Math.min(max,Math.round((H-PB-q.y)/(H-PB-PT)*max))); upd();};
  svg.addEventListener('pointerdown',e=>{drag=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} fromPt(e);});
  svg.addEventListener('pointermove',e=>{if(drag) fromPt(e);});
  svg.addEventListener('pointerup',()=>{drag=false;}); svg.addEventListener('pointercancel',()=>{drag=false;});
  upd();
}

/* Branching scenario: choices lead to feedback and new situations */
function wScen(el,cfg,s){
  const N=cfg.nodes||{};
  if(!s.node){ s.node=cfg.start; s.path=[]; s.fb=null; }
  const draw=()=>{
    const n=N[s.node]; let h='';
    if(s.path.length) h+='<div class="sc-path" aria-label="Choices so far">'+s.path.map((p,i)=>'<span class="sc-tag '+(p.k||'')+'">'+(i+1)+'. '+p.tag+'</span>').join('')+'</div>';
    if(s.fb){
      h+='<div class="sc-fb '+(s.fb.k||'')+'"><div class="sc-fbh">'+(s.fb.k==='good'?'✔':s.fb.k==='bad'?'✖':'◐')+' '+s.fb.tag+'</div><p>'+s.fb.fb+'</p></div><div class="sc-nav"><button type="button" class="wbtn pri" data-act="go">Continue →</button></div>';
    } else {
      h+='<div class="sc-scene">'+(n.text?'<p class="sc-text">'+n.text+'</p>':'')+(n.say||[]).map(b=>'<div class="sc-say"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>').join('')+'</div>';
      if(n.end) h+='<div class="sc-end '+(n.k||'')+'"><div class="sc-fbh">'+n.title+'</div><p>'+n.end+'</p></div><div class="sc-nav"><button type="button" class="wbtn" data-act="restart">↺ Start again</button></div>';
      else h+='<p class="sc-ask">'+(n.ask||cfg.ask||'')+'</p><div class="sc-ch">'+n.ch.map((c,i)=>'<button type="button" data-c="'+i+'">'+c.t+'</button>').join('')+'</div>';
    }
    el.innerHTML=h;
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.c!==undefined){ const c=N[s.node].ch[+b.dataset.c]; s.fb={k:c.k,tag:c.tag,fb:c.fb,to:c.to}; s.path.push({tag:c.tag,k:c.k}); draw(); if(kb(e)) refocus(el,'[data-act=go]'); return; }
    if(b.dataset.act==='go'){ s.node=s.fb.to; s.fb=null; }
    else if(b.dataset.act==='restart'){ s.node=cfg.start; s.path=[]; s.fb=null; }
    draw(); if(kb(e)) refocus(el,'.sc-ch button,[data-act=restart]');
  };
  draw();
}

/* Peer assessment (formative): criteria x levels, comments, copyable summary.
   Draft is kept only in this browser (localStorage) and is never sent anywhere. */
function wPeer(el,cfg,s){
  const C=cfg.criteria||[], Lv=cfg.levels||['1','2','3','4'], K='peer:'+cfg.id, maxS=C.length*Lv.length;
  if(!s.v){ const d=store.get(K,null); s.v=d&&typeof d==='object'?d:{who:'',sc:{},good:'',tip:''}; if(!s.v.sc) s.v.sc={}; }
  const save=()=>store.set(K,s.v);
  const total=()=>C.reduce((a,c,i)=>a+(s.v.sc[i]||0),0);
  const filled=()=>C.filter((c,i)=>s.v.sc[i]).length;
  const band=t=>{const b=(cfg.bands||[]).slice().sort((x,y)=>y.min-x.min).find(x=>t>=x.min); return b?b.t:'';};
  const rowHTML=i=>{const c=C[i], v=s.v.sc[i]||0;
    return '<div class="pa-row" data-r="'+i+'"><div class="pa-c"><b>'+c.t+'</b>'+(c.ind?'<small>'+c.ind+'</small>':'')+'</div><div class="pa-lv" role="group" aria-label="'+c.t.replace(/<[^>]+>/g,'')+'">'+
      Lv.map((l,j)=>'<button type="button" data-r="'+i+'" data-l="'+(j+1)+'" aria-pressed="'+(v===j+1)+'" title="'+l+'">'+(j+1)+'</button>').join('')+
      '</div><div class="pa-d">'+(v?'<b>'+Lv[v-1]+':</b> '+c.d[v-1]:'<span class="muted">'+(cfg.pick||'Pick a level.')+'</span>')+'</div></div>';};
  const sumHTML=()=>{const t=total(), f=filled();
    return '<div class="pa-total"><span><b>'+t+'</b> / '+maxS+'</span><div class="pa-meter"><i style="width:'+(t/maxS*100)+'%"></i></div></div><div class="pa-band">'+(f===C.length?band(t):(f+' of '+C.length+' criteria rated'))+'</div>';};
  el.innerHTML='<div class="pa"><div class="pa-grid">'+C.map((c,i)=>rowHTML(i)).join('')+'</div>'+
    '<div class="pa-side"><label class="pa-f"><span>'+(cfg.whoLabel||'Peer')+'</span><input type="text" data-f="who" maxlength="80" value="'+String(s.v.who).replace(/"/g,'&quot;')+'" placeholder="'+(cfg.whoPh||'')+'"></label>'+
    '<label class="pa-f"><span>'+(cfg.goodLabel||'What went well')+'</span><textarea data-f="good" rows="2" maxlength="400" placeholder="'+(cfg.goodPh||'')+'"></textarea></label>'+
    '<label class="pa-f"><span>'+(cfg.tipLabel||'Suggestion')+'</span><textarea data-f="tip" rows="2" maxlength="400" placeholder="'+(cfg.tipPh||'')+'"></textarea></label>'+
    '<div class="pa-sum" aria-live="polite">'+sumHTML()+'</div>'+
    '<div class="pa-act"><button type="button" class="wbtn pri" data-act="copy">Copy summary</button><button type="button" class="wbtn" data-act="clear">Clear</button><span class="pa-msg" aria-live="polite"></span></div></div></div>';
  el.querySelector('[data-f=good]').value=s.v.good||''; el.querySelector('[data-f=tip]').value=s.v.tip||'';
  const msg=t=>{const m=el.querySelector('.pa-msg'); m.textContent=t; setTimeout(()=>{if(m.textContent===t)m.textContent='';},2500);};
  el.oninput=e=>{const f=e.target.dataset&&e.target.dataset.f; if(!f) return; s.v[f]=e.target.value; save();};
  const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
  const text=()=>[plain(cfg.title||'Peer assessment'),(cfg.whoLabel||'Peer')+': '+(s.v.who||'-')]
    .concat(C.map((c,i)=>'- '+plain(c.t)+': '+(s.v.sc[i]?s.v.sc[i]+' ('+Lv[s.v.sc[i]-1]+')':'-')))
    .concat(['Total: '+total()+' / '+maxS+(filled()===C.length?' · '+plain(band(total())):''),(cfg.goodLabel||'What went well')+': '+(s.v.good||'-'),(cfg.tipLabel||'Suggestion')+': '+(s.v.tip||'-')]).join('\n');
  const copy=()=>{const t=text();
    const fallback=()=>{const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); msg(ok?'Copied.':'Copy failed. Select the text manually.');};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>msg('Copied.'),fallback); else fallback();};
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.l){ const i=+b.dataset.r; s.v.sc[i]=+b.dataset.l; save();
      const r=el.querySelector('.pa-row[data-r="'+i+'"]'); r.outerHTML=rowHTML(i); el.querySelector('.pa-sum').innerHTML=sumHTML();
      if(kb(e)) refocus(el,'.pa-row[data-r="'+i+'"] [data-l="'+b.dataset.l+'"]'); return; }
    if(b.dataset.act==='copy') copy();
    else if(b.dataset.act==='clear'){ s.v={who:'',sc:{},good:'',tip:''}; save(); wPeer(el,cfg,s); msg('Cleared.'); }
  };
}
