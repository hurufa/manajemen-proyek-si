=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-box\"/><text x=\"682\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Jalankan</text><text x=\"682\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">tindakan</text><line x1=\"737\" y1=\"75\" x2=\"750\" y2=\"75\" class=\"s-line\" marker-end=\"url(#pr10)\"/><rect x=\"752\" y=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-box\"/><text x=\"806\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Pantau</text><text x=\"806\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">trigger, update</text><path d=\"M810 116 C 810 168, 190 168, 190 118\" fill=\"none\" class=\"s-line\" stroke-dasharray=\"5 4\" marker-end=\"url(#pr10)\"/><text x=\"500\" y=\"182\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">berulang sepanjang proyek: risk register diperbarui</text><text x=\"132\" y=\"24\" class=\"s-hd\">HARI INI ·····················································</text></svg><figcaption>Alur manajemen risiko dalam mata kuliah ini, dirangkum dari pembahasan risk management oleh Schwalbe (2019) dan Kerzner (2025).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"risk\">Risiko</button>: belum terjadi, bisa baik atau buruk</h2><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"An uncertain event or condition that, if it occurs, has a positive or negative effect on one or more project objectives.\"</p><p class=\"tr\">\"Kejadian atau kondisi tidak pasti yang, bila terjadi, berdampak positif atau negatif pada satu atau lebih tujuan proyek.\"</p><div class=\"src\">PMI, definisi risk</div></blockquote><div class=\"cols\" style=\"margin-top:.6em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg><button type=\"button\" class=\"term\" data-term=\"threat\">Ancaman</button></h3><p>Dampak negatif. Contoh: data santri lama tidak rapi sehingga migrasi molor.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg><button type=\"button\" class=\"term\" data-term=\"opportunity\">Peluang</button></h3><p>Dampak positif. Contoh: alumni menawarkan hibah server sehingga biaya cloud turun.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Bukan risiko</h3><p>Masalah yang <b>sudah terjadi</b> (issue). Itu ditangani, bukan dianalisis peluangnya.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Identifikasi risiko</h2><div class=\"cols\"><div><h3 style=\"margin-top:0\">Teknik</h3><ul><li><b>Brainstorming</b> tim dan mitra</li><li><b>Wawancara</b> pengguna kunci</li><li><b>Daftar periksa</b> dari proyek lalu</li><li><b>Analisis asumsi</b> di charter dan scope statement</li><li><b>SWOT</b> proyek</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"rbs\">RBS</button>: sumber risiko</h3><ul style=\"margin:0\"><li><b>Teknis</b>: data, teknologi, integrasi</li><li><b>Eksternal</b>: harga, regulasi, vendor</li><li><b>Organisasi</b>: SDM, dukungan pimpinan</li><li><b>Manajemen proyek</b>: estimasi, lingkup, komunikasi</li></ul></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Dirangkum dari Schwalbe (2019). Kategori RBS di atas contoh untuk proyek SI.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Menulis <button type=\"button\" class=\"term\" data-term=\"risk-statement\">risk statement</button></h2><div class=\"card hl\" style=\"font-size:1.05em\"><b>Karena</b> [penyebab, sudah fakta], <b>mungkin terjadi</b> [kejadian tidak pasti], <b>yang berakibat</b> [dampak pada tujuan].</div><div class=\"cols\" style=\"margin-top:.6em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Kurang jelas</h3><ul style=\"margin:0\"><li>\"Data.\"</li><li>\"Server.\"</li><li>\"Pengguna tidak mau.\"</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jelas</h3><p style=\"font-size:.9em\">Karena data santri lama tersimpan di buku dan Excel yang tidak seragam, mungkin migrasi data molor, yang berakibat jadwal mundur dan biaya programmer bertambah.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Analisis kualitatif: skala P dan I</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.82em\"><thead><tr><th>Nilai</th><th>Probabilitas (P)</th><th>Dampak (I), contoh untuk modul tagihan</th></tr></thead><tbody><tr><td><b>1</b></td><td>Sangat kecil (<10%)</td><td>Terlambat < 1 hari atau biaya < Rp0,25 jt</td></tr><tr><td><b>2</b></td><td>Kecil (10–30%)</td><td>Terlambat 1–2 hari atau Rp0,25–0,5 jt</td></tr><tr><td><b>3</b></td><td>Sedang (30–50%)</td><td>Terlambat 3–5 hari atau Rp0,5–1 jt</td></tr><tr><td><b>4</b></td><td>Besar (50–70%)</td><td>Terlambat 6–10 hari atau Rp1–2 jt</td></tr><tr><td><b>5</b></td><td>Sangat besar (>70%)</td><td>Go-live gagal atau > Rp2 jt</td></tr></tbody></table></div><p style=\"margin-top:.5em\"><b>Skor = P × I.</b> Zona: <span class=\"chip\" style=\"background:var(--ok);color:#fff\">1–4 rendah</span> <span class=\"chip\" style=\"background:var(--mustard)\">5–9 sedang</span> <span class=\"chip\" style=\"background:var(--coral);color:#fff\">10–25 tinggi</span></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 2 · ubah P dan I</span></div><h2>Matriks probabilitas–dampak</h2><div class=\"sim sim-pim\" data-sim=\"pim\" data-cfg=\"{&quot;id&quot;:&quot;p10-pim&quot;,&quot;risks&quot;:[{&quot;id&quot;:&quot;R1&quot;,&quot;cat&quot;:&quot;Teknis&quot;,&quot;st&quot;:&quot;Karena data santri lama tersimpan di buku dan Excel yang tidak seragam, mungkin migrasi data molor, yang berakibat jadwal mundur dan biaya programmer bertambah.&quot;,&quot;s&quot;:&quot;Data santri lama tidak rapi&quot;,&quot;P&quot;:4,&quot;I&quot;:3,&quot;p&quot;:0.6,&quot;dmp&quot;:2,&quot;act&quot;:&quot;D&quot;,&quot;resp&quot;:&quot;Mitigate&quot;,&quot;do&quot;:&quot;Uji migrasi dengan 50 data contoh di minggu pertama; bagian administrasi merapikan data lebih dulu.&quot;,&quot;own&quot;:&quot;Analis sistem&quot;,&quot;trg&quot;:&quot;Lebih dari 10% data contoh gagal diimpor.&quot;},{&quot;id&quot;:&quot;R2&quot;,&quot;cat&quot;:&quot;Eksternal&quot;,&quot;st&quot;:&quot;Karena harga perangkat mengikuti kurs, mungkin harga printer kuitansi naik, yang berakibat biaya perangkat melebihi estimasi.&quot;,&quot;s&quot;:&quot;Harga printer kuitansi naik&quot;,&quot;P&quot;:3,&quot;I&quot;:1,&quot;p&quot;:0.5,&quot;dmp&quot;:0.6,&quot;act&quot;:&quot;F&quot;,&quot;resp&quot;:&quot;Accept (aktif)&quot;,&quot;do&quot;:&quot;Sediakan kontingensi; minta penawaran harga dari dua toko.&quot;,&quot;own&quot;:&quot;Bendahara proyek&quot;,&quot;trg&quot;:&quot;Harga penawaran &gt; Rp1,5 juta.&quot;},{&quot;id&quot;:&quot;R3&quot;,&quot;cat&quot;:&quot;Organisasi&quot;,&quot;st&quot;:&quot;Karena staf keuangan belum terbiasa dengan aplikasi, mungkin satu sesi pelatihan tidak cukup, yang berakibat perlu pelatihan tambahan.&quot;,&quot;s&quot;:&quot;Pelatihan tambahan bagian keuangan&quot;,&quot;P&quot;:3,&quot;I&quot;:2,&quot;p&quot;:0.5,&quot;dmp&quot;:1,&quot;act&quot;:&quot;H&quot;,&quot;resp&quot;:&quot;Mitigate&quot;,&quot;do&quot;:&quot;Buat panduan bergambar dan video singkat; latih satu staf sebagai pendamping.&quot;,&quot;own&quot;:&quot;Pelatih&quot;,&quot;trg&quot;:&quot;Kurang dari 80% peserta lulus uji praktik.&quot;},{&quot;id&quot;:&quot;R4&quot;,&quot;cat&quot;:&quot;Organisasi&quot;,&quot;st&quot;:&quot;Karena bendahara pesantren dijadwalkan pindah tugas, mungkin narasumber kunci tidak tersedia, yang berakibat validasi kebutuhan tertunda.&quot;,&quot;s&quot;:&quot;Bendahara pindah tugas&quot;,&quot;P&quot;:2,&quot;I&quot;:4,&quot;resp&quot;:&quot;Mitigate&quot;,&quot;do&quot;:&quot;Rekam hasil wawancara; libatkan wakil bendahara sejak awal.&quot;,&quot;own&quot;:&quot;Manajer proyek&quot;,&quot;trg&quot;:&quot;Ada SK mutasi.&quot;},{&quot;id&quot;:&quot;R5&quot;,&quot;cat&quot;:&quot;Teknis&quot;,&quot;st&quot;:&quot;Karena server cloud dikelola pihak ketiga, mungkin layanan gangguan saat go-live, yang berakibat pembayaran wali santri tidak tercatat.&quot;,&quot;s&quot;:&quot;Server cloud gangguan saat go-live&quot;,&quot;P&quot;:2,&quot;I&quot;:5,&quot;resp&quot;:&quot;Transfer + Mitigate&quot;,&quot;do&quot;:&quot;Pilih layanan dengan SLA tertulis; siapkan pencatatan manual cadangan.&quot;,&quot;own&quot;:&quot;Programmer&quot;,&quot;trg&quot;:&quot;Pemberitahuan pemeliharaan dari penyedia.&quot;},{&quot;id&quot;:&quot;R6&quot;,&quot;cat&quot;:&quot;Manajemen proyek&quot;,&quot;st&quot;:&quot;Karena pengasuh sering mendapat usulan dari wali santri, mungkin muncul permintaan fitur tambahan, yang berakibat lingkup bertambah tanpa tambahan waktu.&quot;,&quot;s&quot;:&quot;Permintaan fitur tambahan&quot;,&quot;P&quot;:4,&quot;I&quot;:4,&quot;resp&quot;:&quot;Mitigate&quot;,&quot;do&quot;:&quot;Semua permintaan lewat change request (Pertemuan 5); disepakati di charter.&quot;,&quot;own&quot;:&quot;Manajer proyek&quot;,&quot;trg&quot;:&quot;Permintaan di luar scope statement.&quot;}],&quot;note&quot;:&quot;Data ilustrasi modul tagihan; skala definisi kerja mata kuliah.&quot;}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 2 · tekan Play atau klik langkah</span></div><h2>Analisis kuantitatif: <button type=\"button\" class=\"term\" data-term=\"emv\">EMV</button></h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p10-emv&quot;,&quot;ms&quot;:4200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Rumus&quot;,&quot;en&quot;:&quot;EMV&quot;,&quot;d&quot;:&quot;EMV = peluang × dampak dalam rupiah. Ancaman bernilai positif sebagai biaya yang diharapkan.&quot;,&quot;ex&quot;:&quot;Hanya untuk risiko yang dampaknya dapat dihitung uang.&quot;},{&quot;t&quot;:&quot;R1 data santri&quot;,&quot;en&quot;:&quot;threat&quot;,&quot;d&quot;:&quot;Peluang 60%, dampak 5 hari programmer = Rp2,0 juta.&quot;,&quot;ex&quot;:&quot;0,6 × 2,0 = Rp1,2 juta.&quot;},{&quot;t&quot;:&quot;R2 harga printer&quot;,&quot;en&quot;:&quot;threat&quot;,&quot;d&quot;:&quot;Peluang 50%, kenaikan sekitar Rp0,6 juta.&quot;,&quot;ex&quot;:&quot;0,5 × 0,6 = Rp0,3 juta.&quot;},{&quot;t&quot;:&quot;R3 pelatihan tambahan&quot;,&quot;en&quot;:&quot;threat&quot;,&quot;d&quot;:&quot;Peluang 50%, satu sesi tambahan Rp1,0 juta.&quot;,&quot;ex&quot;:&quot;0,5 × 1,0 = Rp0,5 juta.&quot;},{&quot;t&quot;:&quot;Jumlah = kontingensi&quot;,&quot;en&quot;:&quot;contingency&quot;,&quot;d&quot;:&quot;Jumlah EMV ancaman menjadi dasar cadangan kontingensi di cost baseline.&quot;,&quot;ex&quot;:&quot;1,2 + 0,3 + 0,5 = Rp2,0 juta, sama dengan kontingensi Pertemuan 9.&quot;},{&quot;t&quot;:&quot;Layakkah mitigasi?&quot;,&quot;en&quot;:&quot;decision&quot;,&quot;d&quot;:&quot;Bandingkan EMV tanpa dan dengan tindakan. Uji migrasi dan perapian data biayanya Rp0,4 juta dan menurunkan peluang R1 menjadi 20%.&quot;,&quot;ex&quot;:&quot;Tanpa: 1,2. Dengan: 0,4 + (0,2 × 2,0) = 0,8. Mitigasi lebih murah Rp0,4 juta.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"risk-response\">Strategi respons</button></h2><div class=\"cols\"><div><h3 style=\"margin-top:0\">Ancaman</h3><ul><li><b>Escalate</b>: di luar wewenang proyek, naikkan ke pimpinan</li><li><b>Avoid</b>: hilangkan penyebabnya, mis. ubah rencana</li><li><b>Transfer</b>: alihkan dampak, mis. SLA, asuransi, kontrak</li><li><b>Mitigate</b>: turunkan peluang atau dampak</li><li><b>Accept</b>: terima; aktif dengan kontingensi, pasif tanpa tindakan</li></ul></div><div><h3 style=\"margin-top:0\">Peluang</h3><ul><li><b>Escalate</b>: naikkan ke pimpinan</li><li><b>Exploit</b>: pastikan peluang terjadi</li><li><b>Share</b>: ajak pihak yang mampu</li><li><b>Enhance</b>: naikkan peluang atau manfaat</li><li><b>Accept</b>: manfaatkan bila terjadi</li></ul></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Dirangkum dari PMI (2025) dan Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Indikator 3 · pilih respons</span></div><h2>Respons mana yang tepat?</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;p10-resp&quot;,&quot;start&quot;:&quot;s&quot;,&quot;ask&quot;:&quot;Strategi apa yang Anda pilih?&quot;,&quot;nodes&quot;:{&quot;s&quot;:{&quot;text&quot;:&quot;R5: server cloud bisa gangguan saat go-live. Peluang kecil, dampak sangat besar (pembayaran tidak tercatat).&quot;,&quot;say&quot;:[[&quot;Bendahara&quot;,&quot;Kalau hari pertama sistem mati, wali santri bisa protes.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Memilih penyedia dengan SLA tertulis dan menyiapkan buku kas manual cadangan untuk hari go-live.&quot;,&quot;tag&quot;:&quot;Transfer + mitigate&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. SLA mengalihkan sebagian dampak ke penyedia, dan pencatatan manual menurunkan dampaknya.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Tidak melakukan apa-apa karena peluangnya kecil.&quot;,&quot;tag&quot;:&quot;Accept pasif&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Dampaknya sangat besar; menerima pasif tidak sepadan untuk risiko ini.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Membatalkan rencana memakai cloud.&quot;,&quot;tag&quot;:&quot;Avoid&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Menghindari mungkin, tetapi memunculkan risiko baru (server lokal tanpa pengelola). Pertimbangkan secondary risk.&quot;,&quot;to&quot;:&quot;b&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;R6: pengasuh sering meneruskan usulan fitur dari wali santri di tengah proyek.&quot;,&quot;ask&quot;:&quot;Respons apa yang paling tepat?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Menyepakati sejak awal bahwa semua usulan lewat change request dan diputuskan sponsor.&quot;,&quot;tag&quot;:&quot;Mitigate&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Peluang permintaan liar turun, dan dampaknya terkendali lewat analisis dampak.&quot;,&quot;to&quot;:&quot;c&quot;},{&quot;t&quot;:&quot;Menerima semua usulan agar pengasuh senang.&quot;,&quot;tag&quot;:&quot;Accept tanpa kendali&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Ini scope creep; jadwal dan biaya akan melewati baseline.&quot;,&quot;to&quot;:&quot;c&quot;}]},&quot;c&quot;:{&quot;text&quot;:&quot;Peluang: alumni menawarkan hibah server bekas yang layak pakai.&quot;,&quot;ask&quot;:&quot;Bagaimana menanggapinya?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Segera menghubungi alumni, memeriksa spesifikasi, dan menjadwalkan serah terima.&quot;,&quot;tag&quot;:&quot;Exploit&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Tim berusaha memastikan peluang benar-benar terjadi.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Menunggu saja sampai alumni menghubungi lagi.&quot;,&quot;tag&quot;:&quot;Accept&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Boleh, tetapi peluangnya bisa hilang. Untuk manfaat sebesar ini, respons aktif lebih baik.&quot;,&quot;to&quot;:&quot;endMid&quot;}]},&quot;endGood&quot;:{&quot;end&quot;:&quot;Respons sesuai prioritas dan jenis risiko: ancaman besar diberi respons aktif dan pemilik, peluang diusahakan terjadi.&quot;,&quot;title&quot;:&quot;Pilihan tepat&quot;,&quot;k&quot;:&quot;good&quot;},&quot;endMid&quot;:{&quot;end&quot;:&quot;Hampir tepat. Periksa lagi apakah respons sepadan dengan dampak dan peluangnya.&quot;,&quot;title&quot;:&quot;Cukup&quot;,&quot;k&quot;:&quot;mid&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Indikator 4 · data ilustrasi</span></div><h2><button type=\"button\" class=\"term\" data-term=\"risk-register\">Risk register</button> modul tagihan</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.7em\"><thead><tr><th>ID</th><th>Kategori</th><th>Risiko</th><th>P</th><th>I</th><th>Skor</th><th>EMV</th><th>Respons dan tindakan</th><th>Pemilik</th><th>Trigger</th></tr></thead><tbody><tr><td><b>R6</b></td><td>Manajemen proyek</td><td>Permintaan fitur tambahan</td><td>4</td><td>4</td><td><b>16</b></td><td>–</td><td><b>Mitigate</b>: Semua permintaan lewat change request (Pertemuan 5); disepakati di charter.</td><td>Manajer proyek</td><td>Permintaan di luar scope statement.</td></tr><tr><td><b>R1</b></td><td>Teknis</td><td>Data santri lama tidak rapi</td><td>4</td><td>3</td><td><b>12</b></td><td>Rp1,2 jt</td><td><b>Mitigate</b>: Uji migrasi dengan 50 data contoh di minggu pertama; bagian administrasi merapikan data lebih dulu.</td><td>Analis sistem</td><td>Lebih dari 10% data contoh gagal diimpor.</td></tr><tr><td><b>R5</b></td><td>Teknis</td><td>Server cloud gangguan saat go-live</td><td>2</td><td>5</td><td><b>10</b></td><td>–</td><td><b>Transfer + Mitigate</b>: Pilih layanan dengan SLA tertulis; siapkan pencatatan manual cadangan.</td><td>Programmer</td><td>Pemberitahuan pemeliharaan dari penyedia.</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Tiga risiko teratas ditampilkan. Kolom status (terbuka, terjadi, ditutup) ditambahkan saat pemantauan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 4</span></div><h2>Memantau risiko</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tinjau rutin</h3><p>Bahas 5 risiko teratas di rapat mingguan; perbarui P, I, dan status.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg><button type=\"button\" class=\"term\" data-term=\"risk-trigger\">Trigger</button></h3><p>Pantau tanda awal; jalankan respons begitu trigger muncul.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Risiko baru</h3><p>Tambahkan risiko yang muncul; tutup yang sudah lewat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"residual-risk\">Residual</button></h3><p>Risiko yang tersisa setelah respons, dicatat kembali.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg><button type=\"button\" class=\"term\" data-term=\"secondary-risk\">Secondary</button></h3><p>Risiko baru akibat respons, mis. server lokal tanpa pengelola.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Kontingensi</h3><p>Hitung ulang bila risiko berubah; catat pemakaiannya.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop kelompok</span><span>30 menit · bahan Tugas 2A</span></div><h2>Risk register proyek mitra</h2><ol class=\"lead\"><li>Identifikasi <b>minimal 8 risiko</b> dari empat kategori RBS; minimal satu peluang.</li><li>Tulis tiap risiko dalam format <b>karena–mungkin–berakibat</b>.</li><li>Beri nilai P dan I, hitung skor, tentukan zona.</li><li>Hitung <b>EMV</b> untuk risiko berdampak biaya; bandingkan dengan kontingensi Tugas 2A bagian biaya.</li><li>Pilih respons, pemilik, dan trigger untuk risiko zona tinggi.</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Risiko = tidak pasti, bisa <b>ancaman</b> atau <b>peluang</b>; masalah yang sudah terjadi bukan risiko.</li><li>Identifikasi lengkap dengan <b>RBS</b>; tulis <b>karena–mungkin–berakibat</b>.</li><li>Kualitatif: <b>P × I</b> untuk prioritas. Kuantitatif: <b>EMV</b> untuk kontingensi dan keputusan.</li><li>Respons sepadan: <b>escalate, avoid, transfer, mitigate, accept</b> (peluang: exploit, share, enhance).</li><li><b>Risk register</b> berisi pemilik dan trigger, dan diperbarui sepanjang proyek.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p10-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Rumusan risk statement yang paling tepat adalah…&quot;,&quot;o&quot;:[&quot;\\&quot;Anggaran proyek kurang.\\&quot;&quot;,&quot;\\&quot;Programmer.\\&quot;&quot;,&quot;\\&quot;Karena vendor hosting baru pertama kali dipakai, mungkin konfigurasi server terlambat, yang berakibat uji sistem mundur.\\&quot;&quot;,&quot;\\&quot;Proyek gagal.\\&quot;&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Rumusan yang baik memisahkan penyebab, kejadian tidak pasti, dan dampak. Pilihan A adalah masalah, bukan risiko.&quot;},{&quot;q&quot;:&quot;Dengan skala mata kuliah (P dan I 1–5; zona 1–4 rendah, 5–9 sedang, 10–25 tinggi), risiko dengan P = 2 dan I = 4 berskor…&quot;,&quot;o&quot;:[&quot;6, sedang&quot;,&quot;8, sedang&quot;,&quot;8, tinggi&quot;,&quot;10, tinggi&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Skor = 2 × 4 = 8, berada di zona sedang (5–9).&quot;},{&quot;q&quot;:&quot;Peluang risiko 30% dan dampaknya Rp4 juta. EMV-nya…&quot;,&quot;o&quot;:[&quot;Rp1,2 juta&quot;,&quot;Rp0,3 juta&quot;,&quot;Rp4,3 juta&quot;,&quot;Rp2,8 juta&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;EMV = 0,3 × 4 juta = Rp1,2 juta.&quot;},{&quot;q&quot;:&quot;Tim memilih layanan hosting dengan SLA dan ganti rugi tertulis. Strategi ini termasuk…&quot;,&quot;o&quot;:[&quot;Avoid&quot;,&quot;Accept&quot;,&quot;Exploit&quot;,&quot;Transfer&quot;],&quot;a&quot;:3,&quot;why&quot;:&quot;Sebagian dampak finansial dialihkan ke pihak lain lewat kontrak.&quot;},{&quot;q&quot;:&quot;Setelah memindahkan server dari cloud ke komputer kantor, muncul risiko baru: tidak ada yang merawat server. Risiko baru ini disebut…&quot;,&quot;o&quot;:[&quot;Residual risk&quot;,&quot;Secondary risk&quot;,&quot;Trigger&quot;,&quot;Issue&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Secondary risk muncul sebagai akibat menjalankan respons. Residual risk adalah sisa risiko awal setelah respons.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 2A</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas 2A: biaya dan risiko proyek mitra</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Isi laporan (kelompok)</h3><p style=\"margin:.2em 0\"><b>Bagian A, biaya</b> (Sub-CPMK-5): komponen biaya, teknik dan dasar estimasi, estimasi bottom-up, cadangan, cost baseline dan kurva S.</p><p style=\"margin:.2em 0\"><b>Bagian B, risiko</b> (Sub-CPMK-6): minimal 8 risiko dari empat kategori, analisis P × I dan EMV, strategi respons, risk register dengan pemilik dan trigger.</p><p style=\"margin:.4em 0 0\">Kontingensi bagian A = jumlah EMV bagian B (atau selisihnya dijelaskan).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Ketentuan</h3><ul style=\"margin:0\"><li>PDF, maks. 15 halaman</li><li>Tenggat: <b>Senin, 7 Desember 2026, 23.59 WIB</b></li><li>Bobot: 5% (biaya) + 5% (risiko), Penilaian Hasil Produk</li><li>Rubrik lengkap di Elin</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Risk</span></dt><dd>Kejadian atau kondisi tidak pasti yang, bila terjadi, berpengaruh positif atau negatif pada tujuan proyek. <i>(risiko)</i></dd></div><div><dt><span class=\"en\">Threat</span></dt><dd>Risiko yang berdampak negatif pada tujuan proyek. <i>(ancaman)</i></dd></div><div><dt><span class=\"en\">Opportunity</span></dt><dd>Risiko yang berdampak positif pada tujuan proyek. <i>(peluang)</i></dd></div><div><dt><span class=\"en\">Risk breakdown structure (RBS)</span></dt><dd>Pengelompokan sumber risiko secara bertingkat, mis. teknis, eksternal, organisasi, dan manajemen proyek; dipakai sebagai daftar periksa saat identifikasi. <i>(struktur rincian risiko)</i></dd></div><div><dt><span class=\"en\">Risk statement</span></dt><dd>Rumusan risiko yang memisahkan penyebab, kejadian tidak pasti, dan dampaknya: \"Karena …, mungkin terjadi …, yang berakibat …\". <i>(pernyataan risiko)</i></dd></div><div><dt><span class=\"en\">Probability and impact matrix</span></dt><dd>Tabel yang memetakan peluang dan dampak risiko untuk menentukan prioritasnya. <i>(matriks probabilitas–dampak)</i></dd></div><div><dt><span class=\"en\">Expected monetary value (EMV)</span></dt><dd>Nilai uang yang diharapkan dari risiko: peluang × dampak dalam rupiah. Jumlah EMV ancaman dapat menjadi dasar cadangan kontingensi. <i>(nilai moneter yang diharapkan)</i></dd></div><div><dt><span class=\"en\">Risk response strategy</span></dt><dd>Pilihan tindakan terhadap risiko. Ancaman: escalate, avoid, transfer, mitigate, accept. Peluang: escalate, exploit, share, enhance, accept. <i>(strategi respons risiko)</i></dd></div><div><dt><span class=\"en\">Risk owner</span></dt><dd>Orang yang bertanggung jawab memantau satu risiko dan menjalankan responsnya. <i>(pemilik risiko)</i></dd></div><div><dt><span class=\"en\">Trigger</span></dt><dd>Tanda awal bahwa risiko akan atau sedang terjadi, sehingga respons perlu dijalankan. <i>(pemicu)</i></dd></div><div><dt><span class=\"en\">Residual risk</span></dt><dd>Risiko yang masih tersisa setelah respons dijalankan. <i>(risiko residual)</i></dd></div><div><dt><span class=\"en\">Secondary risk</span></dt><dd>Risiko baru yang muncul sebagai akibat menjalankan respons risiko. <i>(risiko sekunder)</i></dd></div><div><dt><span class=\"en\">Risk register</span></dt><dd>Dokumen tempat risiko proyek dicatat beserta analisis, respons, pemilik, pemicu, dan statusnya; diperbarui sepanjang proyek. <i>(daftar risiko)</i></dd></div><div><dt><span class=\"en\">Contingency reserve</span></dt><dd>Dana (atau waktu) untuk risiko yang sudah teridentifikasi (known-unknowns); termasuk dalam cost baseline. <i>(cadangan kontingensi)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 11 (Manajemen Mutu).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":11,"title":"Manajemen Mutu","subtitle":"QA/QC, ISO/IEC 25010, User Acceptance Testing, kriteria penerimaan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 11</span><span>Sub-CPMK-7 · CPMK-3 · CPL-10</span></div><h1>Manajemen Mutu</h1><p class=\"lead\">QA/QC, ISO/IEC 25010, User Acceptance Testing, kriteria penerimaan</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu merancang rencana mutu dan mengevaluasi solusi SI hasil proyek terhadap kebutuhan organisasi (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":12,"title":"Pengadaan, Legal & Etika Proyek TI","subtitle":"Make-or-buy, jenis kontrak, pengadaan pemerintah, pelindungan data, green IT","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 12</span><span>Sub-CPMK-8 · CPMK-2 · CPL-2</span></div><h1>Pengadaan, Legal & Etika Proyek TI</h1><p class=\"lead\">Make-or-buy, jenis kontrak, pengadaan pemerintah, pelindungan data, green IT</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi strategi pengadaan dan kontrak proyek TI dengan memperhatikan aspek legal, etika, dan keberlanjutan (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":13,"title":"Tim, Komunikasi & Agile","subtitle":"Matriks RACI, rencana komunikasi, nilai dan prinsip agile, Scrum","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 13</span><span>Sub-CPMK-9 (Pertemuan 13–14) · CPMK-3 · CPL-10</span></div><h1>Tim, Komunikasi & Agile</h1><p class=\"lead\">Matriks RACI, rencana komunikasi, nilai dan prinsip agile, Scrum</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengelola pengembangan solusi SI secara iteratif dengan Scrum, termasuk tim, komunikasi, dan evaluasi increment bersama pemangku kepentingan (C3–C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":14,"title":"Simulasi Sprint Scrum","subtitle":"Product backlog, user story, definition of done, sprint review, hybrid","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 14</span><span>Sub-CPMK-9 (Pertemuan 13–14) · CPMK-3 · CPL-10</span></div><h1>Simulasi Sprint Scrum</h1><p class=\"lead\">Product backlog, user story, definition of done, sprint review, hybrid</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengelola pengembangan solusi SI secara iteratif dengan Scrum, termasuk tim, komunikasi, dan evaluasi increment bersama pemangku kepentingan (C3–C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":15,"title":"Pengendalian & Penutupan Proyek","subtitle":"Earned value management, pengendalian perubahan, lessons learned · presentasi akhir","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 15</span><span>Sub-CPMK-10 · CPMK-2 · CPL-2</span></div><h1>Pengendalian & Penutupan Proyek</h1><p class=\"lead\">Earned value management, pengendalian perubahan, lessons learned · presentasi akhir</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi kinerja proyek dengan earned value management serta menyusun laporan penutupan proyek (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":16,"title":"Ujian Akhir Semester (UAS)","subtitle":"Materi Pertemuan 9–15 · Sub-CPMK-5 s.d. Sub-CPMK-10","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 16</span></div><h1>Ujian Akhir Semester (UAS)</h1><p class=\"lead\">Materi Pertemuan 9–15 · Sub-CPMK-5 s.d. Sub-CPMK-10</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]}];
const SIMS={creep(el, cfg, s){
    const I=cfg.items||[]; if(!s.on) s.on={};
    const fmt=v=>String(Math.round(v*10)/10).replace('.',',');
    const draw=()=>{
      let d=0,b=0,n=0; I.forEach((it,i)=>{ if(s.on[i]){ d+=it.d; b+=it.b; n++; } });
      const pd=Math.min(100,d/cfg.room.d*100), pb=Math.min(100,b/cfg.room.b*100);
      const overD=d>cfg.room.d, overB=b>cfg.room.b;
      el.innerHTML='<div class="cols" style="align-items:start">'+
        '<div><p style="margin:0 0 .4em;font-weight:700;color:var(--ink)">'+cfg.ask+'</p><div style="display:grid;gap:.35em">'+
        I.map((it,i)=>'<button type="button" class="wbtn" data-i="'+i+'" aria-pressed="'+(!!s.on[i])+'" style="text-align:left;display:flex;justify-content:space-between;gap:.6em;'+(s.on[i]?'background:var(--coral);color:#111827':'')+'"><span>'+(s.on[i]?'✔ ':'+ ')+it.t+'</span><span style="font-family:var(--mono);white-space:nowrap">'+fmt(it.d)+' hr</span></button>').join('')+
        '</div></div>'+
        '<div style="border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:4px 4px 0 var(--line);padding:.6em .8em;color:var(--ink)" aria-live="polite">'+
        '<div style="font-family:var(--mono);font-size:.72em;font-weight:700;text-transform:uppercase">'+n+' '+cfg.lblN+'</div>'+
        '<div style="margin:.5em 0 .15em;font-size:.85em;font-weight:700">'+cfg.lblD+': '+fmt(d)+' / '+fmt(cfg.room.d)+' '+cfg.unitD+'</div>'+
        '<div style="height:.8em;border:2px solid var(--line);border-radius:2px;background:var(--surface-2);overflow:hidden"><i style="display:block;height:100%;width:'+pd+'%;background:'+(overD?'var(--bad)':'var(--mustard)')+';transition:width .5s ease"></i></div>'+

/* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea,select'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,a,summary'))return; /* let focused buttons work */
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage')&&!e.target.closest('input,textarea,.g2-svg'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Interactive widgets (v4.4) ----------
   Slide HTML holds <div class="sim" data-sim="type" data-cfg="{json}">, made by W() in data.js.
   Built-in types: quizset, stepper, grid2, scenario, peer. Course-specific types: SIMS in data.js.
   UI labels in English; all content comes from cfg (Indonesian). State lives in memory per widget id. */
const WST={};
let wTimers=[];
const WIDGETS={quizset:wQuiz,stepper:wStep,grid2:wGrid,scenario:wScen,peer:wPeer};
function mountW(scope){
  wTimers.forEach(clearInterval); wTimers=[];
  scope.querySelectorAll('[data-sim]').forEach(el=>{
    let cfg={}; try{cfg=JSON.parse(el.getAttribute('data-cfg')||'{}');}catch(e){}
    const id=cfg.id||'w'; if(!WST[id]) WST[id]={};
    const f=WIDGETS[el.dataset.sim]||(typeof SIMS!=='undefined'&&SIMS[el.dataset.sim]);
    if(!f){el.innerHTML='<p class="muted">Unknown widget.</p>';return;}
    try{f(el,cfg,WST[id]);}catch(e){el.innerHTML='<p class="muted">This simulation could not be loaded.</p>';if(window.console)console.error(e);}
  });
}
const kb=e=>e&&e.detail===0; // activated from keyboard
function refocus(el,sel){const b=el.querySelector(sel);if(b)b.focus({preventScroll:true});}

/* Quiz, one question at a time, with score */
function wQuiz(el,cfg,s){
  const Q=cfg.items||[]; if(s.i===undefined){s.i=0;s.ans=[];}
  const L='ABCDEF';
  const draw=()=>{
    if(s.i>=Q.length){
      const ok=Q.filter((q,i)=>s.ans[i]===q.a).length;
      el.innerHTML='<div class="qs-end"><div class="qs-score" aria-live="polite"><b>'+ok+'</b><span>/ '+Q.length+'</span></div><div><p class="qs-msg">'+(ok===Q.length?'Excellent!':ok>=Math.ceil(Q.length*.6)?'Good work.':'Review the material and try again.')+'</p>'+
        '<ol class="qs-rev">'+Q.map((q,i)=>'<li class="'+(s.ans[i]===q.a?'ok':'no')+'"><span>'+q.q+'</span><small>'+L[q.a]+'. '+q.o[q.a]+'</small></li>').join('')+'</ol>'+
        '<button type="button" class="wbtn" data-act="again">↺ Try again</button></div></div>';
      return;
    }
    const q=Q[s.i], a=s.ans[s.i], done=a!==undefined;
    el.innerHTML='<div class="qs-top"><span>Question '+(s.i+1)+' of '+Q.length+'</span><span class="qs-dots" aria-hidden="true">'+
      Q.map((x,i)=>'<i class="'+(i===s.i?'cur ':'')+(s.ans[i]===undefined?'':(s.ans[i]===x.a?'ok':'no'))+'"></i>').join('')+'</span></div>'+
      '<p class="q">'+q.q+'</p><div class="opts">'+q.o.map((o,i)=>'<button type="button" data-o="'+i+'" class="'+(done&&i===q.a?'right':'')+(done&&i===a&&i!==q.a?' wrong':'')+'"'+(done?' aria-disabled="true"':'')+'>'+L[i]+'. '+o+'</button>').join('')+'</div>'+
      '<p class="fb" aria-live="polite">'+(done?(a===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why:'')+'</p>'+
      '<div class="qs-nav"><button type="button" class="wbtn" data-act="prev"'+(s.i?'':' disabled')+'>← Back</button><button type="button" class="wbtn pri" data-act="next"'+(done?'':' disabled')+'>'+(s.i===Q.length-1?'See score':'Next question')+' →</button></div>';
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.o!==undefined){ if(s.ans[s.i]!==undefined) return; s.ans[s.i]=+b.dataset.o; draw(); if(kb(e)) refocus(el,'[data-act=next]'); return; }
    const act=b.dataset.act;
    if(act==='next') s.i++; else if(act==='prev') s.i=Math.max(0,s.i-1); else if(act==='again'){s.i=0;s.ans=[];}
    draw(); if(kb(e)) refocus(el,s.i>=Q.length?'[data-act=again]':'.opts button');
  };
  draw();
}

/* Animated step-by-step process (Play / ← →) */
function wStep(el,cfg,s){
  const S=cfg.steps||[]; if(s.i===undefined) s.i=0;
  el.innerHTML='<ol class="st-row" style="--n:'+S.length+'">'+S.map((x,i)=>'<li><button type="button" data-i="'+i+'"><span class="st-no">'+(i+1)+'</span><span class="st-t">'+x.t+'</span>'+(x.en?'<span class="st-en">'+x.en+'</span>':'')+'</button></li>').join('')+'</ol>'+
    '<div class="st-bar" aria-hidden="true"><i></i></div><div class="st-panel" aria-live="polite"></div>'+
    '<div class="st-nav"><button type="button" class="wbtn" data-act="prev" aria-label="Previous step">←</button><button type="button" class="wbtn pri" data-act="play">▶ Play</button><button type="button" class="wbtn" data-act="next" aria-label="Next step">→</button></div>';
  let timer=null;
  const playBtn=el.querySelector('[data-act=play]');
  const show=()=>{
    el.querySelectorAll('.st-row button').forEach((b,i)=>{b.classList.toggle('on',i===s.i);b.classList.toggle('done',i<s.i);b.setAttribute('aria-current',i===s.i?'step':'false');});
    el.querySelector('.st-bar i').style.width=(S.length>1?s.i/(S.length-1)*100:100)+'%';
    const p=el.querySelector('.st-panel'), x=S[s.i];
    p.classList.remove('in'); void p.offsetWidth;
    p.innerHTML='<h4>'+(s.i+1)+'. '+x.t+(x.en?' <span class="st-en">'+x.en+'</span>':'')+'</h4><p>'+x.d+'</p>'+(x.ex?'<p class="st-ex">'+x.ex+'</p>':'');
    p.classList.add('in');
  };
  const stop=()=>{ if(timer){clearInterval(timer);timer=null;} playBtn.textContent='▶ Play'; };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.i!==undefined){ stop(); s.i=+b.dataset.i; show(); return; }
    const act=b.dataset.act;
    if(act==='prev'){ stop(); s.i=Math.max(0,s.i-1); show(); }
    else if(act==='next'){ stop(); s.i=Math.min(S.length-1,s.i+1); show(); }
    else if(act==='play'){
      if(timer){ stop(); return; }
      if(s.i>=S.length-1){ s.i=0; show(); }
      playBtn.textContent='❚❚ Pause';
      timer=setInterval(()=>{ if(!el.isConnected||s.i>=S.length-1){ stop(); return; } s.i++; show(); }, cfg.ms||2800);
      wTimers.push(timer);
    }
  };
  show();
}

/* Two-axis simulation: sliders (or click/drag) move a point across labelled zones */
function wGrid(el,cfg,s){
  const Z=cfg.zones||[], max=cfg.max||10;
  if(s.x===undefined){ s.x=(cfg.init||[max/2,max/2])[0]; s.y=(cfg.init||[max/2,max/2])[1]; }
  const W=320,H=320,PL=40,PB=40,PT=10,PR=10;
  const X=v=>PL+v/max*(W-PL-PR), Y=v=>H-PB-v/max*(H-PB-PT);
  const zoneOf=()=>Z.find(z=>s.x>=z.r[0]&&s.x<=z.r[1]&&s.y>=z.r[2]&&s.y<=z.r[3])||Z[Z.length-1];
  const rects=Z.slice().reverse().map(z=>{const v=z.v||z.r, x0=X(v[0]),x1=X(v[1]),y0=Y(v[3]),y1=Y(v[2]); /* v: optional visual rect */
    return '<g class="g2-z" data-z="'+z.k+'"><rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" class="'+(z.cls||'s-box')+'"/><text x="'+((x0+x1)/2)+'" y="'+((y0+y1)/2+4)+'" text-anchor="middle" class="s-t" style="font-size:'+Math.min(13,Math.max(8,(x1-x0-6)/(String(z.en).length*.6))).toFixed(1)+'px">'+z.en+'</text></g>';}).join('');
  el.innerHTML='<div class="g2"><div class="g2-fig"><svg class="g2-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(cfg.aria||'Interactive grid')+'">'+rects+
    '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" class="s-line"/><line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" class="s-line"/>'+
    '<text x="'+((PL+W-PR)/2)+'" y="'+(H-12)+'" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.x.label+' →</text>'+
    '<text transform="translate(16 '+((PT+H-PB)/2)+') rotate(-90)" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.y.label+' →</text>'+
    '<text x="'+PL+'" y="'+(H-PB+16)+'" class="s-s" style="font-size:10px">'+(cfg.x.lo||'rendah')+'</text><text x="'+(W-PR)+'" y="'+(H-PB+16)+'" text-anchor="end" class="s-s" style="font-size:10px">'+(cfg.x.hi||'tinggi')+'</text>'+
    '<circle class="g2-dot" r="11" cx="'+X(s.x)+'" cy="'+Y(s.y)+'"/></svg></div>'+
    '<div class="g2-side"><label class="g2-sl"><span>'+cfg.x.label+' <b data-v="x">'+s.x+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.x+'" data-ax="x" aria-label="'+cfg.x.label+'"></label>'+
    '<label class="g2-sl"><span>'+cfg.y.label+' <b data-v="y">'+s.y+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.y+'" data-ax="y" aria-label="'+cfg.y.label+'"></label>'+
    '<div class="g2-out" aria-live="polite"></div></div></div>';
  const dot=el.querySelector('.g2-dot'), out=el.querySelector('.g2-out'); let last=null;
  const upd=()=>{
    dot.setAttribute('cx',X(s.x)); dot.setAttribute('cy',Y(s.y));
    el.querySelector('[data-v=x]').textContent=s.x; el.querySelector('[data-v=y]').textContent=s.y;
    el.querySelector('[data-ax=x]').value=s.x; el.querySelector('[data-ax=y]').value=s.y;
    const z=zoneOf(); el.querySelectorAll('.g2-z').forEach(g=>g.classList.toggle('on',g.dataset.z===z.k));
    if(last!==z.k){ last=z.k; out.classList.remove('in'); void out.offsetWidth;
      out.innerHTML='<div class="g2-name">'+z.name+(z.en?' <span>'+z.en+'</span>':'')+'</div>'+(z.tag?'<div class="g2-tag">'+z.tag+'</div>':'')+'<p>'+z.d+'</p>'+(z.ex?'<p class="g2-ex">'+z.ex+'</p>':'');
      out.classList.add('in'); }
  };
  el.oninput=e=>{const r=e.target.closest('input[type=range]'); if(!r) return; s[r.dataset.ax]=+r.value; upd();};
  const svg=el.querySelector('svg'); let drag=false;
  const fromPt=e=>{const m=svg.getScreenCTM(); if(!m) return; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(m.inverse());
    s.x=Math.max(0,Math.min(max,Math.round((q.x-PL)/(W-PL-PR)*max))); s.y=Math.max(0,Math.min(max,Math.round((H-PB-q.y)/(H-PB-PT)*max))); upd();};
  svg.addEventListener('pointerdown',e=>{drag=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} fromPt(e);});
  svg.addEventListener('pointermove',e=>{if(drag) fromPt(e);});
  svg.addEventListener('pointerup',()=>{drag=false;}); svg.addEventListener('pointercancel',()=>{drag=false;});
  upd();
}

/* Branching scenario: choices lead to feedback and new situations */
function wScen(el,cfg,s){
  const N=cfg.nodes||{};
  if(!s.node){ s.node=cfg.start; s.path=[]; s.fb=null; }
  const draw=()=>{
    const n=N[s.node]; let h='';
    if(s.path.length) h+='<div class="sc-path" aria-label="Choices so far">'+s.path.map((p,i)=>'<span class="sc-tag '+(p.k||'')+'">'+(i+1)+'. '+p.tag+'</span>').join('')+'</div>';
    if(s.fb){
      h+='<div class="sc-fb '+(s.fb.k||'')+'"><div class="sc-fbh">'+(s.fb.k==='good'?'✔':s.fb.k==='bad'?'✖':'◐')+' '+s.fb.tag+'</div><p>'+s.fb.fb+'</p></div><div class="sc-nav"><button type="button" class="wbtn pri" data-act="go">Continue →</button></div>';
    } else {
      h+='<div class="sc-scene">'+(n.text?'<p class="sc-text">'+n.text+'</p>':'')+(n.say||[]).map(b=>'<div class="sc-say"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>').join('')+'</div>';
      if(n.end) h+='<div class="sc-end '+(n.k||'')+'"><div class="sc-fbh">'+n.title+'</div><p>'+n.end+'</p></div><div class="sc-nav"><button type="button" class="wbtn" data-act="restart">↺ Start again</button></div>';
      else h+='<p class="sc-ask">'+(n.ask||cfg.ask||'')+'</p><div class="sc-ch">'+n.ch.map((c,i)=>'<button type="button" data-c="'+i+'">'+c.t+'</button>').join('')+'</div>';
    }
    el.innerHTML=h;
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.c!==undefined){ const c=N[s.node].ch[+b.dataset.c]; s.fb={k:c.k,tag:c.tag,fb:c.fb,to:c.to}; s.path.push({tag:c.tag,k:c.k}); draw(); if(kb(e)) refocus(el,'[data-act=go]'); return; }
    if(b.dataset.act==='go'){ s.node=s.fb.to; s.fb=null; }
    else if(b.dataset.act==='restart'){ s.node=cfg.start; s.path=[]; s.fb=null; }
    draw(); if(kb(e)) refocus(el,'.sc-ch button,[data-act=restart]');
  };
  draw();
}

/* Peer assessment (formative): criteria x levels, comments, copyable summary.
   Draft is kept only in this browser (localStorage) and is never sent anywhere. */
function wPeer(el,cfg,s){
  const C=cfg.criteria||[], Lv=cfg.levels||['1','2','3','4'], K='peer:'+cfg.id, maxS=C.length*Lv.length;
  if(!s.v){ const d=store.get(K,null); s.v=d&&typeof d==='object'?d:{who:'',sc:{},good:'',tip:''}; if(!s.v.sc) s.v.sc={}; }
  const save=()=>store.set(K,s.v);
  const total=()=>C.reduce((a,c,i)=>a+(s.v.sc[i]||0),0);
  const filled=()=>C.filter((c,i)=>s.v.sc[i]).length;
  const band=t=>{const b=(cfg.bands||[]).slice().sort((x,y)=>y.min-x.min).find(x=>t>=x.min); return b?b.t:'';};
  const rowHTML=i=>{const c=C[i], v=s.v.sc[i]||0;
    return '<div class="pa-row" data-r="'+i+'"><div class="pa-c"><b>'+c.t+'</b>'+(c.ind?'<small>'+c.ind+'</small>':'')+'</div><div class="pa-lv" role="group" aria-label="'+c.t.replace(/<[^>]+>/g,'')+'">'+
      Lv.map((l,j)=>'<button type="button" data-r="'+i+'" data-l="'+(j+1)+'" aria-pressed="'+(v===j+1)+'" title="'+l+'">'+(j+1)+'</button>').join('')+
      '</div><div class="pa-d">'+(v?'<b>'+Lv[v-1]+':</b> '+c.d[v-1]:'<span class="muted">'+(cfg.pick||'Pick a level.')+'</span>')+'</div></div>';};
  const sumHTML=()=>{const t=total(), f=filled();
    return '<div class="pa-total"><span><b>'+t+'</b> / '+maxS+'</span><div class="pa-meter"><i style="width:'+(t/maxS*100)+'%"></i></div></div><div class="pa-band">'+(f===C.length?band(t):(f+' of '+C.length+' criteria rated'))+'</div>';};
  el.innerHTML='<div class="pa"><div class="pa-grid">'+C.map((c,i)=>rowHTML(i)).join('')+'</div>'+
    '<div class="pa-side"><label class="pa-f"><span>'+(cfg.whoLabel||'Peer')+'</span><input type="text" data-f="who" maxlength="80" value="'+String(s.v.who).replace(/"/g,'&quot;')+'" placeholder="'+(cfg.whoPh||'')+'"></label>'+
    '<label class="pa-f"><span>'+(cfg.goodLabel||'What went well')+'</span><textarea data-f="good" rows="2" maxlength="400" placeholder="'+(cfg.goodPh||'')+'"></textarea></label>'+
    '<label class="pa-f"><span>'+(cfg.tipLabel||'Suggestion')+'</span><textarea data-f="tip" rows="2" maxlength="400" placeholder="'+(cfg.tipPh||'')+'"></textarea></label>'+
    '<div class="pa-sum" aria-live="polite">'+sumHTML()+'</div>'+
    '<div class="pa-act"><button type="button" class="wbtn pri" data-act="copy">Copy summary</button><button type="button" class="wbtn" data-act="clear">Clear</button><span class="pa-msg" aria-live="polite"></span></div></div></div>';
  el.querySelector('[data-f=good]').value=s.v.good||''; el.querySelector('[data-f=tip]').value=s.v.tip||'';
  const msg=t=>{const m=el.querySelector('.pa-msg'); m.textContent=t; setTimeout(()=>{if(m.textContent===t)m.textContent='';},2500);};
  el.oninput=e=>{const f=e.target.dataset&&e.target.dataset.f; if(!f) return; s.v[f]=e.target.value; save();};
  const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
  const text=()=>[plain(cfg.title||'Peer assessment'),(cfg.whoLabel||'Peer')+': '+(s.v.who||'-')]
    .concat(C.map((c,i)=>'- '+plain(c.t)+': '+(s.v.sc[i]?s.v.sc[i]+' ('+Lv[s.v.sc[i]-1]+')':'-')))
    .concat(['Total: '+total()+' / '+maxS+(filled()===C.length?' · '+plain(band(total())):''),(cfg.goodLabel||'What went well')+': '+(s.v.good||'-'),(cfg.tipLabel||'Suggestion')+': '+(s.v.tip||'-')]).join('\n');
  const copy=()=>{const t=text();
    const fallback=()=>{const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); msg(ok?'Copied.':'Copy failed. Select the text manually.');};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>msg('Copied.'),fallback); else fallback();};
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.l){ const i=+b.dataset.r; s.v.sc[i]=+b.dataset.l; save();
      const r=el.querySelector('.pa-row[data-r="'+i+'"]'); r.outerHTML=rowHTML(i); el.querySelector('.pa-sum').innerHTML=sumHTML();
      if(kb(e)) refocus(el,'.pa-row[data-r="'+i+'"] [data-l="'+b.dataset.l+'"]'); return; }
    if(b.dataset.act==='copy') copy();
    else if(b.dataset.act==='clear'){ s.v={who:'',sc:{},good:'',tip:''}; save(); wPeer(el,cfg,s); msg('Cleared.'); }
  };
}

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();

</script>
