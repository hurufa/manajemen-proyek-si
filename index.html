yle=\"stroke-width:1\"/><text x=\"325\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">5</text><line x1=\"460\" y1=\"34\" x2=\"460\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"460\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">10</text><line x1=\"595\" y1=\"34\" x2=\"595\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"595\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">15</text><line x1=\"730\" y1=\"34\" x2=\"730\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"730\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">20</text><line x1=\"865\" y1=\"34\" x2=\"865\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"865\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"10\" y=\"28\" class=\"s-hd\" style=\"font-size:11px\">HARI KERJA KE-</text><text x=\"10\" y=\"57\" class=\"s-t\" style=\"font-size:12px\">A · Analisis</text><rect x=\"190\" y=\"45\" width=\"135\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"84\" class=\"s-t\" style=\"font-size:12px\">B · Desain DB</text><rect x=\"325\" y=\"72\" width=\"108\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"111\" class=\"s-t\" style=\"font-size:12px\">C · Desain UI</text><rect x=\"325\" y=\"99\" width=\"81\" height=\"16\" rx=\"2\" style=\"fill:var(--mustard);stroke:var(--line);stroke-width:1.5\"/><rect x=\"406\" y=\"102\" width=\"27\" height=\"10\" rx=\"2\" style=\"fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3\"/><text x=\"10\" y=\"138\" class=\"s-t\" style=\"font-size:12px\">D · Migrasi data</text><rect x=\"433\" y=\"126\" width=\"108\" height=\"16\" rx=\"2\" style=\"fill:var(--mustard);stroke:var(--line);stroke-width:1.5\"/><rect x=\"541\" y=\"129\" width=\"189\" height=\"10\" rx=\"2\" style=\"fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3\"/><text x=\"10\" y=\"165\" class=\"s-t\" style=\"font-size:12px\">E · Fitur tagihan</text><rect x=\"433\" y=\"153\" width=\"162\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"192\" class=\"s-t\" style=\"font-size:12px\">F · Catat bayar</text><rect x=\"595\" y=\"180\" width=\"135\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"219\" class=\"s-t\" style=\"font-size:12px\">G · Uji modul</text><rect x=\"730\" y=\"207\" width=\"81\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"246\" class=\"s-t\" style=\"font-size:12px\">H · Pelatihan</text><rect x=\"811\" y=\"234\" width=\"54\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"273\" class=\"s-t\" style=\"font-size:12px\">◆ Modul diterima</text><path d=\"M865 260 l9 9 -9 9 -9 -9z\" style=\"fill:var(--ink)\"/><rect x=\"10\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--coral);stroke:var(--line)\"/><text x=\"34\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">kritis</text><rect x=\"90\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--mustard);stroke:var(--line)\"/><text x=\"114\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">tidak kritis</text><rect x=\"200\" y=\"301\" width=\"18\" height=\"9\" style=\"fill:none;stroke:var(--muted);stroke-dasharray:4 3\"/><text x=\"224\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">float (slack)</text></svg><figcaption>Kasus ilustrasi. Gantt chart disusun dari hasil CPM Pertemuan 6; format batang dan milestone mengikuti pembahasan Gantt chart dalam Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 4</span></div><h2>Gantt chart yang lengkap</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Aktivitas</h3><p>Diturunkan dari WBS; <button type=\"button\" class=\"term\" data-term=\"summary-task\">summary task</button> mengikuti cabang WBS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Durasi dan tanggal</h3><p>Durasi hasil estimasi; tanggal dihitung dari <button type=\"button\" class=\"term\" data-term=\"project-calendar\">kalender proyek</button>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Dependensi</h3><p>Pendahulu sama dengan network diagram (FS, SS, <button type=\"button\" class=\"term\" data-term=\"lead-lag\">lead/lag</button>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"milestone\">Milestone</button></h3><p>Durasi nol: serah terima, pengesahan, presentasi.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg><button type=\"button\" class=\"term\" data-term=\"critical-path\">Jalur kritis</button></h3><p>Ditandai berbeda; sama dengan hitungan manual.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"schedule-baseline\">Baseline</button></h3><p>Disimpan setelah disetujui, sebagai pembanding kemajuan.</p></div></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.84em\">Lima unsur pertama sesuai rubrik Tugas 1C (kriteria C4); baseline dipakai lagi di Pertemuan 15. Dirangkum dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Siapkan lingkungan</span><span>Pilih salah satu · hasilnya setara</span></div><h2>ProjectLibre atau MS Project</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Opsi 1 · ProjectLibre</h3><ul><li>Gratis dan sumber terbuka; unduh dari situs resmi projectlibre.com.</li><li>Tersedia untuk Windows, macOS, dan Linux.</li><li>Buka, lalu buat proyek baru dan isi tanggal mulai.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M8 21h8M12 17v4\"/></svg>Opsi 2 · MS Project</h3><ul><li>Berbayar; pakai bila Anda punya lisensi.</li><li>Langkah dan istilahnya mirip ProjectLibre.</li><li>Buka proyek kosong, lalu isi tanggal mulai di informasi proyek.</li></ul></div></div><div class=\"callout\" style=\"margin-top:.7em\">Tidak punya laptop? Kerjakan berpasangan di laptop anggota kelompok. Nama menu bisa sedikit berbeda menurut versi aplikasi.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum</span><span>Indikator 4 · tekan Play atau klik langkah</span></div><h2>Dari tabel ke Gantt chart di aplikasi</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p7-app&quot;,&quot;ms&quot;:3800,&quot;steps&quot;:[{&quot;t&quot;:&quot;Proyek baru&quot;,&quot;en&quot;:&quot;start date&quot;,&quot;d&quot;:&quot;Buat proyek baru dan isi tanggal mulai di informasi proyek. Pastikan kalender hari kerja Senin–Jumat.&quot;,&quot;ex&quot;:&quot;Mulai Senin, 2 November 2026 (kasus ilustrasi).&quot;},{&quot;t&quot;:&quot;Ketik aktivitas&quot;,&quot;en&quot;:&quot;task name&quot;,&quot;d&quot;:&quot;Ketik nama aktivitas A–H berurutan sesuai berkas jadwal_modul_tagihan.csv. Nomor baris di aplikasi menjadi ID aktivitas.&quot;,&quot;ex&quot;:&quot;Baris 1 = A Analisis kebutuhan rinci tagihan … baris 8 = H Pelatihan bagian keuangan.&quot;},{&quot;t&quot;:&quot;Isi durasi&quot;,&quot;en&quot;:&quot;duration&quot;,&quot;d&quot;:&quot;Isi kolom durasi dalam hari kerja sesuai kolom durasi_hari.&quot;,&quot;ex&quot;:&quot;A 5 hari, B 4 hari, E 6 hari.&quot;},{&quot;t&quot;:&quot;Isi pendahulu&quot;,&quot;en&quot;:&quot;predecessors&quot;,&quot;d&quot;:&quot;Isi kolom pendahulu dengan nomor baris (kolom pendahulu_no), atau pilih dua aktivitas lalu tekan tombol Link (finish-to-start).&quot;,&quot;ex&quot;:&quot;E pendahulunya baris 2 dan 3; G pendahulunya baris 4 dan 6.&quot;},{&quot;t&quot;:&quot;Tambah milestone&quot;,&quot;en&quot;:&quot;milestone&quot;,&quot;d&quot;:&quot;Tambah baris \\&quot;Modul diterima\\&quot; berdurasi 0 dengan pendahulu baris 8, atau tandai sebagai milestone.&quot;,&quot;ex&quot;:&quot;Muncul simbol belah ketupat di akhir jadwal.&quot;},{&quot;t&quot;:&quot;Tampilkan jalur kritis&quot;,&quot;en&quot;:&quot;critical path&quot;,&quot;d&quot;:&quot;Aktifkan tampilan aktivitas kritis dan tambahkan kolom slack untuk melihat float.&quot;,&quot;ex&quot;:&quot;Kritis: A, B, E, F, G, H. Slack C 1 hari, D 7 hari.&quot;},{&quot;t&quot;:&quot;Cocokkan dan simpan&quot;,&quot;en&quot;:&quot;baseline&quot;,&quot;d&quot;:&quot;Cocokkan durasi proyek dengan hitungan manual, simpan baseline, lalu ekspor Gantt chart ke PDF atau gambar untuk laporan.&quot;,&quot;ex&quot;:&quot;Durasi 25 hari kerja: selesai Jumat, 4 Desember 2026.&quot;}]}\"><p class=\"muted\">Loading…</p></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p7-dl&quot;,&quot;compact&quot;:true,&quot;files&quot;:[{&quot;name&quot;:&quot;jadwal_modul_tagihan.csv&quot;,&quot;csv&quot;:&quot;no,id,aktivitas,work_package,durasi_hari,pendahulu_no,pendahulu_id,durasi_tersingkat_hari,biaya_crash_per_hari_juta\\n1,A,Analisis kebutuhan rinci tagihan,1.3.1,5,\\&quot;\\&quot;,\\&quot;\\&quot;,4,1.5\\n2,B,Desain basis data,1.3.1,4,\\&quot;1\\&quot;,\\&quot;A\\&quot;,3,1\\n3,C,Desain antarmuka tagihan,1.3.1,3,\\&quot;1\\&quot;,\\&quot;A\\&quot;,2,0.5\\n4,D,Migrasi data santri lama,1.2.4,4,\\&quot;2\\&quot;,\\&quot;B\\&quot;,3,0.3\\n5,E,Pembuatan fitur tagihan bulanan,1.3.2,6,\\&quot;2;3\\&quot;,\\&quot;B;C\\&quot;,4,0.8\\n6,F,Pembuatan pencatatan pembayaran,1.3.3,5,\\&quot;5\\&quot;,\\&quot;E\\&quot;,3,1.2\\n7,G,Uji modul tagihan,1.3.4,3,\\&quot;4;6\\&quot;,\\&quot;D;F\\&quot;,2,2\\n8,H,Pelatihan bagian keuangan,1.6.2,2,\\&quot;7\\&quot;,\\&quot;G\\&quot;,2,\\n&quot;,&quot;desc&quot;:&quot;8 aktivitas modul tagihan SI Pesantren Al-Hikmah (kasus ilustrasi): durasi, pendahulu, data crashing&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 5</span></div><h2><button type=\"button\" class=\"term\" data-term=\"schedule-compression\">Kompresi jadwal</button>: dua cara</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"crashing\">Crashing</button></h3><ul><li>Tambah sumber daya (orang, lembur, alat) pada aktivitas <b>kritis</b>.</li><li>Pilih yang <button type=\"button\" class=\"term\" data-term=\"crash-cost\">biaya per harinya</button> paling murah lebih dulu.</li><li>Biaya naik; lingkup tetap.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"fast-tracking\">Fast tracking</button></h3><ul><li>Kerjakan aktivitas kritis yang biasanya berurutan secara <b>tumpang tindih</b>.</li><li>Biasanya tanpa biaya tambahan langsung.</li><li>Risiko <button type=\"button\" class=\"term\" data-term=\"rework\">pengerjaan ulang</button> naik.</li></ul></div></div><div class=\"callout\" style=\"margin-top:.7em\">Keduanya hanya berguna pada <b>jalur kritis</b>. Bila jalur kritis berubah, hitung ulang.</div><p class=\"muted\" style=\"margin-top:.4em;font-size:.82em\">Diadaptasi dari Schwalbe (2019) dan Kerzner (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 5 · data ilustrasi · tekan Play</span></div><h2>Crashing: 25 → 22 hari, biaya termurah</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.78em\"><thead><tr><th></th><th ot;&quot;],&quot;lblT&quot;:&quot;Durasi proyek&quot;,&quot;lblC&quot;:&quot;Biaya tambahan&quot;,&quot;lblTarget&quot;:&quot;Target&quot;,&quot;msg0&quot;:&quot;Capai target 22 hari dengan biaya tambahan sekecil mungkin. Biaya terendah yang mungkin: Rp2,6 jt.&quot;,&quot;msgGood&quot;:&quot;Durasi proyek turun. Periksa lagi kolom float: apakah ada aktivitas lain yang kini ikut kritis?&quot;,&quot;msgWaste&quot;:&quot;Biaya naik tetapi durasi proyek tidak turun: aktivitas itu tidak kritis, atau jalur kritis lain masih sama panjang.&quot;}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"margin-top:.35em;font-size:.8em\">Data ilustrasi. Penyederhanaan untuk simulasi: biaya per hari dianggap tetap.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Indikator 5 · kasus ilustrasi</span></div><h2><button type=\"button\" class=\"term\" data-term=\"fast-tracking\">Fast tracking</button>: F mulai sebelum E selesai</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 329\" style=\"max-height:21em\" role=\"img\" aria-label=\"Gantt chart setelah fast tracking: F dimulai tiga hari setelah E mulai sehingga E dan F tumpang tindih; G, H, dan milestone bergeser lebih awal; proyek selesai di hari ke-22.\"><line x1=\"190\" y1=\"34\" x2=\"190\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"190\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">0</text><line x1=\"325\" y1=\"34\" x2=\"325\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"325\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">5</text><line x1=\"460\" y1=\"34\" x2=\"460\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"460\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">10</text><line x1=\"595\" y1=\"34\" x2=\"595\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"595\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">15</text><line x1=\"730\" y1=\"34\" x2=\"730\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"730\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">20</text><line x1=\"865\" y1=\"34\" x2=\"865\" y2=\"289\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"865\" y=\"28\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"10\" y=\"28\" class=\"s-hd\" style=\"font-size:11px\">HARI KERJA KE-</text><text x=\"10\" y=\"57\" class=\"s-t\" style=\"font-size:12px\">A · Analisis</text><rect x=\"190\" y=\"45\" width=\"135\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"84\" class=\"s-t\" style=\"font-size:12px\">B · Desain DB</text><rect x=\"325\" y=\"72\" width=\"108\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"111\" class=\"s-t\" style=\"font-size:12px\">C · Desain UI</text><rect x=\"325\" y=\"99\" width=\"81\" height=\"16\" rx=\"2\" style=\"fill:var(--mustard);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"138\" class=\"s-t\" style=\"font-size:12px\">D · Migrasi data</text><rect x=\"433\" y=\"126\" width=\"108\" height=\"16\" rx=\"2\" style=\"fill:var(--mustard);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"165\" class=\"s-t\" style=\"font-size:12px\">E · Fitur tagihan</text><rect x=\"433\" y=\"153\" width=\"162\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"192\" class=\"s-t\" style=\"font-size:12px\">F · Catat bayar</text><rect x=\"514\" y=\"180\" width=\"135\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"655\" y=\"192\" class=\"s-s\" style=\"font-size:11px\">SS + 3 dari E</text><text x=\"10\" y=\"219\" class=\"s-t\" style=\"font-size:12px\">G · Uji modul</text><rect x=\"649\" y=\"207\" width=\"81\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"246\" class=\"s-t\" style=\"font-size:12px\">H · Pelatihan</text><rect x=\"730\" y=\"234\" width=\"54\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"273\" class=\"s-t\" style=\"font-size:12px\">◆ Modul diterima</text><path d=\"M784 260 l9 9 -9 9 -9 -9z\" style=\"fill:var(--ink)\"/><rect x=\"10\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--coral);stroke:var(--line)\"/><text x=\"34\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">kritis</text><rect x=\"90\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--mustard);stroke:var(--line)\"/><text x=\"114\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">tidak kritis</text><rect x=\"200\" y=\"301\" width=\"18\" height=\"9\" style=\"fill:none;stroke:var(--muted);stroke-dasharray:4 3\"/><text x=\"224\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">float (slack)</text><text x=\"320\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">proyek selesai hari ke-22</text></svg><figcaption>Kasus ilustrasi. Fast tracking: hubungan E → F diubah dari FS menjadi SS dengan lag 3 hari. Float aktivitas lain tidak digambar.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok · 15 menit</span></div><h2>Jadwal proyek mitra di aplikasi</h2><div class=\"cols\"><div><ol><li>Masukkan aktivitas, durasi, dan pendahulu proyek mitra (dari Pertemuan 6) ke aplikasi.</li><li>Tambahkan summary task sesuai WBS dan milestone penting.</li><li>Cocokkan jalur kritis aplikasi dengan hitungan manual.</li><li>Bandingkan tanggal selesai dengan batas waktu di charter.</li><li>Bila melewati batas: pilih crashing atau fast tracking, tulis dampaknya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Masuk ke laporan Tugas 1C</h3><ul><li>Gantt chart (ekspor PDF/gambar yang terbaca)</li><li>Tabel ES, EF, LS, LF, float</li><li>Kompresi: durasi baru dan dampak biaya atau risiko</li><li>Konsisten dengan charter dan WBS</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Presentasi</span><span>Tugas 1C · rencana proyek terpadu</span></div><h2>Presentasi rencana proyek</h2><div class=\"cols\"><div><p><b>Alur yang disarankan</b> (maks. 10 slide):</p><ol><li>Mitra, masalah, dan business case</li><li>Charter: tujuan, kriteria keberhasilan, anggaran</li><li>Lingkup dan WBS</li><li>Jaringan, jalur kritis, Gantt chart</li><li>Kompresi jadwal dan risikonya</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Ketentuan</h3><ul><li>Waktu per kelompok diumumkan dosen sesuai jumlah kelompok.</li><li>Semua anggota siap menjawab.</li><li>Kelompok lain menilai dengan lembar sejawat (formatif).</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai presentasi kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p7-pres-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · presentasi rencana proyek Tugas 1 (MPSI P7)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 4 · SI Koperasi Pesantren&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik dari presentasi&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. Tanggal selesai di Gantt berbeda dengan charter…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:9,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:13,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:17,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Rencana terpadu dan konsisten&quot;,&quot;ind&quot;:&quot;Tugas 1 (C6)&quot;,&quot;d&quot;:[&quot;Bagian-bagian tidak berhubungan.&quot;,&quot;Ada beberapa angka atau tanggal yang bertentangan.&quot;,&quot;Umumnya konsisten; satu ketidakcocokan kecil.&quot;,&quot;Masalah, tujuan, lingkup, anggaran, dan tanggal konsisten.&quot;]},{&quot;t&quot;:&quot;Jaringan dan jalur kritis&quot;,&quot;ind&quot;:&quot;Indikator 1–3&quot;,&quot;d&quot;:[&quot;Tidak ditunjukkan.&quot;,&quot;Ditunjukkan tanpa penjelasan hitungan.&quot;,&quot;Jalur kritis benar; float belum dijelaskan.&quot;,&quot;Jalur kritis dan float benar serta dijelaskan artinya.&quot;]},{&quot;t&quot;:&quot;Gantt chart di aplikasi&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak ada atau bukan dari aplikasi.&quot;,&quot;Ada, tetapi tidak terbaca atau tidak lengkap.&quot;,&quot;Lengkap; satu unsur kurang (mis. milestone).&quot;,&quot;Lengkap, terbaca, dan sama dengan hitungan manual.&quot;]},{&quot;t&quot;:&quot;Kompresi jadwal&quot;,&quot;ind&quot;:&quot;Indikator 5&quot;,&quot;d&quot;:[&quot;Tidak dibahas.&quot;,&quot;Disebut tanpa dasar.&quot;,&quot;Diterapkan pada jalur kritis; dampak kurang jelas.&quot;,&quot;Diterapkan pada jalur kritis dengan durasi baru dan dampak biaya atau risiko.&quot;]},{&quot;t&quot;:&quot;Penyampaian dan tanya jawab&quot;,&quot;ind&quot;:&quot;Tugas 1 (C6)&quot;,&quot;d&quot;:[&quot;Membaca slide; pertanyaan tidak terjawab.&quot;,&quot;Kurang runtut; jawaban kurang tepat.&quot;,&quot;Runtut; sebagian jawaban kurang tepat.&quot;,&quot;Runtut, tepat waktu, dan menjawab dengan tepat.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Gantt chart</b> menampilkan aktivitas, durasi, dependensi, milestone, dan jalur kritis pada sumbu waktu.</li><li>Aplikasi menghitung tanggal dari <b>kalender proyek</b>; hasilnya harus sama dengan hitungan manual.</li><li><b>Baseline</b> disimpan sebagai pembanding kemajuan.</li><li><b>Crashing</b>: tekan aktivitas kritis termurah, hitung ulang tiap langkah; biaya naik.</li><li><b>Fast tracking</b>: tumpang tindihkan aktivitas kritis; risiko pengerjaan ulang naik.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p7-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Gantt chart menampilkan…&quot;,&quot;o&quot;:[&quot;Aktivitas sebagai batang pada sumbu waktu&quot;,&quot;Hanya urutan aktivitas tanpa waktu&quot;,&quot;Struktur pemecahan lingkup proyek&quot;,&quot;Daftar pemangku kepentingan&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Gantt chart menampilkan aktivitas sebagai batang sesuai tanggal mulai dan selesainya; urutan logis lebih jelas di network diagram, pemecahan lingkup di WBS.&quot;},{&quot;q&quot;:&quot;Crashing adalah…&quot;,&quot;o&quot;:[&quot;Mengurangi lingkup agar cepat selesai&quot;,&quot;Menambah sumber daya pada aktivitas kritis untuk memperpendek durasinya dengan biaya tambahan&quot;,&quot;Menumpangtindihkan aktivitas yang biasanya berurutan&quot;,&quot;Menunda aktivitas yang punya float&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Crashing memperpendek aktivitas kritis dengan menambah sumber daya; biaya naik, lingkup tetap.&quot;},{&quot;q&quot;:&quot;Aktivitas kritis A (Rp1,5 jt/hari), B (Rp1,0 jt/hari), E (Rp0,8 jt/hari), dan aktivitas tidak kritis D (Rp0,3 jt/hari). Mana yang ditekan lebih dulu?&quot;,&quot;o&quot;:[&quot;D&quot;,&quot;E&quot;,&quot;B&quot;,&quot;A&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Pilih aktivitas kritis termurah. D lebih murah, tetapi tidak kritis sehingga tidak mempercepat proyek.&quot;},{&quot;q&quot;:&quot;Risiko utama fast tracking adalah…&quot;,&quot;o&quot;:[&quot;Biaya lembur pasti naik&quot;,&quot;Pengerjaan ulang karena aktivitas dikerjakan sebelum pendahulunya selesai&quot;,&quot;Jalur kritis hilang&quot;,&quot;Lingkup proyek bertambah&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Fast tracking mengerjakan aktivitas secara tumpang tindih; bila hasil pendahulu berubah, pekerjaan penerus harus diulang.&quot;},{&quot;q&quot;:&quot;Aktivitas D punya float 7 hari. Bila D dipangkas 1 hari dengan crashing, durasi proyek…&quot;,&quot;o&quot;:[&quot;Turun 1 hari&quot;,&quot;Turun 7 hari&quot;,&quot;Tidak berubah, biaya naik&quot;,&quot;Naik 1 hari&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;D tidak kritis, jadi memangkasnya hanya menambah biaya tanpa mempercepat proyek.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas 1C dan persiapan UTS</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Kumpulkan Tugas 1C</h3><ul><li>Laporan rencana proyek terpadu (PDF, maks. 35 halaman) dan slide presentasi.</li><li>Gantt chart dari aplikasi, tabel CPM, dan kompresi jadwal.</li><li>Tugas 1A dan 1B yang sudah disempurnakan.</li></ul><p style=\"margin:.4em 0 0\">Tenggat di Elin: <b>Senin, 2 November 2026, 23.59 WIB</b>. Setiap anggota mengunggah berkas yang sama.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Persiapan UTS (Pertemuan 8)</h3><p>Materi Pertemuan 1–7 (Sub-CPMK-1 sampai 4). Ulangi rangkuman dan kuis tiap pertemuan, latihan NPV/ROI/payback, WBS, dan CPM.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Gantt chart</span></dt><dd>Bagan batang yang menampilkan aktivitas proyek beserta tanggal mulai dan selesainya pada sumbu waktu. <i>(bagan Gantt)</i></dd></div><div><dt><span class=\"en\">Summary task</span></dt><dd>Baris induk di aplikasi jadwal yang merangkum beberapa aktivitas di bawahnya, biasanya sesuai cabang WBS. <i>(tugas ringkasan)</i></dd></div><div><dt><span class=\"en\">Milestone</span></dt><dd>Titik penting dalam jadwal proyek yang menandai selesainya hasil atau fase tertentu; durasinya nol. <i>(tonggak proyek)</i></dd></div><div><dt><span class=\"en\">Project calendar</span></dt><dd>Kalender hari dan jam kerja yang dipakai aplikasi untuk mengubah durasi menjadi tanggal. <i>(kalender proyek)</i></dd></div><div><dt><span class=\"en\">Schedule baseline</span></dt><dd>Versi jadwal yang sudah disetujui dan disimpan sebagai pembanding untuk memantau kemajuan. <i>(baseline jadwal)</i></dd></div><div><dt><span class=\"en\">Slack</span></dt><dd>Istilah lain untuk float di aplikasi seperti MS Project dan ProjectLibre: kelonggaran waktu sebuah aktivitas. <i>(kelonggaran (float))</i></dd></div><div><dt><span class=\"en\">Critical path</span></dt><dd>Rangkaian aktivitas terpanjang dalam jaringan proyek; panjangnya menentukan durasi proyek tersingkat. <i>(jalur kritis)</i></dd></div><div><dt><span class=\"en\">Schedule compression</span></dt><dd>Teknik memperpendek jadwal tanpa mengurangi lingkup, terutama crashing dan fast tracking. <i>(kompresi jadwal)</i></dd></div><div><dt><span class=\"en\">Crashing</span></dt><dd>Memperpendek durasi aktivitas di jalur kritis dengan menambah sumber daya, dengan biaya tambahan sekecil mungkin. <i>(percepatan dengan tambahan sumber daya)</i></dd></div><div><dt><span class=\"en\">Crash cost per day</span></dt><dd>Tambahan biaya untuk memperpendek satu aktivitas sebanyak satu hari; dipakai untuk memilih aktivitas yang ditekan lebih dulu. <i>(biaya percepatan per hari)</i></dd></div><div><dt><span class=\"en\">Fast tracking</span></dt><dd>Mengerjakan sebagian aktivitas secara paralel atau tumpang tindih padahal biasanya berurutan; risikonya pengerjaan ulang. <i>(pengerjaan tumpang tindih)</i></dd></div><div><dt><span class=\"en\">Rework</span></dt><dd>Pekerjaan yang harus diulang karena hasil sebelumnya salah atau berubah. <i>(pengerjaan ulang)</i></dd></div><div><dt><span class=\"en\">Lead dan lag</span></dt><dd>Lead: aktivitas penerus boleh mulai lebih awal sebelum pendahulu selesai. Lag: ada jeda tunggu antara dua aktivitas. <i>(percepatan dan jeda)</i></dd></div><div><dt><span class=\"en\">Total float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan tanggal selesai proyek; dihitung LS − ES. <i>(kelonggaran total)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 8 (UTS).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"Manajemen Biaya","subtitle":"Teknik estimasi, komponen biaya proyek SI, bottom-up estimating, cadangan, dan cost baseline","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 9</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Biaya</h1><p class=\"lead\">Dari WBS ke estimasi biaya, cadangan, dan cost baseline</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Sub-CPMK</b>5 · satu pertemuan</div><div><b>Hari ini</b>Estimasi biaya + persiapan Tugas 2A</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun estimasi biaya dan cost baseline proyek SI (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1–3)</span></h3><ol><li>Ketepatan memilih teknik estimasi biaya.</li><li>Kelengkapan komponen biaya proyek SI (SDM, perangkat, lisensi, cloud, pelatihan).</li><li>Ketepatan menyusun cost baseline dan cadangan kontingensi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 2: 5%, lewat Tugas 2A yang diumumkan di Pertemuan 10) dan Tes Tulis (UAS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 7 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Crashing modul tagihan dari 25 ke 22 hari menambah biaya berapa, dan mengapa biayanya naik?</li><li>Apa gunanya menyimpan baseline jadwal?</li><li>Durasi aktivitas di Pertemuan 6 diestimasi dengan teknik apa saja?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Alur manajemen biaya</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen biaya: rencanakan manajemen biaya, estimasi biaya, dan tetapkan anggaran atau cost baseline dibahas hari ini di Pertemuan 9; kendalikan biaya dengan earned value management di Pertemuan 15.\"><defs><marker id=\"pc9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"20\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"115\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Rencanakan</text><text x=\"115\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">satuan, ketelitian, aturan</text><line x1=\"211\" y1=\"72\" x2=\"233\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pc9)\"/><rect x=\"235\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"330\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Estimasi biaya</text><text x=\"330\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">teknik, komponen, dasar estimasi</text><line x1=\"426\" y1=\"72\" x2=\"448\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pc9)\"/><rect x=\"450\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"545\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Tetapkan anggaran</text><text x=\"545\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">cadangan, cost baseline, kurva S</text><line x1=\"641\" y1=\"72\" x2=\"663\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pc9)\"/><rect x=\"665\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"760\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kendalikan biaya</text><text x=\"760\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">EVM, perubahan</text><text x=\"235\" y=\"150\" class=\"s-hd\">HARI INI ································································</text><text x=\"665\" y=\"150\" class=\"s-s\">PERTEMUAN 15</text></svg><figcaption>Alur manajemen biaya dalam mata kuliah ini, dirangkum dari pembahasan project cost management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pembuka</span><span>Diskusi 3 menit</span></div><h2>Berapa biaya modul tagihan?</h2><div class=\"cols\"><div><p class=\"lead\">Pengasuh Pesantren Al-Hikmah bertanya: <b>\"Modul tagihan itu habis berapa?\"</b></p><p>Tiga anggota tim menjawab berbeda:</p><ul><li>Ani: \"Proyek pesantren tetangga tahun lalu Rp20 juta, ya sekitar itu.\"</li><li>Budi: \"Tiga fitur × Rp7 juta per fitur = Rp21 juta.\"</li><li>Citra: \"Belum tahu. Saya hitung per aktivitas dari WBS dulu.\"</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Pertanyaan</h3><p>Jawaban siapa yang paling cocok untuk:</p><ol><li>rapat yayasan besok pagi?</li><li>dana yang akan dicairkan bendahara per tahap?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Tiga jenis estimasi biaya</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Jenis</th><th>Kapan dibuat</th><th>Kegunaan</th><th>Rentang ketelitian</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"rom-estimate\">Rough order of magnitude</button></b></td><td>Sangat awal, lingkup belum rinci</td><td>Seleksi proyek, keputusan awal</td><td>−50% s.d. +100%</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"budgetary-estimate\">Budgetary</button></b></td><td>Awal, saat menyusun anggaran organisasi</td><td>Memasukkan proyek ke anggaran</td><td>−10% s.d. +25%</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"definitive-estimate\">Definitive</button></b></td><td>Setelah WBS dan jadwal rinci</td><td>Pembelian, cost baseline</td><td>−5% s.d. +10%</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.84em;margin-top:.5em\">Rentang menurut Schwalbe (2019). Makin rinci lingkupnya, makin sempit rentangnya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Teknik estimasi biaya</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"analogous\">Analogous</button></h3><p>Dari biaya proyek serupa. Cepat, butuh proyek pembanding yang benar-benar mirip.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg><button type=\"button\" class=\"term\" data-term=\"parametric\">Parametric</button></h3><p>Jumlah × tarif satuan, mis. hari kerja × tarif harian, GB × harga cloud.</p></div></div><div class=\"cols\" style=\"margin-top:.6em\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"bottom-up\">Bottom-up</button></h3><p>Hitung tiap work package atau aktivitas, lalu jumlahkan. Paling teliti, butuh WBS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"three-point\">Three-point</button></h3><p>(o + 4m + p) / 6 untuk biaya yang tidak pasti, sama seperti durasi di Pertemuan 6.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Semua teknik perlu <button type=\"button\" class=\"term\" data-term=\"basis-of-estimates\">dasar estimasi</button> tertulis. Dirangkum dari Schwalbe (2019) dan Kerzner (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Indikator 1 · pilih tindakan</span></div><h2>Teknik mana yang dipakai?</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;p9-tech&quot;,&quot;start&quot;:&quot;s&quot;,&quot;ask&quot;:&quot;Teknik apa yang Anda pakai?&quot;,&quot;nodes&quot;:{&quot;s&quot;:{&quot;text&quot;:&quot;Minggu pertama proyek SI Pesantren Al-Hikmah. WBS belum ada. Besok pagi ada rapat yayasan.&quot;,&quot;say&quot;:[[&quot;Pengasuh&quot;,&quot;Kira-kira modul tagihan butuh berapa? Saya perlu angka untuk rapat besok.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Memakai biaya modul serupa di pesantren tetangga tahun lalu, lalu menyebutnya sebagai perkiraan kasar dengan rentangnya.&quot;,&quot;tag&quot;:&quot;Analogous + rentang&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Waktunya sempit dan WBS belum ada. Menyebut rentang menjaga harapan pengasuh tetap realistis.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Menyusun estimasi bottom-up lengkap malam ini.&quot;,&quot;tag&quot;:&quot;Bottom-up semalam&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;WBS belum ada, jadi \\&quot;bottom-up\\&quot; semalam hanya tebakan yang tampak rinci. Ketelitian palsu lebih berbahaya daripada perkiraan kasar yang jujur.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Menyebut satu angka pasti agar pengasuh yakin.&quot;,&quot;tag&quot;:&quot;Angka pasti&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Angka pasti di tahap ini mudah dianggap janji. Bila nanti meleset, kepercayaan sponsor turun.&quot;,&quot;to&quot;:&quot;b&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Dua bulan kemudian WBS dan jadwal sudah disetujui. Bendahara yayasan akan mencairkan dana per tahap.&quot;,&quot;say&quot;:[[&quot;Bendahara&quot;,&quot;Saya perlu rincian biaya per bagian pekerjaan, bukan angka total saja.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Menghitung biaya tiap aktivitas dari sumber daya × tarif × durasi, lalu menjumlahkannya per work package.&quot;,&quot;tag&quot;:&quot;Bottom-up&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Rincian per work package memudahkan pencairan per tahap dan pengendalian.&quot;,&quot;to&quot;:&quot;c&quot;},{&quot;t&quot;:&quot;Memakai angka analogous yang dulu dibawa ke rapat yayasan.&quot;,&quot;tag&quot;:&quot;Analogous lagi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Terlalu kasar untuk pencairan per tahap; tidak ada rincian per bagian pekerjaan.&quot;,&quot;to&quot;:&quot;c&quot;}]},&quot;c&quot;:{&quot;text&quot;:&quot;Tim perlu memperkirakan biaya notifikasi WhatsApp tagihan selama setahun. Penyedia layanan memberi tarif per pesan.&quot;,&quot;ask&quot;:&quot;Bagaimana menghitungnya?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Tarif per pesan × jumlah wali santri × 12 bulan.&quot;,&quot;tag&quot;:&quot;Parametric&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Ada tarif satuan yang jelas dan jumlah yang dapat dihitung.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Bertanya kepada teman berapa biayanya dulu.&quot;,&quot;tag&quot;:&quot;Tebakan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Pendapat ahli boleh sebagai pembanding, tetapi di sini data tarif sudah ada; parametric lebih dapat dipertanggungjawabkan.&quot;,&quot;to&quot;:&quot;endMid&quot;}]},&quot;endGood&quot;:{&quot;end&quot;:&quot;Teknik dipilih sesuai tahap proyek dan data yang tersedia: analogous untuk keputusan awal, bottom-up untuk anggaran rinci, parametric bila ada tarif satuan.&quot;,&quot;title&quot;:&quot;Pilihan tepat&quot;,&quot;k&quot;:&quot;good&quot;},&quot;endMid&quot;:{&quot;end&quot;:&quot;Hampir tepat. Ingat: pilih teknik yang datanya tersedia dan paling dapat dipertanggungjawabkan.&quot;,&quot;title&quot;:&quot;Cukup&quot;,&quot;k&quot;:&quot;mid&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Komponen biaya proyek SI</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>SDM</h3><p>Analis, programmer, desainer, tester, manajer proyek: orang × hari × tarif.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Perangkat</h3><p>Komputer, printer, jaringan, perangkat pendukung di lokasi mitra.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Lisensi</h3><p>Perangkat lunak, pustaka, basis data. Bila gratis (sumber terbuka), tetap ditulis Rp0 dengan alasan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Cloud</h3><p>Hosting, server staging, domain, penyimpanan; sering berlangganan per bulan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pelatihan</h3><p>Pelatih, modul, konsumsi, pendampingan setelah go-live.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Sering terlupa</h3><p>Migrasi data, transport ke mitra, komunikasi, dokumentasi, perbaikan setelah uji.</p></div></div><p class=\"muted\" style=\"font-size:.84em;margin-top:.5em\">Bedakan <button type=\"button\" class=\"term\" data-term=\"direct-cost\">biaya langsung</button> dan <button type=\"button\" class=\"term\" data-term=\"indirect-cost\">tidak langsung</button>; <button type=\"button\" class=\"term\" data-term=\"sunk-cost\">sunk cost</button> tidak dihitung ulang. Dirangkum dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Indikator 2 · data ilustrasi, Rp juta</span></div><h2>Estimasi biaya modul tagihan</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.8em\"><thead><tr><th>Aktivitas</th><th>Sumber daya</th><th>SDM</th><th>Non-SDM</th><th>Total</th></tr></thead><tbody><tr><td>A · Analisis</td><td>1 analis × 5 hari</td><td>2,5</td><td>–</td><td><b>2,5</b></td></tr><tr><td>B · Desain DB</td><td>1 analis × 4 hari</td><td>2,0</td><td>–</td><td><b>2,0</b></td></tr><tr><td>C · Desain UI</td><td>1 desainer UI × 3 hari</td><td>1,2</td><td>–</td><td><b>1,2</b></td></tr><tr><td>D · Migrasi data</td><td>1 programmer × 4 hari</td><td>1,6</td><td>–</td><td><b>1,6</b></td></tr><tr><td>E · Fitur tagihan</td><td>2 programmer × 6 hari</td><td>4,8</td><td>0,6 <span class=\"muted\">(cloud staging 2 bulan)</span></td><td><b>5,4</b></td></tr><tr><td>F · Catat bayar</td><td>2 programmer × 5 hari</td><td>4,0</td><td>1,5 <span class=\"muted\">(printer kuitansi)</span></td><td><b>5,5</b></td></tr><tr><td>G · Uji modul</td><td>1 tester + 1 programmer × 3 hari</td><td>2,1</td><td>–</td><td><b>2,1</b></td></tr><tr><td>H · Pelatihan</td><td>1 pelatih × 2 hari</td><td>0,7</td><td>0,5 <span class=\"muted\">(konsumsi dan modul cetak)</span></td><td><b>1,2</b></td></tr><tr><td colspan=\"4\"><b>Total estimasi aktivitas</b> <span class=\"muted\">(lisensi Rp0: tumpukan sumber terbuka)</span></td><td><b>21,5</b></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Tarif per hari: analis Rp500 rb, programmer Rp400 rb, desainer UI Rp400 rb, tester Rp300 rb, pelatih Rp350 rb. Durasi dari Pertemuan 6.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 1 dan 3 · tekan Play atau klik langkah</span></div><h2>Bottom-up dari WBS</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p9-bu&quot;,&quot;ms&quot;:4200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Mulai dari WBS&quot;,&quot;en&quot;:&quot;work package&quot;,&quot;d&quot;:&quot;Ambil work package dan aktivitas dari WBS dan jadwal. Estimasi dibuat per aktivitas, bukan per proyek.&quot;,&quot;ex&quot;:&quot;Modul tagihan: 8 aktivitas (A–H) dari 6 work package.&quot;},{&quot;t&quot;:&quot;Sumber daya dan tarif&quot;,&quot;en&quot;:&quot;resource rate&quot;,&quot;d&quot;:&quot;Tentukan siapa mengerjakan, berapa orang, berapa hari, dan tarif harian. Tulis sumber tarifnya.&quot;,&quot;ex&quot;:&quot;E: 2 programmer × 6 hari × Rp400 rb.&quot;},{&quot;t&quot;:&quot;Hitung SDM&quot;,&quot;en&quot;:&quot;labor cost&quot;,&quot;d&quot;:&quot;Orang × hari × tarif.&quot;,&quot;ex&quot;:&quot;E: 2 × 6 × 0,4 = Rp4,8 juta.&quot;},{&quot;t&quot;:&quot;Tambah non-SDM&quot;,&quot;en&quot;:&quot;non-labor&quot;,&quot;d&quot;:&quot;Tambahkan perangkat, lisensi, cloud, dan bahan yang dipakai aktivitas itu.&quot;,&quot;ex&quot;:&quot;E: + cloud staging Rp0,6 juta = Rp5,4 juta.&quot;},{&quot;t&quot;:&quot;Jumlahkan ke atas&quot;,&quot;en&quot;:&quot;roll up&quot;,&quot;d&quot;:&quot;Jumlahkan aktivitas ke work package, lalu ke total proyek.&quot;,&quot;ex&quot;:&quot;1.3.1 (A+B+C) = 2,5 + 2,0 + 1,2 = Rp5,7 juta. Total delapan aktivitas Rp21,5 juta.&quot;},{&quot;t&quot;:&quot;Catat dasar estimasi&quot;,&quot;en&quot;:&quot;basis of estimates&quot;,&quot;d&quot;:&quot;Tulis asumsi dan sumber angka agar estimasi dapat diperiksa dan diperbarui.&quot;,&quot;ex&quot;:&quot;\\&quot;Tarif programmer dari penawaran dua pengembang lepas di Sidoarjo, Oktober 2026.\\&quot;&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Cadangan: dua jenis</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"contingency-reserve\">Cadangan kontingensi</button></h3><p>Untuk risiko yang <b>sudah diketahui</b> (known-unknowns). Dihitung dari daftar risiko. <b>Masuk</b> cost baseline.</p><p style=\"font-size:.85em\">Modul tagihan: R1 migrasi data 1,2 + R2 harga printer 0,3 + R3 pelatihan tambahan 0,5 = Rp2,0 jt.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/></svg><button type=\"button\" class=\"term\" data-term=\"management-reserve\">Cadangan manajemen</button></h3><p>Untuk hal <b>tak terduga</b> yang masih dalam lingkup (unknown-unknowns). <b>Di luar</b> cost baseline; dipakai dengan persetujuan sponsor.</p><p style=\"font-size:.85em\">Ditetapkan pengasuh: Rp1,5 jt.</p></div></div><figure class=\"fig\"><svg viewBox=\"0 0 860 112\" style=\"max-height:8.5em\" role=\"img\" aria-label=\"Susunan anggaran modul tagihan: estimasi biaya aktivitas Rp21,5 juta ditambah cadangan kontingensi Rp2,0 juta menjadi cost baseline Rp23,5 juta; ditambah cadangan manajemen Rp1,5 juta menjadi anggaran proyek Rp25,0 juta.\"><text x=\"140\" y=\"31\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:13px\">Cost baseline</text><rect x=\"150\" y=\"8\" width=\"404.20000000000005\" height=\"36\" class=\"s-box\"/><text x=\"352.1\" y=\"31\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\">Estimasi 21,5</text><rect x=\"554.2\" y=\"8\" width=\"37.59999999999991\" height=\"36\" class=\"s-acc\"/><text x=\"601.8\" y=\"31\" class=\"s-s\" style=\"font-size:12px\">= 23,5 (estimasi + kontingensi 2,0)</text><text x=\"140\" y=\"85\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:13px\">Anggaran proyek</text><rect x=\"150\" y=\"62\" width=\"404.20000000000005\" height=\"36\" class=\"s-box\"/><text x=\"352.1\" y=\"85\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\">Estimasi 21,5</text><rect x=\"554.2\" y=\"62\" width=\"37.59999999999991\" height=\"36\" class=\"s-acc\"/><rect x=\"591.8\" y=\"62\" width=\"28.200000000000045\" height=\"36\" class=\"s-mr\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:2.5\"/><text x=\"630\" y=\"85\" class=\"s-s\" style=\"font-size:12px\">= 25,0 (+ cadangan manajemen 1,5)</text></svg><figcaption>Kasus ilustrasi, Rp juta. Krem = kontingensi, koral = cadangan manajemen. Mengikuti pembahasan cost baseline dan reserves dalam PMI (2025) dan Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"cost-baseline\">Cost baseline</button></h2><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The approved version of the time-phased project budget, excluding any management reserves, which can be changed only through formal change control procedures and is used as a basis for comparison to actual results.\"</p><p class=\"tr\">\"Versi yang disetujui dari anggaran proyek bertahap waktu, tidak termasuk cadangan manajemen, yang hanya dapat diubah melalui prosedur pengendalian perubahan formal dan digunakan sebagai dasar pembanding terhadap hasil aktual.\"</p><div class=\"src\">PMI, definisi cost baseline</div></blockquote><ul class=\"lead\" style=\"margin-top:.5em\"><li><b>Bertahap waktu</b>: dibagi per minggu atau bulan mengikuti jadwal.</li><li><b>Tanpa cadangan manajemen.</b></li><li><b>Pembanding</b> biaya aktual di Pertemuan 15.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 3 · tekan Play atau klik langkah</span></div><h2>Menyusun cost baseline modul tagihan</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p9-base&quot;,&quot;ms&quot;:4200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Total estimasi&quot;,&quot;en&quot;:&quot;activity estimates&quot;,&quot;d&quot;:&quot;Jumlah estimasi bottom-up delapan aktivitas.&quot;,&quot;ex&quot;:&quot;Rp21,5 juta.&quot;},{&quot;t&quot;:&quot;Kontingensi&quot;,&quot;en&quot;:&quot;contingency&quot;,&quot;d&quot;:&quot;Tambahkan cadangan untuk tiap risiko teridentifikasi dan tempelkan pada aktivitasnya.&quot;,&quot;ex&quot;:&quot;R1 (D) 1,2 + R2 (F) 0,3 + R3 (H) 0,5 = Rp2,0 juta.&quot;},{&quot;t&quot;:&quot;Cost baseline&quot;,&quot;en&quot;:&quot;cost baseline&quot;,&quot;d&quot;:&quot;Estimasi + kontingensi, disetujui sponsor.&quot;,&quot;ex&quot;:&quot;21,5 + 2,0 = Rp23,5 juta.&quot;},{&quot;t&quot;:&quot;Bagi per minggu&quot;,&quot;en&quot;:&quot;time-phased&quot;,&quot;d&quot;:&quot;Bagi biaya tiap aktivitas ke minggu pelaksanaannya menurut jadwal CPM.&quot;,&quot;ex&quot;:&quot;Minggu 1–5: 2,5; 4,8; 6,6; 5,8; 3,8 (Rp juta).&quot;},{&quot;t&quot;:&quot;Kumulatif&quot;,&quot;en&quot;:&quot;S-curve&quot;,&quot;d&quot;:&quot;Jumlahkan berurutan untuk mendapat kurva S.&quot;,&quot;ex&quot;:&quot;Kumulatif: 2,5; 7,3; 13,9; 19,7; 23,5.&quot;},{&quot;t&quot;:&quot;Anggaran proyek&quot;,&quot;en&quot;:&quot;project budget&quot;,&quot;d&quot;:&quot;Tambahkan cadangan manajemen di luar baseline; bandingkan dengan alokasi di charter.&quot;,&quot;ex&quot;:&quot;23,5 + 1,5 = Rp25,0 juta ≤ alokasi Rp25,0 juta. ✔&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"s-curve\">Kurva S</button> cost baseline</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 260\" style=\"max-height:20em\" role=\"img\" aria-label=\"Kurva S cost baseline modul tagihan: biaya per minggu 2,5, 4,8, 6,6, 5,8, 3,8 juta rupiah; kumulatif 2,5, 7,3, 13,9, 19,7, 23,5 juta rupiah; garis putus-putus anggaran proyek 25,0 juta.\"><line x1=\"60\" y1=\"220\" x2=\"820\" y2=\"220\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"52\" y=\"224\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">0</text><line x1=\"60\" y1=\"181.53846153846155\" x2=\"820\" y2=\"181.53846153846155\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"52\" y=\"185.53846153846155\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">5</text><line x1=\"60\" y1=\"143.07692307692307\" x2=\"820\" y2=\"143.07692307692307\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"52\" y=\"147.07692307692307\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">10</text><line x1=\"60\" y1=\"104.61538461538463\" x2=\"820\" y2=\"104.61538461538463\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"52\" y=\"108.61538461538463\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">15</text><line x1=\"60\" y1=\"66.15384615384613\" x2=\"820\" y2=\"66.15384615384613\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"52\" y=\"70.15384615384613\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">20</text><line x1=\"60\" y1=\"27.69230769230768\" x2=\"820\" y2=\"27.69230769230768\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"52\" y=\"31.69230769230768\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><rect x=\"74\" y=\"200.76923076923077\" width=\"124\" height=\"19.230769230769226\" class=\"s-box\"/><text x=\"136\" y=\"214\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">2,5</text><text x=\"136\" y=\"238\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Minggu 1</text><rect x=\"226\" y=\"183.0769230769231\" width=\"124\" height=\"36.923076923076906\" class=\"s-box\"/><text x=\"288\" y=\"214\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">4,8</text><text x=\"288\" y=\"238\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Minggu 2</text><rect x=\"378\" y=\"169.23076923076923\" width=\"124\" height=\"50.769230769230774\" class=\"s-box\"/><text x=\"440\" y=\"214\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">6,6</text><text x=\"440\" y=\"238\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Minggu 3</text><rect x=\"530\" y=\"175.3846153846154\" width=\"124\" height=\"44.61538461538461\" class=\"s-box\"/><text x=\"592\" y=\"214\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">5,8</text><text x=\"592\" y=\"238\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Minggu 4</text><rect x=\"682\" y=\"190.76923076923077\" width=\"124\" height=\"29.230769230769226\" class=\"s-box\"/><text x=\"744\" y=\"214\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">3,8</text><text x=\"744\" y=\"238\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Minggu 5</text><line x1=\"60\" y1=\"27.69230769230768\" x2=\"820\" y2=\"27.69230769230768\" class=\"s-line\" stroke-dasharray=\"6 4\"/><text x=\"66\" y=\"21.69230769230768\" class=\"s-s\" style=\"font-size:11px\">Anggaran proyek 25,0 (termasuk cadangan manajemen 1,5)</text><polyline points=\"60,220 212,200.76923076923077 364,163.84615384615384 516,113.07692307692308 668,68.46153846153845 820,39.230769230769226\" fill=\"none\" stroke=\"var(--coral)\" stroke-width=\"3\"/><circle cx=\"212\" cy=\"200.76923076923077\" r=\"5\" class=\"s-acc\"/><text x=\"202\" y=\"191.76923076923077\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:12px\">2,5</text><circle cx=\"364\" cy=\"163.84615384615384\" r=\"5\" class=\"s-acc\"/><text x=\"354\" y=\"154.84615384615384\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:12px\">7,3</text><circle cx=\"516\" cy=\"113.07692307692308\" r=\"5\" class=\"s-acc\"/><text x=\"506\" y=\"104.07692307692308\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:12px\">13,9</text><circle cx=\"668\" cy=\"68.46153846153845\" r=\"5\" class=\"s-acc\"/><text x=\"658\" y=\"59.46153846153845\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:12px\">19,7</text><circle cx=\"820\" cy=\"39.230769230769226\" r=\"5\" class=\"s-acc\"/><text x=\"810\" y=\"59.230769230769226\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:12px\">23,5</text></svg><figcaption>Kasus ilustrasi, dalam juta rupiah. Batang = biaya per minggu, garis = biaya kumulatif (cost baseline). Biaya tiap aktivitas dibagi rata per hari kerja sesuai jadwal CPM Pertemuan 6 (penyederhanaan).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 2 dan 3 · geser dan centang</span></div><h2>Apakah anggaran masih cukup?</h2><div class=\"sim sim-budget\" data-sim=\"budget\" data-cfg=\"{&quot;id&quot;:&quot;p9-sim&quot;,&quot;rate&quot;:0.4,&quot;pgDays&quot;:29,&quot;fixed&quot;:9.9,&quot;risks&quot;:[{&quot;id&quot;:&quot;R1&quot;,&quot;act&quot;:&quot;D&quot;,&quot;t&quot;:&quot;Data santri lama tidak rapi; migrasi butuh 3 hari programmer tambahan&quot;,&quot;v&quot;:1.2},{&quot;id&quot;:&quot;R2&quot;,&quot;act&quot;:&quot;F&quot;,&quot;t&quot;:&quot;Harga printer kuitansi naik sekitar 20%&quot;,&quot;v&quot;:0.3},{&quot;id&quot;:&quot;R3&quot;,&quot;act&quot;:&quot;H&quot;,&quot;t&quot;:&quot;Bagian keuangan perlu satu sesi pelatihan tambahan&quot;,&quot;v&quot;:0.5}],&quot;mr&quot;:1.5,&quot;cap&quot;:25,&quot;msgOk&quot;:&quot;Anggaran proyek masih di dalam alokasi modul tagihan.&quot;,&quot;msgOver&quot;:&quot;Anggaran melebihi alokasi. Pilihan: kurangi lingkup, cari tarif lain, atau minta tambahan dana lewat sponsor. Menghapus kontingensi bukan solusi; risikonya tetap ada.&quot;}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan kelompok</span><span>30 menit · bahan Tugas 2A</span></div><h2>Estimasi biaya proyek mitra</h2><ol class=\"lead\"><li>Pilih <b>tiga work package</b> dari WBS Tugas 1 (salah satunya berisi pengembangan aplikasi).</li><li>Tulis aktivitas, sumber daya, durasi (dari jadwal Tugas 1C), dan tarif beserta sumbernya.</li><li>Hitung biaya SDM dan non-SDM; periksa lima komponen: SDM, perangkat, lisensi, cloud, pelatihan.</li><li>Tentukan satu risiko dan kontingensinya.</li><li>Bandingkan dengan anggaran di charter: masih cukup?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Estimasi makin teliti seiring tahap: <b>ROM → budgetary → definitive</b>.</li><li>Pilih teknik sesuai data: <b>analogous</b>, <b>parametric</b>, <b>bottom-up</b>, <b>three-point</b>.</li><li>Komponen lengkap: <b>SDM, perangkat, lisensi, cloud, pelatihan</b>, plus yang sering terlupa.</li><li><b>Cost baseline</b> = estimasi + kontingensi, bertahap waktu (kurva S).</li><li><b>Anggaran proyek</b> = cost baseline + cadangan manajemen.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p9-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;WBS dan jadwal sudah disetujui, dan bendahara membutuhkan rincian biaya per bagian pekerjaan. Teknik yang paling tepat adalah…&quot;,&quot;o&quot;:[&quot;Analogous&quot;,&quot;Expert judgment saja&quot;,&quot;Bottom-up&quot;,&quot;Rough order of magnitude&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Bottom-up menghitung tiap work package lalu menjumlahkannya, sehingga rincian per bagian pekerjaan tersedia. ROM adalah jenis estimasi, bukan teknik.&quot;},{&quot;q&quot;:&quot;Estimasi ROM ciri utamanya…&quot;,&quot;o&quot;:[&quot;Dibuat sangat awal dengan rentang ketelitian paling lebar&quot;,&quot;Dibuat dari WBS rinci&quot;,&quot;Menjadi nilai kontrak&quot;,&quot;Selalu lebih mahal daripada estimasi definitif&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;ROM dibuat saat lingkup belum rinci, sehingga rentangnya paling lebar.&quot;},{&quot;q&quot;:&quot;Estimasi proyek SI sebuah UMKM hanya berisi upah programmer. Yang paling perlu ditambahkan adalah…&quot;,&quot;o&quot;:[&quot;Biaya rapat internal dosen&quot;,&quot;Sunk cost proyek lama&quot;,&quot;Biaya iklan produk UMKM&quot;,&quot;Perangkat, lisensi, cloud, dan pelatihan&quot;],&quot;a&quot;:3,&quot;why&quot;:&quot;Komponen biaya proyek SI meliputi SDM, perangkat, lisensi, cloud, dan pelatihan. Sunk cost tidak dihitung ulang.&quot;},{&quot;q&quot;:&quot;Estimasi aktivitas Rp21,5 juta, cadangan kontingensi Rp2,0 juta, cadangan manajemen Rp1,5 juta. Cost baseline-nya…&quot;,&quot;o&quot;:[&quot;Rp21,5 juta&quot;,&quot;Rp23,5 juta&quot;,&quot;Rp23,0 juta&quot;,&quot;Rp25,0 juta&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Cost baseline = estimasi + kontingensi = Rp23,5 juta. Cadangan manajemen di luar baseline; Rp25,0 juta adalah anggaran proyek.&quot;},{&quot;q&quot;:&quot;Cadangan manajemen dipakai untuk…&quot;,&quot;o&quot;:[&quot;Risiko yang sudah teridentifikasi di risk register&quot;,&quot;Menambah fitur di luar lingkup&quot;,&quot;Kejadian tak terduga yang masih dalam lingkup, dengan persetujuan sponsor&quot;,&quot;Membayar lembur crashing yang sudah direncanakan&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Risiko teridentifikasi ditangani cadangan kontingensi. Penambahan lingkup harus lewat change request, bukan cadangan.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Persiapan Tugas 2A: estimasi biaya proyek mitra</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Siapkan (kelompok)</h3><ol style=\"margin:0;padding-left:1.2em\"><li>Lengkapi latihan hari ini untuk semua aktivitas di jadwal Tugas 1C.</li><li>Daftar komponen biaya, termasuk yang bernilai Rp0 beserta alasannya.</li><li>Dasar estimasi: sumber daya, tarif, dan sumbernya.</li><li>Cost baseline per minggu (tabel dan kurva S) dan anggaran dibandingkan dengan charter.</li><li>Catat risiko proyek mitra untuk Pertemuan 10.</li></ol><p style=\"margin:.4em 0 0\"><b>Tugas 2A</b> (biaya + risk register) diumumkan di Pertemuan 10, Senin 23 November 2026. Tenggat: Senin, 7 Desember 2026, 23.59 WIB.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Belajar mandiri</h3><p>Baca bab project cost management di Schwalbe (2019). Mulai catat risiko proyek mitra untuk Pertemuan 10.</p><p class=\"muted\" style=\"font-size:.85em\">Tugas 2A: Sub-CPMK-5 dan 6, masing-masing 5% nilai akhir, Penilaian Hasil Produk.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Cost estimate</span></dt><dd>Perkiraan biaya sumber daya yang dibutuhkan untuk menyelesaikan pekerjaan proyek, lengkap dengan dasar perhitungannya. <i>(estimasi biaya)</i></dd></div><div><dt><span class=\"en\">Rough order of magnitude (ROM)</span></dt><dd>Estimasi sangat awal, sebelum lingkup rinci tersedia; rentang ketelitiannya paling lebar. <i>(estimasi kasar)</i></dd></div><div><dt><span class=\"en\">Budgetary estimate</span></dt><dd>Estimasi untuk memasukkan proyek ke anggaran organisasi; lebih teliti daripada ROM. <i>(estimasi anggaran)</i></dd></div><div><dt><span class=\"en\">Definitive estimate</span></dt><dd>Estimasi rinci, biasanya dari WBS, untuk keputusan pembelian dan anggaran akhir; rentang ketelitiannya paling sempit. <i>(estimasi definitif)</i></dd></div><div><dt><span class=\"en\">Analogous estimating</span></dt><dd>Estimasi dari durasi atau biaya proyek serupa di masa lalu; cepat, tetapi kurang akurat. <i>(estimasi analogi)</i></dd></div><div><dt><span class=\"en\">Parametric estimating</span></dt><dd>Estimasi dari hubungan statistik antara jumlah pekerjaan dan produktivitas, mis. jumlah data dibagi laju per hari. <i>(estimasi parametrik)</i></dd></div><div><dt><span class=\"en\">Bottom-up estimating</span></dt><dd>Estimasi biaya tiap work package atau aktivitas lalu dijumlahkan ke tingkat di atasnya sampai total proyek. <i>(estimasi dari bawah ke atas)</i></dd></div><div><dt><span class=\"en\">Basis of estimates</span></dt><dd>Catatan dasar estimasi: sumber daya, tarif, durasi, asumsi, dan sumber angka. <i>(dasar estimasi)</i></dd></div><div><dt><span class=\"en\">Direct cost</span></dt><dd>Biaya yang langsung terkait dengan pekerjaan proyek, mis. upah programmer dan printer untuk modul. <i>(biaya langsung)</i></dd></div><div><dt><span class=\"en\">Contingency reserve</span></dt><dd>Dana (atau waktu) untuk risiko yang sudah teridentifikasi (known-unknowns); termasuk dalam cost baseline. <i>(cadangan kontingensi)</i></dd></div><div><dt><span class=\"en\">Management reserve</span></dt><dd>Dana untuk pekerjaan tak terduga yang masih dalam lingkup (unknown-unknowns); di luar cost baseline, pemakaiannya perlu persetujuan sponsor atau manajemen. <i>(cadangan manajemen)</i></dd></div><div><dt><span class=\"en\">Cost baseline</span></dt><dd>Anggaran proyek bertahap waktu yang sudah disetujui, tanpa cadangan manajemen; hanya diubah lewat pengendalian perubahan dan menjadi pembanding biaya aktual. <i>(baseline biaya)</i></dd></div><div><dt><span class=\"en\">Project budget</span></dt><dd>Cost baseline ditambah cadangan manajemen; batas dana yang disetujui untuk proyek. <i>(anggaran proyek)</i></dd></div><div><dt><span class=\"en\">S-curve</span></dt><dd>Grafik biaya kumulatif terhadap waktu; bentuknya seperti huruf S karena pengeluaran lambat di awal, cepat di tengah, dan melambat di akhir. <i>(kurva S)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 10 (Manajemen Risiko).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":10,"title":"Manajemen Risiko","subtitle":"Identifikasi, analisis kualitatif dan kuantitatif (EMV), strategi respons, dan risk register","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 10</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Risiko</h1><p class=\"lead\">Apa yang bisa salah, seberapa penting, dan apa yang kita lakukan</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Sub-CPMK</b>6 · satu pertemuan</div><div><b>Hari ini</b>Risk register + Tugas 2A</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-6</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengevaluasi risiko proyek SI dan merumuskan strategi responsnya (C5).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1–4)</span></h3><ol><li>Kelengkapan identifikasi risiko proyek SI.</li><li>Ketepatan analisis kualitatif (matriks probabilitas-dampak) dan kuantitatif (EMV).</li><li>Ketepatan strategi respons risiko.</li><li>Kelengkapan risk register.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu mengevaluasi risiko, pengadaan, dan kinerja proyek sistem informasi secara bertanggung jawab sesuai prinsip legal, etika profesi, dan keberlanjutan.</dd><dt>CPL-2</dt><dd class=\"id\">Memiliki tanggung jawab profesional serta mampu melakukan penilaian berdasarkan informasi dalam praktik sistem informasi sesuai prinsip legal, etika profesi, dan keberlanjutan.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 2: 5%, lewat Tugas 2A) dan Tes Tulis (UAS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 9 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Berapa cost baseline modul tagihan, dan apa saja penyusunnya?</li><li>Apa beda cadangan kontingensi dan cadangan manajemen?</li><li>Angka kontingensi Rp2,0 juta itu dari mana?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Alur manajemen risiko</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 190\" role=\"img\" aria-label=\"Alur manajemen risiko: rencanakan, identifikasi, analisis kualitatif, analisis kuantitatif, rencanakan respons, jalankan respons, pantau. Identifikasi sampai rencanakan respons dibahas hari ini; pemantauan berlangsung sepanjang proyek.\"><defs><marker id=\"pr10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"8\" y=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-box\"/><text x=\"62\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Rencanakan</text><text x=\"62\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">aturan, skala</text><line x1=\"117\" y1=\"75\" x2=\"130\" y2=\"75\" class=\"s-line\" marker-end=\"url(#pr10)\"/><rect x=\"132\" y=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-acc\"/><text x=\"186\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Identifikasi</text><text x=\"186\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">RBS, risk statement</text><line x1=\"241\" y1=\"75\" x2=\"254\" y2=\"75\" class=\"s-line\" marker-end=\"url(#pr10)\"/><rect x=\"256\" y=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-acc\"/><text x=\"310\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Kualitatif</text><text x=\"310\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">P × I, prioritas</text><line x1=\"365\" y1=\"75\" x2=\"378\" y2=\"75\" class=\"s-line\" marker-end=\"url(#pr10)\"/><rect x=\"380\" y=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-acc\"/><text x=\"434\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Kuantitatif</text><text x=\"434\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">EMV</text><line x1=\"489\" y1=\"75\" x2=\"502\" y2=\"75\" class=\"s-line\" marker-end=\"url(#pr10)\"/><rect x=\"504\" y=\"36\" width=\"108\" height=\"78\" rx=\"10\" class=\"s-acc\"/><text x=\"558\" y=\"70\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Respons</text><text x=\"558\" y=\"92\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">strategi, pemilik</text><line x1=\"613\" y1=\"75\" x2=\"626\" y2=\"75\" class=\"s-line\" marker-end=\"url(#pr10)\"/><rect x=\"628\" y
