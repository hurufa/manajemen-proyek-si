style=\"font-size:11px\">9</text><text x=\"365\" y=\"205\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">6</text><text x=\"412\" y=\"205\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">15</text><text x=\"365\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">E · Fitur tagihan</text><text x=\"318\" y=\"256\" class=\"s-s\" style=\"font-size:11px\">9</text><text x=\"365\" y=\"256\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"412\" y=\"256\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">15</text><rect x=\"460\" y=\"190\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"460\" y1=\"210\" x2=\"570\" y2=\"210\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"460\" y1=\"242\" x2=\"570\" y2=\"242\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"468\" y=\"205\" class=\"s-s\" style=\"font-size:11px\">15</text><text x=\"515\" y=\"205\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">5</text><text x=\"562\" y=\"205\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"515\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F · Catat bayar</text><text x=\"468\" y=\"256\" class=\"s-s\" style=\"font-size:11px\">15</text><text x=\"515\" y=\"256\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"562\" y=\"256\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">20</text><rect x=\"610\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"610\" y1=\"135\" x2=\"720\" y2=\"135\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"610\" y1=\"167\" x2=\"720\" y2=\"167\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"618\" y=\"130\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"665\" y=\"130\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">3</text><text x=\"712\" y=\"130\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"665\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">G · Uji modul</text><text x=\"618\" y=\"181\" class=\"s-s\" style=\"font-size:11px\">20</text><text x=\"665\" y=\"181\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"712\" y=\"181\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">23</text><rect x=\"760\" y=\"115\" width=\"110\" height=\"72\" rx=\"6\" class=\"s-acc\" style=\"stroke:var(--primary);stroke-width:3\"/><line x1=\"760\" y1=\"135\" x2=\"870\" y2=\"135\" class=\"s-dash\" style=\"stroke-width:1\"/><line x1=\"760\" y1=\"167\" x2=\"870\" y2=\"167\" class=\"s-dash\" style=\"stroke-width:1\"/><text x=\"768\" y=\"130\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"815\" y=\"130\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">2</text><text x=\"862\" y=\"130\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"815\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">H · Pelatihan</text><text x=\"768\" y=\"181\" class=\"s-s\" style=\"font-size:11px\">23</text><text x=\"815\" y=\"181\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">F 0</text><text x=\"862\" y=\"181\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">25</text><text x=\"10\" y=\"284\" class=\"s-hd\" style=\"font-size:12px\">ATAS: ES · DURASI · EF  ·  BAWAH: LS · FLOAT · LF  ·  GARIS TEBAL = JALUR KRITIS (25 HARI)</text></svg><figcaption>Kasus ilustrasi. Diagram jaringan dengan metode PDM (activity on node) sebagaimana dibahas Schwalbe (2019); ES, EF, LS, LF, dan float dihitung dengan CPM, konvensi mulai hari ke-0.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Membaca float</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The amount of time that a schedule activity can be delayed or extended from its early start date without delaying the project finish date or violating a schedule constraint.\"</p><p class=\"tr\">\"Lamanya waktu suatu aktivitas jadwal dapat ditunda atau diperpanjang dari tanggal mulai paling awalnya tanpa menunda tanggal selesai proyek atau melanggar suatu batasan jadwal.\"</p><div class=\"src\">PMI (2025), definisi total float; terjemahan harfiah penyusun</div></blockquote><ul><li><button type=\"button\" class=\"term\" data-term=\"total-float\">Total float</button> = LS − ES.</li><li><button type=\"button\" class=\"term\" data-term=\"free-float\">Free float</button> = ES penerus terkecil − EF.</li><li>Float milik <b>jalur</b>, bukan jatah santai satu aktivitas.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Di modul tagihan</h3><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th></th><th>Total</th><th>Free</th></tr></thead><tbody><tr><td>C · Desain UI</td><td>1</td><td>9 − 8 = 1</td></tr><tr><td>D · Migrasi</td><td>7</td><td>20 − 13 = 7</td></tr><tr><td>E · Fitur tagihan</td><td>0</td><td>0</td></tr></tbody></table><p style=\"margin:.5em 0 0;font-size:.9em\">D boleh mundur sampai 7 hari tanpa memundurkan proyek. E terlambat 1 hari = proyek terlambat 1 hari.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 3 · ubah durasi dengan − dan +</span></div><h2>Apa yang terjadi bila durasi berubah?</h2><div class=\"sim sim-cpm\" data-sim=\"cpm\" data-cfg=\"{&quot;id&quot;:&quot;p6-sim&quot;,&quot;acts&quot;:[{&quot;id&quot;:&quot;A&quot;,&quot;t&quot;:&quot;Analisis&quot;,&quot;d&quot;:5,&quot;pre&quot;:[]},{&quot;id&quot;:&quot;B&quot;,&quot;t&quot;:&quot;Desain DB&quot;,&quot;d&quot;:4,&quot;pre&quot;:[&quot;A&quot;]},{&quot;id&quot;:&quot;C&quot;,&quot;t&quot;:&quot;Desain UI&quot;,&quot;d&quot;:3,&quot;pre&quot;:[&quot;A&quot;]},{&quot;id&quot;:&quot;D&quot;,&quot;t&quot;:&quot;Migrasi data&quot;,&quot;d&quot;:4,&quot;pre&quot;:[&quot;B&quot;]},{&quot;id&quot;:&quot;E&quot;,&quot;t&quot;:&quot;Fitur tagihan&quot;,&quot;d&quot;:6,&quot;pre&quot;:[&quot;B&quot;,&quot;C&quot;]},{&quot;id&quot;:&quot;F&quot;,&quot;t&quot;:&quot;Catat bayar&quot;,&quot;d&quot;:5,&quot;pre&quot;:[&quot;E&quot;]},{&quot;id&quot;:&quot;G&quot;,&quot;t&quot;:&quot;Uji modul&quot;,&quot;d&quot;:3,&quot;pre&quot;:[&quot;D&quot;,&quot;F&quot;]},{&quot;id&quot;:&quot;H&quot;,&quot;t&quot;:&quot;Pelatihan&quot;,&quot;d&quot;:2,&quot;pre&quot;:[&quot;G&quot;]}],&quot;min&quot;:1,&quot;max&quot;:15,&quot;unit&quot;:&quot;hari&quot;,&quot;hd&quot;:[&quot;ID&quot;,&quot;Durasi&quot;,&quot;ES&quot;,&quot;EF&quot;,&quot;LS&quot;,&quot;LF&quot;,&quot;Float&quot;,&quot;Bagan&quot;],&quot;lblT&quot;:&quot;Durasi proyek&quot;,&quot;lblCrit&quot;:&quot;Aktivitas kritis&quot;,&quot;msg0&quot;:&quot;Ini jadwal awal. Coba tambah durasi D sampai 9, lalu kembalikan dan tambah durasi E sebanyak 1.&quot;,&quot;msgLate&quot;:&quot;Proyek mundur {n} hari karena aktivitas di jalur kritis bertambah lama atau float sebuah aktivitas habis.&quot;,&quot;msgEarly&quot;:&quot;Proyek maju {n} hari karena jalur kritis memendek. Perhatikan apakah jalur kritisnya berpindah.&quot;,&quot;msgSame&quot;:&quot;Durasi proyek tetap: perubahan terserap float. Perhatikan float aktivitas lain yang ikut berkurang.&quot;}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"margin-top:.35em;font-size:.8em\">Data ilustrasi. Batang berwarna = waktu aktivitas; kotak putus-putus = float.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok · 15 menit · kasus ilustrasi</span></div><h2>Portal layanan Desa Sukamaju</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>ID</th><th>Aktivitas</th><th>Durasi</th><th>Pendahulu</th></tr></thead><tbody><tr><td>P</td><td>Analisis proses layanan surat</td><td>3</td><td>–</td></tr><tr><td>Q</td><td>Desain formulir daring</td><td>2</td><td>P</td></tr><tr><td>R</td><td>Desain basis data</td><td>3</td><td>P</td></tr><tr><td>S</td><td>Pembuatan fitur pengajuan surat</td><td>5</td><td>Q, R</td></tr><tr><td>T</td><td>Pembuatan fitur cetak surat</td><td>4</td><td>R</td></tr><tr><td>U</td><td>Uji fungsi</td><td>2</td><td>S, T</td></tr><tr><td>V</td><td>Pelatihan operator desa</td><td>1</td><td>U</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Kerjakan</h3><ol><li>Gambar network diagram PDM.</li><li>Hitung ES, EF, LS, LF, dan float setiap aktivitas.</li><li>Tentukan jalur kritis dan durasi proyek.</li><li>Bila T terlambat 2 hari, apa dampaknya?</li></ol><p class=\"muted\" style=\"margin:0;font-size:.85em\">Durasi dalam hari kerja. Mulai hari ke-0.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 30 menit</span></div><h2>Jaringan dan jalur kritis proyek Anda</h2><div class=\"cols\"><div><p><b>Dari WBS Pertemuan 5:</b></p><ol><li>Turunkan 10–15 aktivitas dari work package (cantumkan kode WBS).</li><li>Tentukan pendahulu setiap aktivitas, termasuk dependensi eksternal dari mitra.</li><li>Estimasi durasi; pakai minimal dua teknik berbeda dan tulis alasannya.</li><li>Gambar network diagram PDM.</li><li>Hitung ES, EF, LS, LF, float, dan jalur kritis.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dinilai rekan</h3><ul><li>Setiap work package punya aktivitas</li><li>Tidak ada aktivitas \"menggantung\" tanpa penerus</li><li>Tidak ada lingkaran dependensi</li><li>Asumsi estimasi tertulis</li><li>Forward dan backward pass konsisten (float ≥ 0)</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai jaringan kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p6-net-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · jaringan dan jalur kritis (MPSI P6)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · SI Kasir UMKM&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di jaringan mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. ES aktivitas 7 seharusnya dari EF terbesar…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:7,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:10,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Aktivitas dari WBS&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Aktivitas tidak terkait WBS.&quot;,&quot;Sebagian work package belum punya aktivitas.&quot;,&quot;Hampir semua work package diturunkan; kode WBS dicantumkan.&quot;,&quot;Semua work package diturunkan menjadi aktivitas berkata kerja yang terlacak.&quot;]},{&quot;t&quot;:&quot;Dependensi dan diagram&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Tidak ada dependensi.&quot;,&quot;Banyak dependensi tidak logis atau ada aktivitas menggantung.&quot;,&quot;Dependensi umumnya logis; satu atau dua keliru.&quot;,&quot;Dependensi logis, termasuk dependensi eksternal; diagram rapi tanpa lingkaran.&quot;]},{&quot;t&quot;:&quot;Estimasi durasi&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Durasi tanpa dasar.&quot;,&quot;Durasi ditebak; teknik tidak disebut.&quot;,&quot;Satu teknik dipakai dengan alasan.&quot;,&quot;Minimal dua teknik berbeda, asumsi tertulis, hitungan PERT benar.&quot;]},{&quot;t&quot;:&quot;CPM dan float&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Belum dihitung.&quot;,&quot;ES/EF ada, LS/LF dan float belum.&quot;,&quot;Perhitungan lengkap dengan satu atau dua salah hitung.&quot;,&quot;ES, EF, LS, LF, float benar; jalur kritis dan durasi proyek tepat.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Aktivitas diturunkan dari <b>work package</b>, lalu diurutkan dengan <b>dependensi</b> (FS paling umum).</li><li><b>Network diagram PDM</b>: kotak = aktivitas, panah = dependensi.</li><li>Estimasi durasi: <b>analogous</b>, <b>parametric</b>, <b>PERT</b> (o + 4m + p) / 6.</li><li><b>CPM</b>: forward pass (ES, EF), backward pass (LS, LF), float = LS − ES.</li><li><b>Jalur kritis</b> = jalur terpanjang dengan float 0; durasi proyek bukan jumlah semua durasi.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p6-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;\\&quot;Fitur tagihan baru bisa mulai dikerjakan setelah desain basis data selesai.\\&quot; Jenis dependensinya adalah…&quot;,&quot;o&quot;:[&quot;Finish-to-Start (FS)&quot;,&quot;Start-to-Start (SS)&quot;,&quot;Finish-to-Finish (FF)&quot;,&quot;Start-to-Finish (SF)&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Aktivitas penerus mulai setelah pendahulu selesai: finish-to-start, jenis yang paling umum.&quot;},{&quot;q&quot;:&quot;Estimasi tiga titik: o = 2, m = 5, p = 14 hari. Berapa t&lt;sub&gt;E&lt;/sub&gt; menurut rumus PERT?&quot;,&quot;o&quot;:[&quot;5 hari&quot;,&quot;6 hari&quot;,&quot;7 hari&quot;,&quot;7,5 hari&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;(2 + 4×5 + 14) / 6 = 36 / 6 = 6 hari. Angka 7 adalah rata-rata sederhana (2 + 5 + 14) / 3.&quot;},{&quot;q&quot;:&quot;Aktivitas G punya dua pendahulu dengan EF 13 dan 20. Pada forward pass, ES aktivitas G adalah…&quot;,&quot;o&quot;:[&quot;13&quot;,&quot;16,5&quot;,&quot;20&quot;,&quot;33&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;ES = EF terbesar dari semua pendahulu, karena G baru bisa mulai setelah keduanya selesai.&quot;},{&quot;q&quot;:&quot;Aktivitas C: ES = 5, EF = 8, LS = 6, LF = 9. Total float C adalah…&quot;,&quot;o&quot;:[&quot;0 hari&quot;,&quot;1 hari&quot;,&quot;3 hari&quot;,&quot;4 hari&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Total float = LS − ES = 6 − 5 = 1 hari (sama dengan LF − EF = 9 − 8).&quot;},{&quot;q&quot;:&quot;Aktivitas D punya total float 7 hari dan terlambat 3 hari. Bila aktivitas lain sesuai rencana, durasi proyek…&quot;,&quot;o&quot;:[&quot;Mundur 3 hari&quot;,&quot;Mundur 7 hari&quot;,&quot;Tidak berubah&quot;,&quot;Maju 4 hari&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Keterlambatan 3 hari masih lebih kecil dari float 7 hari, sehingga terserap tanpa memundurkan proyek.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1C)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca dan menyiapkan</h3><p>Bagian penjadwalan proyek (dependensi, network diagram, estimasi durasi, CPM) dalam Schwalbe (2019) dan Kerzner (2025).</p><p>Pasang <b>ProjectLibre</b> (gratis) atau siapkan <b>MS Project</b> di laptop sebelum Pertemuan 7.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1C · jadwal dan rencana proyek)</h3><ul><li>Lengkapi <b>daftar aktivitas</b>, dependensi, dan <b>network diagram</b>.</li><li>Estimasi durasi dengan minimal <b>dua teknik</b> beserta tabel hitungannya.</li><li>Hitung <b>ES, EF, LS, LF, float</b>, dan <b>jalur kritis</b>.</li><li>Mulai menggabungkan Tugas 1A dan 1B menjadi rencana proyek terpadu.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.7em\">Tugas 1B (scope statement dan WBS): Jumat, 30 Oktober 2026, 23.59 WIB. Tugas 1C dikumpulkan di Elin paling lambat <b>Senin, 2 November 2026, 23.59 WIB</b> dan dipresentasikan di Pertemuan 7. Rincian dan rubrik ada di Elin.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Activity</span></dt><dd>Bagian pekerjaan terjadwal yang jelas batasnya, diturunkan dari work package, dan punya durasi. <i>(aktivitas)</i></dd></div><div><dt><span class=\"en\">Dependency</span></dt><dd>Hubungan logis antara dua aktivitas yang menentukan urutan pengerjaannya, mis. B baru mulai setelah A selesai. <i>(ketergantungan / dependensi)</i></dd></div><div><dt><span class=\"en\">Project network diagram</span></dt><dd>Gambar urutan dan hubungan logis antaraktivitas proyek. <i>(diagram jaringan proyek)</i></dd></div><div><dt><span class=\"en\">Precedence Diagramming Method (PDM)</span></dt><dd>Cara menggambar jaringan dengan aktivitas di dalam kotak (activity on node) dan panah sebagai dependensi; mendukung empat jenis hubungan FS, SS, FF, SF. <i>(metode diagram preseden)</i></dd></div><div><dt><span class=\"en\">Lead dan lag</span></dt><dd>Lead: aktivitas penerus boleh mulai lebih awal sebelum pendahulu selesai. Lag: ada jeda tunggu antara dua aktivitas. <i>(percepatan dan jeda)</i></dd></div><div><dt><span class=\"en\">Analogous estimating</span></dt><dd>Estimasi dari durasi atau biaya proyek serupa di masa lalu; cepat, tetapi kurang akurat. <i>(estimasi analogi)</i></dd></div><div><dt><span class=\"en\">Parametric estimating</span></dt><dd>Estimasi dari hubungan statistik antara jumlah pekerjaan dan produktivitas, mis. jumlah data dibagi laju per hari. <i>(estimasi parametrik)</i></dd></div><div><dt><span class=\"en\">Three-point estimating (PERT)</span></dt><dd>Estimasi memakai tiga nilai, yaitu optimistis, paling mungkin, dan pesimistis; versi PERT memakai (o + 4m + p) / 6. <i>(estimasi tiga titik)</i></dd></div><div><dt><span class=\"en\">Critical Path Method (CPM)</span></dt><dd>Teknik analisis jaringan untuk menghitung waktu mulai dan selesai paling awal dan paling lambat setiap aktivitas, lalu menemukan jalur kritis. <i>(metode jalur kritis)</i></dd></div><div><dt><span class=\"en\">Critical path</span></dt><dd>Rangkaian aktivitas terpanjang dalam jaringan proyek; panjangnya menentukan durasi proyek tersingkat. <i>(jalur kritis)</i></dd></div><div><dt><span class=\"en\">Forward pass</span></dt><dd>Perhitungan dari awal ke akhir jaringan untuk mencari ES dan EF setiap aktivitas. <i>(hitung maju)</i></dd></div><div><dt><span class=\"en\">Backward pass</span></dt><dd>Perhitungan dari akhir ke awal jaringan untuk mencari LF dan LS setiap aktivitas. <i>(hitung mundur)</i></dd></div><div><dt><span class=\"en\">Total float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan tanggal selesai proyek; dihitung LS − ES. <i>(kelonggaran total)</i></dd></div><div><dt><span class=\"en\">Free float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan ES aktivitas penerusnya. <i>(kelonggaran bebas)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Penjadwalan Proyek (2)","subtitle":"Gantt chart di ProjectLibre/MS Project, crashing, fast tracking, dan presentasi Tugas 1","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Penjadwalan Proyek (2)</h1><p class=\"lead\">Gantt chart di aplikasi, kompresi jadwal, dan presentasi rencana proyek</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Praktik aplikasi + presentasi Tugas 1</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun jadwal proyek dan menganalisis jalur kritis (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 4 dan 5)</span></h3><ol><li>Ketepatan menurunkan aktivitas dari WBS dan menentukan dependensinya. <span class=\"muted\">(Pertemuan 6)</span></li><li>Ketepatan estimasi durasi (analogous, parametric, three-point/PERT). <span class=\"muted\">(Pertemuan 6)</span></li><li>Ketepatan menghitung jalur kritis dan float. <span class=\"muted\">(Pertemuan 6)</span></li><li>Kelengkapan Gantt chart pada aplikasi manajemen proyek.</li><li>Ketepatan menerapkan crashing atau fast tracking.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 6 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Mengapa modul tagihan butuh 25 hari, bukan 32?</li><li>Bagaimana menghitung ES aktivitas yang punya dua pendahulu?</li><li>Aktivitas D punya float 7 hari. Apa artinya?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari jalur kritis ke Gantt chart</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen jadwal: definisikan aktivitas, urutkan, estimasi durasi, dan susun jadwal dengan CPM sudah dibahas di Pertemuan 6; Gantt chart di aplikasi dan kompresi jadwal dibahas hari ini di Pertemuan 7.\"><defs><marker id=\"ps7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"87\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Definisikan aktivitas</text><text x=\"87\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">work package → aktivitas</text><line x1=\"165\" y1=\"72\" x2=\"181\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps7)\"/><rect x=\"184\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"261\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Urutkan aktivitas</text><text x=\"261\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">dependensi, PDM</text><line x1=\"339\" y1=\"72\" x2=\"355\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps7)\"/><rect x=\"358\" y=\"30\" width=\"154\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"435\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Estimasi durasi</text><text x=\"435\" y=\"90\" text-anchor=\"middle\" class= 3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Aktivitas</h3><p>Diturunkan dari WBS; <button type=\"button\" class=\"term\" data-term=\"summary-task\">summary task</button> mengikuti cabang WBS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Durasi dan tanggal</h3><p>Durasi hasil estimasi; tanggal dihitung dari <button type=\"button\" class=\"term\" data-term=\"project-calendar\">kalender proyek</button>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Dependensi</h3><p>Pendahulu sama dengan network diagram (FS, SS, <button type=\"button\" class=\"term\" data-term=\"lead-lag\">lead/lag</button>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"milestone\">Milestone</button></h3><p>Durasi nol: serah terima, pengesahan, presentasi.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg><button type=\"button\" class=\"term\" data-term=\"critical-path\">Jalur kritis</button></h3><p>Ditandai berbeda; sama dengan hitungan manual.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"schedule-baseline\">Baseline</button></h3><p>Disimpan setelah disetujui, sebagai pembanding kemajuan.</p></div></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.84em\">Lima unsur pertama sesuai rubrik Tugas 1C (kriteria C4); baseline dipakai lagi di Pertemuan 15. Dirangkum dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Siapkan lingkungan</span><span>Pilih salah satu · hasilnya setara</span></div><h2>ProjectLibre atau MS Project</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Opsi 1 · ProjectLibre</h3><ul><li>Gratis dan sumber terbuka; unduh dari situs resmi projectlibre.com.</li><li>Tersedia untuk Windows, macOS, dan Linux.</li><li>Buka, lalu buat proyek baru dan isi tanggal mulai.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M8 21h8M12 17v4\"/></svg>Opsi 2 · MS Project</h3><ul><li>Berbayar; pakai bila Anda punya lisensi.</li><li>Langkah dan istilahnya mirip ProjectLibre.</li><li>Buka proyek kosong, lalu isi tanggal mulai di informasi proyek.</li></ul></div></div><div class=\"callout\" style=\"margin-top:.7em\">Tidak punya laptop? Kerjakan berpasangan di laptop anggota kelompok. Nama menu bisa sedikit berbeda menurut versi aplikasi.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum</span><span>Indikator 4 · tekan Play atau klik langkah</span></div><h2>Dari tabel ke Gantt chart di aplikasi</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p7-app&quot;,&quot;ms&quot;:3800,&quot;steps&quot;:[{&quot;t&quot;:&quot;Proyek baru&quot;,&quot;en&quot;:&quot;start date&quot;,&quot;d&quot;:&quot;Buat proyek baru dan isi tanggal mulai di informasi proyek. Pastikan kalender hari kerja Senin–Jumat.&quot;,&quot;ex&quot;:&quot;Mulai Senin, 2 November 2026 (kasus ilustrasi).&quot;},{&quot;t&quot;:&quot;Ketik aktivitas&quot;,&quot;en&quot;:&quot;task name&quot;,&quot;d&quot;:&quot;Ketik nama aktivitas A–H berurutan sesuai berkas jadwal_modul_tagihan.csv. Nomor baris di aplikasi menjadi ID aktivitas.&quot;,&quot;ex&quot;:&quot;Baris 1 = A Analisis kebutuhan rinci tagihan … baris 8 = H Pelatihan bagian keuangan.&quot;},{&quot;t&quot;:&quot;Isi durasi&quot;,&quot;en&quot;:&quot;duration&quot;,&quot;d&quot;:&quot;Isi kolom durasi dalam hari kerja sesuai kolom durasi_hari.&quot;,&quot;ex&quot;:&quot;A 5 hari, B 4 hari, E 6 hari.&quot;},{&quot;t&quot;:&quot;Isi pendahulu&quot;,&quot;en&quot;:&quot;predecessors&quot;,&quot;d&quot;:&quot;Isi kolom pendahulu dengan nomor baris (kolom pendahulu_no), atau pilih dua aktivitas lalu tekan tombol Link (finish-to-start).&quot;,&quot;ex&quot;:&quot;E pendahulunya baris 2 dan 3; G pendahulunya baris 4 dan 6.&quot;},{&quot;t&quot;:&quot;Tambah milestone&quot;,&quot;en&quot;:&quot;milestone&quot;,&quot;d&quot;:&quot;Tambah baris \\&quot;Modul diterima\\&quot; berdurasi 0 dengan pendahulu baris 8, atau tandai sebagai milestone.&q l);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"246\" class=\"s-t\" style=\"font-size:12px\">H · Pelatihan</text><rect x=\"730\" y=\"234\" width=\"54\" height=\"16\" rx=\"2\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:1.5\"/><text x=\"10\" y=\"273\" class=\"s-t\" style=\"font-size:12px\">◆ Modul diterima</text><path d=\"M784 260 l9 9 -9 9 -9 -9z\" style=\"fill:var(--ink)\"/><rect x=\"10\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--coral);stroke:var(--line)\"/><text x=\"34\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">kritis</text><rect x=\"90\" y=\"299\" width=\"18\" height=\"12\" style=\"fill:var(--mustard);stroke:var(--line)\"/><text x=\"114\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">tidak kritis</text><rect x=\"200\" y=\"301\" width=\"18\" height=\"9\" style=\"fill:none;stroke:var(--muted);stroke-dasharray:4 3\"/><text x=\"224\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">float (slack)</text><text x=\"320\" y=\"309\" class=\"s-s\" style=\"font-size:11px\">proyek selesai hari ke-22</text></svg><figcaption>Kasus ilustrasi. Fast tracking: hubungan E → F diubah dari FS menjadi SS dengan lag 3 hari. Float aktivitas lain tidak digambar.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok · 15 menit</span></div><h2>Jadwal proyek mitra di aplikasi</h2><div class=\"cols\"><div><ol><li>Masukkan aktivitas, durasi, dan pendahulu proyek mitra (dari Pertemuan 6) ke aplikasi.</li><li>Tambahkan summary task sesuai WBS dan milestone penting.</li><li>Cocokkan jalur kritis aplikasi dengan hitungan manual.</li><li>Bandingkan tanggal selesai dengan batas waktu di charter.</li><li>Bila melewati batas: pilih crashing atau fast tracking, tulis dampaknya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Masuk ke laporan Tugas 1C</h3><ul><li>Gantt chart (ekspor PDF/gambar yang terbaca)</li><li>Tabel ES, EF, LS, LF, float</li><li>Kompresi: durasi baru dan dampak biaya atau risiko</li><li>Konsisten dengan charter dan WBS</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Presentasi</span><span>Tugas 1C · rencana proyek terpadu</span></div><h2>Presentasi rencana proyek</h2><div class=\"cols\"><div><p><b>Alur yang disarankan</b> (maks. 10 slide):</p><ol><li>Mitra, masalah, dan business case</li><li>Charter: tujuan, kriteria keberhasilan, anggaran</li><li>Lingkup dan WBS</li><li>Jaringan, jalur kritis, Gantt chart</li><li>Kompresi jadwal dan risikonya</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Ketentuan</h3><ul><li>Waktu per kelompok diumumkan dosen sesuai jumlah kelompok.</li><li>Semua anggota siap menjawab.</li><li>Kelompok lain menilai dengan lembar sejawat (formatif).</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai presentasi kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p7-pres-peer&quot;,&quot;title&quot;:&quot;Penilaian sejawat · presentasi rencana proyek Tugas 1 (MPSI P7)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 4 · SI Koperasi Pesantren&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik dari presentasi&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. Tanggal selesai di Gantt berbeda dengan charter…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:9,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:13,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:17,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Rencana terpadu dan konsisten&quot;,&quot;ind&quot;:&quot;Tugas 1 (C6)&quot;,&quot;d&quot;:[&quot;Bagian-bagian tidak berhubungan.&quot;,&quot;Ada beberapa angka atau tanggal yang bertentangan.&quot;,&quot;Umumnya konsisten; satu ketidakcocokan kecil.&quot;,&quot;Masalah, tujuan, lingkup, anggaran, dan tanggal konsisten.&quot;]},{&quot;t&quot;:&quot;Jaringan dan jalur kritis&quot;,&quot;ind&quot;:&quot;Indikator 1–3&quot;,&quot;d&quot;:[&quot;Tidak ditunjukkan.&quot;,&quot;Ditunjukkan tanpa penjelasan hitungan.&quot;,&quot;Jalur kritis benar; float belum dijelaskan.&quot;,&quot;Jalur kritis dan float benar serta dijelaskan artinya.&quot;]},{&quot;t&quot;:&quot;Gantt chart di aplikasi&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak ada atau bukan dari aplikasi.&quot;,&quot;Ada, tetapi tidak terbaca atau tidak lengkap.&quot;,&quot;Lengkap; satu unsur kurang (mis. milestone).&quot;,&quot;Lengkap, terbaca, dan sama dengan hitungan manual.&quot;]},{&quot;t&quot;:&quot;Kompresi jadwal&quot;,&quot;ind&quot;:&quot;Indikator 5&quot;,&quot;d&quot;:[&quot;Tidak dibahas.&quot;,&quot;Disebut tanpa dasar.&quot;,&quot;Diterapkan pada jalur kritis; dampak kurang jelas.&quot;,&quot;Diterapkan pada jalur kritis dengan durasi baru dan dampak biaya atau risiko.&quot;]},{&quot;t&quot;:&quot;Penyampaian dan tanya jawab&quot;,&quot;ind&quot;:&quot;Tugas 1 (C6)&quot;,&quot;d&quot;:[&quot;Membaca slide; pertanyaan tidak terjawab.&quot;,&quot;Kurang runtut; jawaban kurang tepat.&quot;,&quot;Runtut; sebagian jawaban kurang tepat.&quot;,&quot;Runtut, tepat waktu, dan menjawab dengan tepat.&quot;]}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Gantt chart</b> menampilkan aktivitas, durasi, dependensi, milestone, dan jalur kritis pada sumbu waktu.</li><li>Aplikasi menghitung tanggal dari <b>kalender proyek</b>; hasilnya harus sama dengan hitungan manual.</li><li><b>Baseline</b> disimpan sebagai pembanding kemajuan.</li><li><b>Crashing</b>: tekan aktivitas kritis termurah, hitung ulang tiap langkah; biaya naik.</li><li><b>Fast tracking</b>: tumpang tindihkan aktivitas kritis; risiko pengerjaan ulang naik.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p7-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Gantt chart menampilkan…&quot;,&quot;o&quot;:[&quot;Aktivitas sebagai batang pada sumbu waktu&quot;,&quot;Hanya urutan aktivitas tanpa waktu&quot;,&quot;Struktur pemecahan lingkup proyek&quot;,&quot;Daftar pemangku kepentingan&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Gantt chart menampilkan aktivitas sebagai batang sesuai tanggal mulai dan selesainya; urutan logis lebih jelas di network diagram, pemecahan lingkup di WBS.&quot;},{&quot;q&quot;:&quot;Crashing adalah…&quot;,&quot;o&quot;:[&quot;Mengurangi lingkup agar cepat selesai&quot;,&quot;Menambah sumber daya pada aktivitas kritis untuk memperpendek durasinya dengan biaya tambahan&quot;,&quot;Menumpangtindihkan aktivitas yang biasanya berurutan&quot;,&quot;Menunda aktivitas yang punya float&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Crashing memperpendek aktivitas kritis dengan menambah sumber daya; biaya naik, lingkup tetap.&quot;},{&quot;q&quot;:&quot;Aktivitas kritis A (Rp1,5 jt/hari), B (Rp1,0 jt/hari), E (Rp0,8 jt/hari), dan aktivitas tidak kritis D (Rp0,3 jt/hari). Mana yang ditekan lebih dulu?&quot;,&quot;o&quot;:[&quot;D&quot;,&quot;E&quot;,&quot;B&quot;,&quot;A&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Pilih aktivitas kritis termurah. D lebih murah, tetapi tidak kritis sehingga tidak mempercepat proyek.&quot;},{&quot;q&quot;:&quot;Risiko utama fast tracking adalah…&quot;,&quot;o&quot;:[&quot;Biaya lembur pasti naik&quot;,&quot;Pengerjaan ulang karena aktivitas dikerjakan sebelum pendahulunya selesai&quot;,&quot;Jalur kritis hilang&quot;,&quot;Lingkup proyek bertambah&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Fast tracking mengerjakan aktivitas secara tumpang tindih; bila hasil pendahulu berubah, pekerjaan penerus harus diulang.&quot;},{&quot;q&quot;:&quot;Aktivitas D punya float 7 hari. Bila D dipangkas 1 hari dengan crashing, durasi proyek…&quot;,&quot;o&quot;:[&quot;Turun 1 hari&quot;,&quot;Turun 7 hari&quot;,&quot;Tidak berubah, biaya naik&quot;,&quot;Naik 1 hari&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;D tidak kritis, jadi memangkasnya hanya menambah biaya tanpa mempercepat proyek.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas 1C dan persiapan UTS</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Kumpulkan Tugas 1C</h3><ul><li>Laporan rencana proyek terpadu (PDF, maks. 35 halaman) dan slide presentasi.</li><li>Gantt chart dari aplikasi, tabel CPM, dan kompresi jadwal.</li><li>Tugas 1A dan 1B yang sudah disempurnakan.</li></ul><p style=\"margin:.4em 0 0\">Tenggat di Elin: <b>Senin, 2 November 2026, 23.59 WIB</b>. Setiap anggota mengunggah berkas yang sama.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Persiapan UTS (Pertemuan 8)</h3><p>Materi Pertemuan 1–7 (Sub-CPMK-1 sampai 4). Ulangi rangkuman dan kuis tiap pertemuan, latihan NPV/ROI/payback, WBS, dan CPM.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Gantt chart</span></dt><dd>Bagan batang yang menampilkan aktivitas proyek beserta tanggal mulai dan selesainya pada sumbu waktu. <i>(bagan Gantt)</i></dd></div><div><dt><span class=\"en\">Summary task</span></dt><dd>Baris induk di aplikasi jadwal yang merangkum beberapa aktivitas di bawahnya, biasanya sesuai cabang WBS. <i>(tugas ringkasan)</i></dd></div><div><dt><span class=\"en\">Milestone</span></dt><dd>Titik penting dalam jadwal proyek yang menandai selesainya hasil atau fase tertentu; durasinya nol. <i>(tonggak proyek)</i></dd></div><div><dt><span class=\"en\">Project calendar</span></dt><dd>Kalender hari dan jam kerja yang dipakai aplikasi untuk mengubah durasi menjadi tanggal. <i>(kalender proyek)</i></dd></div><div><dt><span class=\"en\">Schedule baseline</span></dt><dd>Versi jadwal yang sudah disetujui dan disimpan sebagai pembanding untuk memantau kemajuan. <i>(baseline jadwal)</i></dd></div><div><dt><span class=\"en\">Slack</span></dt><dd>Istilah lain untuk float di aplikasi seperti MS Project dan ProjectLibre: kelonggaran waktu sebuah aktivitas. <i>(kelonggaran (float))</i></dd></div><div><dt><span class=\"en\">Critical path</span></dt><dd>Rangkaian aktivitas terpanjang dalam jaringan proyek; panjangnya menentukan durasi proyek tersingkat. <i>(jalur kritis)</i></dd></div><div><dt><span class=\"en\">Schedule compression</span></dt><dd>Teknik memperpendek jadwal tanpa mengurangi lingkup, terutama crashing dan fast tracking. <i>(kompresi jadwal)</i></dd></div><div><dt><span class=\"en\">Crashing</span></dt><dd>Memperpendek durasi aktivitas di jalur kritis dengan menambah sumber daya, dengan biaya tambahan sekecil mungkin. <i>(percepatan dengan tambahan sumber daya)</i></dd></div><div><dt><span class=\"en\">Crash cost per day</span></dt><dd>Tambahan biaya untuk memperpendek satu aktivitas sebanyak satu hari; dipakai untuk memilih aktivitas yang ditekan lebih dulu. <i>(biaya percepatan per hari)</i></dd></div><div><dt><span class=\"en\">Fast tracking</span></dt><dd>Mengerjakan sebagian aktivitas secara paralel atau tumpang tindih padahal biasanya berurutan; risikonya pengerjaan ulang. <i>(pengerjaan tumpang tindih)</i></dd></div><div><dt><span class=\"en\">Rework</span></dt><dd>Pekerjaan yang harus diulang karena hasil sebelumnya salah atau berubah. <i>(pengerjaan ulang)</i></dd></div><div><dt><span class=\"en\">Lead dan lag</span></dt><dd>Lead: aktivitas penerus boleh mulai lebih awal sebelum pendahulu selesai. Lag: ada jeda tunggu antara dua aktivitas. <i>(percepatan dan jeda)</i></dd></div><div><dt><span class=\"en\">Total float</span></dt><dd>Lama waktu sebuah aktivitas boleh tertunda tanpa memundurkan tanggal selesai proyek; dihitung LS − ES. <i>(kelonggaran total)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 8 (UTS).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"Manajemen Biaya","subtitle":"Teknik estimasi, komponen biaya proyek SI, bottom-up estimating, cadangan, dan cost baseline","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 9</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Biaya</h1><p class=\"lead\">Dari WBS ke estimasi biaya, cadangan, dan cost baseline</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Sub-CPMK</b>5 · satu pertemuan</div><div><b>Hari ini</b>Estimasi biaya + persiapan Tugas 2A</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun estimasi biaya dan cost baseline proyek SI (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1–3)</span></h3><ol><li>Ketepatan memilih teknik estimasi biaya.</li><li>Kelengkapan komponen biaya proyek SI (SDM, perangkat, lisensi, cloud, pelatihan).</li><li>Ketepatan menyusun cost baseline dan cadangan kontingensi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 2: 5%, lewat Tugas 2A yang diumumkan di Pertemuan 10) dan Tes Tulis (UAS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 7 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Crashing modul tagihan dari 25 ke 22 hari menambah biaya berapa, dan mengapa biayanya naik?</li><li>Apa gunanya menyimpan baseline jadwal?</li><li>Durasi aktivitas di Pertemuan 6 diestimasi dengan teknik apa saja?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Alur manajemen biaya</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen biaya: rencanakan manajemen biaya, estimasi biaya, dan tetapkan anggaran atau cost baseline dibahas hari ini di Pertemuan 9; kendalikan biaya dengan earned value management di Pertemuan 15.\"><defs><marker id=\"pc9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"20\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"115\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Rencanakan</text><text x=\"115\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">satuan, ketelitian, aturan</text><line x1=\"211\" y1=\"72\" x2=\"233\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pc9)\"/><rect x=\"235\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"330\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Estimasi biaya</text><text x=\"330\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">teknik, komponen, dasar estimasi</text><line x1=\"426\" y1=\"72\" x2=\"448\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pc9)\"/><rect x=\"450\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"545\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Tetapkan anggaran</text><text x=\"545\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">cadangan, cost baseline, kurva S</text><line x1=\"641\" y1=\"72\" x2=\"663\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pc9)\"/><rect x=\"665\" y=\"30\" width=\"190\" height=\"84\" rx=\"10\" class=\"s-box\"/><text x=\"760\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kendalikan biaya</text><text x=\"760\" y=\"90\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">EVM, perubahan</text><text x=\"235\" y=\"150\" class=\"s-hd\">HARI INI ································································</text><text x=\"665\" y=\"150\" class=\"s-s\">PERTEMUAN 15</text></svg><figcaption>Alur manajemen biaya dalam mata kuliah ini, dirangkum dari pembahasan project cost management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pembuka</span><span>Diskusi 3 menit</span></div><h2>Berapa biaya modul tagihan?</h2><div class=\"cols\"><div><p class=\"lead\">Pengasuh Pesantren Al-Hikmah bertanya: <b>\"Modul tagihan itu habis berapa?\"</b></p><p>Tiga anggota tim menjawab berbeda:</p><ul><li>Ani: \"Proyek pesantren tetangga tahun lalu Rp20 juta, ya sekitar itu.\"</li><li>Budi: \"Tiga fitur × Rp7 juta per fitur = Rp21 juta.\"</li><li>Citra: \"Belum tahu. Saya hitung per aktivitas dari WBS dulu.\"</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Pertanyaan</h3><p>Jawaban siapa yang paling cocok untuk:</p><ol><li>rapat yayasan besok pagi?</li><li>dana yang akan dicairkan bendahara per tahap?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Tiga jenis estimasi biaya</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Jenis</th><th>Kapan dibuat</th><th>Kegunaan</th><th>Rentang ketelitian</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"rom-estimate\">Rough order of magnitude</button></b></td><td>Sangat awal, lingkup belum rinci</td><td>Seleksi proyek, keputusan awal</td><td>−50% s.d. +100%</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"budgetary-estimate\">Budgetary</button></b></td><td>Awal, saat menyusun anggaran organisasi</td><td>Memasukkan proyek ke anggaran</td><td>−10% s.d. +25%</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"definitive-estimate\">Definitive</button></b></td><td>Setelah WBS dan jadwal rinci</td><td>Pembelian, cost baseline</td><td>−5% s.d. +10%</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.84em;margin-top:.5em\">Rentang menurut Schwalbe (2019). Makin rinci lingkupnya, makin sempit rentangnya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Teknik estimasi biaya</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"analogous\">Analogous</button></h3><p>Dari biaya proyek serupa. Cepat, butuh proyek pembanding yang benar-benar mirip.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg><button type=\"button\" class=\"term\" data-term=\"parametric\">Parametric</button></h3><p>Jumlah × tarif satuan, mis. hari kerja × tarif harian, GB × harga cloud.</p></div></div><div class=\"cols\" style=\"margin-top:.6em\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"bottom-up\">Bottom-up</button></h3><p>Hitung tiap work package atau aktivitas, lalu jumlahkan. Paling teliti, butuh WBS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"three-point\">Three-point</button></h3><p>(o + 4m + p) / 6 untuk biaya yang tidak pasti, sama seperti durasi di Pertemuan 6.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Semua teknik perlu <button type=\"button\" class=\"term\" data-term=\"basis-of-estimates\">dasar estimasi</button> tertulis. Dirangkum dari Schwalbe (2019) dan Kerzner (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Indikator 1 · pilih tindakan</span></div><h2>Teknik mana yang dipakai?</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;p9-tech&quot;,&quot;start&quot;:&quot;s&quot;,&quot;ask&quot;:&quot;Teknik apa yang Anda pakai?&quot;,&quot;nodes&quot;:{&quot;s&quot;:{&quot;text&quot;:&quot;Minggu pertama proyek SI Pesantren Al-Hikmah. WBS belum ada. Besok pagi ada rapat yayasan.&quot;,&quot;say&quot;:[[&quot;Pengasuh&quot;,&quot;Kira-kira modul tagihan butuh berapa? Saya perlu angka untuk rapat besok.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Memakai biaya modul serupa di pesantren tetangga tahun lalu, lalu menyebutnya sebagai perkiraan kasar dengan rentangnya.&quot;,&quot;tag&quot;:&quot;Analogous + rentang&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Waktunya sempit dan WBS belum ada. Menyebut rentang menjaga harapan pengasuh tetap realistis.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Menyusun estimasi bottom-up lengkap malam ini.&quot;,&quot;tag&quot;:&quot;Bottom-up semalam&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;WBS belum ada, jadi \\&quot;bottom-up\\&quot; semalam hanya tebakan yang tampak rinci. Ketelitian palsu lebih berbahaya daripada perkiraan kasar yang jujur.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Menyebut satu angka pasti agar pengasuh yakin.&quot;,&quot;tag&quot;:&quot;Angka pasti&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Angka pasti di tahap ini mudah dianggap janji. Bila nanti meleset, kepercayaan sponsor turun.&quot;,&quot;to&quot;:&quot;b&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Dua bulan kemudian WBS dan jadwal sudah disetujui. Bendahara yayasan akan mencairkan dana per tahap.&quot;,&quot;say&quot;:[[&quot;Bendahara&quot;,&quot;Saya perlu rincian biaya per bagian pekerjaan, bukan angka total saja.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Menghitung biaya tiap aktivitas dari sumber daya × tarif × durasi, lalu menjumlahkannya per work package.&quot;,&quot;tag&quot;:&quot;Bottom-up&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Rincian per work package memudahkan pencairan per tahap dan pengendalian.&quot;,&quot;to&quot;:&quot;c&quot;},{&quot;t&quot;:&quot;Memakai angka analogous yang dulu dibawa ke rapat yayasan.&quot;,&quot;tag&quot;:&quot;Analogous lagi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Terlalu kasar untuk pencairan per tahap; tidak ada rincian per bagian pekerjaan.&quot;,&quot;to&quot;:&quot;c&quot;}]},&quot;c&quot;:{&quot;text&quot;:&quot;Tim perlu memperkirakan biaya notifikasi WhatsApp tagihan selama setahun. Penyedia layanan memberi tarif per pesan.&quot;,&quot;ask&quot;:&quot;Bagaimana menghitungnya?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Tarif per pesan × jumlah wali santri × 12 bulan.&quot;,&quot;tag&quot;:&quot;Parametric&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Ada tarif satuan yang jelas dan jumlah yang dapat dihitung.&quot;,&quot;to&quot;:&quot;endGood&quot;},{&quot;t&quot;:&quot;Bertanya kepada teman berapa biayanya dulu.&quot;,&quot;tag&quot;:&quot;Tebakan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Pendapat ahli boleh sebagai pembanding, tetapi di sini data tarif sudah ada; parametric lebih dapat dipertanggungjawabkan.&quot;,&quot;to&quot;:&quot;endMid&quot;}]},&quot;endGood&quot;:{&quot;end&quot;:&quot;Teknik dipilih sesuai tahap proyek dan data yang tersedia: analogous untuk keputusan awal, bottom-up untuk anggaran rinci, parametric bila ada tarif satuan.&quot;,&quot;title&quot;:&quot;Pilihan tepat&quot;,&quot;k&quot;:&quot;good&quot;},&quot;endMid&quot;:{&quot;end&quot;:&quot;Hampir tepat. Ingat: pilih teknik yang datanya tersedia dan paling dapat dipertanggungjawabkan.&quot;,&quot;title&quot;:&quot;Cukup&quot;,&quot;k&quot;:&quot;mid&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Komponen biaya proyek SI</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>SDM</h3><p>Analis, programmer, desainer, tester, manajer proyek: orang × hari × tarif.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Perangkat</h3><p>Komputer, printer, jaringan, perangkat pendukung di lokasi mitra.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Lisensi</h3><p>Perangkat lunak, pustaka, basis data. Bila gratis (sumber terbuka), tetap ditulis Rp0 dengan alasan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Cloud</h3><p>Hosting, server staging, domain, penyimpanan; sering berlangganan per bulan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pelatihan</h3><p>Pelatih, modul, konsumsi, pendampingan setelah go-live.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Sering terlupa</h3><p>Migrasi data, transport ke mitra, komunikasi, dokumentasi, perbaikan setelah uji.</p></div></div><p class=\"muted\" style=\"font-size:.84em;margin-top:.5em\">Bedakan <button type=\"button\" class=\"term\" data-term=\"direct-cost\">biaya langsung</button> dan <button type=\"button\" class=\"term\" data-term=\"indirect-cost\">tidak langsung</button>; <button type=\"button\" class=\"term\" data-term=\"sunk-cost\">sunk cost</button> tidak dihitung ulang. Dirangkum dari Schwalbe (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Indikator 2 · data ilustrasi, Rp juta</span></div><h2>Estimasi biaya modul tagihan</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.8em\"><thead><tr><th>Aktivitas</th><th>Sumber daya</th><th>SDM</th><th>Non-SDM</th><th>Total</th></tr></thead><tbody><tr><td>A · Analisis</td><td>1 analis × 5 hari</td><td>2,5</td><td>–</td><td><b>2,5</b></td></tr><tr><td>B · Desain DB</td><td>1 analis × 4 hari</td><td>2,0</td><td>–</td><td><b>2,0</b></td></tr><tr><td>C · Desain UI</td><td>1 desainer UI × 3 hari</td><td>1,2</td><td>–</td><td><b>1,2</b></td></tr><tr><td>D · Migrasi data</td><td>1 programmer × 4 hari</td><td>1,6</td><td>–</td><td><b>1,6</b></td></tr><tr><td>E · Fitur tagihan</td><td>2 programmer × 6 hari</td><td>4,8</td><td>0,6 <span class=\"muted\">(cloud staging 2 bulan)</span></td><td><b>5,4</b></td></tr><tr><td>F · Catat bayar</td><td>2 programmer × 5 hari</td><td>4,0</td><td>1,5 <span class=\"muted\">(printer kuitansi)</span></td><td><b>5,5</b></td></tr><tr><td>G · Uji modul</td><td>1 tester + 1 programmer × 3 hari</td><td>2,1</td><td>–</td><td><b>2,1</b></td></tr><tr><td>H · Pelatihan</td><td>1 pelatih × 2 hari</td><td>0,7</td><td>0,5 <span class=\"muted\">(konsumsi dan modul cetak)</span></td><td><b>1,2</b></td></tr><tr><td colspan=\"4\"><b>Total estimasi aktivitas</b> <span class=\"muted\">(lisensi Rp0: tumpukan sumber terbuka)</span></td><td><b>21,5</b></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Tarif per hari: analis Rp500 rb, programmer Rp400 rb, desainer UI Rp400 rb, tester Rp300 rb, pelatih Rp350 rb. Durasi dari Pertemuan 6.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 1 dan 3 · tekan Play atau klik langkah</span></div><h2>Bottom-up dari WBS</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p9-bu&quot;,&quot;ms&quot;:4200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Mulai dari WBS&quot;,&quot;en&quot;:&quot;work package&quot;,&quot;d&quot;:&quot;Ambil work package dan aktivitas dari WBS dan jadwal. Estimasi dibuat per aktivitas, bukan per proyek.&quot;,&quot;ex&quot;:&quot;Modul tagihan: 8 aktivitas (A–H) dari 6 work package.&quot;},{&quot;t&quot;:&quot;Sumber daya dan tarif&quot;,&quot;en&quot;:&quot;resource rate&quot;,&quot;d&quot;:&quot;Tentukan siapa mengerjakan, berapa orang, berapa hari, dan tarif harian. Tulis sumber tarifnya.&quot;,&quot;ex&quot;:&quot;E: 2 programmer × 6 hari × Rp400 rb.&quot;},{&quot;t&quot;:&quot;Hitung SDM&quot;,&quot;en&quot;:&quot;labor cost&quot;,&quot;d&quot;:&quot;Orang × hari × tarif.&quot;,&quot;ex&quot;:&quot;E: 2 × 6 × 0,4 = Rp4,8 juta.&quot;},{&quot;t&quot;:&quot;Tambah non-SDM&quot;,&quot;en&quot;:&quot;non-labor&quot;,&quot;d&quot;:&quot;Tambahkan perangkat, lisensi, cloud, dan bahan yang dipakai aktivitas itu.&quot;,&quot;ex&quot;:&quot;E: + cloud staging Rp0,6 juta = Rp5,4 juta.&quot;},{&quot;t&quot;:&quot;Jumlahkan ke atas&quot;,&quot;en&quot;:&quot;roll up&quot;,&quot;d&quot;:&quot;Jumlahkan aktivitas ke work package, lalu ke total proyek.&quot;,&quot;ex&quot;:&quot;1.3.1 (A+B+C) = 2,5 + 2,0 + 1,2 = Rp5,7 juta. Total delapan aktivitas Rp21,5 juta.&quot;},{&quot;t&quot;:&quot;Catat dasar estimasi&quot;,&quot;en&quot;:&quot;basis of estimates&quot;,&quot;d&quot;:&quot;Tulis asumsi dan sumber angka agar estimasi dapat diperiksa dan diperbarui.&quot;,&quot;ex&quot;:&quot;\\&quot;Tarif programmer dari penawaran dua pengembang lepas di Sidoarjo, Oktober 2026.\\&quot;&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Cadangan: dua jenis</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"contingency-reserve\">Cadangan kontingensi</button></h3><p>Untuk risiko yang <b>sudah diketahui</b> (known-unknowns). Dihitung dari daftar risiko. <b>Masuk</b> cost baseline.</p><p style=\"font-size:.85em\">Modul tagihan: R1 migrasi data 1,2 + R2 harga printer 0,3 + R3 pelatihan tambahan 0,5 = Rp2,0 jt.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/></svg><button type=\"button\" class=\"term\" data-term=\"management-reserve\">Cadangan manajemen</button></h3><p>Untuk hal <b>tak terduga</b> yang masih dalam lingkup (unknown-unknowns). <b>Di luar</b> cost baseline; dipakai dengan persetujuan sponsor.</p><p style=\"font-size:.85em\">Ditetapkan pengasuh: Rp1,5 jt.</p></div></div><figure class=\"fig\"><svg viewBox=\"0 0 860 112\" style=\"max-height:8.5em\" role=\"img\" aria-label=\"Susunan anggaran modul tagihan: estimasi biaya aktivitas Rp21,5 juta ditambah cadangan kontingensi Rp2,0 juta menjadi cost baseline Rp23,5 juta; ditambah cadangan manajemen Rp1,5 juta menjadi anggaran proyek Rp25,0 juta.\"><text x=\"140\" y=\"31\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:13px\">Cost baseline</text><rect x=\"150\" y=\"8\" width=\"404.20000000000005\" height=\"36\" class=\"s-box\"/><text x=\"352.1\" y=\"31\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\">Estimasi 21,5</text><rect x=\"554.2\" y=\"8\" width=\"37.59999999999991\" height=\"36\" class=\"s-acc\"/><text x=\"601.8\" y=\"31\" class=\"s-s\" style=\"font-size:12px\">= 23,5 (estimasi + kontingensi 2,0)</text><text x=\"140\" y=\"85\" text-anchor=\"end\" class=\"s-t\" style=\"font-size:13px\">Anggaran proyek</text><rect x=\"150\" y=\"62\" width=\"404.20000000000005\" height=\"36\" class=\"s-box\"/><text x=\"352.1\" y=\"85\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\">Estimasi 21,5</text><rect x=\"554.2\" y=\"62\" width=\"37.59999999999991\" height=\"36\" class=\"s-acc\"/><rect x=\"591.8\" y=\"62\" width=\"28.200000000000045\" height=\"36\" class=\"s-mr\" style=\"fill:var(--coral);stroke:var(--line);stroke-width:2.5\"/><text x=\"630\" y=\"85\" class=\"s-s\" style=\"font-size:12px\">= 25,0 (+ cadangan manajemen 1,5)</text></svg><figcaption>Kasus ilustrasi, Rp juta. Krem = kontingensi, koral = cadangan manajemen. Mengikuti pembahasan cost baseline dan reserves dalam PMI (2025) dan Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"cost-baseline\">Cost baseline</button></h2><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The approved version of the time-phased project budget, excluding any management reserves, which can be changed only through formal change control procedures and is used as a basis for comparison to actual results.\"</p><p class=\"tr\">\"Versi yang disetujui dari anggaran proyek bertahap waktu, tidak termasuk cadangan manajemen, yang hanya dapat diubah melalui prosedur pengendalian perubahan formal dan digunakan sebagai dasar pembanding terhadap hasil aktual.\"</p><div class=\"src\">PMI, definisi cost baseline</div></blockquote><ul class=\"lead\" style=\"margin-top:.5em\"><li><b>Bertahap waktu</b>: dibagi per minggu atau bulan mengikuti jadwal.</li><li><b>Tanpa cadangan manajemen.</b></li><li><b>Pembanding</b> biaya aktual di Pertemuan 15.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 3 · tekan Play atau klik langkah</span></div><h2>Menyusun cost baseline modul tagihan</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p9-base&quot;,&quot;ms&quot;:4200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Total estimasi&quot;,&quot;en&quot;:&quot;activity estimates&quot;,&quot;d&quot;:&quot;Jumlah estimasi bottom-up delapan aktivitas.&quot;,&quot;ex&quot;:&quot;Rp21,5 juta.&quot;},{&quot;t&quot;:&quot;Kontingensi&quot;,&quot;en&quot;:&quot;contingency&quot;,&quot;d&quot;:&quot;Tambahkan
