const GLOSSARY={"project":{"t":"Project","d":"Usaha sementara yang dilakukan untuk menghasilkan produk, layanan, atau hasil yang unik.","id":"proyek"},"operations":{"t":"Operations","d":"Pekerjaan rutin yang berjalan terus-menerus untuk mempertahankan layanan organisasi.","id":"operasional / kegiatan rutin"},"program":{"t":"Program","d":"Sekumpulan proyek (dan kegiatan) yang saling terkait dan dikelola terkoordinasi agar manfaatnya lebih besar daripada bila dikelola sendiri-sendiri.","id":"program"},"portfolio":{"t":"Portfolio","d":"Kumpulan proyek, program, dan operasi yang dikelola bersama untuk mencapai tujuan strategis organisasi.","id":"portofolio"},"project-management":{"t":"Project management","d":"Penerapan pengetahuan, keterampilan, alat, dan teknik pada kegiatan proyek agar memenuhi kebutuhan proyek.","id":"manajemen proyek"},"deliverable":{"t":"Deliverable","d":"Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek.","id":"luaran / hasil serahan"},"stakeholder":{"t":"Stakeholder","d":"Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek.","id":"pemangku kepentingan"},"triple-constraint":{"t":"Triple constraint","d":"Tiga batasan klasik proyek: lingkup (scope), waktu (time), dan biaya (cost) yang saling memengaruhi.","id":"tiga batasan proyek"},"life-cycle":{"t":"Project life cycle","d":"Rangkaian fase yang dilalui proyek dari awal sampai selesai.","id":"siklus hidup proyek"},"predictive":{"t":"Predictive approach","d":"Pendekatan yang menetapkan lingkup, jadwal, dan biaya sejak awal lalu mengerjakannya berurutan (sering disebut waterfall).","id":"pendekatan prediktif"},"adaptive":{"t":"Adaptive approach","d":"Pendekatan iteratif dan inkremental; kebutuhan diperinci bertahap dan hasil diserahkan dalam siklus pendek (mis. agile).","id":"pendekatan adaptif"},"hybrid":{"t":"Hybrid approach","d":"Gabungan unsur prediktif dan adaptif dalam satu proyek.","id":"pendekatan hibrida"},"principle":{"t":"Principle","d":"Pedoman dasar yang mengarahkan perilaku dan keputusan dalam mengelola proyek.","id":"prinsip"},"performance-domain":{"t":"Performance domain","d":"Kelompok kegiatan yang saling terkait dan penting bagi keberhasilan proyek. PMBOK Guide edisi ke-8 memuat tujuh domain.","id":"domain kinerja"},"focus-area":{"t":"Focus area","d":"Pengelompokan proses manajemen proyek menurut tahapnya: initiating, planning, executing, monitoring and controlling, closing.","id":"area fokus"},"project-manager":{"t":"Project manager","d":"Orang yang ditugaskan organisasi untuk memimpin tim dan bertanggung jawab mencapai tujuan proyek.","id":"manajer proyek"},"scope-creep":{"t":"Scope creep","d":"Bertambahnya lingkup proyek sedikit demi sedikit tanpa pengendalian (tanpa penyesuaian waktu, biaya, dan sumber daya).","id":"melebarnya lingkup"},"governance":{"t":"Governance","d":"Kerangka kewenangan, akuntabilitas, dan pengambilan keputusan yang mengarahkan proyek.","id":"tata kelola"},"business-case":{"t":"Business case","d":"Dokumen yang menjelaskan alasan bisnis sebuah proyek: masalah atau peluang, pilihan solusi, analisis biaya-manfaat, dan rekomendasi.","id":"kajian kelayakan bisnis"},"feasibility":{"t":"Feasibility study","d":"Kajian untuk menilai apakah sebuah proyek layak dijalankan dari sisi teknis, operasional, dan ekonomi.","id":"studi kelayakan"},"npv":{"t":"Net present value (NPV)","d":"Selisih nilai sekarang seluruh manfaat dan seluruh biaya proyek setelah didiskonto. NPV positif berarti proyek menghasilkan nilai.","id":"nilai sekarang bersih"},"roi":{"t":"Return on investment (ROI)","d":"Perbandingan manfaat bersih terhadap biaya investasi, dinyatakan dalam persen.","id":"tingkat pengembalian investasi"},"payback":{"t":"Payback period","d":"Lama waktu sampai manfaat kumulatif menutup biaya kumulatif proyek.","id":"periode pengembalian"},"discount-rate":{"t":"Discount rate","d":"Tingkat bunga yang dipakai untuk mengubah uang di masa depan menjadi nilai sekarang; sering disebut juga required rate of return.","id":"tingkat diskonto"},"discount-factor":{"t":"Discount factor","d":"Pengali untuk mengubah nilai tahun ke-t menjadi nilai sekarang: 1/(1+r)^t.","id":"faktor diskonto"},"weighted-scoring":{"t":"Weighted scoring model","d":"Alat seleksi proyek yang memberi skor pada beberapa kriteria berbobot, lalu menjumlahkannya.","id":"model skor berbobot"},"project-charter":{"t":"Project charter","d":"Dokumen yang secara resmi mengesahkan proyek dan memberi wewenang kepada manajer proyek.","id":"piagam proyek"},"sponsor":{"t":"Sponsor","d":"Orang atau kelompok yang menyediakan sumber daya dan dukungan bagi proyek serta bertanggung jawab atas keberhasilannya.","id":"sponsor / penyandang proyek"},"opportunity-cost":{"t":"Opportunity cost of capital","d":"Imbal hasil yang hilang karena dana dipakai untuk proyek ini, bukan untuk alternatif lain.","id":"biaya peluang modal"}};
const QUOTES=[{"q":"Plans are worthless, but planning is everything.","a":"Dwight D. Eisenhower","s":"Remarks at the National Defense Executive Reserve Conference, 14 Nov 1957 (Public Papers of the Presidents, 1957)"},{"q":"Adding manpower to a late software project makes it later.","a":"Frederick P. Brooks Jr.","s":"The Mythical Man-Month, 1975"},{"q":"How does a project get to be a year late? One day at a time.","a":"Frederick P. Brooks Jr.","s":"The Mythical Man-Month, 1975, ch. 14"},{"q":"You can't control what you can't measure.","a":"Tom DeMarco","s":"Controlling Software Projects, 1982"},{"q":"Responding to change over following a plan.","a":"Beck, Beedle, van Bennekum, et al.","s":"Manifesto for Agile Software Development, 2001"},{"q":"O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow.","a":"Al-Qur'an, Al-Hasyr 59:18","s":"Sahih International translation"}];
const MEETINGS=[{"no":1,"title":"Konsep Manajemen Proyek SI","subtitle":"Proyek, siklus hidup, prinsip, dan domain kinerja PMBOK Guide","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Konsep Manajemen Proyek SI</h1><p class=\"lead\">Proyek, siklus hidup, prinsip, dan domain kinerja PMBOK Guide</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>5 · 3 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep, siklus hidup, prinsip, dan domain kinerja manajemen proyek SI (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan membedakan proyek, program, portofolio, dan operasi.</li><li>Ketepatan menjelaskan siklus hidup proyek prediktif, adaptif, dan hybrid.</li><li>Ketepatan menjelaskan prinsip dan domain kinerja PMBOK Guide.</li><li>Ketepatan mengidentifikasi penyebab kegagalan proyek SI dari kasus.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 3 SKS · Project Based Learning</span></div><h2>Satu semester, satu proyek nyata</h2><p>Setiap kelompok mengelola <b>satu proyek SI untuk mitra nyata</b> (UMKM, instansi pemerintah, perguruan tinggi, atau pesantren/lembaga NU) dari rencana sampai penutupan.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas 1 · Rencana proyek</h3><p>Business case, project charter, scope statement, WBS, dan jadwal dengan jalur kritis. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tugas 2 · Kendali &amp; penutupan</h3><p>Cost baseline, risk register, rencana mutu dan UAT, RACI dan simulasi sprint, laporan EVM, laporan penutupan, presentasi akhir.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tenggat tugas mengikuti jadwal proyek.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran jelas dan tercatat (<i>At Taawun</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Menjaga mitra</h3><p>Santun dan menepati janji kepada mitra proyek (<i>Al Amanah</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Data, laporan, dan progres apa adanya. Tidak menyalin karya kelompok lain (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Hambatan proyek segera disampaikan, jangan ditunda sampai tenggat.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Proyek atau bukan?</h2><div class=\"cols w\"><div><p class=\"lead\">Tandai mana yang <b>proyek</b> dan mana yang <b>kegiatan rutin</b>. Berikan alasan singkat.</p><ol><li>Membangun aplikasi kasir untuk UMKM keripik tempe</li><li>Mencetak slip gaji dosen setiap bulan</li><li>Menyelenggarakan wisuda ke-10 Unusida</li><li>Melayani helpdesk akun SIAKAD setiap hari</li><li>Memindahkan server kantor desa ke cloud</li><li>Mencadangkan (backup) database setiap malam</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Petunjuk</h3><p>Tanyakan dua hal: <b>Apakah ada titik selesainya?</b> dan <b>Apakah hasilnya baru/unik?</b></p><p class=\"muted\">Jawaban dibahas di slide berikutnya.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu proyek?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"project\">Proyek</button> adalah usaha yang bersifat sementara untuk menghasilkan produk, layanan, atau hasil yang unik.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(PMI, 2025, terjemahan bebas)</span></div></div><ul style=\"margin-top:.8em\"><li><b>Sementara</b>: punya awal dan akhir yang jelas, bukan berarti singkat.</li><li><b>Unik</b>: hasilnya berbeda dari yang pernah ada, walau mirip.</li><li>Menghasilkan <button type=\"button\" class=\"term\" data-term=\"deliverable\">deliverable</button> yang bernilai bagi organisasi.</li><li>Melibatkan <button type=\"button\" class=\"term\" data-term=\"stakeholder\">stakeholder</button> dan mendorong perubahan.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Bandingkan dengan <button type=\"button\" class=\"term\" data-term=\"operations\">operasi</button></h3><table class=\"t\"><tbody><tr><th></th><th>Proyek</th><th>Operasi</th></tr><tr><td>Waktu</td><td>ada akhir</td><td>terus-menerus</td></tr><tr><td>Hasil</td><td>unik</td><td>berulang</td></tr><tr><td>Tujuan</td><td>mengubah</td><td>menjaga layanan</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Portofolio, program, proyek, operasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 820 290\" role=\"img\" aria-label=\"Hierarki: portfolio organisasi berisi program, proyek mandiri, dan operasi. Program berisi beberapa proyek yang saling terkait. Hasil proyek diserahkan ke operasi untuk dijalankan rutin.\"><defs><marker id=\"pa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"10\" width=\"800\" height=\"56\" rx=\"12\" class=\"s-acc\"/><text x=\"410\" y=\"36\" text-anchor=\"middle\" class=\"s-t\">Portfolio · Transformasi digital Pemkab (ilustrasi)</text><text x=\"410\" y=\"55\" text-anchor=\"middle\" class=\"s-s\">dipilih dan diprioritaskan menurut strategi organisasi</text><rect x=\"10\" y=\"100\" width=\"380\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"200\" y=\"124\" text-anchor=\"middle\" class=\"s-t\">Program · Layanan publik terpadu</text><rect x=\"26\" y=\"136\" width=\"170\" height=\"34\" rx=\"8\" class=\"s-box\"/><text x=\"111\" y=\"158\" text-anchor=\"middle\" class=\"s-s\">A: aplikasi perizinan</text><rect x=\"206\" y=\"136\" width=\"170\" height=\"34\" rx=\"8\" class=\"s-box\"/><text x=\"291\" y=\"158\" text-anchor=\"middle\" class=\"s-s\">B: integrasi data NIK</text><rect x=\"410\" y=\"100\" width=\"190\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"505\" y=\"132\" text-anchor=\"middle\" class=\"s-t\">Proyek mandiri</text><text x=\"505\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">migrasi server ke cloud</text><rect x=\"620\" y=\"100\" width=\"190\" height=\"80\" rx=\"12\" class=\"s-box\"/><text x=\"715\" y=\"132\" text-anchor=\"middle\" class=\"s-t\">Operasi</text><text x=\"715\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">helpdesk, backup harian</text><line x1=\"200\" y1=\"68\" x2=\"200\" y2=\"98\" class=\"s-line\" marker-end=\"url(#pa)\"/><line x1=\"505\" y1=\"68\" x2=\"505\" y2=\"98\" class=\"s-line\" marker-end=\"url(#pa)\"/><line x1=\"715\" y1=\"68\" x2=\"715\" y2=\"98\" class=\"s-line\" marker-end=\"url(#pa)\"/><path d=\"M200 182 C200 250 715 250 715 184\" class=\"s-line\" marker-end=\"url(#pa)\"/><path d=\"M505 182 C505 220 690 220 700 186\" class=\"s-line\" marker-end=\"url(#pa)\"/><text x=\"420\" y=\"270\" text-anchor=\"middle\" class=\"s-s\">hasil proyek diserahkan (handover) ke operasi untuk dijalankan setiap hari</text></svg><figcaption>Hubungan portfolio, program, proyek, dan operasi, disusun berdasarkan definisi PMI (2025). Contoh instansi adalah ilustrasi.</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"portfolio\">Portfolio</button> = memilih pekerjaan yang <b>benar</b> · <button type=\"button\" class=\"term\" data-term=\"program\">Program</button> = mengoordinasikan proyek yang saling terkait · proyek = mengerjakan dengan <b>benar</b></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konteks</span><span>Proyek teknologi informasi</span></div><h2>Apa yang khas dari proyek SI?</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pemangku kepentingan beragam</h3><p>Pimpinan, staf pengguna, bagian keuangan, vendor, sampai masyarakat, dengan kepentingan yang sering berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Tim beragam</h3><p>Analis, programmer, desainer UI, admin jaringan, dan pengguna kunci dengan latar belakang berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Teknologi beragam &amp; cepat berubah</h3><p>Platform, bahasa, cloud, dan standar keamanan berganti cepat; keahlian tim ikut harus menyesuaikan.</p></div></div><p style=\"margin-top:.8em\">Ciri-ciri ini diuraikan Schwalbe <span class=\"cite\">(2019)</span>. Hasil proyek SI juga sering <b>tak kasatmata</b>: kemajuan kode dan data lebih sulit dilihat daripada kemajuan bangunan fisik.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Manajemen proyek dan tiga batasannya</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"project-management\">Manajemen proyek</button> adalah penerapan pengetahuan, keterampilan, alat, dan teknik pada kegiatan proyek agar memenuhi kebutuhan proyek.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(PMI, 2025, terjemahan bebas)</span></div></div><p style=\"margin-top:.8em\">Klasiknya, setiap proyek dibatasi <button type=\"button\" class=\"term\" data-term=\"triple-constraint\">triple constraint</button> <span class=\"cite\">(Schwalbe, 2019)</span>:</p><ul><li><b>Scope</b>: apa yang dikerjakan dan dihasilkan.</li><li><b>Time</b>: berapa lama.</li><li><b>Cost</b>: berapa biayanya.</li></ul><p class=\"muted\">Mengubah satu sisi hampir selalu memengaruhi sisi lain. Mutu dan kepuasan pemangku kepentingan menjadi ukuran keberhasilan di atasnya.</p></div><figure class=\"fig\"><svg viewBox=\"0 0 320 260\" role=\"img\" aria-label=\"Segitiga tiga batasan proyek: scope di puncak, time di kiri bawah, cost di kanan bawah; di tengah tertulis mutu dan nilai.\"><polygon points=\"160,20 20,230 300,230\" class=\"s-soft\"/><text x=\"160\" y=\"14\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope</text><text x=\"20\" y=\"252\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Time</text><text x=\"300\" y=\"252\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Cost</text><circle cx=\"160\" cy=\"160\" r=\"46\" class=\"s-acc\"/><text x=\"160\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mutu &amp;</text><text x=\"160\" y=\"174\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">nilai</text></svg><figcaption>Triple constraint (Schwalbe, 2019).</figcaption></figure></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Siklus hidup</span><span>Indikator 2</span></div><h2>Prediktif, adaptif, atau hybrid?</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 230\" role=\"img\" aria-label=\"Spektrum pendekatan pengembangan: di kiri prediktif dengan lingkup ditetapkan di awal dan fase berurutan; di tengah hybrid; di kanan adaptif dengan siklus pendek berulang dan kebutuhan diperinci bertahap.\"><defs><marker id=\"pl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"40\" y1=\"30\" x2=\"820\" y2=\"30\" class=\"s-line\" marker-end=\"url(#pl)\" marker-start=\"url(#pl)\"/><text x=\"40\" y=\"20\" class=\"s-hd\">LINGKUP JELAS DI AWAL</text><text x=\"820\" y=\"20\" text-anchor=\"end\" class=\"s-hd\">KEBUTUHAN BERUBAH-UBAH</text><rect x=\"20\" y=\"50\" width=\"250\" height=\"160\" rx=\"12\" class=\"s-soft\"/><text x=\"145\" y=\"76\" text-anchor=\"middle\" class=\"s-t\">Predictive</text><rect x=\"32\" y=\"92\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"54\" y=\"107\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Analisis</text><rect x=\"78\" y=\"106\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"100\" y=\"121\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Desain</text><rect x=\"124\" y=\"120\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"146\" y=\"135\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Bangun</text><rect x=\"170\" y=\"134\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"192\" y=\"149\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Uji</text><rect x=\"216\" y=\"148\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"238\" y=\"163\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Serah</text><text x=\"145\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">fase berurutan, satu kali serah</text><rect x=\"305\" y=\"50\" width=\"250\" height=\"160\" rx=\"12\" class=\"s-acc\"/><text x=\"430\" y=\"76\" text-anchor=\"middle\" class=\"s-t\">Hybrid</text><rect x=\"320\" y=\"96\" width=\"90\" height=\"26\" rx=\"4\" class=\"s-box\"/><text x=\"365\" y=\"113\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">rencana induk</text><circle cx=\"445\" cy=\"140\" r=\"16\" class=\"s-box\"/><circle cx=\"485\" cy=\"140\" r=\"16\" class=\"s-box\"/><circle cx=\"525\" cy=\"140\" r=\"16\" class=\"s-box\"/><line x1=\"410\" y1=\"110\" x2=\"430\" y2=\"132\" class=\"s-line\" marker-end=\"url(#pl)\"/><text x=\"430\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">kerangka prediktif + iterasi</text><rect x=\"590\" y=\"50\" width=\"250\" height=\"160\" rx=\"12\" class=\"s-soft\"/><text x=\"715\" y=\"76\" text-anchor=\"middle\" class=\"s-t\">Adaptive</text><circle cx=\"640\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"640\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">1</text><circle cx=\"690\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"690\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">2</text><circle cx=\"740\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"740\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">3</text><circle cx=\"790\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"790\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">4</text><text x=\"715\" y=\"176\" text-anchor=\"middle\" class=\"s-s\">siklus pendek berulang,</text><text x=\"715\" y=\"194\" text-anchor=\"middle\" class=\"s-s\">hasil diserahkan bertahap</text></svg><figcaption>Pendekatan pengembangan sebagai spektrum dari prediktif ke adaptif, diadaptasi dari PMI (2025) dan PMI &amp; Agile Alliance (2017).</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"predictive\">Predictive</button> cocok bila kebutuhan stabil · <button type=\"button\" class=\"term\" data-term=\"adaptive\">Adaptive</button> cocok bila kebutuhan belum pasti · <button type=\"button\" class=\"term\" data-term=\"hybrid\">Hybrid</button> menggabungkan keduanya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">PMBOK Guide ed. 8</span><span>Indikator 3</span></div><h2>Enam <button type=\"button\" class=\"term\" data-term=\"principle\">prinsip</button> manajemen proyek <span class=\"cite\">(PMI, 2025)</span></h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Adopt a holistic view</h3><p>Lihat proyek sebagai satu sistem: keputusan di satu bagian berdampak ke bagian lain.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Focus on value</h3><p>Ukur keberhasilan dari manfaat bagi organisasi, bukan sekadar \"fitur selesai\".</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Embed quality into processes and deliverables</h3><p>Mutu dirancang sejak awal, bukan diperiksa di akhir.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Be an accountable leader</h3><p>Memimpin dengan bertanggung jawab atas hasil, bukan hanya tugas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Integrate sustainability within all project areas</h3><p>Pertimbangkan dampak jangka panjang: lingkungan, sosial, dan keberlanjutan organisasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Build an empowered culture</h3><p>Bangun tim yang dipercaya, kolaboratif, dan berani menyampaikan masalah.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">PMBOK Guide ed. 8</span><span>Indikator 3</span></div><h2>Tujuh <button type=\"button\" class=\"term\" data-term=\"performance-domain\">domain kinerja</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 880 300\" role=\"img\" aria-label=\"Struktur PMBOK Guide edisi ke-8: enam prinsip sebagai dasar perilaku, tujuh domain kinerja yaitu Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk, dan lima focus areas yaitu Initiating, Planning, Executing, Monitoring and Controlling, Closing.\"><text x=\"10\" y=\"22\" class=\"s-hd\">6 PRINCIPLES · MENGAPA (pola pikir)</text><rect x=\"10\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"78\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Holistic view</text><rect x=\"155\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"223\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Focus on value</text><rect x=\"300\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"368\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Embed quality</text><rect x=\"445\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"513\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Accountable leader</text><rect x=\"590\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"658\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Sustainability</text><rect x=\"735\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"803\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Empowered culture</text><text x=\"10\" y=\"112\" class=\"s-hd\">7 PERFORMANCE DOMAINS · APA (area praktik)</text><rect x=\"10\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"68\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Governance</text><rect x=\"134\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"192\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Scope</text><rect x=\"258\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"316\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Schedule</text><rect x=\"382\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"440\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Finance</text><rect x=\"506\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"564\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Stakeholders</text><rect x=\"630\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"688\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Resources</text><rect x=\"754\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"812\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Risk</text><text x=\"10\" y=\"206\" class=\"s-hd\">5 FOCUS AREAS · BAGAIMANA (40 proses)</text><rect x=\"10\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"85\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Initiating</text><rect x=\"170\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"245\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Planning</text><rect x=\"330\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"405\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Executing</text><rect x=\"490\" y=\"216\" width=\"210\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"595\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Monitoring &amp; Controlling</text><rect x=\"710\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"785\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Closing</text><text x=\"440\" y=\"288\" text-anchor=\"middle\" class=\"s-s\">ketujuh domain bekerja bersamaan sepanjang proyek, bukan berurutan</text></svg><figcaption>Struktur PMBOK Guide edisi ke-8 (PMI, 2025): enam prinsip, tujuh domain kinerja, dan lima focus areas yang memuat 40 proses. Nama prinsip disingkat; nama lengkapnya ada di slide sebelumnya.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peran</span></div><h2>Apa kerja <button type=\"button\" class=\"term\" data-term=\"project-manager\">manajer proyek</button>?</h2><div class=\"cols\"><div><ul class=\"lead\"><li>Menyelaraskan proyek dengan <b>tujuan organisasi</b>.</li><li>Merencanakan, memantau, dan mengendalikan lingkup, jadwal, biaya, risiko.</li><li>Memimpin dan melindungi tim.</li><li>Berkomunikasi dengan sponsor, pengguna, dan vendor.</li><li>Mengambil keputusan dan bertanggung jawab atas hasil.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Bukan \"programmer paling senior\"</h3><p>Manajer proyek SI perlu paham teknologi, tetapi pekerjaan utamanya adalah <b>mengelola orang, keputusan, dan informasi</b>.</p><p class=\"muted\">Di kelompok Anda, satu orang akan berperan sebagai manajer proyek dan bertanggung jawab atas laporan progres.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Studi kasus</span><span>Instansi pemerintah · 2024</span></div><h2>Gangguan PDNS 2 Surabaya</h2><div class=\"cols w\"><div><ul><li>Juni 2024, Pusat Data Nasional Sementara (PDNS) 2 di Surabaya diserang <i>ransomware</i> Brain Cipher; pemerintah mengidentifikasi <b>282 instansi</b> yang terdampak <span class=\"cite\">(Antara, 2024)</span>.</li><li>Kepala BSSN menyatakan hanya sekitar <b>2%</b> data PDNS 2 yang tercadangkan di Batam, sehingga tidak bisa dipakai sebagai pusat pemulihan <span class=\"cite\">(Kompas.com, 2024)</span>.</li><li>Kepala BSSN menyebut permasalahan utamanya adalah <b>tata kelola</b> dan tidak adanya cadangan data <span class=\"cite\">(IDN Times, 2024)</span>.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Pertanyaan pemantik</h3><p>Ini kegagalan teknologi, atau kegagalan <b>manajemen</b>? Domain kinerja mana yang paling lemah?</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kasus</span><span>Kelompok 4–5 orang · 15 menit</span></div><h2>Bedah kasus proyek SI pemerintah</h2><div class=\"cols\"><div><p><b>Kasus pembanding: proyek e-KTP.</b> Proyek pengadaan e-KTP bernilai sekitar Rp5,9 triliun; hakim menetapkan kerugian negara sekitar Rp2,3 triliun akibat penggelembungan harga <span class=\"cite\">(Detik.com, 2017)</span>.</p><p class=\"lead\" style=\"margin-top:.6em\">Tugas kelompok:</p><ol><li>Pilih satu kasus (PDNS 2 atau e-KTP).</li><li>Identifikasi <b>tiga penyebab</b> masalah.</li><li>Petakan tiap penyebab ke <b>domain kinerja</b> dan <b>prinsip</b> PMBOK yang terkait.</li><li>Usulkan satu tindakan manajemen yang seharusnya dilakukan sejak awal.</li></ol></div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Penyebab</th><th>Domain</th><th>Prinsip</th></tr></thead><tbody><tr><td>…</td><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td><td>…</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Salin tabel ini di kertas atau dokumen kelompok.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Penting</span><span>Indikator 4</span></div><h2>Pola penyebab kegagalan proyek SI</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tujuan tidak jelas</h3><p>Proyek dimulai karena \"ada anggaran\", bukan karena masalah yang jelas.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pengguna tidak dilibatkan</h3><p>Kebutuhan ditebak; aplikasi jadi tetapi tidak dipakai.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Lingkup melebar</h3><p><button type=\"button\" class=\"term\" data-term=\"scope-creep\">Scope creep</button>: fitur terus ditambah tanpa menyesuaikan waktu dan biaya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Estimasi tidak realistis</h3><p>Jadwal dan biaya ditentukan dari tenggat, bukan dari perhitungan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko diabaikan</h3><p>Keamanan, backup, dan ketergantungan vendor tidak direncanakan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tata kelola lemah</h3><p>Tidak jelas siapa memutuskan dan siapa bertanggung jawab.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen dari diskusi kasus dan pembahasan dalam Schwalbe (2019) serta Kerzner (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Proyek bersifat <b>sementara</b> dan menghasilkan sesuatu yang <b>unik</b>; operasi berulang.</li><li>Portofolio memilih pekerjaan yang benar; program mengoordinasikan proyek terkait.</li><li>Pendekatan pengembangan berupa spektrum: <b>prediktif – hybrid – adaptif</b>.</li><li>PMBOK Guide ed. 8: <b>6 prinsip</b>, <b>7 domain kinerja</b>, 5 focus areas.</li><li>Kegagalan proyek SI lebih sering berakar pada <b>manajemen</b> daripada teknologi.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Membangun aplikasi presensi punya awal-akhir dan hasil unik; tiga lainnya kegiatan rutin.\"><p class=\"q\">Manakah yang merupakan proyek, bukan operasi?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Backup database setiap malam</button><button type=\"button\" data-o=\"b\">B. Membangun aplikasi presensi santri</button><button type=\"button\" data-o=\"c\">C. Melayani reset kata sandi SIAKAD</button><button type=\"button\" data-o=\"d\">D. Mencetak slip gaji bulanan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Pendekatan adaptif memerinci kebutuhan bertahap dan menyerahkan hasil dalam siklus pendek.\"><p class=\"q\">Kebutuhan pemilik UMKM belum jelas dan ingin mencoba fitur sedikit demi sedikit. Pendekatan yang paling cocok adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Prediktif</button><button type=\"button\" data-o=\"b\">B. Adaptif</button><button type=\"button\" data-o=\"c\">C. Waterfall murni</button><button type=\"button\" data-o=\"d\">D. Tanpa pendekatan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Tujuh domain: Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk.\"><p class=\"q\">Manakah yang BUKAN domain kinerja dalam PMBOK Guide edisi ke-8?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Governance</button><button type=\"button\" data-o=\"b\">B. Finance</button><button type=\"button\" data-o=\"c\">C. Risk</button><button type=\"button\" data-o=\"d\">D. Programming</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar manajemen proyek TI dalam Schwalbe (2019), <i>Information Technology Project Management</i> (edisi ke-9), dan bagian prinsip serta domain kinerja dalam PMBOK Guide edisi ke-8.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menganalisis kasus</h3><p>Pilih <b>satu kasus kegagalan proyek SI</b> (selain PDNS 2 dan e-KTP) dari berita tepercaya. Tulis analisis 300–400 kata dalam bahasa Indonesia: ringkasan kasus, tiga penyebab, pemetaan ke domain kinerja, dan pelajaran untuk proyek kelompok Anda. Cantumkan sumber (APA 7).</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>mitra proyek</b>. Kelompok dan mitra ditetapkan di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Project</span></dt><dd>Usaha sementara yang dilakukan untuk menghasilkan produk, layanan, atau hasil yang unik. <i>(proyek)</i></dd></div><div><dt><span class=\"en\">Operations</span></dt><dd>Pekerjaan rutin yang berjalan terus-menerus untuk mempertahankan layanan organisasi. <i>(operasional / kegiatan rutin)</i></dd></div><div><dt><span class=\"en\">Program</span></dt><dd>Sekumpulan proyek (dan kegiatan) yang saling terkait dan dikelola terkoordinasi agar manfaatnya lebih besar daripada bila dikelola sendiri-sendiri. <i>(program)</i></dd></div><div><dt><span class=\"en\">Portfolio</span></dt><dd>Kumpulan proyek, program, dan operasi yang dikelola bersama untuk mencapai tujuan strategis organisasi. <i>(portofolio)</i></dd></div><div><dt><span class=\"en\">Project management</span></dt><dd>Penerapan pengetahuan, keterampilan, alat, dan teknik pada kegiatan proyek agar memenuhi kebutuhan proyek. <i>(manajemen proyek)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Triple constraint</span></dt><dd>Tiga batasan klasik proyek: lingkup (scope), waktu (time), dan biaya (cost) yang saling memengaruhi. <i>(tiga batasan proyek)</i></dd></div><div><dt><span class=\"en\">Project life cycle</span></dt><dd>Rangkaian fase yang dilalui proyek dari awal sampai selesai. <i>(siklus hidup proyek)</i></dd></div><div><dt><span class=\"en\">Predictive approach</span></dt><dd>Pendekatan yang menetapkan lingkup, jadwal, dan biaya sejak awal lalu mengerjakannya berurutan (sering disebut waterfall). <i>(pendekatan prediktif)</i></dd></div><div><dt><span class=\"en\">Adaptive approach</span></dt><dd>Pendekatan iteratif dan inkremental; kebutuhan diperinci bertahap dan hasil diserahkan dalam siklus pendek (mis. agile). <i>(pendekatan adaptif)</i></dd></div><div><dt><span class=\"en\">Hybrid approach</span></dt><dd>Gabungan unsur prediktif dan adaptif dalam satu proyek. <i>(pendekatan hibrida)</i></dd></div><div><dt><span class=\"en\">Performance domain</span></dt><dd>Kelompok kegiatan yang saling terkait dan penting bagi keberhasilan proyek. PMBOK Guide edisi ke-8 memuat tujuh domain. <i>(domain kinerja)</i></dd></div><div><dt><span class=\"en\">Governance</span></dt><dd>Kerangka kewenangan, akuntabilitas, dan pengambilan keputusan yang mengarahkan proyek. <i>(tata kelola)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Antara. (2024, 2 Juli). <i>Tip cegah serangan \"ransomware\" pada Pusat Data Nasional</i>. https://www.antaranews.com/berita/4178778/</li><li>Detik.com. (2017, 20 Juli). <i>Ini penyimpangan proyek e-KTP yang bikin rugi negara Rp 2,3 triliun</i>. https://news.detik.com/berita/d-3567749/</li><li>IDN Times. (2024, 28 Juni). <i>Hanya 2 persen data yang kena ransomware ada back up</i>. https://www.idntimes.com/news/indonesia/kepala-bssn-hanya-2-persen-data-yang-kena-ransomware-ada-back-up-00-bbwlv-3dw607</li><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Kompas.com. (2024, 28 Juni). <i>Kepala BSSN: Hanya 2 persen data di PDNS 2 Surabaya yang di-\"backup\"</i>. https://tekno.kompas.com/read/2024/06/28/11300067/</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Project Management Institute &amp; Agile Alliance. (2017). <i>Agile practice guide</i>. Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Seleksi & Kelayakan Proyek (1)","subtitle":"Seleksi proyek, studi kelayakan, NPV, ROI, payback, dan business case","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Seleksi &amp; Kelayakan Proyek (1)</h1><p class=\"lead\">Seleksi proyek, studi kelayakan, NPV, ROI, payback, dan business case</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Latihan hitung + bentuk kelompok</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis kelayakan proyek SI dan menyusun business case serta project charter (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2)</span></h3><ol><li>Ketepatan menghitung NPV, ROI, dan payback period.</li><li>Kelengkapan analisis kelayakan teknis, operasional, dan ekonomi.</li><li>Kelengkapan project charter (tujuan, ruang lingkup awal, milestone, anggaran, sponsor). <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan identifikasi dan analisis pemangku kepentingan. <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa dua ciri utama proyek menurut PMI?</li><li>Sebutkan tujuh domain kinerja PMBOK Guide edisi ke-8.</li><li>Kapan pendekatan adaptif lebih cocok daripada prediktif?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span></div><h2>Dari strategi ke proyek resmi</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur dari strategi organisasi ke seleksi proyek, studi kelayakan dan business case, lalu project charter yang mengesahkan proyek.\"><defs><marker id=\"pf\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Strategi organisasi</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">Renstra, visi-misi</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Seleksi proyek</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">ide mana yang didanai?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kelayakan &amp; business case</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">layak? bernilai?</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Project charter</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">proyek resmi dimulai</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 2 ·····························································</text><text x=\"660\" y=\"150\" class=\"s-hd\">PERTEMUAN 3</text></svg><figcaption>Proyek SI yang baik berangkat dari strategi organisasi, bukan dari keinginan membeli teknologi. Alur ini dirangkum dari Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Seleksi proyek</span></div><h2>Lima metode memilih proyek TI <span class=\"cite\">(Schwalbe, 2019)</span></h2><div class=\"cols w\"><div><ol><li><b>Kebutuhan organisasi secara luas</b>: apakah ada kebutuhan, dana, dan kemauan kuat?</li><li><b>Kategorisasi proyek</b>: menjawab masalah, peluang, atau arahan (mis. regulasi); waktu dan prioritas.</li><li><b>Analisis finansial</b>: NPV, ROI, payback.</li><li><b><button type=\"button\" class=\"term\" data-term=\"weighted-scoring\">Weighted scoring model</button></b>: skor pada beberapa kriteria berbobot.</li><li><b>Balanced scorecard</b>: keselarasan dengan ukuran kinerja strategis.</li></ol></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Contoh skor berbobot</h3><div class=\"tw\"><table class=\"t\"><thead><tr><th>Kriteria</th><th>Bobot</th><th>A</th><th>B</th></tr></thead><tbody><tr><td>Selaras strategi</td><td>40%</td><td>90</td><td>60</td></tr><tr><td>NPV positif</td><td>30%</td><td>70</td><td>80</td></tr><tr><td>Risiko rendah</td><td>30%</td><td>50</td><td>90</td></tr><tr><td><b>Total</b></td><td></td><td><b>72</b></td><td><b>75</b></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.85em\">Data ilustrasi. A = aplikasi PPDB daring, B = digitalisasi arsip.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kelayakan</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"feasibility\">Studi kelayakan</button>: tiga sudut pandang</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Teknis</h3><p>Apakah teknologi, infrastruktur, dan keahlian tersedia?</p><p class=\"muted\" style=\"font-size:.9em\">Internet pondok stabil? Ada server atau perlu cloud? Tim menguasai framework-nya?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Operasional</h3><p>Apakah sistem akan benar-benar dipakai dan cocok dengan cara kerja organisasi?</p><p class=\"muted\" style=\"font-size:.9em\">Ustaz mau input nilai di aplikasi? Siapa admin setelah proyek selesai?</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Ekonomi</h3><p>Apakah manfaat lebih besar daripada biaya, dengan memperhitungkan nilai waktu uang?</p><p class=\"muted\" style=\"font-size:.9em\">Dinilai dengan NPV, ROI, dan payback period.</p></div></div><div class=\"callout\" style=\"margin-top:.9em\">Proyek bisa layak secara teknis tetapi gagal secara operasional: aplikasinya jalan, penggunanya tidak ada.</div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Definisi kerja mata kuliah ini, mengikuti tiga aspek kelayakan dalam RPS.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis finansial</span><span>Indikator 1</span></div><h2>Rp1 juta hari ini ≠ Rp1 juta tahun depan</h2><div class=\"cols w\"><div><p>Uang hari ini bisa diinvestasikan, jadi nilainya lebih besar daripada jumlah yang sama di masa depan. Karena itu manfaat dan biaya di masa depan <b>didiskonto</b> ke nilai sekarang.</p><div class=\"callout\" style=\"margin:.7em 0\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"discount-factor\">Discount factor</button> = 1 / (1 + r)<sup>t</sup></span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\">r = <button type=\"button\" class=\"term\" data-term=\"discount-rate\">discount rate</button>, t = tahun ke-</div></div><p class=\"muted\">Discount rate mencerminkan <button type=\"button\" class=\"term\" data-term=\"opportunity-cost\">opportunity cost of capital</button>: imbal hasil yang hilang karena dana dipakai untuk proyek ini <span class=\"cite\">(Schwalbe, 2019)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>r = 10%</h3><table class=\"t\"><thead><tr><th>Tahun</th><th>Faktor</th><th>Rp10 jt bernilai</th></tr></thead><tbody><tr><td>0</td><td>1,00</td><td>Rp10,0 jt</td></tr><tr><td>1</td><td>0,91</td><td>Rp9,1 jt</td></tr><tr><td>2</td><td>0,83</td><td>Rp8,3 jt</td></tr><tr><td>3</td><td>0,75</td><td>Rp7,5 jt</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis finansial</span><span>Indikator 1</span></div><h2>NPV, ROI, dan payback <span class=\"cite\">(Schwalbe, 2019)</span></h2><div class=\"grid3\"><div class=\"card hl\"><h3><button type=\"button\" class=\"term\" data-term=\"npv\">NPV</button></h3><p class=\"phrase\" style=\"display:block;margin:.4em 0\">NPV = Σ (Manfaat<sub>t</sub> − Biaya<sub>t</sub>) / (1+r)<sup>t</sup></p><p>NPV &gt; 0: proyek menghasilkan nilai pada discount rate itu. Pilih NPV lebih besar bila membandingkan.</p></div><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"roi\">ROI</button></h3><p class=\"phrase\" style=\"display:block;margin:.4em 0\">ROI = (Σ manfaat terdiskonto − Σ biaya terdiskonto) / Σ biaya terdiskonto</p><p>Semakin tinggi semakin baik; bandingkan dengan target organisasi.</p></div><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"payback\">Payback</button></h3><p class=\"phrase\" style=\"display:block;margin:.4em 0\">titik saat manfaat kumulatif terdiskonto ≥ biaya kumulatif terdiskonto</p><p>Semakin cepat semakin baik; organisasi sering menetapkan batas maksimal.</p></div></div><p class=\"muted\" style=\"margin-top:.7em\">Ketiganya dihitung dari arus biaya dan manfaat yang sama, tetapi menjawab pertanyaan berbeda: <b>berapa nilainya</b>, <b>berapa persen imbal hasilnya</b>, <b>berapa lama balik modal</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Data ilustrasi · juta rupiah · r = 10%</span></div><h2>Sistem Informasi Pesantren Al-Hikmah</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Tahun 0</th><th>Tahun 1</th><th>Tahun 2</th><th>Tahun 3</th><th>Total</th></tr></thead><tbody><tr><td>Biaya</td><td>80</td><td>15</td><td>15</td><td>15</td><td></td></tr><tr><td>Manfaat</td><td>0</td><td>45</td><td>50</td><td>55</td><td></td></tr><tr><td>Faktor diskonto</td><td>1,00</td><td>0,91</td><td>0,83</td><td>0,75</td><td></td></tr><tr><td>Biaya terdiskonto</td><td>80,0</td><td>13,6</td><td>12,4</td><td>11,3</td><td><b>117,3</b></td></tr><tr><td>Manfaat terdiskonto</td><td>0,0</td><td>40,9</td><td>41,3</td><td>41,3</td><td><b>123,6</b></td></tr><tr><td>Kumulatif (manfaat − biaya)</td><td>−80,0</td><td>−52,7</td><td>−23,8</td><td>6,3</td><td></td></tr></tbody></table></div><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card hl\"><h3>NPV = 6,3 jt</h3><p>Positif: layak secara finansial pada r = 10%.</p></div><div class=\"card\"><h3>ROI = 5,3%</h3><p>(123,6 − 117,3) / 117,3</p></div><div class=\"card\"><h3>Payback ≈ 2,8 tahun</h3><p>Kumulatif berubah positif di tahun ke-3.</p></div></div><p class=\"muted\" style=\"font-size:.75em;margin-top:.3em\">Kasus ilustrasi. Dihitung dengan faktor tak dibulatkan; selisih 0,1 karena pembulatan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Visualisasi</span><span>Indikator 1</span></div><h2>Membaca payback dari grafik</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 262\" role=\"img\" aria-label=\"Grafik arus kas kumulatif terdiskonto, data ilustrasi: tahun 0 minus 80 juta, tahun 1 minus 52,7 juta, tahun 2 minus 23,8 juta, tahun 3 plus 6,3 juta. Garis memotong nol antara tahun 2 dan 3, yaitu titik payback sekitar 2,8 tahun.\"><line x1=\"70\" y1=\"110\" x2=\"840\" y2=\"110\" class=\"s-dash\"/><text x=\"64\" y=\"114\" text-anchor=\"end\" class=\"s-s\">0</text><text x=\"64\" y=\"218\" text-anchor=\"end\" class=\"s-s\">−80</text><line x1=\"70\" y1=\"214\" x2=\"840\" y2=\"214\" stroke=\"var(--line)\"/><polyline points=\"110,214 310,178.51 510,140.94 710,101.81\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"3\"/><circle cx=\"110\" cy=\"214\" r=\"6\" fill=\"var(--warn)\"/><text x=\"110\" y=\"236\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">−80</text><text x=\"110\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 0</text><circle cx=\"310\" cy=\"178.51\" r=\"6\" fill=\"var(--warn)\"/><text x=\"310\" y=\"200.51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">−52,7</text><text x=\"310\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 1</text><circle cx=\"510\" cy=\"140.94\" r=\"6\" fill=\"var(--warn)\"/><text x=\"510\" y=\"162.94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">−23,8</text><text x=\"510\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 2</text><circle cx=\"710\" cy=\"101.81\" r=\"6\" fill=\"var(--ok)\"/><text x=\"710\" y=\"89.81\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">6,3</text><text x=\"710\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 3</text><line x1=\"668.1395348837209\" y1=\"70\" x2=\"668.1395348837209\" y2=\"118\" stroke=\"var(--accent)\" stroke-width=\"3\"/><text x=\"668.1395348837209\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">payback ≈ 2,8 tahun</text><text x=\"70\" y=\"16\" class=\"s-hd\">ARUS KAS KUMULATIF TERDISKONTO (JUTA RUPIAH)</text></svg><figcaption>Data ilustrasi dari contoh Sistem Informasi Pesantren. Payback dibaca saat garis kumulatif memotong nol (cara analisis payback dalam Schwalbe, 2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok · 15 menit · data ilustrasi</span></div><h2>Aplikasi kasir dan stok UMKM Keripik Tempe</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Juta Rp</th><th>Th 0</th><th>Th 1</th><th>Th 2</th><th>Th 3</th></tr></thead><tbody><tr><td>Biaya</td><td>30</td><td>5</td><td>5</td><td>5</td></tr><tr><td>Manfaat</td><td>0</td><td>15</td><td>18</td><td>20</td></tr></tbody></table></div><p style=\"margin-top:.6em\">Discount rate 10%. Hitung:</p><ol><li>Biaya dan manfaat terdiskonto per tahun.</li><li>NPV dan ROI.</li><li>Payback period (perkiraan tahun).</li><li>Beri rekomendasi 2–3 kalimat untuk pemilik UMKM.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Tantangan tambahan</h3><p>Bila discount rate naik menjadi 15%, apakah rekomendasi Anda berubah?</p><p class=\"muted\">Pakai kalkulator atau spreadsheet.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumen</span><span>Tugas 1 · bagian pertama</span></div><h2>Isi sebuah <button type=\"button\" class=\"term\" data-term=\"business-case\">business case</button></h2><div class=\"cols\"><ol><li>Pendahuluan dan latar belakang</li><li>Tujuan bisnis</li><li>Kondisi saat ini dan pernyataan masalah/peluang</li><li>Asumsi kritis dan batasan</li><li>Analisis alternatif dan rekomendasi</li></ol><ol start=\"6\"><li>Kebutuhan awal proyek</li><li>Estimasi anggaran dan analisis finansial</li><li>Estimasi jadwal</li><li>Potensi risiko</li><li>Lampiran</li></ol></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Diadaptasi dari contoh business case dalam Schwalbe (2019).</p><div class=\"callout\" style=\"margin-top:.6em\">Bagian 3 dan 5 paling sering lemah: masalah tidak dibuktikan dengan data, dan hanya satu alternatif yang dianalisis. Selalu bandingkan minimal <b>dua alternatif</b>, termasuk \"tidak melakukan apa-apa\".</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih mitra</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 4–5 orang. Tetapkan peran awal:</p><ul><li>Manajer proyek (penanggung jawab laporan)</li><li>Penghubung mitra</li><li>Analis kebutuhan</li><li>Penanggung jawab dokumen dan keuangan proyek</li></ul><p class=\"muted\">Peran boleh dirotasi, tetapi harus tercatat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria mitra yang baik</h3><ul><li>Organisasi nyata: UMKM, instansi, perguruan tinggi, atau pesantren/lembaga NU.</li><li>Punya masalah atau peluang yang bisa dijawab sistem informasi.</li><li>Bersedia ditemui 3–4 kali selama semester.</li><li>Ada narahubung yang bisa memberi data dan umpan balik.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Dokumen rencana proyek kelompok</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>P2–3 · 10%</h3><p>Business case dan project charter, termasuk analisis kelayakan dan pemangku kepentingan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>P4–5 · 10%</h3><p>Scope statement dan WBS beserta WBS dictionary.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>P6–7 · 10%</h3><p>Jadwal proyek dengan jalur kritis (Gantt chart) dan presentasi rencana proyek di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai proyek yang <b>sama</b>, jadi pilih mitra dengan serius.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Proyek SI harus berangkat dari <b>strategi organisasi</b>, lalu diseleksi.</li><li>Seleksi bisa memakai lima metode, termasuk <b>weighted scoring</b> dan analisis finansial.</li><li>Kelayakan dilihat dari aspek <b>teknis, operasional, ekonomi</b>.</li><li>Nilai waktu uang: manfaat dan biaya masa depan <b>didiskonto</b>.</li><li><b>NPV</b> (nilai), <b>ROI</b> (persen imbal hasil), <b>payback</b> (lama balik modal) menjadi isi business case.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"11 / (1 + 0,10) = 10 juta.\"><p class=\"q\">Dengan discount rate 10%, berapa nilai sekarang dari manfaat Rp11 juta yang diterima satu tahun lagi?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Rp9,9 juta</button><button type=\"button\" data-o=\"b\">B. Rp10 juta</button><button type=\"button\" data-o=\"c\">C. Rp11 juta</button><button type=\"button\" data-o=\"d\">D. Rp12,1 juta</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"NPV negatif berarti nilai sekarang manfaat belum menutup nilai sekarang biaya.\"><p class=\"q\">NPV sebuah proyek negatif pada discount rate organisasi. Artinya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Proyek pasti gagal teknis</button><button type=\"button\" data-o=\"b\">B. Manfaat terdiskonto < biaya terdiskonto</button><button type=\"button\" data-o=\"c\">C. Payback lebih cepat dari target</button><button type=\"button\" data-o=\"d\">D. ROI di atas target</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Kelayakan operasional menilai apakah sistem akan dipakai dan dikelola dalam cara kerja organisasi.\"><p class=\"q\">\"Ustaz belum terbiasa memakai aplikasi dan belum ada admin.\" Ini temuan kelayakan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. teknis</button><button type=\"button\" data-o=\"b\">B. operasional</button><button type=\"button\" data-o=\"c\">C. ekonomi</button><button type=\"button\" data-o=\"d\">D. finansial</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian seleksi proyek dan analisis finansial (NPV, ROI, payback) serta contoh business case dalam Schwalbe (2019).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Hubungi dan pastikan mitra; minta izin tertulis bila perlu.</li><li>Kumpulkan data awal: masalah, proses saat ini, perkiraan biaya dan manfaat.</li><li>Susun draf business case bagian 1–5 dan tabel NPV/ROI/payback dengan minimal dua alternatif.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf ke Pertemuan 3; kita lanjutkan ke project charter dan analisis pemangku kepentingan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Business case</span></dt><dd>Dokumen yang menjelaskan alasan bisnis sebuah proyek: masalah atau peluang, pilihan solusi, analisis biaya-manfaat, dan rekomendasi. <i>(kajian kelayakan bisnis)</i></dd></div><div><dt><span class=\"en\">Feasibility study</span></dt><dd>Kajian untuk menilai apakah sebuah proyek layak dijalankan dari sisi teknis, operasional, dan ekonomi. <i>(studi kelayakan)</i></dd></div><div><dt><span class=\"en\">Weighted scoring model</span></dt><dd>Alat seleksi proyek yang memberi skor pada beberapa kriteria berbobot, lalu menjumlahkannya. <i>(model skor berbobot)</i></dd></div><div><dt><span class=\"en\">Net present value (NPV)</span></dt><dd>Selisih nilai sekarang seluruh manfaat dan seluruh biaya proyek setelah didiskonto. NPV positif berarti proyek menghasilkan nilai. <i>(nilai sekarang bersih)</i></dd></div><div><dt><span class=\"en\">Return on investment (ROI)</span></dt><dd>Perbandingan manfaat bersih terhadap biaya investasi, dinyatakan dalam persen. <i>(tingkat pengembalian investasi)</i></dd></div><div><dt><span class=\"en\">Payback period</span></dt><dd>Lama waktu sampai manfaat kumulatif menutup biaya kumulatif proyek. <i>(periode pengembalian)</i></dd></div><div><dt><span class=\"en\">Discount rate</span></dt><dd>Tingkat bunga yang dipakai untuk mengubah uang di masa depan menjadi nilai sekarang; sering disebut juga required rate of return. <i>(tingkat diskonto)</i></dd></div><div><dt><span class=\"en\">Discount factor</span></dt><dd>Pengali untuk mengubah nilai tahun ke-t menjadi nilai sekarang: 1/(1+r)^t. <i>(faktor diskonto)</i></dd></div><div><dt><span class=\"en\">Opportunity cost of capital</span></dt><dd>Imbal hasil yang hilang karena dana dipakai untuk proyek ini, bukan untuk alternatif lain. <i>(biaya peluang modal)</i></dd></div><div><dt><span class=\"en\">Sponsor</span></dt><dd>Orang atau kelompok yang menyediakan sumber daya dan dukungan bagi proyek serta bertanggung jawab atas keberhasilannya. <i>(sponsor / penyandang proyek)</i></dd></div><div><dt><span class=\"en\">Project charter</span></dt><dd>Dokumen yang secara resmi mengesahkan proyek dan memberi wewenang kepada manajer proyek. <i>(piagam proyek)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Marchewka, J. T. (2016). <i>Information technology project management: Providing measurable organizational value</i> (5th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Seleksi & Kelayakan Proyek (2)","subtitle":"Project charter dan identifikasi serta analisis pemangku kepentingan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Sub-CPMK-2 (Pertemuan 2–3) · CPMK-1 · CPL-4</span></div><h1>Seleksi & Kelayakan Proyek (2)</h1><p class=\"lead\">Project charter dan identifikasi serta analisis pemangku kepentingan</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis kelayakan proyek SI dan menyusun business case serta project charter (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":4,"title":"Manajemen Lingkup (1)","subtitle":"Pengumpulan kebutuhan dan scope statement","status":"soon","slides":
