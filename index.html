utton type=\"button\" data-o=\"c\">C. Waterfall murni</button><button type=\"button\" data-o=\"d\">D. Tanpa pendekatan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Tujuh domain: Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk.\"><p class=\"q\">Manakah yang BUKAN domain kinerja dalam PMBOK Guide edisi ke-8?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Governance</button><button type=\"button\" data-o=\"b\">B. Finance</button><button type=\"button\" data-o=\"c\">C. Risk</button><button type=\"button\" data-o=\"d\">D. Programming</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar manajemen proyek TI dalam Schwalbe (2019), <i>Information Technology Project Management</i> (edisi ke-9), dan bagian prinsip serta domain kinerja dalam PMBOK Guide edisi ke-8.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menganalisis kasus</h3><p>Pilih <b>satu kasus kegagalan proyek SI</b> (selain PDNS 2 dan e-KTP) dari berita tepercaya. Tulis analisis 300–400 kata dalam bahasa Indonesia: ringkasan kasus, tiga penyebab, pemetaan ke domain kinerja, dan pelajaran untuk proyek kelompok Anda. Cantumkan sumber (APA 7).</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>mitra proyek</b>. Kelompok dan mitra ditetapkan di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Project</span></dt><dd>Usaha sementara yang dilakukan untuk menghasilkan produk, layanan, atau hasil yang unik. <i>(proyek)</i></dd></div><div><dt><span class=\"en\">Operations</span></dt><dd>Pekerjaan rutin yang berjalan terus-menerus untuk mempertahankan layanan organisasi. <i>(operasional / kegiatan rutin)</i></dd></div><div><dt><span class=\"en\">Program</span></dt><dd>Sekumpulan proyek (dan kegiatan) yang saling terkait dan dikelola terkoordinasi agar manfaatnya lebih besar daripada bila dikelola sendiri-sendiri. <i>(program)</i></dd></div><div><dt><span class=\"en\">Portfolio</span></dt><dd>Kumpulan proyek, program, dan operasi yang dikelola bersama untuk mencapai tujuan strategis organisasi. <i>(portofolio)</i></dd></div><div><dt><span class=\"en\">Project management</span></dt><dd>Penerapan pengetahuan, keterampilan, alat, dan teknik pada kegiatan proyek agar memenuhi kebutuhan proyek. <i>(manajemen proyek)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Triple constraint</span></dt><dd>Tiga batasan klasik proyek: lingkup (scope), waktu (time), dan biaya (cost) yang saling memengaruhi. <i>(tiga batasan proyek)</i></dd></div><div><dt><span class=\"en\">Project life cycle</span></dt><dd>Rangkaian fase yang dilalui proyek dari awal sampai selesai. <i>(siklus hidup proyek)</i></dd></div><div><dt><span class=\"en\">Predictive approach</span></dt><dd>Pendekatan yang menetapkan lingkup, jadwal, dan biaya sejak awal lalu mengerjakannya berurutan (sering disebut waterfall). <i>(pendekatan prediktif)</i></dd></div><div><dt><span class=\"en\">Adaptive approach</span></dt><dd>Pendekatan iteratif dan inkremental; kebutuhan diperinci bertahap dan hasil diserahkan dalam siklus pendek (mis. agile). <i>(pendekatan adaptif)</i></dd></div><div><dt><span class=\"en\">Hybrid approach</span></dt><dd>Gabungan unsur prediktif dan adaptif dalam satu proyek. <i>(pendekatan hibrida)</i></dd></div><div><dt><span class=\"en\">Performance domain</span></dt><dd>Kelompok kegiatan yang saling terkait dan penting bagi keberhasilan proyek. PMBOK Guide edisi ke-8 memuat tujuh domain. <i>(domain kinerja)</i></dd></div><div><dt><span class=\"en\">Governance</span></dt><dd>Kerangka kewenangan, akuntabilitas, dan pengambilan keputusan yang mengarahkan proyek. <i>(tata kelola)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Antara. (2024, 2 Juli). <i>Tip cegah serangan \"ransomware\" pada Pusat Data Nasional</i>. https://www.antaranews.com/berita/4178778/</li><li>Detik.com. (2017, 20 Juli). <i>Ini penyimpangan proyek e-KTP yang bikin rugi negara Rp 2,3 triliun</i>. https://news.detik.com/berita/d-3567749/</li><li>IDN Times. (2024, 28 Juni). <i>Hanya 2 persen data yang kena ransomware ada back up</i>. https://www.idntimes.com/news/indonesia/kepala-bssn-hanya-2-persen-data-yang-kena-ransomware-ada-back-up-00-bbwlv-3dw607</li><li>Kerzner, H. (2025). <i>Project management: A systems approach to planning, scheduling, and controlling</i> (14th ed.). Wiley.</li><li>Kompas.com. (2024, 28 Juni). <i>Kepala BSSN: Hanya 2 persen data di PDNS 2 Surabaya yang di-\"backup\"</i>. https://tekno.kompas.com/read/2024/06/28/11300067/</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Project Management Institute &amp; Agile Alliance. (2017). <i>Agile practice guide</i>. Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Seleksi & Kelayakan Proyek (1)","subtitle":"Seleksi proyek, studi kelayakan, NPV, ROI, payback, dan business case","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Seleksi &amp; Kelayakan Proyek (1)</h1><p class=\"lead\">Seleksi proyek, studi kelayakan, NPV, ROI, payback, dan business case</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Latihan hitung + bentuk kelompok</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis kelayakan proyek SI dan menyusun business case serta project charter (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2)</span></h3><ol><li>Ketepatan menghitung NPV, ROI, dan payback period.</li><li>Kelengkapan analisis kelayakan teknis, operasional, dan ekonomi.</li><li>Kelengkapan project charter (tujuan, ruang lingkup awal, milestone, anggaran, sponsor). <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan identifikasi dan analisis pemangku kepentingan. <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa dua ciri utama proyek menurut PMI?</li><li>Sebutkan tujuh domain kinerja PMBOK Guide edisi ke-8.</li><li>Kapan pendekatan adaptif lebih cocok daripada prediktif?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span></div><h2>Dari strategi ke proyek resmi</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur dari strategi organisasi ke seleksi proyek, studi kelayakan dan business case, lalu project charter yang mengesahkan proyek.\"><defs><marker id=\"pf\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Strategi organisasi</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">Renstra, visi-misi</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Seleksi proyek</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">ide mana yang didanai?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kelayakan &amp; business case</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">layak? bernilai?</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Project charter</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">proyek resmi dimulai</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 2 ·····························································</text><text x=\"660\" y=\"150\" class=\"s-hd\">PERTEMUAN 3</text></svg><figcaption>Proyek SI yang baik berangkat dari strategi organisasi, bukan dari keinginan membeli teknologi. Alur ini dirangkum dari Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Seleksi proyek</span></div><h2>Lima metode memilih proyek TI <span class=\"cite\">(Schwalbe, 2019)</span></h2><div class=\"cols w\"><div><ol><li><b>Kebutuhan organisasi secara luas</b>: apakah ada kebutuhan, dana, dan kemauan kuat?</li><li><b>Kategorisasi proyek</b>: menjawab masalah, peluang, atau arahan (mis. regulasi); waktu dan prioritas.</li><li><b>Analisis finansial</b>: NPV, ROI, payback.</li><li><b><button type=\"button\" class=\"term\" data-term=\"weighted-scoring\">Weighted scoring model</button></b>: skor pada beberapa kriteria berbobot.</li><li><b>Balanced scorecard</b>: keselarasan dengan ukuran kinerja strategis.</li></ol></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Contoh skor berbobot</h3><div class=\"tw\"><table class=\"t\"><thead><tr><th>Kriteria</th><th>Bobot</th><th>A</th><th>B</th></tr></thead><tbody><tr><td>Selaras strategi</td><td>40%</td><td>90</td><td>60</td></tr><tr><td>NPV positif</td><td>30%</td><td>70</td><td>80</td></tr><tr><td>Risiko rendah</td><td>30%</td><td>50</td><td>90</td></tr><tr><td><b>Total</b></td><td></td><td><b>72</b></td><td><b>75</b></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.85em\">Data ilustrasi. A = aplikasi PPDB daring, B = digitalisasi arsip.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kelayakan</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"feasibility\">Studi kelayakan</button>: tiga sudut pandang</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Teknis</h3><p>Apakah teknologi, infrastruktur, dan keahlian tersedia?</p><p class=\"muted\" style=\"font-size:.9em\">Internet pondok stabil? Ada server atau perlu cloud? Tim menguasai framework-nya?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Operasional</h3><p>Apakah sistem akan benar-benar dipakai dan cocok dengan cara kerja organisasi?</p><p class=\"muted\" style=\"font-size:.9em\">Ustaz mau input nilai di aplikasi? Siapa admin setelah proyek selesai?</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Ekonomi</h3><p>Apakah manfaat lebih besar daripada biaya, dengan memperhitungkan nilai waktu uang?</p><p class=\"muted\" style=\"font-size:.9em\">Dinilai dengan NPV, ROI, dan payback period.</p></div></div><div class=\"callout\" style=\"margin-top:.9em\">Proyek bisa layak secara teknis tetapi gagal secara operasional: aplikasinya jalan, penggunanya tidak ada.</div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Definisi kerja mata kuliah ini, mengikuti tiga aspek kelayakan dalam RPS.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis finansial</span><span>Indikator 1</span></div><h2>Rp1 juta hari ini ≠ Rp1 juta tahun depan</h2><div class=\"cols w\"><div><p>Uang hari ini bisa diinvestasikan, jadi nilainya lebih besar daripada jumlah yang sama di masa depan. Karena itu manfaat dan biaya di masa depan <b>didiskonto</b> ke nilai sekarang.</p><div class=\"callout\" style=\"margin:.7em 0\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"discount-factor\">Discount factor</button> = 1 / (1 + r)<sup>t</sup></span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\">r = <button type=\"button\" class=\"term\" data-term=\"discount-rate\">discount rate</button>, t = tahun ke-</div></div><p class=\"muted\">Discount rate mencerminkan <button type=\"button\" class=\"term\" data-term=\"opportunity-cost\">opportunity cost of capital</button>: imbal hasil yang hilang karena dana dipakai untuk proyek ini <span class=\"cite\">(Schwalbe, 2019)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>r = 10%</h3><table class=\"t\"><thead><tr><th>Tahun</th><th>Faktor</th><th>Rp10 jt bernilai</th></tr></thead><tbody><tr><td>0</td><td>1,00</td><td>Rp10,0 jt</td></tr><tr><td>1</td><td>0,91</td><td>Rp9,1 jt</td></tr><tr><td>2</td><td>0,83</td><td>Rp8,3 jt</td></tr><tr><td>3</td><td>0,75</td><td>Rp7,5 jt</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis finansial</span><span>Indikator 1</span></div><h2>NPV, ROI, dan payback <span class=\"cite\">(Schwalbe, 2019)</span></h2><div class=\"grid3\"><div class=\"card hl\"><h3><button type=\"button\" class=\"term\" data-term=\"npv\">NPV</button></h3><p class=\"phrase\" style=\"display:block;margin:.4em 0\">NPV = Σ (Manfaat<sub>t</sub> − Biaya<sub>t</sub>) / (1+r)<sup>t</sup></p><p>NPV &gt; 0: proyek menghasilkan nilai pada discount rate itu. Pilih NPV lebih besar bila membandingkan.</p></div><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"roi\">ROI</button></h3><p class=\"phrase\" style=\"display:block;margin:.4em 0\">ROI = (Σ manfaat terdiskonto − Σ biaya terdiskonto) / Σ biaya terdiskonto</p><p>Semakin tinggi semakin baik; bandingkan dengan target organisasi.</p></div><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"payback\">Payback</button></h3><p class=\"phrase\" style=\"display:block;margin:.4em 0\">titik saat manfaat kumulatif terdiskonto ≥ biaya kumulatif terdiskonto</p><p>Semakin cepat semakin baik; organisasi sering menetapkan batas maksimal.</p></div></div><p class=\"muted\" style=\"margin-top:.7em\">Ketiganya dihitung dari arus biaya dan manfaat yang sama, tetapi menjawab pertanyaan berbeda: <b>berapa nilainya</b>, <b>berapa persen imbal hasilnya</b>, <b>berapa lama balik modal</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Data ilustrasi · juta rupiah · r = 10%</span></div><h2>Sistem Informasi Pesantren Al-Hikmah</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Tahun 0</th><th>Tahun 1</th><th>Tahun 2</th><th>Tahun 3</th><th>Total</th></tr></thead><tbody><tr><td>Biaya</td><td>80</td><td>15</td><td>15</td><td>15</td><td></td></tr><tr><td>Manfaat</td><td>0</td><td>45</td><td>50</td><td>55</td><td></td></tr><tr><td>Faktor diskonto</td><td>1,00</td><td>0,91</td><td>0,83</td><td>0,75</td><td></td></tr><tr><td>Biaya terdiskonto</td><td>80,0</td><td>13,6</td><td>12,4</td><td>11,3</td><td><b>117,3</b></td></tr><tr><td>Manfaat terdiskonto</td><td>0,0</td><td>40,9</td><td>41,3</td><td>41,3</td><td><b>123,6</b></td></tr><tr><td>Kumulatif (manfaat − biaya)</td><td>−80,0</td><td>−52,7</td><td>−23,8</td><td>6,3</td><td></td></tr></tbody></table></div><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card hl\"><h3>NPV = 6,3 jt</h3><p>Positif: layak secara finansial pada r = 10%.</p></div><div class=\"card\"><h3>ROI = 5,3%</h3><p>(123,6 − 117,3) / 117,3</p></div><div class=\"card\"><h3>Payback ≈ 2,8 tahun</h3><p>Kumulatif berubah positif di tahun ke-3.</p></div></div><p class=\"muted\" style=\"font-size:.75em;margin-top:.3em\">Kasus ilustrasi. Dihitung dengan faktor tak dibulatkan; selisih 0,1 karena pembulatan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Visualisasi</span><span>Indikator 1</span></div><h2>Membaca payback dari grafik</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 262\" role=\"img\" aria-label=\"Grafik arus kas kumulatif terdiskonto, data ilustrasi: tahun 0 minus 80 juta, tahun 1 minus 52,7 juta, tahun 2 minus 23,8 juta, tahun 3 plus 6,3 juta. Garis memotong nol antara tahun 2 dan 3, yaitu titik payback sekitar 2,8 tahun.\"><line x1=\"70\" y1=\"110\" x2=\"840\" y2=\"110\" class=\"s-dash\"/><text x=\"64\" y=\"114\" text-anchor=\"end\" class=\"s-s\">0</text><text x=\"64\" y=\"218\" text-anchor=\"end\" class=\"s-s\">−80</text><line x1=\"70\" y1=\"214\" x2=\"840\" y2=\"214\" stroke=\"var(--line)\"/><polyline points=\"110,214 310,178.51 510,140.94 710,101.81\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"3\"/><circle cx=\"110\" cy=\"214\" r=\"6\" fill=\"var(--warn)\"/><text x=\"110\" y=\"236\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">−80</text><text x=\"110\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 0</text><circle cx=\"310\" cy=\"178.51\" r=\"6\" fill=\"var(--warn)\"/><text x=\"310\" y=\"200.51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">−52,7</text><text x=\"310\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 1</text><circle cx=\"510\" cy=\"140.94\" r=\"6\" fill=\"var(--warn)\"/><text x=\"510\" y=\"162.94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">−23,8</text><text x=\"510\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 2</text><circle cx=\"710\" cy=\"101.81\" r=\"6\" fill=\"var(--ok)\"/><text x=\"710\" y=\"89.81\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">6,3</text><text x=\"710\" y=\"256\" text-anchor=\"middle\" class=\"s-s\">Tahun 3</text><line x1=\"668.1395348837209\" y1=\"70\" x2=\"668.1395348837209\" y2=\"118\" stroke=\"var(--accent)\" stroke-width=\"3\"/><text x=\"668.1395348837209\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">payback ≈ 2,8 tahun</text><text x=\"70\" y=\"16\" class=\"s-hd\">ARUS KAS KUMULATIF TERDISKONTO (JUTA RUPIAH)</text></svg><figcaption>Data ilustrasi dari contoh Sistem Informasi Pesantren. Payback dibaca saat garis kumulatif memotong nol (cara analisis payback dalam Schwalbe, 2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok · 15 menit · data ilustrasi</span></div><h2>Aplikasi kasir dan stok UMKM Keripik Tempe</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Juta Rp</th><th>Th 0</th><th>Th 1</th><th>Th 2</th><th>Th 3</th></tr></thead><tbody><tr><td>Biaya</td><td>30</td><td>5</td><td>5</td><td>5</td></tr><tr><td>Manfaat</td><td>0</td><td>15</td><td>18</td><td>20</td></tr></tbody></table></div><p style=\"margin-top:.6em\">Discount rate 10%. Hitung:</p><ol><li>Biaya dan manfaat terdiskonto per tahun.</li><li>NPV dan ROI.</li><li>Payback period (perkiraan tahun).</li><li>Beri rekomendasi 2–3 kalimat untuk pemilik UMKM.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Tantangan tambahan</h3><p>Bila discount rate naik menjadi 15%, apakah rekomendasi Anda berubah?</p><p class=\"muted\">Pakai kalkulator atau spreadsheet.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumen</span><span>Tugas 1 · bagian pertama</span></div><h2>Isi sebuah <button type=\"button\" class=\"term\" data-term=\"business-case\">business case</button></h2><div class=\"cols\"><ol><li>Pendahuluan dan latar belakang</li><li>Tujuan bisnis</li><li>Kondisi saat ini dan pernyataan masalah/peluang</li><li>Asumsi kritis dan batasan</li><li>Analisis alternatif dan rekomendasi</li></ol><ol start=\"6\"><li>Kebutuhan awal proyek</li><li>Estimasi anggaran dan analisis finansial</li><li>Estimasi jadwal</li><li>Potensi risiko</li><li>Lampiran</li></ol></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Diadaptasi dari contoh business case dalam Schwalbe (2019).</p><div class=\"callout\" style=\"margin-top:.6em\">Bagian 3 dan 5 paling sering lemah: masalah tidak dibuktikan dengan data, dan hanya satu alternatif yang dianalisis. Selalu bandingkan minimal <b>dua alternatif</b>, termasuk \"tidak melakukan apa-apa\".</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih mitra</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 4–5 orang. Tetapkan peran awal:</p><ul><li>Manajer proyek (penanggung jawab laporan)</li><li>Penghubung mitra</li><li>Analis kebutuhan</li><li>Penanggung jawab dokumen dan keuangan proyek</li></ul><p class=\"muted\">Peran boleh dirotasi, tetapi harus tercatat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria mitra yang baik</h3><ul><li>Organisasi nyata: UMKM, instansi, perguruan tinggi, atau pesantren/lembaga NU.</li><li>Punya masalah atau peluang yang bisa dijawab sistem informasi.</li><li>Bersedia ditemui 3–4 kali selama semester.</li><li>Ada narahubung yang bisa memberi data dan umpan balik.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Dokumen rencana proyek kelompok</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>P2–3 · 10%</h3><p>Business case dan project charter, termasuk analisis kelayakan dan pemangku kepentingan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>P4–5 · 10%</h3><p>Scope statement dan WBS beserta WBS dictionary.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>P6–7 · 10%</h3><p>Jadwal proyek dengan jalur kritis (Gantt chart) dan presentasi rencana proyek di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai proyek yang <b>sama</b>, jadi pilih mitra dengan serius.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Proyek SI harus berangkat dari <b>strategi organisasi</b>, lalu diseleksi.</li><li>Seleksi bisa memakai lima metode, termasuk <b>weighted scoring</b> dan analisis finansial.</li><li>Kelayakan dilihat dari aspek <b>teknis, operasional, ekonomi</b>.</li><li>Nilai waktu uang: manfaat dan biaya masa depan <b>didiskonto</b>.</li><li><b>NPV</b> (nilai), <b>ROI</b> (persen imbal hasil), <b>payback</b> (lama balik modal) menjadi isi business case.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"11 / (1 + 0,10) = 10 juta.\"><p class=\"q\">Dengan discount rate 10%, berapa nilai sekarang dari manfaat Rp11 juta yang diterima satu tahun lagi?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Rp9,9 juta</button><button type=\"button\" data-o=\"b\">B. Rp10 juta</button><button type=\"button\" data-o=\"c\">C. Rp11 juta</button><button type=\"button\" data-o=\"d\">D. Rp12,1 juta</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"NPV negatif berarti nilai sekarang manfaat belum menutup nilai sekarang biaya.\"><p class=\"q\">NPV sebuah proyek negatif pada discount rate organisasi. Artinya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Proyek pasti gagal teknis</button><button type=\"button\" data-o=\"b\">B. Manfaat terdiskonto < biaya terdiskonto</button><button type=\"button\" data-o=\"c\">C. Payback lebih cepat dari target</button><button type=\"button\" data-o=\"d\">D. ROI di atas target</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Kelayakan operasional menilai apakah sistem akan dipakai dan dikelola dalam cara kerja organisasi.\"><p class=\"q\">\"Ustaz belum terbiasa memakai aplikasi dan belum ada admin.\" Ini temuan kelayakan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. teknis</button><button type=\"button\" data-o=\"b\">B. operasional</button><button type=\"button\" data-o=\"c\">C. ekonomi</button><button type=\"button\" data-o=\"d\">D. finansial</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian seleksi proyek dan analisis finansial (NPV, ROI, payback) serta contoh business case dalam Schwalbe (2019).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Hubungi dan pastikan mitra; minta izin tertulis bila perlu.</li><li>Kumpulkan data awal: masalah, proses saat ini, perkiraan biaya dan manfaat.</li><li>Susun draf business case bagian 1–5 dan tabel NPV/ROI/payback dengan minimal dua alternatif.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf ke Pertemuan 3; kita lanjutkan ke project charter dan analisis pemangku kepentingan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Business case</span></dt><dd>Dokumen yang menjelaskan alasan bisnis sebuah proyek: masalah atau peluang, pilihan solusi, analisis biaya-manfaat, dan rekomendasi. <i>(kajian kelayakan bisnis)</i></dd></div><div><dt><span class=\"en\">Feasibility study</span></dt><dd>Kajian untuk menilai apakah sebuah proyek layak dijalankan dari sisi teknis, operasional, dan ekonomi. <i>(studi kelayakan)</i></dd></div><div><dt><span class=\"en\">Weighted scoring model</span></dt><dd>Alat seleksi proyek yang memberi skor pada beberapa kriteria berbobot, lalu menjumlahkannya. <i>(model skor berbobot)</i></dd></div><div><dt><span class=\"en\">Net present value (NPV)</span></dt><dd>Selisih nilai sekarang seluruh manfaat dan seluruh biaya proyek setelah didiskonto. NPV positif berarti proyek menghasilkan nilai. <i>(nilai sekarang bersih)</i></dd></div><div><dt><span class=\"en\">Return on investment (ROI)</span></dt><dd>Perbandingan manfaat bersih terhadap biaya investasi, dinyatakan dalam persen. <i>(tingkat pengembalian investasi)</i></dd></div><div><dt><span class=\"en\">Payback period</span></dt><dd>Lama waktu sampai manfaat kumulatif menutup biaya kumulatif proyek. <i>(periode pengembalian)</i></dd></div><div><dt><span class=\"en\">Discount rate</span></dt><dd>Tingkat bunga yang dipakai untuk mengubah uang di masa depan menjadi nilai sekarang; sering disebut juga required rate of return. <i>(tingkat diskonto)</i></dd></div><div><dt><span class=\"en\">Discount factor</span></dt><dd>Pengali untuk mengubah nilai tahun ke-t menjadi nilai sekarang: 1/(1+r)^t. <i>(faktor diskonto)</i></dd></div><div><dt><span class=\"en\">Opportunity cost of capital</span></dt><dd>Imbal hasil yang hilang karena dana dipakai untuk proyek ini, bukan untuk alternatif lain. <i>(biaya peluang modal)</i></dd></div><div><dt><span class=\"en\">Sponsor</span></dt><dd>Orang atau kelompok yang menyediakan sumber daya dan dukungan bagi proyek serta bertanggung jawab atas keberhasilannya. <i>(sponsor / penyandang proyek)</i></dd></div><div><dt><span class=\"en\">Project charter</span></dt><dd>Dokumen yang secara resmi mengesahkan proyek dan memberi wewenang kepada manajer proyek. <i>(piagam proyek)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Marchewka, J. T. (2016). <i>Information technology project management: Providing measurable organizational value</i> (5th ed.). Wiley.</li><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Seleksi & Kelayakan Proyek (2)","subtitle":"Project charter, identifikasi dan analisis pemangku kepentingan","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Seleksi &amp; Kelayakan Proyek (2)</h1><p class=\"lead\">Project charter, identifikasi dan analisis pemangku kepentingan</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Charter + peta stakeholder</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis kelayakan proyek SI dan menyusun business case serta project charter (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3 dan 4)</span></h3><ol><li>Ketepatan menghitung NPV, ROI, dan payback period. <span class=\"muted\">(Pertemuan 2)</span></li><li>Kelengkapan analisis kelayakan teknis, operasional, dan ekonomi. <span class=\"muted\">(Pertemuan 2)</span></li><li>Kelengkapan project charter (tujuan, ruang lingkup awal, milestone, anggaran, sponsor).</li><li>Ketepatan identifikasi dan analisis pemangku kepentingan.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 2 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa arti NPV positif bagi sebuah proyek?</li><li>Sebutkan tiga aspek studi kelayakan dalam mata kuliah ini.</li><li>Mengapa business case perlu membandingkan minimal dua alternatif?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari business case ke charter</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur dari strategi organisasi ke seleksi proyek, studi kelayakan dan business case, lalu project charter yang mengesahkan proyek.\"><defs><marker id=\"pf\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Strategi organisasi</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">Renstra, visi-misi</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Seleksi proyek</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">ide mana yang didanai?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kelayakan &amp; business case</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">layak? bernilai?</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#pf)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Project charter</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">proyek resmi dimulai</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 2 ·····························································</text><text x=\"660\" y=\"150\" class=\"s-hd\">PERTEMUAN 3</text></svg><figcaption>Proyek SI yang baik berangkat dari strategi organisasi, bukan dari keinginan membeli teknologi. Alur ini dirangkum dari Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"project-charter\">project charter</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A document issued by the project initiator or sponsor that formally authorizes the existence of a project and provides the project manager with the authority to apply organizational resources to project activities.\"</p><p class=\"tr\">\"Dokumen yang diterbitkan oleh pemrakarsa atau sponsor proyek yang secara resmi mengesahkan keberadaan proyek dan memberikan kepada manajer proyek wewenang untuk menerapkan sumber daya organisasi pada kegiatan proyek.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li><b>Mengesahkan</b>: proyek resmi ada, bukan sekadar ide.</li><li><b>Memberi wewenang</b>: manajer proyek boleh meminta orang, waktu, dan dana.</li><li><b>Menyamakan pemahaman</b>: tujuan dan batas awal disepakati sejak hari pertama.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Siapa menandatangani?</h3><p><button type=\"button\" class=\"term\" data-term=\"sponsor\">Sponsor</button>: pihak yang menyediakan dana dan dukungan, mis. pimpinan instansi, pemilik UMKM, atau pengasuh pesantren.</p><p class=\"muted\">Charter yang tidak ditandatangani sponsor tidak punya kekuatan.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Struktur</span><span>Indikator 3</span></div><h2>Isi sebuah project charter</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Bagian</th><th>Isi singkat</th></tr></thead><tbody><tr><td><b>Judul proyek</b></td><td>Nama yang jelas dan spesifik</td></tr><tr><td><b>Tanggal mulai &amp; perkiraan selesai</b></td><td>Batas waktu proyek</td></tr><tr><td><b>Informasi anggaran</b></td><td>Batas biaya yang disetujui</td></tr><tr><td><b>Manajer proyek</b></td><td>Nama dan kontak</td></tr><tr><td><b>Tujuan proyek</b></td><td>Apa yang ingin dicapai</td></tr><tr><td><b>Kriteria keberhasilan utama</b></td><td>Ukuran berhasil yang disepakati</td></tr><tr><td><b>Pendekatan</b></td><td>Cara kerja dan tonggak utama</td></tr><tr><td><b>Peran &amp; tanggung jawab</b></td><td>Sponsor, manajer, tim, mitra</td></tr><tr><td><b>Pengesahan</b></td><td>Tanda tangan pihak berwenang</td></tr></tbody></table></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek dengan indikator RPS</h3><ul><li>Tujuan → <b>Tujuan proyek</b></li><li>Ruang lingkup awal → <b>Pendekatan</b> dan tujuan</li><li><button type=\"button\" class=\"term\" data-term=\"milestone\">Milestone</button> → <b>Pendekatan</b></li><li>Anggaran → <b>Informasi anggaran</b></li><li>Sponsor → <b>Peran</b> dan <button type=\"button\" class=\"term\" data-term=\"sign-off\">sign-off</button></li></ul></div></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Diadaptasi dari contoh project charter dalam Schwalbe (2019). Contoh di buku juga memuat kolom komentar dari pihak yang menandatangani.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · lanjutan Pertemuan 2</span></div><h2>Charter SI Pesantren Al-Hikmah</h2><div class=\"tw\"><table class=\"t\"><tbody><tr><td style=\"width:24%\"><b>Judul</b></td><td>Pengembangan Sistem Informasi Pendaftaran, SPP, dan Rapor Santri</td></tr><tr><td><b>Waktu</b></td><td>Februari – Juli (6 bulan)</td></tr><tr><td><b>Anggaran</b></td><td>Rp80 juta investasi awal; Rp15 juta per tahun untuk operasional</td></tr><tr><td><b>Sponsor / MP</b></td><td>Pengasuh pesantren / kepala bagian TI pesantren</td></tr><tr><td><b>Tujuan</b></td><td>Pendaftaran santri baru dan tagihan SPP dilakukan daring; rapor dicetak dari sistem</td></tr><tr><td><b>Kriteria berhasil</b></td><td>100% santri baru mendaftar daring; tunggakan SPP turun; rapor semester genap dicetak dari sistem</td></tr><tr><td><b>Milestone</b></td><td>Analisis selesai (Maret) · modul pendaftaran (April) · modul SPP (Mei) · uji pengguna (Juni) · serah terima (Juli)</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi. Angka anggaran sama dengan contoh hitung Pertemuan 2.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Waspada</span><span>Indikator 3</span></div><h2>Charter yang lemah vs charter yang kuat</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Bagian</th><th>Lemah</th><th>Kuat</th></tr></thead><tbody><tr><td><b>Tujuan</b></td><td>\"Membuat aplikasi yang bagus.\"</td><td>\"Tagihan SPP terkirim otomatis lewat WhatsApp setiap tanggal 1.\"</td></tr><tr><td><b>Kriteria</b></td><td>\"Pengguna puas.\"</td><td>\"Tunggakan SPP turun minimal 20% dibanding semester lalu.\"</td></tr><tr><td><b>Lingkup awal</b></td><td>\"Semua kebutuhan pesantren.\"</td><td>\"Pendaftaran, SPP, rapor. Tidak termasuk absensi dan perpustakaan.\"</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"assumption\">Asumsi</button></b></td><td>(tidak ditulis)</td><td>\"Internet kantor pesantren tersedia minimal 20 Mbps.\"</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"constraint\">Batasan</button></b></td><td>(tidak ditulis)</td><td>\"Anggaran maksimal Rp80 juta; serah terima sebelum tahun ajaran baru.\"</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.4em;font-size:.85em\">Contoh rumusan adalah ilustrasi. Angka target perlu disepakati bersama mitra.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 2</span><span>Indikator 4</span></div><h2>Siapa pemangku kepentingan proyek?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"An individual, group, or organization that may affect, be affected by, or perceive itself to be affected by a decision, activity, or outcome of a project, program, or portfolio.\"</p><p class=\"tr\">\"Individu, kelompok, atau organisasi yang dapat memengaruhi, dipengaruhi oleh, atau menganggap dirinya dipengaruhi oleh suatu keputusan, kegiatan, atau hasil dari proyek, program, atau portofolio.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p style=\"margin-top:.7em\">Schwalbe (2019) membedakan:</p><ul><li><b>Internal</b>: sponsor, tim proyek, staf pendukung, pengguna di dalam organisasi.</li><li><b>Eksternal</b>: pelanggan, vendor, pemerintah, masyarakat, pesaing.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Yang sering terlupa</h3><ul><li>Staf yang pekerjaannya berubah karena sistem baru</li><li>Bagian keuangan yang membayar lisensi dan hosting</li><li>Regulator, mis. Kemenag atau dinas terkait</li><li>Pihak yang merasa dirugikan</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat</span><span>Indikator 4</span></div><h2><button type=\"button\" class=\"term\" data-term=\"stakeholder-register\">Stakeholder register</button></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Nama / jabatan</th><th>Peran dalam proyek</th><th>Kepentingan utama</th><th>Pengaruh</th><th>Harapan / kekhawatiran</th></tr></thead><tbody><tr><td>Pengasuh pesantren</td><td>Sponsor</td><td>Layanan santri lebih tertib</td><td>Tinggi</td><td>Biaya terkendali</td></tr><tr><td>Kepala bagian keuangan</td><td>Pengguna kunci</td><td>Tagihan SPP akurat</td><td>Tinggi</td><td>Khawatir data keuangan bocor</td></tr><tr><td>Staf administrasi</td><td>Pengguna harian</td><td>Pekerjaan lebih ringan</td><td>Sedang</td><td>Takut tidak bisa memakai sistem</td></tr><tr><td>Wali santri</td><td>Penerima layanan</td><td>Info tagihan dan rapor jelas</td><td>Rendah</td><td>Tidak semua punya ponsel pintar</td></tr></tbody></table></div><p style=\"margin-top:.6em\">Isi register: <b>identitas</b>, <b>penilaian</b> (kepentingan, pengaruh, harapan), dan <b>klasifikasi</b> (mis. internal/eksternal, kuadran pada grid) <span class=\"cite\">(Schwalbe, 2019)</span>.</p><p class=\"muted\" style=\"font-size:.8em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis</span><span>Indikator 4</span></div><h2><button type=\"button\" class=\"term\" data-term=\"power-interest\">Power/interest grid</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 640 330\" role=\"img\" aria-label=\"Power/interest grid. Sumbu tegak kekuasaan, sumbu datar kepentingan. Kuadran kiri atas, kekuasaan tinggi kepentingan rendah: keep satisfied, contoh pengurus yayasan. Kanan atas, kekuasaan tinggi kepentingan tinggi: manage closely, contoh pengasuh pesantren dan kepala bagian keuangan. Kiri bawah: monitor, contoh penyedia internet. Kanan bawah, kepentingan tinggi kekuasaan rendah: keep informed, contoh staf administrasi, ustaz, wali santri.\"><defs><marker id=\"pg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"70\" y1=\"300\" x2=\"70\" y2=\"18\" class=\"s-line\" marker-end=\"url(#pg)\"/><line x1=\"70\" y1=\"300\" x2=\"628\" y2=\"300\" class=\"s-line\" marker-end=\"url(#pg)\"/><text x=\"22\" y=\"160\" class=\"s-hd\" transform=\"rotate(-90 22 160)\" text-anchor=\"middle\">POWER (KEKUASAAN)</text><text x=\"350\" y=\"324\" class=\"s-hd\" text-anchor=\"middle\">INTEREST (KEPENTINGAN)</text><rect x=\"82\" y=\"26\" width=\"262\" height=\"128\" rx=\"8\" class=\"s-acc\"/><text x=\"213\" y=\"54\" text-anchor=\"middle\" class=\"s-t\">Keep satisfied</text><text x=\"213\" y=\"76\" text-anchor=\"middle\" class=\"s-s\">jaga agar tetap puas</text><text x=\"213\" y=\"118\" text-anchor=\"middle\" class=\"s-s\">mis. pengurus yayasan</text><rect x=\"354\" y=\"26\" width=\"262\" height=\"128\" rx=\"8\" class=\"s-hl\"/><text x=\"485\" y=\"54\" text-anchor=\"middle\" class=\"s-t\">Manage closely</text><text x=\"485\" y=\"76\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px;font-weight:500\">kelola secara dekat</text><text x=\"485\" y=\"110\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px;font-weight:500\">mis. pengasuh pesantren,</text><text x=\"485\" y=\"128\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px;font-weight:500\">kepala bagian keuangan</text><rect x=\"82\" y=\"162\" width=\"262\" height=\"128\" rx=\"8\" class=\"s-box\"/><text x=\"213\" y=\"190\" text-anchor=\"middle\" class=\"s-t\">Monitor</text><text x=\"213\" y=\"212\" text-anchor=\"middle\" class=\"s-s\">pantau, usaha minimal</text><text x=\"213\" y=\"254\" text-anchor=\"middle\" class=\"s-s\">mis. penyedia internet</text><rect x=\"354\" y=\"162\" width=\"262\" height=\"128\" rx=\"8\" class=\"s-soft\"/><text x=\"485\" y=\"190\" text-anchor=\"middle\" class=\"s-t\">Keep informed</text><text x=\"485\" y=\"212\" text-anchor=\"middle\" class=\"s-s\">beri informasi rutin</text><text x=\"485\" y=\"246\" text-anchor=\"middle\" class=\"s-s\">mis. staf administrasi, ustaz,</text><text x=\"485\" y=\"264\" text-anchor=\"middle\" class=\"s-s\">wali santri</text></svg><figcaption>Power/interest grid sebagaimana dibahas Schwalbe (2019). Contoh penempatan adalah ilustrasi untuk SI Pesantren Al-Hikmah (Pertemuan 2) dan bisa berbeda di setiap organisasi.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis</span><span>Indikator 4</span></div><h2>Seberapa terlibat mereka sekarang?</h2><p><button type=\"button\" class=\"term\" data-term=\"engagement-matrix\">Stakeholder engagement assessment matrix</button>: <b>C</b> = keterlibatan saat ini, <b>D</b> = keterlibatan yang diinginkan <span class=\"cite\">(Schwalbe, 2019)</span>.</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>Pemangku kepentingan</th><th>Unaware</th><th>Resistant</th><th>Neutral</th><th>Supportive</th><th>Leading</th></tr></thead><tbody><tr><td>Pengasuh pesantren</td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\">C</td><td style=\"text-align:center;font-weight:700\">D</td></tr><tr><td>Kepala bagian keuangan</td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\">C</td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\">D</td><td style=\"text-align:center;font-weight:700\"></td></tr><tr><td>Staf administrasi</td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\">C</td><td style=\"text-align:center;font-weight:700\">D</td><td style=\"text-align:center;font-weight:700\"></td></tr><tr><td>Ustaz wali kelas</td><td style=\"text-align:center;font-weight:700\">C</td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\"></td><td style=\"text-align:center;font-weight:700\">D</td><td style=\"text-align:center;font-weight:700\"></td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.7em\">Selisih antara C dan D adalah pekerjaan komunikasi tim proyek. Contoh: ustaz wali kelas masih <i>unaware</i>, padahal mereka harus mengisi nilai rapor di sistem.</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penelitian dosen pengampu</span><span>Indikator 3 dan 4</span></div><h2>Presensi rapat berbasis web di BDK Surabaya</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Kebutuhan</h3><ul><li>Presensi rapat masih memakai lembar kertas.</li><li>Masalah: rekap lama, salah catat, sulit dipantau <i>real-time</i>, arsip rusak/hilang.</li><li>Analisis kebutuhan: observasi + kuesioner pegawai (admin dan peserta).</li><li>Lebih dari 80% responden setuju–sangat setuju pada fitur digital yang diusulkan.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Solusi dan hasil</h3><ul><li>Model Waterfall: analisis, desain, implementasi, pengujian.</li><li>Tanda tangan digital, foto, validasi lokasi GPS (radius), hitung keterlambatan otomatis.</li><li>Ekspor daftar hadir PDF/CSV dengan format pengesahan Kasubbag TU.</li><li>Black Box Testing: seluruh fitur utama berfungsi.</li></ul></div></div><div class=\"callout\" style=\"margin-top:.6em\">Pelajaran untuk business case: manfaat (lebih cepat, lebih akurat) perlu dirumuskan sebagai kriteria keberhasilan yang terukur di charter.</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Sumber: Robbi dkk. (2026).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok · 10 menit</span></div><h2>Belajar dari proyek presensi rapat</h2><ol class=\"lead\"><li>Siapa sponsor dan siapa pengguna kunci proyek presensi rapat di Balai Diklat Keagamaan Surabaya?</li><li>Tempatkan minimal empat pemangku kepentingannya pada power/interest grid.</li><li>Tuliskan satu tujuan dan satu kriteria keberhasilan yang terukur untuk charter proyek tersebut.</li></ol><p class=\"muted\">Gunakan informasi dari slide sebelumnya. Bila ada yang tidak disebut di artikel, tulis sebagai asumsi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 25 menit</span></div><h2>Draf charter dan peta stakeholder</h2><div class=\"cols\"><div><p><b>Untuk proyek mitra kelompok Anda:</b></p><ol><li>Isi draf charter: judul, waktu, anggaran, sponsor, manajer proyek, tujuan, kriteria keberhasilan, milestone, asumsi, batasan.</li><li>Buat stakeholder register minimal 8 baris.</li><li>Tempatkan semuanya pada power/interest grid.</li><li>Tandai dua pemangku kepentingan dengan selisih C–D terbesar dan rencana tindakannya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dikumpulkan</h3><ul><li>Lima unsur indikator 3 terisi</li><li>Tujuan dan kriteria terukur</li><li>Ada yang \"tidak termasuk\" lingkup</li><li>Register memuat pihak internal dan eksternal</li><li>Anggaran sama dengan business case</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Project charter <b>mengesahkan</b> proyek dan <b>memberi wewenang</b> kepada manajer proyek.</li><li>Charter memuat tujuan, lingkup awal, milestone, anggaran, sponsor, dan kriteria keberhasilan yang <b>terukur</b>.</li><li>Pemangku kepentingan: semua pihak yang memengaruhi, dipengaruhi, atau merasa dipengaruhi proyek.</li><li>Catat di <b>stakeholder register</b>, petakan di <b>power/interest grid</b>.</li><li>Kelola selisih keterlibatan saat ini (C) dan yang diinginkan (D).</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Charter mengesahkan keberadaan proyek dan memberi wewenang kepada manajer proyek (PMI, 2025).\"><p class=\"q\">Fungsi utama project charter adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Merinci seluruh tugas proyek</button><button type=\"button\" data-o=\"b\">B. Mengesahkan proyek dan memberi wewenang manajer proyek</button><button type=\"button\" data-o=\"c\">C. Menghitung NPV proyek</button><button type=\"button\" data-o=\"d\">D. Mencatat bug sistem</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Kekuasaan tinggi dan kepentingan tinggi berada di kuadran manage closely.\"><p class=\"q\">Kepala bagian keuangan punya pengaruh besar dan sangat peduli pada proyek. Strateginya adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Monitor</button><button type=\"button\" data-o=\"b\">B. Keep informed</button><button type=\"button\" data-o=\"c\">C. Keep satisfied</button><button type=\"button\" data-o=\"d\">D. Manage closely</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Kriteria terukur menyebut ukuran dan periode waktu.\"><p class=\"q\">Manakah kriteria keberhasilan yang paling terukur?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Pengguna merasa puas</button><button type=\"button\" data-o=\"b\">B. Aplikasi tampil menarik</button><button type=\"button\" data-o=\"c\">C. Tunggakan SPP turun 20% dalam satu semester</button><button type=\"button\" data-o=\"d\">D. Sistem selesai secepatnya</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian project charter dan identifikasi pemangku kepentingan dalam Schwalbe (2019), serta artikel Robbi dkk. (2026) tentang sistem presensi rapat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · bagian pertama)</h3><ul><li>Lengkapi <b>business case</b> (10 bagian, minimal dua alternatif, tabel NPV/ROI/payback).</li><li>Susun <b>project charter</b> 1–2 halaman dan mintakan tanda tangan sponsor mitra.</li><li>Lampirkan <b>stakeholder register</b> dan <b>power/interest grid</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Format, tenggat, dan rubrik ada di lembar Tugas 1. Pertemuan 4 masuk ke pengumpulan kebutuhan dan scope statement.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Project charter</span></dt><dd>Dokumen yang secara resmi mengesahkan proyek dan memberi wewenang kepada manajer proyek. <i>(piagam proyek)</i></dd></div><div><dt><span class=\"en\">Sponsor</span></dt><dd>Orang atau kelompok yang menyediakan sumber daya dan dukungan bagi proyek serta bertanggung jawab atas keberhasilannya. <i>(sponsor / penyandang proyek)</i></dd></div><div><dt><span class=\"en\">Milestone</span></dt><dd>Titik penting dalam jadwal proyek yang menandai selesainya hasil atau fase tertentu; durasinya nol. <i>(tonggak proyek)</i></dd></div><div><dt><span class=\"en\">Success criteria</span></dt><dd>Ukuran yang disepakati untuk menyatakan proyek berhasil, mis. sistem dipakai seluruh staf dalam satu bulan. <i>(kriteria keberhasilan)</i></dd></div><div><dt><span class=\"en\">Assumption</span></dt><dd>Hal yang dianggap benar untuk keperluan perencanaan tanpa bukti pasti, sehingga perlu dicek kembali. <i>(asumsi)</i></dd></div><div><dt><span class=\"en\">Constraint</span></dt><dd>Batasan yang membatasi pilihan tim proyek, mis. anggaran tetap atau tenggat yang tidak bisa digeser. <i>(batasan / kendala)</i></dd></div><div><dt><span class=\"en\">Sign-off</span></dt><dd>Persetujuan resmi (biasanya bertanda tangan) dari pihak berwenang atas sebuah dokumen atau hasil. <i>(pengesahan)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Stakeholder register</span></dt><dd>Dokumen yang mencatat identitas, kepentingan, pengaruh, dan klasifikasi para pemangku kepentingan proyek. <i>(daftar pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Power/interest grid</span></dt><dd>Kisi dua kali dua untuk mengelompokkan pemangku kepentingan menurut kekuasaan (power) dan kepentingan (interest) mereka terhadap proyek. <i>(kisi kekuasaan–kepentingan)</i></dd></div><div><dt><span class=\"en\">Stakeholder engagement assessment matrix</span></dt><dd>Tabel yang membandingkan tingkat keterlibatan pemangku kepentingan saat ini dengan tingkat yang diinginkan. <i>(matriks penilaian keterlibatan)</i></dd></div><div><dt><span class=\"en\">Kick-off meeting</span></dt><dd>Rapat pembukaan proyek untuk menyamakan pemahaman tujuan, peran, dan rencana kerja di antara pihak yang terlibat. <i>(rapat pembukaan proyek)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Robbi, I. A., Mufliq, A., Nugroho, R. A., Mu'min, S., Andhyka, A., Arif, S., &amp; Al-Haq, A. K. (2026). Perancangan sistem presensi rapat berbasis web untuk meningkatkan efisiensi administrasi pada Balai Diklat Keagamaan Surabaya. <i>Jurnal Riset Sistem Informasi dan Teknologi Informasi (JURSISTEKNI), 8</i>(1), 1090–1105.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Manajemen Lingkup (1)","subtitle":"Pengumpulan kebutuhan dan scope statement","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Lingkup (1)</h1><p class=\"lead\">Pengumpulan kebutuhan dan scope statement</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Kebutuhan → scope statement</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun rencana lingkup proyek SI, termasuk scope statement dan WBS (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2)</span></h3><ol><li>Ketepatan menurunkan kebutuhan pemangku kepentingan menjadi lingkup proyek.</li><li>Kelengkapan scope statement (deliverable, batasan, asumsi, kriteria penerimaan).</li><li>Ketepatan dekomposisi WBS dan WBS dictionary. <span class=\"muted\">(Pertemuan 5)</span></li><li>Ketepatan mengidentifikasi potensi scope creep. <span class=\"muted\">(Pertemuan 5)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa dua fungsi utama project charter?</li><li>Mengapa kriteria keberhasilan di charter harus terukur?</li><li>Pemangku kepentingan dengan kekuasaan tinggi dan kepentingan tinggi dikelola dengan strategi apa?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari charter ke lingkup yang rinci</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen lingkup: mengumpulkan kebutuhan dan menyusun scope statement dibahas di Pertemuan 4; membuat WBS serta validasi dan pengendalian lingkup di Pertemuan 5.\"><defs><marker id=\"ps\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kumpulkan kebutuhan</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dibutuhkan?</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope statement</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dikerjakan dan tidak?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Buat WBS</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">pecah menjadi paket kerja</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Validasi &amp; kendalikan</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">terima hasil, jaga batas</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 4 (HARI INI) ··········································</text><text x=\"446\" y=\"150\" class=\"s-hd\">PERTEMUAN 5 ··········································</text></svg><figcaption>Alur manajemen lingkup dalam mata kuliah ini, dirangkum dari pembahasan scope management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>\"Tolong buatkan sistem informasi pesantren\"</h2><div class=\"cols w\"><div><p class=\"lead\">Pengasuh menyampaikan permintaan itu. Lalu Anda bertanya kepada empat orang:</p><ul><li><b>Pengasuh</b>: \"Saya ingin tahu jumlah santri dan keuangan kapan saja.\"</li><li><b>Bagian keuangan</b>: \"Tagihan SPP jangan lagi dihitung manual.\"</li><li><b>Admin</b>: \"Data pendaftar jangan diketik dua kali.\"</li><li><b>Ustaz wali kelas</b>: \"Rapor jangan direkap dari tumpukan kertas.\"</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Diskusikan 3 menit</h3><ol><li>Apakah empat kalimat ini sudah cukup untuk mulai membuat sistem?</li><li>Apa yang masih kabur?</li><li>Apa risikonya bila tim langsung mengetik kode?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"scope\">lingkup</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The sum of the products, services, and results to be provided as a project.\"</p><p class=\"tr\">\"Jumlah dari produk, layanan, dan hasil yang akan diberikan sebagai suatu proyek.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Lingkup selalu punya dua sisi, yaitu apa yang dihasilkan dan pekerjaan untuk menghasilkannya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Dua jenis lingkup</h3><table class=\"t\"><tbody><tr><th></th><th><button type=\"button\" class=\"term\" data-term=\"product-scope\">Lingkup produk</button></th><th><button type=\"button\" class=\"term\" data-term=\"project-scope\">Lingkup proyek</button></th></tr><tr><td>Isi</td><td>fitur dan fungsi sistem</td><td>pekerjaan untuk menghasilkannya</td></tr><tr><td>Contoh</td><td>modul tagihan SPP</td><td>analisis, desain, coding, uji, pelatihan</td></tr><tr><td>Diukur dengan</td><td>kebutuhan</td><td>rencana kerja</td></tr></tbody></table><p class=\"muted\" style=\"margin:.5em 0 0;font-size:.85em\">Diadaptasi dari pembedaan lingkup produk dan lingkup proyek (PMI, 2025).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Kebutuhan: dari keinginan ke yang dapat diuji</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A condition or capability that is necessary to be present in a product, service, or result to satisfy a business need.\"</p><p class=\"tr\">\"Suatu kondisi atau kemampuan yang perlu ada pada suatu produk, layanan, atau hasil untuk memenuhi suatu kebutuhan bisnis.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Ada tiga lapis yang sering bercampur:</p><ul><li><b>Kebutuhan bisnis</b>: mengapa proyek ada (mis. tunggakan SPP berkurang).</li><li><b>Kebutuhan pemangku kepentingan</b>: apa yang diperlukan tiap pihak.</li><li><b>Kebutuhan solusi</b>: apa yang harus dimiliki sistem.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Dua jenis kebutuhan solusi</h3><p><button type=\"button\" class=\"term\" data-term=\"functional-req\">Fungsional</button>: apa yang dilakukan sistem.</p><p class=\"muted\" style=\"margin-top:0\">\"Sistem membuat tagihan SPP bulanan untuk setiap santri aktif.\"</p><p><button type=\"button\" class=\"term\" data-term=\"nonfunctional-req\">Nonfungsional</button>: seberapa baik atau dalam batasan apa.</p><p class=\"muted\" style=\"margin:0\">\"Dasbor pengasuh tampil kurang dari 3 detik pada jaringan 4G.\"</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknik</span><span>Indikator 1</span></div><h2>Menggali kebutuhan (<button type=\"button\" class=\"term\" data-term=\"elicitation\">elicitation</button>)</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknik</th><th>Cocok untuk</th><th>Contoh di proyek mitra</th></tr></thead><tbody><tr><td><b>Wawancara</b></td><td>pimpinan, pengguna kunci</td><td>Tanya pengasuh tentang laporan yang diperlukan</td></tr><tr><td><b>Diskusi kelompok</b></td><td>banyak pihak, perlu kesepakatan</td><td>Pertemuan staf keuangan, admin, dan ustaz</td></tr><tr><td><b>Kuesioner</b></td><td>pengguna yang banyak</td><td>Formulir daring untuk wali santri</td></tr><tr><td><b>Observasi</b></td><td>proses yang berjalan</td><td>Mengamati antrean pembayaran SPP</td></tr><tr><td><b>Analisis dokumen</b></td><td>proses sudah tercatat</td><td>Buku induk, formulir, rekap Excel</td></tr><tr><td><b>Prototipe</b></td><td>kebutuhan sulit diucapkan</td><td>Sketsa layar tagihan untuk dikomentari</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Daftar teknik diadaptasi dari pembahasan pengumpulan kebutuhan (PMI, 2025; Schwalbe, 2019). Contoh adalah kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 1</span></div><h2>Menulis kebutuhan yang dapat diuji</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Masih kabur</th><th>Dapat diuji</th></tr></thead><tbody><tr><td>Sistem harus cepat.</td><td>Dasbor pengasuh tampil kurang dari 3 detik pada jaringan 4G.</td></tr><tr><td>Aplikasi mudah dipakai.</td><td>Wali kelas dapat menginput presensi satu kelas (maks. 40 santri) dalam kurang dari 2 menit setelah pelatihan 1 sesi.</td></tr><tr><td>Tagihan otomatis.</td><td>Sistem menerbitkan tagihan SPP bulanan untuk seluruh santri aktif pada tanggal 1 tiap bulan.</td></tr><tr><td>Data aman.</td><td>Nilai santri hanya dapat dilihat oleh wali kelas yang bersangkutan dan pengasuh.</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.6em\"><b>Ciri kebutuhan yang baik:</b> jelas (satu makna), dapat diuji (ada ukuran), satu hal per kalimat, dan punya sumber (siapa yang memintanya).</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 1</span></div><h2>Memilih yang didahulukan: <button type=\"button\" class=\"term\" data-term=\"moscow\">MoSCoW</button></h2><div class=\"grid4\"><div class=\"card ok\"><h3>Must</h3><p>Tanpa ini proyek dianggap gagal.</p><p class=\"muted\" style=\"margin:0\">Tagihan SPP otomatis</p></div><div class=\"card hl\"><h3>Should</h3><p>Penting, tetapi ada jalan sementara.</p><p class=\"muted\" style=\"margin:0\">Cetak rapor dari impor nilai</p></div><div class=\"card\"><h3>Could</h3><p>Bagus bila waktu dan dana ada.</p><p class=\"muted\" style=\"margin:0\">Notifikasi tagihan lewat WhatsApp</p></div><div class=\"card warn\"><h3>Won't (kali ini)</h3><p>Disepakati tidak dikerjakan sekarang.</p><p class=\"muted\" style=\"margin:0\">Pembayaran dompet digital</p></div></div><p style=\"margin-top:.8em\">Saat pemangku kepentingan berbeda pendapat, kembali ke <b>tujuan di charter</b> dan <b>peta power/interest</b> dari Pertemuan 3. Keputusan akhir ada pada sponsor.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumentasi</span><span>Indikator 1</span></div><h2>Daftar kebutuhan dan <button type=\"button\" class=\"term\" data-term=\"traceability-matrix\">matriks keterlacakan</button></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>ID</th><th>Kebutuhan</th><th>Sumber</th><th>Prioritas</th><th>Deliverable</th></tr></thead><tbody><tr><td>K-01</td><td>Dasbor menampilkan jumlah santri dan total tunggakan per bulan</td><td>Pengasuh</td><td>Must</td><td>Dasbor pengasuh</td></tr><tr><td>K-02</td><td>Tagihan SPP terbit otomatis tiap bulan</td><td>Bag. keuangan</td><td>Must</td><td>Modul tagihan</td></tr><tr><td>K-03</td><td>Data pendaftar diterima tidak diketik ulang</td><td>Admin</td><td>Must</td><td>Modul pendaftaran</td></tr><tr><td>K-04</td><td>Nilai diimpor dari spreadsheet dan rapor dapat dicetak</td><td>Ustaz</td><td>Should</td><td>Modul rapor</td></tr><tr><td>K-05</td><td>Pembayaran lewat dompet digital</td><td>Wali santri</td><td>Won't</td><td>(ditunda)</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Kasus ilustrasi. Matriks ini dilengkapi kolom pengujian di Pertemuan 11 (UAT).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"s
