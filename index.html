\"button\" data-o=\"a\">A. Pengguna merasa puas</button><button type=\"button\" data-o=\"b\">B. Aplikasi tampil menarik</button><button type=\"button\" data-o=\"c\">C. Tunggakan SPP turun 20% dalam satu semester</button><button type=\"button\" data-o=\"d\">D. Sistem selesai secepatnya</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian project charter dan identifikasi pemangku kepentingan dalam Schwalbe (2019), serta artikel Robbi dkk. (2026) tentang sistem presensi rapat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · bagian pertama)</h3><ul><li>Lengkapi <b>business case</b> (10 bagian, minimal dua alternatif, tabel NPV/ROI/payback).</li><li>Susun <b>project charter</b> 1–2 halaman dan mintakan tanda tangan sponsor mitra.</li><li>Lampirkan <b>stakeholder register</b> dan <b>power/interest grid</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Format, tenggat, dan rubrik ada di lembar Tugas 1. Pertemuan 4 masuk ke pengumpulan kebutuhan dan scope statement.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Project charter</span></dt><dd>Dokumen yang secara resmi mengesahkan proyek dan memberi wewenang kepada manajer proyek. <i>(piagam proyek)</i></dd></div><div><dt><span class=\"en\">Sponsor</span></dt><dd>Orang atau kelompok yang menyediakan sumber daya dan dukungan bagi proyek serta bertanggung jawab atas keberhasilannya. <i>(sponsor / penyandang proyek)</i></dd></div><div><dt><span class=\"en\">Milestone</span></dt><dd>Titik penting dalam jadwal proyek yang menandai selesainya hasil atau fase tertentu; durasinya nol. <i>(tonggak proyek)</i></dd></div><div><dt><span class=\"en\">Success criteria</span></dt><dd>Ukuran yang disepakati untuk menyatakan proyek berhasil, mis. sistem dipakai seluruh staf dalam satu bulan. <i>(kriteria keberhasilan)</i></dd></div><div><dt><span class=\"en\">Assumption</span></dt><dd>Hal yang dianggap benar untuk keperluan perencanaan tanpa bukti pasti, sehingga perlu dicek kembali. <i>(asumsi)</i></dd></div><div><dt><span class=\"en\">Constraint</span></dt><dd>Batasan yang membatasi pilihan tim proyek, mis. anggaran tetap atau tenggat yang tidak bisa digeser. <i>(batasan / kendala)</i></dd></div><div><dt><span class=\"en\">Sign-off</span></dt><dd>Persetujuan resmi (biasanya bertanda tangan) dari pihak berwenang atas sebuah dokumen atau hasil. <i>(pengesahan)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Stakeholder register</span></dt><dd>Dokumen yang mencatat identitas, kepentingan, pengaruh, dan klasifikasi para pemangku kepentingan proyek. <i>(daftar pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Power/interest grid</span></dt><dd>Kisi dua kali dua untuk mengelompokkan pemangku kepentingan menurut kekuasaan (power) dan kepentingan (interest) mereka terhadap proyek. <i>(kisi kekuasaan–kepentingan)</i></dd></div><div><dt><span class=\"en\">Stakeholder engagement assessment matrix</span></dt><dd>Tabel yang membandingkan tingkat keterlibatan pemangku kepentingan saat ini dengan tingkat yang diinginkan. <i>(matriks penilaian keterlibatan)</i></dd></div><div><dt><span class=\"en\">Kick-off meeting</span></dt><dd>Rapat pembukaan proyek untuk menyamakan pemahaman tujuan, peran, dan rencana kerja di antara pihak yang terlibat. <i>(rapat pembukaan proyek)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Robbi, I. A., Mufliq, A., Nugroho, R. A., Mu'min, S., Andhyka, A., Arif, S., &amp; Al-Haq, A. K. (2026). Perancangan sistem presensi rapat berbasis web untuk meningkatkan efisiensi administrasi pada Balai Diklat Keagamaan Surabaya. <i>Jurnal Riset Sistem Informasi dan Teknologi Informasi (JURSISTEKNI), 8</i>(1), 1090–1105.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Manajemen Lingkup (1)","subtitle":"Pengumpulan kebutuhan dan scope statement","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Lingkup (1)</h1><p class=\"lead\">Pengumpulan kebutuhan dan scope statement</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Kebutuhan → scope statement</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun rencana lingkup proyek SI, termasuk scope statement dan WBS (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2)</span></h3><ol><li>Ketepatan menurunkan kebutuhan pemangku kepentingan menjadi lingkup proyek.</li><li>Kelengkapan scope statement (deliverable, batasan, asumsi, kriteria penerimaan).</li><li>Ketepatan dekomposisi WBS dan WBS dictionary. <span class=\"muted\">(Pertemuan 5)</span></li><li>Ketepatan mengidentifikasi potensi scope creep. <span class=\"muted\">(Pertemuan 5)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa dua fungsi utama project charter?</li><li>Mengapa kriteria keberhasilan di charter harus terukur?</li><li>Pemangku kepentingan dengan kekuasaan tinggi dan kepentingan tinggi dikelola dengan strategi apa?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari charter ke lingkup yang rinci</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen lingkup: mengumpulkan kebutuhan dan menyusun scope statement dibahas di Pertemuan 4; membuat WBS serta validasi dan pengendalian lingkup di Pertemuan 5.\"><defs><marker id=\"ps\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kumpulkan kebutuhan</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dibutuhkan?</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope statement</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dikerjakan dan tidak?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Buat WBS</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">pecah menjadi paket kerja</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Validasi &amp; kendalikan</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">terima hasil, jaga batas</text><text x=\"10\" y=\"150\" class=\"s-hd\">PERTEMUAN 4 (HARI INI) ··········································</text><text x=\"446\" y=\"150\" class=\"s-hd\">PERTEMUAN 5 ··········································</text></svg><figcaption>Alur manajemen lingkup dalam mata kuliah ini, dirangkum dari pembahasan scope management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>\"Tolong buatkan sistem informasi pesantren\"</h2><div class=\"cols w\"><div><p class=\"lead\">Pengasuh menyampaikan permintaan itu. Lalu Anda bertanya kepada empat orang:</p><ul><li><b>Pengasuh</b>: \"Saya ingin tahu jumlah santri dan keuangan kapan saja.\"</li><li><b>Bagian keuangan</b>: \"Tagihan SPP jangan lagi dihitung manual.\"</li><li><b>Admin</b>: \"Data pendaftar jangan diketik dua kali.\"</li><li><b>Ustaz wali kelas</b>: \"Rapor jangan direkap dari tumpukan kertas.\"</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Diskusikan 3 menit</h3><ol><li>Apakah empat kalimat ini sudah cukup untuk mulai membuat sistem?</li><li>Apa yang masih kabur?</li><li>Apa risikonya bila tim langsung mengetik kode?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"scope\">lingkup</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The sum of the products, services, and results to be provided as a project.\"</p><p class=\"tr\">\"Jumlah dari produk, layanan, dan hasil yang akan diberikan sebagai suatu proyek.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Lingkup selalu punya dua sisi, yaitu apa yang dihasilkan dan pekerjaan untuk menghasilkannya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Dua jenis lingkup</h3><table class=\"t\"><tbody><tr><th></th><th><button type=\"button\" class=\"term\" data-term=\"product-scope\">Lingkup produk</button></th><th><button type=\"button\" class=\"term\" data-term=\"project-scope\">Lingkup proyek</button></th></tr><tr><td>Isi</td><td>fitur dan fungsi sistem</td><td>pekerjaan untuk menghasilkannya</td></tr><tr><td>Contoh</td><td>modul tagihan SPP</td><td>analisis, desain, coding, uji, pelatihan</td></tr><tr><td>Diukur dengan</td><td>kebutuhan</td><td>rencana kerja</td></tr></tbody></table><p class=\"muted\" style=\"margin:.5em 0 0;font-size:.85em\">Diadaptasi dari pembedaan lingkup produk dan lingkup proyek (PMI, 2025).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Kebutuhan: dari keinginan ke yang dapat diuji</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A condition or capability that is necessary to be present in a product, service, or result to satisfy a business need.\"</p><p class=\"tr\">\"Suatu kondisi atau kemampuan yang perlu ada pada suatu produk, layanan, atau hasil untuk memenuhi suatu kebutuhan bisnis.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Ada tiga lapis yang sering bercampur:</p><ul><li><b>Kebutuhan bisnis</b>: mengapa proyek ada (mis. tunggakan SPP berkurang).</li><li><b>Kebutuhan pemangku kepentingan</b>: apa yang diperlukan tiap pihak.</li><li><b>Kebutuhan solusi</b>: apa yang harus dimiliki sistem.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Dua jenis kebutuhan solusi</h3><p><button type=\"button\" class=\"term\" data-term=\"functional-req\">Fungsional</button>: apa yang dilakukan sistem.</p><p class=\"muted\" style=\"margin-top:0\">\"Sistem membuat tagihan SPP bulanan untuk setiap santri aktif.\"</p><p><button type=\"button\" class=\"term\" data-term=\"nonfunctional-req\">Nonfungsional</button>: seberapa baik atau dalam batasan apa.</p><p class=\"muted\" style=\"margin:0\">\"Dasbor pengasuh tampil kurang dari 3 detik pada jaringan 4G.\"</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknik</span><span>Indikator 1</span></div><h2>Menggali kebutuhan (<button type=\"button\" class=\"term\" data-term=\"elicitation\">elicitation</button>)</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknik</th><th>Cocok untuk</th><th>Contoh di proyek mitra</th></tr></thead><tbody><tr><td><b>Wawancara</b></td><td>pimpinan, pengguna kunci</td><td>Tanya pengasuh tentang laporan yang diperlukan</td></tr><tr><td><b>Diskusi kelompok</b></td><td>banyak pihak, perlu kesepakatan</td><td>Pertemuan staf keuangan, admin, dan ustaz</td></tr><tr><td><b>Kuesioner</b></td><td>pengguna yang banyak</td><td>Formulir daring untuk wali santri</td></tr><tr><td><b>Observasi</b></td><td>proses yang berjalan</td><td>Mengamati antrean pembayaran SPP</td></tr><tr><td><b>Analisis dokumen</b></td><td>proses sudah tercatat</td><td>Buku induk, formulir, rekap Excel</td></tr><tr><td><b>Prototipe</b></td><td>kebutuhan sulit diucapkan</td><td>Sketsa layar tagihan untuk dikomentari</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Daftar teknik diadaptasi dari pembahasan pengumpulan kebutuhan (PMI, 2025; Schwalbe, 2019). Contoh adalah kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 1</span></div><h2>Menulis kebutuhan yang dapat diuji</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Masih kabur</th><th>Dapat diuji</th></tr></thead><tbody><tr><td>Sistem harus cepat.</td><td>Dasbor pengasuh tampil kurang dari 3 detik pada jaringan 4G.</td></tr><tr><td>Aplikasi mudah dipakai.</td><td>Wali kelas dapat menginput presensi satu kelas (maks. 40 santri) dalam kurang dari 2 menit setelah pelatihan 1 sesi.</td></tr><tr><td>Tagihan otomatis.</td><td>Sistem menerbitkan tagihan SPP bulanan untuk seluruh santri aktif pada tanggal 1 tiap bulan.</td></tr><tr><td>Data aman.</td><td>Nilai santri hanya dapat dilihat oleh wali kelas yang bersangkutan dan pengasuh.</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.6em\"><b>Ciri kebutuhan yang baik:</b> jelas (satu makna), dapat diuji (ada ukuran), satu hal per kalimat, dan punya sumber (siapa yang memintanya).</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 1</span></div><h2>Memilih yang didahulukan: <button type=\"button\" class=\"term\" data-term=\"moscow\">MoSCoW</button></h2><div class=\"grid4\"><div class=\"card ok\"><h3>Must</h3><p>Tanpa ini proyek dianggap gagal.</p><p class=\"muted\" style=\"margin:0\">Tagihan SPP otomatis</p></div><div class=\"card hl\"><h3>Should</h3><p>Penting, tetapi ada jalan sementara.</p><p class=\"muted\" style=\"margin:0\">Cetak rapor dari impor nilai</p></div><div class=\"card\"><h3>Could</h3><p>Bagus bila waktu dan dana ada.</p><p class=\"muted\" style=\"margin:0\">Notifikasi tagihan lewat WhatsApp</p></div><div class=\"card warn\"><h3>Won't (kali ini)</h3><p>Disepakati tidak dikerjakan sekarang.</p><p class=\"muted\" style=\"margin:0\">Pembayaran dompet digital</p></div></div><p style=\"margin-top:.8em\">Saat pemangku kepentingan berbeda pendapat, kembali ke <b>tujuan di charter</b> dan <b>peta power/interest</b> dari Pertemuan 3. Keputusan akhir ada pada sponsor.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dokumentasi</span><span>Indikator 1</span></div><h2>Daftar kebutuhan dan <button type=\"button\" class=\"term\" data-term=\"traceability-matrix\">matriks keterlacakan</button></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>ID</th><th>Kebutuhan</th><th>Sumber</th><th>Prioritas</th><th>Deliverable</th></tr></thead><tbody><tr><td>K-01</td><td>Dasbor menampilkan jumlah santri dan total tunggakan per bulan</td><td>Pengasuh</td><td>Must</td><td>Dasbor pengasuh</td></tr><tr><td>K-02</td><td>Tagihan SPP terbit otomatis tiap bulan</td><td>Bag. keuangan</td><td>Must</td><td>Modul tagihan</td></tr><tr><td>K-03</td><td>Data pendaftar diterima tidak diketik ulang</td><td>Admin</td><td>Must</td><td>Modul pendaftaran</td></tr><tr><td>K-04</td><td>Nilai diimpor dari spreadsheet dan rapor dapat dicetak</td><td>Ustaz</td><td>Should</td><td>Modul rapor</td></tr><tr><td>K-05</td><td>Pembayaran lewat dompet digital</td><td>Wali santri</td><td>Won't</td><td>(ditunda)</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Kasus ilustrasi. Matriks ini dilengkapi kolom pengujian di Pertemuan 11 (UAT).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"scope-statement\">scope statement</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The description of the project scope, major deliverables, assumptions, and constraints.\"</p><p class=\"tr\">\"Uraian tentang lingkup proyek, deliverable utama, asumsi, dan batasan.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Charter menyebut lingkup awal secara ringkas. Scope statement <b>memperincinya</b> menjadi kesepakatan bersama yang menjadi dasar WBS, jadwal, dan biaya.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Empat unsur indikator 2</h3><ol><li><button type=\"button\" class=\"term\" data-term=\"deliverable\">Deliverable</button></li><li>Batasan (<button type=\"button\" class=\"term\" data-term=\"constraint\">constraint</button>)</li><li>Asumsi (<button type=\"button\" class=\"term\" data-term=\"assumption\">assumption</button>)</li><li><button type=\"button\" class=\"term\" data-term=\"acceptance-criteria\">Kriteria penerimaan</button></li></ol><p class=\"muted\" style=\"margin:.4em 0 0;font-size:.85em\">Ditambah: uraian lingkup dan hal yang <button type=\"button\" class=\"term\" data-term=\"out-of-scope\">tidak termasuk</button>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>Scope statement ringkas</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><tbody><tr><td style=\"width:24%\"><b>Lingkup</b></td><td>Sistem web untuk pendaftaran santri, penagihan SPP, dan rapor, serta dasbor pengasuh.</td></tr><tr><td><b>Deliverable</b></td><td>(1) modul pendaftaran; (2) modul tagihan SPP; (3) modul rapor; (4) dasbor pengasuh; (5) manual pengguna dan 2 sesi pelatihan.</td></tr><tr><td><b>Kriteria penerimaan</b></td><td>Tagihan terbit untuk 100% santri aktif pada uji data satu semester; dasbor tampil &lt; 3 detik di 4G; lima pengguna kunci lulus skenario uji; berita acara ditandatangani pengasuh.</td></tr><tr><td><b>Batasan</b></td><td>Anggaran maksimal Rp80 juta; selesai sebelum tahun ajaran baru; tim pengembang 5 orang.</td></tr><tr><td><b>Asumsi</b></td><td>Data santri lama tersedia dalam Excel; internet pesantren stabil; lima pengguna kunci hadir pelatihan.</td></tr><tr><td><b>Tidak termasuk</b></td><td>Aplikasi mobile native; pembayaran dompet digital; perangkat keras baru; modul perpustakaan.</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 2</span></div><h2>Kriteria penerimaan dan batas lingkup</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A set of conditions that is required to be met before deliverables are accepted.\"</p><p class=\"tr\">\"Seperangkat kondisi yang harus dipenuhi sebelum deliverable diterima.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><table class=\"t\"><thead><tr><th>Lemah</th><th>Kuat</th></tr></thead><tbody><tr><td>Sistem berjalan baik.</td><td>Seluruh skenario uji prioritas Must lulus tanpa cacat kritis.</td></tr><tr><td>Pengguna puas.</td><td>Lima pengguna kunci menandatangani berita acara uji.</td></tr></tbody></table></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Batas lingkup</h3><ul><li>Tulis <b>tidak termasuk</b> sama tegasnya dengan yang termasuk.</li><li>Asumsi yang tidak dicek hari ini menjadi risiko besok.</li><li>Batasan datang dari luar tim (anggaran, tenggat, aturan); asumsi adalah tebakan kita.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok · 12 menit · Kasus ilustrasi</span></div><h2>Portal layanan Desa Sukamaju</h2><div class=\"cols w\"><div><p>Kepala desa meminta, dengan anggaran <b>Rp40 juta</b> dan waktu <b>4 bulan</b>:</p><ol><li>Pengajuan surat keterangan secara daring.</li><li>Pembayaran PBB lewat portal.</li><li>Aplikasi Android.</li><li>Terhubung ke data kependudukan nasional.</li><li>\"Sekalian\" situs wisata desa.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas kelompok</h3><ol><li>Golongkan tiap permintaan: <b>di dalam</b>, <b>di luar</b>, atau <b>perlu klarifikasi</b>.</li><li>Tulis satu asumsi dan satu batasan.</li><li>Tulis satu kriteria penerimaan terukur untuk permintaan no. 1.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 30 menit</span></div><h2>Kebutuhan dan scope statement proyek Anda</h2><div class=\"cols\"><div><p><b>Untuk proyek mitra kelompok Anda:</b></p><ol><li>Tulis minimal 10 kebutuhan bernomor, lengkap dengan sumber dan prioritas MoSCoW.</li><li>Pastikan tiap kebutuhan dapat diuji.</li><li>Susun draf scope statement: lingkup, deliverable, kriteria penerimaan, batasan, asumsi, tidak termasuk.</li><li>Tandai satu asumsi yang paling berisiko dan cara mengeceknya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dikumpulkan</h3><ul><li>Setiap kebutuhan punya sumber</li><li>Setiap deliverable berasal dari kebutuhan</li><li>Kriteria penerimaan terukur</li><li>Ada bagian \"tidak termasuk\"</li><li>Anggaran dan tenggat sama dengan charter</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Lingkup mencakup <b>produk</b> (fitur) dan <b>proyek</b> (pekerjaan untuk menghasilkannya).</li><li>Kebutuhan digali dengan beberapa teknik, lalu ditulis <b>jelas dan dapat diuji</b>.</li><li>Prioritaskan dengan <b>MoSCoW</b>, rujuk tujuan charter dan peta pemangku kepentingan.</li><li>Catat dalam <b>daftar kebutuhan</b> yang bisa ditelusuri ke sumber dan deliverable.</li><li><b>Scope statement</b> memuat lingkup, deliverable, kriteria penerimaan, batasan, asumsi, dan yang tidak termasuk.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Kebutuhan yang baik memuat ukuran yang dapat diperiksa; tiga pilihan lain masih kabur.\"><p class=\"q\">Kebutuhan mana yang paling dapat diuji?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Sistem harus cepat</button><button type=\"button\" data-o=\"b\">B. Aplikasi mudah dipakai</button><button type=\"button\" data-o=\"c\">C. Wali kelas dapat menginput presensi satu kelas dalam kurang dari 2 menit</button><button type=\"button\" data-o=\"d\">D. Tampilan harus modern</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Menyebut dengan tegas apa yang tidak dikerjakan mencegah salah paham antara tim dan pemangku kepentingan.\"><p class=\"q\">Bagian \"tidak termasuk\" dalam scope statement berfungsi untuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Memperpanjang dokumen</button><button type=\"button\" data-o=\"b\">B. Menegaskan batas agar tidak ada harapan yang keliru</button><button type=\"button\" data-o=\"c\">C. Menyembunyikan pekerjaan yang sulit</button><button type=\"button\" data-o=\"d\">D. Menggantikan kriteria penerimaan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Asumsi adalah hal yang dianggap benar tetapi belum pasti. Pilihan A dan C adalah batasan, D adalah kebutuhan.\"><p class=\"q\">Manakah yang merupakan ASUMSI?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Anggaran maksimal Rp80 juta</button><button type=\"button\" data-o=\"b\">B. Data santri lama tersedia dalam Excel</button><button type=\"button\" data-o=\"c\">C. Selesai sebelum tahun ajaran baru</button><button type=\"button\" data-o=\"d\">D. Tagihan terbit otomatis tiap bulan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian pengumpulan kebutuhan dan scope statement dalam Schwalbe (2019), serta bagian domain lingkup dalam PMBOK Guide edisi ke-8 (PMI, 2025). Pertemuan 5 membahas WBS.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · scope statement dan WBS)</h3><ul><li>Rapikan <b>daftar kebutuhan</b> (minimal 10, bersumber, MoSCoW).</li><li>Susun <b>scope statement</b> lengkap untuk proyek mitra.</li><li>Bawa draf ke Pertemuan 5 untuk dijadikan <b>WBS</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Tugas 1 bagian ini dinilai dengan <b>Penilaian Hasil Produk</b> memakai bobot blok Pertemuan 4–5 (Tugas 1: 10%; UTS: 5%). Tenggat: <b>[PERLU DIISI]</b>. Format dan rubrik ada di lembar Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Requirement</span></dt><dd>Kondisi atau kemampuan yang harus ada pada produk, layanan, atau hasil proyek agar kebutuhan pemangku kepentingan terpenuhi. <i>(kebutuhan / persyaratan)</i></dd></div><div><dt><span class=\"en\">Requirements elicitation</span></dt><dd>Kegiatan menggali kebutuhan dari pemangku kepentingan, mis. lewat wawancara, observasi, atau kuesioner. <i>(penggalian kebutuhan)</i></dd></div><div><dt><span class=\"en\">Functional requirement</span></dt><dd>Kebutuhan tentang apa yang harus dapat dilakukan sistem, mis. membuat tagihan SPP bulanan. <i>(kebutuhan fungsional)</i></dd></div><div><dt><span class=\"en\">Non-functional requirement</span></dt><dd>Kebutuhan tentang mutu atau batasan sistem, mis. kecepatan, keamanan, dan ketersediaan. <i>(kebutuhan nonfungsional)</i></dd></div><div><dt><span class=\"en\">MoSCoW</span></dt><dd>Teknik memprioritaskan kebutuhan menjadi Must have, Should have, Could have, dan Won't have (kali ini). <i>(prioritas MoSCoW)</i></dd></div><div><dt><span class=\"en\">Requirements traceability matrix</span></dt><dd>Tabel yang menghubungkan tiap kebutuhan dengan sumbernya, deliverable, dan pengujiannya agar dapat ditelusuri. <i>(matriks keterlacakan kebutuhan)</i></dd></div><div><dt><span class=\"en\">Scope</span></dt><dd>Seluruh produk, layanan, dan hasil yang akan diberikan oleh proyek, beserta pekerjaan untuk menghasilkannya. <i>(lingkup)</i></dd></div><div><dt><span class=\"en\">Product scope</span></dt><dd>Fitur dan fungsi yang menjadi ciri produk, layanan, atau hasil proyek. <i>(lingkup produk)</i></dd></div><div><dt><span class=\"en\">Project scope</span></dt><dd>Pekerjaan yang dilakukan untuk menghasilkan produk, layanan, atau hasil dengan fitur dan fungsi yang ditentukan. <i>(lingkup proyek)</i></dd></div><div><dt><span class=\"en\">Project scope statement</span></dt><dd>Dokumen yang menguraikan lingkup, deliverable utama, asumsi, dan batasan proyek, sebagai dasar kesepakatan bersama. <i>(pernyataan lingkup proyek)</i></dd></div><div><dt><span class=\"en\">Acceptance criteria</span></dt><dd>Syarat yang harus dipenuhi sebelum deliverable diterima oleh sponsor atau pelanggan. <i>(kriteria penerimaan)</i></dd></div><div><dt><span class=\"en\">Out of scope</span></dt><dd>Hal yang secara tegas tidak dikerjakan proyek; dicatat agar tidak muncul harapan yang keliru. <i>(di luar lingkup / tidak termasuk)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Assumption</span></dt><dd>Hal yang dianggap benar untuk keperluan perencanaan tanpa bukti pasti, sehingga perlu dicek kembali. <i>(asumsi)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Manajemen Lingkup (2)","subtitle":"WBS, WBS dictionary, validasi lingkup, dan scope creep","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Manajemen Lingkup (2)</h1><p class=\"lead\">WBS, WBS dictionary, validasi lingkup, dan scope creep</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Scope statement → WBS → jaga batas</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menyusun rencana lingkup proyek SI, termasuk scope statement dan WBS (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3 dan 4)</span></h3><ol><li>Ketepatan menurunkan kebutuhan pemangku kepentingan menjadi lingkup proyek. <span class=\"muted\">(Pertemuan 4)</span></li><li>Kelengkapan scope statement (deliverable, batasan, asumsi, kriteria penerimaan). <span class=\"muted\">(Pertemuan 4)</span></li><li>Ketepatan dekomposisi WBS dan WBS dictionary.</li><li>Ketepatan mengidentifikasi potensi scope creep.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda lingkup produk dan lingkup proyek?</li><li>Sebutkan empat unsur scope statement yang dinilai di indikator 2.</li><li>Mengapa bagian \"tidak termasuk\" penting ditulis?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Gambaran besar</span><span>Posisi kita sekarang</span></div><h2>Dari scope statement ke WBS</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 170\" role=\"img\" aria-label=\"Alur manajemen lingkup: mengumpulkan kebutuhan dan scope statement sudah dibahas di Pertemuan 4; membuat WBS serta validasi dan pengendalian lingkup dibahas hari ini di Pertemuan 5.\"><defs><marker id=\"ps5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-box\"/><text x=\"105\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kumpulkan kebutuhan</text><text x=\"105\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dibutuhkan?</text><line x1=\"202\" y1=\"72\" x2=\"224\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps5)\"/><rect x=\"228\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-box\"/><text x=\"323\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope statement</text><text x=\"323\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">apa yang dikerjakan dan tidak?</text><line x1=\"420\" y1=\"72\" x2=\"442\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps5)\"/><rect x=\"446\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"541\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Buat WBS</text><text x=\"541\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">pecah menjadi paket kerja</text><line x1=\"638\" y1=\"72\" x2=\"660\" y2=\"72\" class=\"s-line\" marker-end=\"url(#ps5)\"/><rect x=\"664\" y=\"30\" width=\"190\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"759\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Validasi &amp; kendalikan</text><text x=\"759\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">terima hasil, jaga batas</text><text x=\"10\" y=\"150\" class=\"s-s\">PERTEMUAN 4 ··········································</text><text x=\"446\" y=\"150\" class=\"s-hd\">PERTEMUAN 5 (HARI INI) ·································</text></svg><figcaption>Alur manajemen lingkup dalam mata kuliah ini, dirangkum dari pembahasan scope management oleh Schwalbe (2019).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"wbs\">WBS</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A hierarchical decomposition of the total scope of work to be carried out by the project team to accomplish the project objectives and create the required deliverables.\"</p><p class=\"tr\">\"Suatu dekomposisi hierarkis dari keseluruhan lingkup pekerjaan yang akan dilaksanakan oleh tim proyek untuk mencapai tujuan proyek dan menciptakan deliverable yang disyaratkan.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><ul><li><b>Hierarkis</b>: dari proyek, ke deliverable, ke paket kerja.</li><li><b>Keseluruhan lingkup</b>: semua pekerjaan, termasuk yang bukan coding.</li><li>Berisi <b>hasil (kata benda)</b>, bukan urutan kegiatan.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"work-package\">Work package</button></h3><p>Tingkat terendah WBS: cukup kecil untuk diestimasi biaya dan durasinya, dan bisa diserahkan kepada satu penanggung jawab.</p><p class=\"muted\" style=\"margin:0;font-size:.85em\">Diadaptasi dari PMI (2025).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Dua bentuk WBS</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Berdasarkan deliverable</h3><p>Tingkat kedua berisi hasil proyek.</p><p class=\"muted\" style=\"margin:0\">1.2 Modul pendaftaran · 1.3 Modul tagihan SPP · 1.4 Modul rapor · …</p><p style=\"margin-top:.5em\">Cocok bila lingkup produknya jelas dan tiap hasil dapat diserahkan terpisah.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Berdasarkan fase</h3><p>Tingkat kedua berisi fase siklus hidup.</p><p class=\"muted\" style=\"margin:0\">1.1 Analisis · 1.2 Desain · 1.3 Pembuatan · 1.4 Pengujian · 1.5 Implementasi</p><p style=\"margin-top:.5em\">Cocok bila organisasi sudah memakai metodologi bertahap yang baku.</p></div></div><p class=\"muted\" style=\"margin-top:.7em;font-size:.85em\">Kedua bentuk dibahas dalam Schwalbe (2019). Mata kuliah ini memakai pengelompokan berdasarkan deliverable untuk Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses</span><span>Indikator 3 · tekan Play</span></div><h2><button type=\"button\" class=\"term\" data-term=\"decomposition\">Dekomposisi</button> top-down langkah demi langkah</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p5-wbs&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Mulai dari scope statement&quot;,&quot;en&quot;:&quot;input&quot;,&quot;d&quot;:&quot;Ambil uraian lingkup, daftar deliverable, dan bagian tidak termasuk dari Pertemuan 4.&quot;,&quot;ex&quot;:&quot;Lima deliverable SI Pesantren Al-Hikmah: pendaftaran, tagihan SPP, rapor, dasbor pengasuh, manual dan pelatihan.&quot;},{&quot;t&quot;:&quot;Tingkat 1: proyek&quot;,&quot;en&quot;:&quot;level 1&quot;,&quot;d&quot;:&quot;Puncak WBS adalah nama proyek, mewakili 100% pekerjaan.&quot;,&quot;ex&quot;:&quot;1.0 SI Pesantren Al-Hikmah.&quot;},{&quot;t&quot;:&quot;Tingkat 2: deliverable&quot;,&quot;en&quot;:&quot;level 2&quot;,&quot;d&quot;:&quot;Setiap deliverable menjadi satu cabang. Tambahkan cabang manajemen proyek untuk pekerjaan mengelola proyek.&quot;,&quot;ex&quot;:&quot;1.1 Manajemen proyek, 1.2 Modul pendaftaran, … 1.6 Manual dan pelatihan.&quot;},{&quot;t&quot;:&quot;Tingkat 3: pecah lagi&quot;,&quot;en&quot;:&quot;decompose&quot;,&quot;d&quot;:&quot;Pecah tiap deliverable menjadi bagian yang lebih kecil sampai bisa diestimasi dan diberi satu penanggung jawab.&quot;,&quot;ex&quot;:&quot;1.3 Modul tagihan SPP → 1.3.1 Analisis dan desain, 1.3.2 Fitur tagihan bulanan, 1.3.3 Pencatatan pembayaran, 1.3.4 Uji modul.&quot;},{&quot;t&quot;:&quot;Berhenti di work package&quot;,&quot;en&quot;:&quot;work package&quot;,&quot;d&quot;:&quot;Berhenti memecah bila bagian itu sudah bisa diperkirakan biaya dan durasinya. Tidak semua cabang harus sama dalam.&quot;,&quot;ex&quot;:&quot;1.6 Manual dan pelatihan cukup dua work package: 1.6.1 Manual pengguna, 1.6.2 Dua sesi pelatihan.&quot;},{&quot;t&quot;:&quot;Beri kode&quot;,&quot;en&quot;:&quot;numbering&quot;,&quot;d&quot;:&quot;Beri nomor bertingkat agar tiap komponen mudah dirujuk di jadwal, biaya, dan WBS dictionary.&quot;,&quot;ex&quot;:&quot;1.3.2 selalu berarti fitur tagihan bulanan otomatis.&quot;},{&quot;t&quot;:&quot;Cek aturan 100%&quot;,&quot;en&quot;:&quot;100% rule&quot;,&quot;d&quot;:&quot;Apakah semua pekerjaan sudah tercakup, dan tidak ada yang di luar lingkup ikut masuk?&quot;,&quot;ex&quot;:&quot;Migrasi data santri lama dari Excel belum ada. Tambahkan sebagai 1.2.4. Modul perpustakaan tidak boleh masuk karena tidak termasuk lingkup.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>WBS tiga tingkat</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 330\" role=\"img\" aria-label=\"WBS tiga tingkat SI Pesantren Al-Hikmah. Tingkat 1: proyek. Tingkat 2: manajemen proyek, modul pendaftaran, modul tagihan SPP, modul rapor, dasbor pengasuh, manual dan pelatihan. Tingkat 3 untuk modul tagihan SPP: analisis dan desain alur tagihan, fitur tagihan bulanan otomatis, pencatatan pembayaran, uji modul tagihan.\"><rect x=\"300\" y=\"8\" width=\"280\" height=\"52\" rx=\"8\" class=\"s-hl\" style=\"stroke:currentColor;stroke-width:2.5\"/><text x=\"440\" y=\"30\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px;fill:#111827\">1.0</text><text x=\"440\" y=\"49\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px;f
