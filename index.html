cope-statement\">scope statement</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The description of the project scope, major deliverables, assumptions, and constraints.\"</p><p class=\"tr\">\"Uraian tentang lingkup proyek, deliverable utama, asumsi, dan batasan.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p>Charter menyebut lingkup awal secara ringkas. Scope statement <b>memperincinya</b> menjadi kesepakatan bersama yang menjadi dasar WBS, jadwal, dan biaya.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Empat unsur indikator 2</h3><ol><li><button type=\"button\" class=\"term\" data-term=\"deliverable\">Deliverable</button></li><li>Batasan (<button type=\"button\" class=\"term\" data-term=\"constraint\">constraint</button>)</li><li>Asumsi (<button type=\"button\" class=\"term\" data-term=\"assumption\">assumption</button>)</li><li><button type=\"button\" class=\"term\" data-term=\"acceptance-criteria\">Kriteria penerimaan</button></li></ol><p class=\"muted\" style=\"margin:.4em 0 0;font-size:.85em\">Ditambah: uraian lingkup dan hal yang <button type=\"button\" class=\"term\" data-term=\"out-of-scope\">tidak termasuk</button>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · SI Pesantren Al-Hikmah</span></div><h2>Scope statement ringkas</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><tbody><tr><td style=\"width:24%\"><b>Lingkup</b></td><td>Sistem web untuk pendaftaran santri, penagihan SPP, dan rapor, serta dasbor pengasuh.</td></tr><tr><td><b>Deliverable</b></td><td>(1) modul pendaftaran; (2) modul tagihan SPP; (3) modul rapor; (4) dasbor pengasuh; (5) manual pengguna dan 2 sesi pelatihan.</td></tr><tr><td><b>Kriteria penerimaan</b></td><td>Tagihan terbit untuk 100% santri aktif pada uji data satu semester; dasbor tampil &lt; 3 detik di 4G; lima pengguna kunci lulus skenario uji; berita acara ditandatangani pengasuh.</td></tr><tr><td><b>Batasan</b></td><td>Anggaran maksimal Rp80 juta; selesai sebelum tahun ajaran baru; tim pengembang 5 orang.</td></tr><tr><td><b>Asumsi</b></td><td>Data santri lama tersedia dalam Excel; internet pesantren stabil; lima pengguna kunci hadir pelatihan.</td></tr><tr><td><b>Tidak termasuk</b></td><td>Aplikasi mobile native; pembayaran dompet digital; perangkat keras baru; modul perpustakaan.</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktik</span><span>Indikator 2</span></div><h2>Kriteria penerimaan dan batas lingkup</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A set of conditions that is required to be met before deliverables are accepted.\"</p><p class=\"tr\">\"Seperangkat kondisi yang harus dipenuhi sebelum deliverable diterima.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><table class=\"t\"><thead><tr><th>Lemah</th><th>Kuat</th></tr></thead><tbody><tr><td>Sistem berjalan baik.</td><td>Seluruh skenario uji prioritas Must lulus tanpa cacat kritis.</td></tr><tr><td>Pengguna puas.</td><td>Lima pengguna kunci menandatangani berita acara uji.</td></tr></tbody></table></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Batas lingkup</h3><ul><li>Tulis <b>tidak termasuk</b> sama tegasnya dengan yang termasuk.</li><li>Asumsi yang tidak dicek hari ini menjadi risiko besok.</li><li>Batasan datang dari luar tim (anggaran, tenggat, aturan); asumsi adalah tebakan kita.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok · 12 menit · Kasus ilustrasi</span></div><h2>Portal layanan Desa Sukamaju</h2><div class=\"cols w\"><div><p>Kepala desa meminta, dengan anggaran <b>Rp40 juta</b> dan waktu <b>4 bulan</b>:</p><ol><li>Pengajuan surat keterangan secara daring.</li><li>Pembayaran PBB lewat portal.</li><li>Aplikasi Android.</li><li>Terhubung ke data kependudukan nasional.</li><li>\"Sekalian\" situs wisata desa.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas kelompok</h3><ol><li>Golongkan tiap permintaan: <b>di dalam</b>, <b>di luar</b>, atau <b>perlu klarifikasi</b>.</li><li>Tulis satu asumsi dan satu batasan.</li><li>Tulis satu kriteria penerimaan terukur untuk permintaan no. 1.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop kelompok · 30 menit</span></div><h2>Kebutuhan dan scope statement proyek Anda</h2><div class=\"cols\"><div><p><b>Untuk proyek mitra kelompok Anda:</b></p><ol><li>Tulis minimal 10 kebutuhan bernomor, lengkap dengan sumber dan prioritas MoSCoW.</li><li>Pastikan tiap kebutuhan dapat diuji.</li><li>Susun draf scope statement: lingkup, deliverable, kriteria penerimaan, batasan, asumsi, tidak termasuk.</li><li>Tandai satu asumsi yang paling berisiko dan cara mengeceknya.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cek sebelum dikumpulkan</h3><ul><li>Setiap kebutuhan punya sumber</li><li>Setiap deliverable berasal dari kebutuhan</li><li>Kriteria penerimaan terukur</li><li>Ada bagian \"tidak termasuk\"</li><li>Anggaran dan tenggat sama dengan charter</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Lingkup mencakup <b>produk</b> (fitur) dan <b>proyek</b> (pekerjaan untuk menghasilkannya).</li><li>Kebutuhan digali dengan beberapa teknik, lalu ditulis <b>jelas dan dapat diuji</b>.</li><li>Prioritaskan dengan <b>MoSCoW</b>, rujuk tujuan charter dan peta pemangku kepentingan.</li><li>Catat dalam <b>daftar kebutuhan</b> yang bisa ditelusuri ke sumber dan deliverable.</li><li><b>Scope statement</b> memuat lingkup, deliverable, kriteria penerimaan, batasan, asumsi, dan yang tidak termasuk.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Kebutuhan yang baik memuat ukuran yang dapat diperiksa; tiga pilihan lain masih kabur.\"><p class=\"q\">Kebutuhan mana yang paling dapat diuji?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Sistem harus cepat</button><button type=\"button\" data-o=\"b\">B. Aplikasi mudah dipakai</button><button type=\"button\" data-o=\"c\">C. Wali kelas dapat menginput presensi satu kelas dalam kurang dari 2 menit</button><button type=\"button\" data-o=\"d\">D. Tampilan harus modern</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Menyebut dengan tegas apa yang tidak dikerjakan mencegah salah paham antara tim dan pemangku kepentingan.\"><p class=\"q\">Bagian \"tidak termasuk\" dalam scope statement berfungsi untuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Memperpanjang dokumen</button><button type=\"button\" data-o=\"b\">B. Menegaskan batas agar tidak ada harapan yang keliru</button><button type=\"button\" data-o=\"c\">C. Menyembunyikan pekerjaan yang sulit</button><button type=\"button\" data-o=\"d\">D. Menggantikan kriteria penerimaan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Asumsi adalah hal yang dianggap benar tetapi belum pasti. Pilihan A dan C adalah batasan, D adalah kebutuhan.\"><p class=\"q\">Manakah yang merupakan ASUMSI?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Anggaran maksimal Rp80 juta</button><button type=\"button\" data-o=\"b\">B. Data santri lama tersedia dalam Excel</button><button type=\"button\" data-o=\"c\">C. Selesai sebelum tahun ajaran baru</button><button type=\"button\" data-o=\"d\">D. Tagihan terbit otomatis tiap bulan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas kelompok (Tugas 1)</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian pengumpulan kebutuhan dan scope statement dalam Schwalbe (2019), serta bagian domain lingkup dalam PMBOK Guide edisi ke-8 (PMI, 2025). Pertemuan 5 membahas WBS.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menyusun (Tugas 1 · scope statement dan WBS)</h3><ul><li>Rapikan <b>daftar kebutuhan</b> (minimal 10, bersumber, MoSCoW).</li><li>Susun <b>scope statement</b> lengkap untuk proyek mitra.</li><li>Bawa draf ke Pertemuan 5 untuk dijadikan <b>WBS</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Tugas 1 bagian ini dinilai dengan <b>Penilaian Hasil Produk</b> memakai bobot blok Pertemuan 4–5 (Tugas 1: 10%; UTS: 5%). Tenggat: <b>[PERLU DIISI]</b>. Format dan rubrik ada di lembar Tugas 1.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Requirement</span></dt><dd>Kondisi atau kemampuan yang harus ada pada produk, layanan, atau hasil proyek agar kebutuhan pemangku kepentingan terpenuhi. <i>(kebutuhan / persyaratan)</i></dd></div><div><dt><span class=\"en\">Requirements elicitation</span></dt><dd>Kegiatan menggali kebutuhan dari pemangku kepentingan, mis. lewat wawancara, observasi, atau kuesioner. <i>(penggalian kebutuhan)</i></dd></div><div><dt><span class=\"en\">Functional requirement</span></dt><dd>Kebutuhan tentang apa yang harus dapat dilakukan sistem, mis. membuat tagihan SPP bulanan. <i>(kebutuhan fungsional)</i></dd></div><div><dt><span class=\"en\">Non-functional requirement</span></dt><dd>Kebutuhan tentang mutu atau batasan sistem, mis. kecepatan, keamanan, dan ketersediaan. <i>(kebutuhan nonfungsional)</i></dd></div><div><dt><span class=\"en\">MoSCoW</span></dt><dd>Teknik memprioritaskan kebutuhan menjadi Must have, Should have, Could have, dan Won't have (kali ini). <i>(prioritas MoSCoW)</i></dd></div><div><dt><span class=\"en\">Requirements traceability matrix</span></dt><dd>Tabel yang menghubungkan tiap kebutuhan dengan sumbernya, deliverable, dan pengujiannya agar dapat ditelusuri. <i>(matriks keterlacakan kebutuhan)</i></dd></div><div><dt><span class=\"en\">Scope</span></dt><dd>Seluruh produk, layanan, dan hasil yang akan diberikan oleh proyek, beserta pekerjaan untuk menghasilkannya. <i>(lingkup)</i></dd></div><div><dt><span class=\"en\">Product scope</span></dt><dd>Fitur dan fungsi yang menjadi ciri produk, layanan, atau hasil proyek. <i>(lingkup produk)</i></dd></div><div><dt><span class=\"en\">Project scope</span></dt><dd>Pekerjaan yang dilakukan untuk menghasilkan produk, layanan, atau hasil dengan fitur dan fungsi yang ditentukan. <i>(lingkup proyek)</i></dd></div><div><dt><span class=\"en\">Project scope statement</span></dt><dd>Dokumen yang menguraikan lingkup, deliverable utama, asumsi, dan batasan proyek, sebagai dasar kesepakatan bersama. <i>(pernyataan lingkup proyek)</i></dd></div><div><dt><span class=\"en\">Acceptance criteria</span></dt><dd>Syarat yang harus dipenuhi sebelum deliverable diterima oleh sponsor atau pelanggan. <i>(kriteria penerimaan)</i></dd></div><div><dt><span class=\"en\">Out of scope</span></dt><dd>Hal yang secara tegas tidak dikerjakan proyek; dicatat agar tidak muncul harapan yang keliru. <i>(di luar lingkup / tidak termasuk)</i></dd></div><div><dt><span class=\"en\">Deliverable</span></dt><dd>Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek. <i>(luaran / hasil serahan)</i></dd></div><div><dt><span class=\"en\">Assumption</span></dt><dd>Hal yang dianggap benar untuk keperluan perencanaan tanpa bukti pasti, sehingga perlu dicek kembali. <i>(asumsi)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Project Management Institute. (2025). <i>A guide to the project management body of knowledge (PMBOK guide)</i> (8th ed.). Project Management Institute.</li><li>Schwalbe, K. (2019). <i>Information technology project management</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"cl /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();


</script>
</body>
</html>
