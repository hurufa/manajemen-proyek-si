<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manajemen Proyek Sistem Informasi · SI Unusida</title>
<meta name="description" content="Materi perkuliahan Manajemen Proyek Sistem Informasi (SI24W08), Program Studi Sistem Informasi, Universitas Nahdlatul Ulama Sidoarjo.">
<link rel="icon" type="image/png" href="https://hurufa.github.io/assets/favicon.png">
<link rel="apple-touch-icon" href="https://hurufa.github.io/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Darker+Grotesque:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#ECF0EF; --ink:#2C2E31; --ink-2:#45474B; --muted:#646A6F;
  --line:#D9DFDD; --primary:#495E57; --primary-ink:#FFFFFF; --primary-soft:#E3EBE8;
  --accent:#F4CE14; --accent-soft:#FCF3C4; --accent-ink:#2C2E31;
  --green:#0F7A45; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B42318; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(35,45,40,.06),0 8px 24px rgba(35,45,40,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
    --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
    --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
    --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
  --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
  --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
  --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.app.collapsed{grid-template-columns:0 1fr}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease}
.app.collapsed .side{transform:translateX(-100%);visibility:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--muted)}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 18px 6px;font-weight:700}
.mlist{list-style:none;margin:0;padding:0 10px 18px;display:grid;gap:2px}
.mbtn{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-current="true"]{background:var(--primary-soft)}
.mbtn .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary);background:var(--surface-2);border-radius:7px;text-align:center;padding:3px 0}
.mbtn[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink)}
.mbtn .t{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mbtn.soon .t{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.soon{background:var(--surface-2);color:var(--muted)}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:160px;font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--primary)}
.ibtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ibtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg svg{width:16px;height:16px}

/* Slide mode */
.view{padding:20px 16px 40px;width:100%;max-width:1320px;margin:0 auto}
.stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage .slide{position:absolute;inset:0;overflow:auto;font-size:clamp(9px,1.55cqw,30px)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.hint{font-size:12px;color:var(--muted)}
.notes{margin-top:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:12px 16px;color:var(--ink)}
.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notes p,.notes li{margin:.25em 0;font-size:14.5px}
.notes ul{margin:.2em 0;padding-left:1.2em}
:fullscreen .stage, .stage:fullscreen{border-radius:0;border:0}
.stage:fullscreen{background:var(--surface)}

/* Read mode */
.read{max-width:880px;margin:0 auto;display:grid;gap:18px}
.read .slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16.5px}
.read .notes{margin-top:-8px}

/* Slide content */
.slide{padding:2.6em 3.4em;color:var(--ink-2)}
.slide h1,.slide h2{color:var(--ink);line-height:1.15;text-wrap:balance;margin:0 0 .55em;letter-spacing:-.01em}
.slide h2{font-size:2em;font-weight:800}
.slide h1{font-size:2.9em;font-weight:800}
.slide h3{color:var(--ink);font-size:1.15em;margin:0 0 .35em}
.slide p{margin:.35em 0}
.slide ul,.slide ol{margin:.3em 0;padding-left:1.25em}
.slide li{margin:.32em 0}
.slide li::marker{color:var(--primary);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .chip{background:var(--primary-soft);padding:.15em .6em;border-radius:99px}
.lead{font-size:1.2em;color:var(--ink)}
.muted{color:var(--muted)}
.id{color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.w{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface-2);border-radius:.8em;padding:.9em 1.1em}
.card h3{display:flex;gap:.45em;align-items:center}
.card p{font-size:.95em}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok{background:var(--ok-soft)}
.ic{width:1.3em;height:1.3em;flex:none;color:var(--primary)}
.warn .ic{color:var(--warn)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.big{font-size:1.5em;font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;align-items:baseline}
.kv dt{font-family:var(--mono);font-size:.8em;font-weight:600;color:var(--primary);white-space:nowrap}
.kv dd{margin:0}
.callout{border-left:.3em solid var(--accent);background:var(--accent-soft);padding:.7em 1em;border-radius:0 .6em .6em 0;color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.quote{font-size:1.25em;font-weight:600;color:var(--ink);line-height:1.4}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
table.t th{color:var(--ink);font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.phrase{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .45em;border-radius:.35em;color:var(--ink)}

/* Title slide */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.3em;background:
  radial-gradient(60em 30em at 110% -10%,var(--primary-soft),transparent 60%),
  linear-gradient(transparent 0 0)}
.cover .logo{width:5.2em;margin-bottom:1em}
.cover .meta{margin-top:1.6em;display:flex;gap:2.2em;flex-wrap:wrap;font-size:.9em}
.cover .meta b{display:block;color:var(--ink)}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:.55em;background:linear-gradient(90deg,var(--primary) 0 60%,var(--accent) 60% 100%)}
.read .cover{min-height:26em;position:relative}

/* Figures */
figure.fig{margin:.6em 0 0}
figure.fig svg{width:100%;height:auto;max-height:17em;display:block;color:var(--ink)}
figure.fig figcaption{font-size:.82em;color:var(--muted);margin-top:.4em}
.s-box{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.s-soft{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-hl{fill:var(--accent);stroke:none}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.s-line{stroke:currentColor;stroke-width:2;fill:none}
.s-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;fill:none}
.s-warnline{stroke:var(--warn);stroke-width:2.2;fill:none}
.s-t{fill:currentColor;font-family:var(--font);font-size:15px;font-weight:700}
.s-s{fill:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:500}
.s-tw{fill:var(--warn);font-family:var(--font);font-size:13px;font-weight:700}
.s-ta{fill:var(--accent-ink);font-family:var(--font);font-size:15px;font-weight:800}
.s-hd{fill:var(--primary);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em}

/* Assessment bar */
.assess{display:flex;height:3.4em;border-radius:.6em;overflow:hidden;margin:.6em 0 .4em;font-size:.9em}
.assess div{display:flex;flex-direction:column;justify-content:center;padding:0 .8em;color:var(--primary-ink);min-width:0}
.assess div b{font-size:1.15em}
.assess .a1{background:var(--primary)}
.assess .a2{background:var(--accent);color:var(--accent-ink)}
.assess .a3{background:color-mix(in srgb,var(--primary) 70%,var(--ink))}
.assess .a4{background:var(--warn);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);gap:.25em;margin-top:.8em}
.weeks span{font-family:var(--mono);font-size:.7em;text-align:center;padding:.35em 0;border-radius:.35em;background:var(--surface-2);color:var(--muted)}
.weeks span.ex{background:var(--warn-soft);color:var(--warn);font-weight:700}
.weeks span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Chat mockup */
.chat{background:var(--surface-2);border-radius:.8em;padding:.8em;display:grid;gap:.45em;font-size:.92em}
.chat .who{font-size:.75em;color:var(--muted);font-weight:700}
.bub{max-width:88%;padding:.45em .7em;border-radius:.8em;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.bub.me{justify-self:end;background:var(--primary-soft)}
.bub small{display:block;color:var(--muted);font-size:.72em;text-align:right}

/* Glossary term + tooltip */
.term{border-bottom:2px dotted var(--primary);cursor:help;color:inherit;font-weight:600;background:none;padding:0;border-top:0;border-left:0;border-right:0;font-size:inherit;line-height:inherit;font-family:inherit}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
.tip b{display:block;font-size:14px}
.tip i{display:block;color:var(--accent);font-style:normal;font-weight:700;font-size:12.5px;margin-top:4px}
.gl dt{font-weight:700;color:var(--ink)}
.gl dd{margin:0 0 .5em}
.gl dd i{color:var(--primary);font-style:normal;font-weight:600}
.gl{columns:2;column-gap:2em;font-size:.92em}
.gl div{break-inside:avoid}

/* Quiz */
.quiz{display:grid;gap:.5em;margin-bottom:.9em}
.quiz .q{font-weight:700;color:var(--ink);margin:0}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.45em .7em;text-align:left;cursor:pointer;font-size:.92em}
.quiz button:hover{border-color:var(--primary)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.quiz .fb{font-size:.88em;margin:0;min-height:1.3em;color:var(--ink)}

/* Placeholder */
.soonbox{display:flex;flex-direction:column;justify-content:center;height:100%}
.soonbox .pill{align-self:flex-start;margin-bottom:1em}

/* Closing */
.closing{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(50em 26em at 50% 120%,var(--accent-soft),transparent 70%)}
.read .closing{min-height:24em}
.closing h1{font-size:3.6em;margin-bottom:.2em}
.closing .qwrap{max-width:34em;min-height:6.5em;position:relative;z-index:2}
.closing .qt{font-size:1.3em;font-weight:600;color:var(--ink);line-height:1.4;transition:opacity .5s}
.closing .qa{margin-top:.5em;color:var(--muted);font-size:.9em;transition:opacity .5s}
.closing .emo{position:absolute;inset:0;pointer-events:none;z-index:1}
.closing .emo span{position:absolute;bottom:-2em;font-size:1.8em;opacity:.8;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14em) translateX(1em) rotate(12deg)}100%{transform:translateY(-30em) translateX(-1em) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.closing .emo span{animation:none;display:none}.side{transition:none}.bar i{transition:none}}

/* Menu button for phone */
.menu-t{display:none}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-100%);box-shadow:var(--shadow);visibility:hidden}
  .app.open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top .lbl{display:none}
  .slide{padding:1.8em 2em}
  .read .slide{padding:1.4em 1.2em}
  .cols,.cols.w,.cols.c3{grid-template-columns:1fr}
  .grid5,.grid4{grid-template-columns:1fr 1fr}
  .quiz .opts{grid-template-columns:1fr}
  .gl{columns:1}
}
@media print{.side,.top,.ctrl{display:none}}


/* ===== Revisi v2 ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.cite{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.en{font-style:italic}
.notes dl.nt{margin:.2em 0 0;display:grid;gap:.15em}
.notes dl.nt dt{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-top:.55em}
.notes dl.nt dt:first-child{margin-top:.1em}
.notes dl.nt dd{margin:0;font-size:14.5px;line-height:1.55}
.notes dl.nt dd ul,.notes dl.nt dd ol{margin:.2em 0;padding-left:1.2em}
ol.refs{list-style:none;padding:0;margin:.4em 0 0;display:grid;gap:.55em}
ol.refs li{padding-left:2.2em;text-indent:-2.2em;margin:0;line-height:1.45}
.closing .emo span{opacity:.4}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
.grid3>*,.grid4>*,.grid5>*,.cols>*{min-width:0}
.card{overflow-wrap:break-word}
@media (max-width:600px){.grid3,.grid5,.grid4{grid-template-columns:1fr!important}.read .slide{font-size:15.5px}}
.card.obek{font-size:.84em}
.stage .gl{columns:3;column-gap:1.6em;font-size:.8em}
.stage .gl dd{margin-bottom:.35em}
.stage .quiz{gap:.28em;margin-bottom:.45em}
.stage .quiz button{padding:.32em .6em}
.stage .quiz .fb{min-height:1.1em}
.read{grid-template-columns:minmax(0,1fr)}.view{min-width:0}
.notes .nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.notes .nhead h4{margin:0}
.lockb{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lockb svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal form{width:min(380px,100%);background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.modal h2 svg{width:18px;height:18px;color:var(--primary)}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.modal input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.modal input:focus{outline:3px solid var(--accent);outline-offset:1px}
.modal .err{color:var(--bad);font-size:13px;min-height:1.3em;margin:6px 0 10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .row button.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ===== Revisi v3.1 (MPSI): URL panjang di referensi, slide padat ===== */
ol.refs li{overflow-wrap:anywhere}
.stage ol.refs{font-size:.9em;gap:.4em}
.stage .gl{font-size:.74em}


/* ===== Revisi v3.3 (KMO): judul berkata panjang di HP, kuis lebih rapat ===== */
@media (max-width:600px){.read .soonbox h1,.read .cover h1,.read .closing h1{font-size:2.1em;overflow-wrap:break-word;hyphens:auto}}
.stage .quiz{gap:.2em;margin-bottom:.35em}
.stage .quiz .opts{gap:.25em}

/* ===== Tema Brutalism (v4) =====
   Sumber gaya: skill "brutalism" (typeui.sh / awesome-design-skills).
   Koral #DD614C · mustard #DAA144 · tinta #111827 · kertas #F4F1EA.
   Judul: Darker Grotesque · isi: Atkinson Hyperlegible Next · label: JetBrains Mono. */
:root{
  --coral:#DD614C; --mustard:#DAA144; --paper:#F4F1EA;
  --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#F1ECE1; --ink:#111827; --ink-2:#1F2937; --muted:#4B5563;
  --line:#111827; --rule:#D8D0BF; --hatch:#E7E1D3;
  --primary:#B5412E; --primary-ink:#FFFFFF; --primary-soft:#F9DED7;
  --accent:#DAA144; --accent-soft:#F7E9CC; --accent-ink:#111827;
  --green:#15803D; --warn:#A1350E; --warn-soft:#FBE2D3; --ok:#15803D; --ok-soft:#DDF3E3; --bad:#B91C1C; --bad-soft:#FDE2E2;
  --side-bg:#DAA144; --side-ink:#111827; --side-muted:#2B2B2B;
  --bw:2px; --sh:5px; --r:6px;
  --shadow:var(--sh) var(--sh) 0 var(--line);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Darker Grotesque","Atkinson Hyperlegible Next",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --surface-2:#262626; --ink:#F5F3EE; --ink-2:#E7E3DA; --muted:#BDB7AA;
    --line:#F5F3EE; --rule:#3A3A3A; --hatch:#222;
    --primary:#F29482; --primary-ink:#111111; --primary-soft:#3D241E;
    --accent:#DAA144; --accent-soft:#3A2F18; --accent-ink:#111111;
    --green:#6FD39A; --warn:#FFA071; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --side-bg:#181818; --side-ink:#F5F3EE; --side-muted:#BDB7AA;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --surface-2:#262626; --ink:#F5F3EE; --ink-2:#E7E3DA; --muted:#BDB7AA;
  --line:#F5F3EE; --rule:#3A3A3A; --hatch:#222;
  --primary:#F29482; --primary-ink:#111111; --primary-soft:#3D241E;
  --accent:#DAA144; --accent-soft:#3A2F18; --accent-ink:#111111;
  --green:#6FD39A; --warn:#FFA071; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --side-bg:#181818; --side-ink:#F5F3EE; --side-muted:#BDB7AA;
}
body{background-color:var(--bg);background-image:linear-gradient(var(--hatch) 1px,transparent 1px),linear-gradient(90deg,var(--hatch) 1px,transparent 1px);background-size:32px 32px;font-size:16.5px}
:focus-visible{outline:3px dashed var(--coral);outline-offset:3px;border-radius:2px}

/* Sidebar: blok mustard dengan garis tegas */
.side{background:var(--side-bg);color:var(--side-ink);border-right:3px solid var(--line)}
.brand{border-bottom:3px solid var(--line);background:var(--surface)}
.brand b{font-family:var(--display);font-weight:900;font-size:21px;line-height:.95;text-transform:uppercase;color:var(--ink)}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.side h3{font-family:var(--mono);color:var(--side-ink);letter-spacing:.1em}
.mlist{gap:6px;padding:0 12px 18px}
.mbtn{border:var(--bw) solid transparent;border-radius:4px;padding:6px 8px;color:var(--side-ink)}
.mbtn:hover{background:var(--surface);color:var(--ink);border-color:var(--line)}
.mbtn[aria-current="true"]{background:var(--coral);color:#111827;border-color:#111827;box-shadow:3px 3px 0 #111827}
.mbtn .no{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:2px}
.mbtn[aria-current="true"] .no{background:#111827;color:var(--mustard);border-color:#111827}
.mbtn .t{color:inherit;font-weight:700;font-size:14px}
.mbtn.soon .t{color:var(--side-muted);font-weight:500}
.mbtn[aria-current="true"] .t{color:#111827}
.tag{border-radius:2px;font-family:var(--mono);font-size:9.5px;border:1.5px solid currentColor}
.tag.soon{background:transparent;color:var(--side-muted)}
.tag.exam{background:#111827;color:var(--mustard);border-color:#111827}
.side .foot{border-top:3px solid var(--line);color:var(--side-ink);font-family:var(--mono);font-size:11px}

/* Bilah atas dan tombol */
.top{background:var(--bg);backdrop-filter:none;border-bottom:3px solid var(--line)}
.top .title{font-family:var(--display);font-weight:900;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.005em}
.top .title small{font-family:var(--font);text-transform:none;font-size:12.5px;font-weight:600;margin-top:3px}
.ibtn,.seg{border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:3px 3px 0 var(--line);font-weight:700}
.ibtn:hover{border-color:var(--line);background:var(--accent-soft)}
.ibtn:active{transform:translate(3px,3px);box-shadow:none}
.ibtn[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--coral);color:#111827;border-color:var(--line)}
.seg{overflow:hidden}
.seg button{border-radius:0;font-weight:700}
.seg button+button{border-left:var(--bw) solid var(--line)}

/* Panggung slide */
.stage{border:3px solid var(--line);border-radius:8px;box-shadow:8px 8px 0 var(--line)}
.ctrl .count{font-weight:700;color:var(--ink)}
.bar{height:12px;border:var(--bw) solid var(--line);border-radius:2px;background:var(--surface)}
.bar i{background:var(--coral);border-radius:0}
.hint{font-family:var(--mono);font-size:11px}
.read .slide{border:3px solid var(--line);border-radius:8px;box-shadow:6px 6px 0 var(--line)}
.notes{background:var(--accent-soft);border:var(--bw) solid var(--line);border-left:10px solid var(--mustard);border-radius:4px}
.notes h4,.notes dl.nt dt{font-family:var(--mono)}
.notes dl.nt dt{color:var(--primary)}
.lockb{border:1.5px solid var(--line);border-radius:3px}

/* Tipografi slide */
.slide{color:var(--ink-2);line-height:1.5}
.slide h1,.slide h2{font-family:var(--display);color:var(--ink);letter-spacing:0;line-height:.92}
.slide h1{font-size:3.6em;font-weight:900;text-transform:uppercase}
.slide h2{font-size:2.55em;font-weight:900;margin-bottom:.45em}
.slide h3{font-weight:700}
.slide li::marker{color:var(--primary)}
.eyebrow{color:var(--ink);font-weight:700}
.eyebrow .chip{background:var(--ink);color:var(--mustard);border-radius:2px;padding:.2em .6em}
.lead{font-weight:500}
.muted{color:var(--muted)}

/* Kartu, callout, tabel */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--line)}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.ok{background:var(--ok-soft)}
.ic{color:var(--primary)}
.callout{background:var(--accent-soft);border:var(--bw) solid var(--line);border-left:.45em solid var(--coral);border-radius:4px;color:var(--ink)}
.callout.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.quote{font-weight:700}
.kv dt{color:var(--primary);font-weight:700}
table.t{border:var(--bw) solid var(--line)}
table.t th{background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.72em;letter-spacing:.06em;border-bottom:0}
table.t th,table.t td{border-bottom:1px solid var(--rule)}
table.t td+td,table.t th+th{border-left:1px solid var(--rule)}
.phrase{background:var(--accent-soft);border:1px solid var(--line);border-radius:2px}

/* Sampul dan penutup */
.cover{background:linear-gradient(var(--hatch) 1px,transparent 1px) 0 0/2em 2em,linear-gradient(90deg,var(--hatch) 1px,transparent 1px) 0 0/2em 2em,var(--surface)}
.cover .meta b{font-family:var(--mono);font-size:.8em;text-transform:uppercase;letter-spacing:.06em}
.cover .strip{height:.9em;border-top:3px solid var(--line);background:linear-gradient(90deg,var(--coral) 0 55%,var(--mustard) 55% 85%,#111827 85% 100%)}
.closing{background:linear-gradient(var(--hatch) 1px,transparent 1px) 0 0/2em 2em,linear-gradient(90deg,var(--hatch) 1px,transparent 1px) 0 0/2em 2em,var(--surface)}
.closing h1{font-size:4.6em}
.closing .qwrap{background:var(--accent-soft);border:var(--bw) solid var(--line);box-shadow:4px 4px 0 var(--line);padding:.8em 1.1em;border-radius:4px}
.closing .qa{font-family:var(--mono);font-size:.75em}

/* Diagram SVG */
.s-box{fill:var(--surface);stroke:var(--line);stroke-width:2.5}
.s-soft{fill:var(--primary-soft);stroke:var(--line);stroke-width:2.5}
.s-acc{fill:var(--accent-soft);stroke:var(--line);stroke-width:2.5}
.s-hl{fill:var(--mustard)}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2.5}
.s-dash{stroke:var(--muted)}
.s-hd{fill:var(--ink);font-weight:700}
.s-t{font-weight:700}
.s-s{fill:var(--muted);font-weight:500}

/* Batang penilaian dan minggu */
.assess{border:var(--bw) solid var(--line);border-radius:4px}
.assess div+div{border-left:var(--bw) solid var(--line)}
.assess .a1{background:var(--coral);color:#111827}
.assess .a2{background:var(--mustard);color:#111827}
.assess .a3{background:#111827;color:#F4F1EA}
.assess .a4{background:var(--surface);color:var(--ink)}
.weeks span{border:1.5px solid var(--line);border-radius:2px;background:var(--surface)}
.weeks span.on{background:var(--coral);color:#111827}
.weeks span.ex{background:#111827;color:var(--mustard)}

/* Chat, istilah, kuis */
.chat{background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:6px}
.bub{border:1.5px solid var(--line);box-shadow:none;border-radius:6px}
.bub.me{background:var(--primary-soft)}
.term{border-bottom:2px dotted var(--primary);font-weight:700}
.tip{background:#111827;color:#F4F1EA;border:2px solid var(--mustard);border-radius:4px;box-shadow:4px 4px 0 var(--mustard)}
.tip i{color:var(--mustard)}
.gl dd i{color:var(--primary)}
.quiz .q{font-weight:700}
.quiz button{border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:3px 3px 0 var(--line);font-weight:600}
.quiz button:hover{background:var(--accent-soft);border-color:var(--line)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}

/* Kerangka "soon" dan dialog */
.soonbox .pill{font-size:.75em;padding:.3em .7em}
.tag.pill.soon{color:var(--ink)}
.modal form{border:3px solid var(--line);border-radius:6px;box-shadow:8px 8px 0 var(--line)}
.modal h2{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase}
.modal input{border:var(--bw) solid var(--line);border-radius:4px}
.modal .row button{border:var(--bw) solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line)}
.modal .row button.pri{background:var(--coral);color:#111827;border-color:var(--line)}

@media (max-width:900px){
  .top .title{font-size:18px}
  .side{border-right:3px solid var(--line)}
}
@media (max-width:600px){
  .read .slide{box-shadow:4px 4px 0 var(--line)}
  .card{box-shadow:3px 3px 0 var(--line)}
}
/* Penyesuaian mode gelap dan HP */
.eyebrow .chip{background:#111827;color:var(--mustard)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .eyebrow .chip,:root:not([data-theme="light"]) .tag.exam{background:var(--mustard);color:#111111;border-color:var(--mustard)}
}
:root[data-theme="dark"] .eyebrow .chip,:root[data-theme="dark"] .tag.exam{background:var(--mustard);color:#111111;border-color:var(--mustard)}
@media (max-width:600px){
  .top{gap:6px;padding:8px 12px}
  .top .title{font-size:16px;min-width:0}
  .top .title small{display:none}
  .stage{box-shadow:4px 4px 0 var(--line)}
}

/* ===== Kutipan teks asli + terjemahan (v4.2) ===== */
.qt{margin:0 0 .6em}
.qt:last-child{margin-bottom:0}
.qt .ar{font-family:'Amiri','Noto Naskh Arabic','Scheherazade New',serif;font-size:1.35em;line-height:1.85;direction:rtl;text-align:right;margin:0 0 .3em;color:var(--ink)}
.qt .quote{display:block;margin:0;font-size:1.05em}
.qt .quote[lang="en"]{font-style:italic}
.qt .tr{margin:.35em 0 0;font-size:.95em;color:var(--ink-2)}
.qt .src{margin-top:.4em;font-size:.8em;color:var(--muted)}
.cols.wr{grid-template-columns:1fr 1.3fr}
.slide .qt .quote{font-size:1em;font-weight:600;line-height:1.4}
.slide .qt .quote[lang="en"]{font-weight:500}
.slide .qt .tr{font-size:.92em;line-height:1.45}
@media (max-width:900px){.cols.wr{grid-template-columns:1fr}}
.qh{display:flex;align-items:center;gap:.4em;margin:0 0 .5em}

/* ===== Tombol kembali ke homepage (v4.3) ===== */
.homeback{display:flex;align-items:center;gap:.4em;margin:12px 12px 0;padding:7px 10px;background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.02em;text-decoration:none;flex:0 0 auto}
.homeback:hover{background:var(--coral);color:#111827}
.homeback:active{transform:translate(3px,3px);box-shadow:none}
.homeback+.brand{margin-top:12px;border-top:3px solid var(--line)}

</style>
</head>

const GLOSSARY={"project":{"t":"Project","d":"Usaha sementara yang dilakukan untuk menghasilkan produk, layanan, atau hasil yang unik.","id":"proyek"},"operations":{"t":"Operations","d":"Pekerjaan rutin yang berjalan terus-menerus untuk mempertahankan layanan organisasi.","id":"operasional / kegiatan rutin"},"program":{"t":"Program","d":"Sekumpulan proyek (dan kegiatan) yang saling terkait dan dikelola terkoordinasi agar manfaatnya lebih besar daripada bila dikelola sendiri-sendiri.","id":"program"},"portfolio":{"t":"Portfolio","d":"Kumpulan proyek, program, dan operasi yang dikelola bersama untuk mencapai tujuan strategis organisasi.","id":"portofolio"},"project-management":{"t":"Project management","d":"Penerapan pengetahuan, keterampilan, alat, dan teknik pada kegiatan proyek agar memenuhi kebutuhan proyek.","id":"manajemen proyek"},"deliverable":{"t":"Deliverable","d":"Produk, hasil, atau kemampuan yang harus diserahkan untuk menyelesaikan suatu proses, fase, atau proyek.","id":"luaran / hasil serahan"},"stakeholder":{"t":"Stakeholder","d":"Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh proyek.","id":"pemangku kepentingan"},"triple-constraint":{"t":"Triple constraint","d":"Tiga batasan klasik proyek: lingkup (scope), waktu (time), dan biaya (cost) yang saling memengaruhi.","id":"tiga batasan proyek"},"life-cycle":{"t":"Project life cycle","d":"Rangkaian fase yang dilalui proyek dari awal sampai selesai.","id":"siklus hidup proyek"},"predictive":{"t":"Predictive approach","d":"Pendekatan yang menetapkan lingkup, jadwal, dan biaya sejak awal lalu mengerjakannya berurutan (sering disebut waterfall).","id":"pendekatan prediktif"},"adaptive":{"t":"Adaptive approach","d":"Pendekatan iteratif dan inkremental; kebutuhan diperinci bertahap dan hasil diserahkan dalam siklus pendek (mis. agile).","id":"pendekatan adaptif"},"hybrid":{"t":"Hybrid approach","d":"Gabungan unsur prediktif dan adaptif dalam satu proyek.","id":"pendekatan hibrida"},"principle":{"t":"Principle","d":"Pedoman dasar yang mengarahkan perilaku dan keputusan dalam mengelola proyek.","id":"prinsip"},"performance-domain":{"t":"Performance domain","d":"Kelompok kegiatan yang saling terkait dan penting bagi keberhasilan proyek. PMBOK Guide edisi ke-8 memuat tujuh domain.","id":"domain kinerja"},"focus-area":{"t":"Focus area","d":"Pengelompokan proses manajemen proyek menurut tahapnya: initiating, planning, executing, monitoring and controlling, closing.","id":"area fokus"},"project-manager":{"t":"Project manager","d":"Orang yang ditugaskan organisasi untuk memimpin tim dan bertanggung jawab mencapai tujuan proyek.","id":"manajer proyek"},"scope-creep":{"t":"Scope creep","d":"Bertambahnya lingkup proyek sedikit demi sedikit tanpa pengendalian (tanpa penyesuaian waktu, biaya, dan sumber daya).","id":"melebarnya lingkup"},"governance":{"t":"Governance","d":"Kerangka kewenangan, akuntabilitas, dan pengambilan keputusan yang mengarahkan proyek.","id":"tata kelola"},"business-case":{"t":"Business case","d":"Dokumen yang menjelaskan alasan bisnis sebuah proyek: masalah atau peluang, pilihan solusi, analisis biaya-manfaat, dan rekomendasi.","id":"kajian kelayakan bisnis"},"feasibility":{"t":"Feasibility study","d":"Kajian untuk menilai apakah sebuah proyek layak dijalankan dari sisi teknis, operasional, dan ekonomi.","id":"studi kelayakan"},"npv":{"t":"Net present value (NPV)","d":"Selisih nilai sekarang seluruh manfaat dan seluruh biaya proyek setelah didiskonto. NPV positif berarti proyek menghasilkan nilai.","id":"nilai sekarang bersih"},"roi":{"t":"Return on investment (ROI)","d":"Perbandingan manfaat bersih terhadap biaya investasi, dinyatakan dalam persen.","id":"tingkat pengembalian investasi"},"payback":{"t":"Payback period","d":"Lama waktu sampai manfaat kumulatif menutup biaya kumulatif proyek.","id":"periode pengembalian"},"discount-rate":{"t":"Discount rate","d":"Tingkat bunga yang dipakai untuk mengubah uang di masa depan menjadi nilai sekarang; sering disebut juga required rate of return.","id":"tingkat diskonto"},"discount-factor":{"t":"Discount factor","d":"Pengali untuk mengubah nilai tahun ke-t menjadi nilai sekarang: 1/(1+r)^t.","id":"faktor diskonto"},"weighted-scoring":{"t":"Weighted scoring model","d":"Alat seleksi proyek yang memberi skor pada beberapa kriteria berbobot, lalu menjumlahkannya.","id":"model skor berbobot"},"project-charter":{"t":"Project charter","d":"Dokumen yang secara resmi mengesahkan proyek dan memberi wewenang kepada manajer proyek.","id":"piagam proyek"},"sponsor":{"t":"Sponsor","d":"Orang atau kelompok yang menyediakan sumber daya dan dukungan bagi proyek serta bertanggung jawab atas keberhasilannya.","id":"sponsor / penyandang proyek"},"opportunity-cost":{"t":"Opportunity cost of capital","d":"Imbal hasil yang hilang karena dana dipakai untuk proyek ini, bukan untuk alternatif lain.","id":"biaya peluang modal"},"milestone":{"t":"Milestone","d":"Titik penting dalam jadwal proyek yang menandai selesainya hasil atau fase tertentu; durasinya nol.","id":"tonggak proyek"},"success-criteria":{"t":"Success criteria","d":"Ukuran yang disepakati untuk menyatakan proyek berhasil, mis. sistem dipakai seluruh staf dalam satu bulan.","id":"kriteria keberhasilan"},"assumption":{"t":"Assumption","d":"Hal yang dianggap benar untuk keperluan perencanaan tanpa bukti pasti, sehingga perlu dicek kembali.","id":"asumsi"},"constraint":{"t":"Constraint","d":"Batasan yang membatasi pilihan tim proyek, mis. anggaran tetap atau tenggat yang tidak bisa digeser.","id":"batasan / kendala"},"sign-off":{"t":"Sign-off","d":"Persetujuan resmi (biasanya bertanda tangan) dari pihak berwenang atas sebuah dokumen atau hasil.","id":"pengesahan"},"stakeholder-register":{"t":"Stakeholder register","d":"Dokumen yang mencatat identitas, kepentingan, pengaruh, dan klasifikasi para pemangku kepentingan proyek.","id":"daftar pemangku kepentingan"},"power-interest":{"t":"Power/interest grid","d":"Kisi dua kali dua untuk mengelompokkan pemangku kepentingan menurut kekuasaan (power) dan kepentingan (interest) mereka terhadap proyek.","id":"kisi kekuasaan–kepentingan"},"engagement-matrix":{"t":"Stakeholder engagement assessment matrix","d":"Tabel yang membandingkan tingkat keterlibatan pemangku kepentingan saat ini dengan tingkat yang diinginkan.","id":"matriks penilaian keterlibatan"},"kick-off":{"t":"Kick-off meeting","d":"Rapat pembukaan proyek untuk menyamakan pemahaman tujuan, peran, dan rencana kerja di antara pihak yang terlibat.","id":"rapat pembukaan proyek"},"requirement":{"t":"Requirement","d":"Kondisi atau kemampuan yang harus ada pada produk, layanan, atau hasil proyek agar kebutuhan pemangku kepentingan terpenuhi.","id":"kebutuhan / persyaratan"},"elicitation":{"t":"Requirements elicitation","d":"Kegiatan menggali kebutuhan dari pemangku kepentingan, mis. lewat wawancara, observasi, atau kuesioner.","id":"penggalian kebutuhan"},"functional-req":{"t":"Functional requirement","d":"Kebutuhan tentang apa yang harus dapat dilakukan sistem, mis. membuat tagihan SPP bulanan.","id":"kebutuhan fungsional"},"nonfunctional-req":{"t":"Non-functional requirement","d":"Kebutuhan tentang mutu atau batasan sistem, mis. kecepatan, keamanan, dan ketersediaan.","id":"kebutuhan nonfungsional"},"moscow":{"t":"MoSCoW","d":"Teknik memprioritaskan kebutuhan menjadi Must have, Should have, Could have, dan Won't have (kali ini).","id":"prioritas MoSCoW"},"traceability-matrix":{"t":"Requirements traceability matrix","d":"Tabel yang menghubungkan tiap kebutuhan dengan sumbernya, deliverable, dan pengujiannya agar dapat ditelusuri.","id":"matriks keterlacakan kebutuhan"},"scope":{"t":"Scope","d":"Seluruh produk, layanan, dan hasil yang akan diberikan oleh proyek, beserta pekerjaan untuk menghasilkannya.","id":"lingkup"},"product-scope":{"t":"Product scope","d":"Fitur dan fungsi yang menjadi ciri produk, layanan, atau hasil proyek.","id":"lingkup produk"},"project-scope":{"t":"Project scope","d":"Pekerjaan yang dilakukan untuk menghasilkan produk, layanan, atau hasil dengan fitur dan fungsi yang ditentukan.","id":"lingkup proyek"},"scope-statement":{"t":"Project scope statement","d":"Dokumen yang menguraikan lingkup, deliverable utama, asumsi, dan batasan proyek, sebagai dasar kesepakatan bersama.","id":"pernyataan lingkup proyek"},"acceptance-criteria":{"t":"Acceptance criteria","d":"Syarat yang harus dipenuhi sebelum deliverable diterima oleh sponsor atau pelanggan.","id":"kriteria penerimaan"},"out-of-scope":{"t":"Out of scope","d":"Hal yang secara tegas tidak dikerjakan proyek; dicatat agar tidak muncul harapan yang keliru.","id":"di luar lingkup / tidak termasuk"}};
const QUOTES=[{"q":"Plans are worthless, but planning is everything.","a":"Dwight D. Eisenhower","s":"Remarks at the National Defense Executive Reserve Conference, 14 Nov 1957 (Public Papers of the Presidents, 1957)"},{"q":"Adding manpower to a late software project makes it later.","a":"Frederick P. Brooks Jr.","s":"The Mythical Man-Month, 1975"},{"q":"How does a project get to be a year late? One day at a time.","a":"Frederick P. Brooks Jr.","s":"The Mythical Man-Month, 1975, ch. 14"},{"q":"You can't control what you can't measure.","a":"Tom DeMarco","s":"Controlling Software Projects, 1982"},{"q":"Responding to change over following a plan.","a":"Beck, Beedle, van Bennekum, et al.","s":"Manifesto for Agile Software Development, 2001"},{"q":"O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow.","a":"Al-Qur'an, Al-Hasyr 59:18","s":"Sahih International translation"}];
const MEETINGS=[{"no":1,"title":"Konsep Manajemen Proyek SI","subtitle":"Proyek, siklus hidup, prinsip, dan domain kinerja PMBOK Guide","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Manajemen Proyek Sistem Informasi · SI24W08</span></div><h1>Konsep Manajemen Proyek SI</h1><p class=\"lead\">Proyek, siklus hidup, prinsip, dan domain kinerja PMBOK Guide</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>5 · 3 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep, siklus hidup, prinsip, dan domain kinerja manajemen proyek SI (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan membedakan proyek, program, portofolio, dan operasi.</li><li>Ketepatan menjelaskan siklus hidup proyek prediktif, adaptif, dan hybrid.</li><li>Ketepatan menjelaskan prinsip dan domain kinerja PMBOK Guide.</li><li>Ketepatan mengidentifikasi penyebab kegagalan proyek SI dari kasus.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis persoalan proyek sistem informasi dan menyusun rencana proyek yang terintegrasi (kelayakan, lingkup, jadwal, dan biaya).</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 3 SKS · Project Based Learning</span></div><h2>Satu semester, satu proyek nyata</h2><p>Setiap kelompok mengelola <b>satu proyek SI untuk mitra nyata</b> (UMKM, instansi pemerintah, perguruan tinggi, atau pesantren/lembaga NU) dari rencana sampai penutupan.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas 1 · Rencana proyek</h3><p>Business case, project charter, scope statement, WBS, dan jadwal dengan jalur kritis. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tugas 2 · Kendali &amp; penutupan</h3><p>Cost baseline, risk register, rencana mutu dan UAT, RACI dan simulasi sprint, laporan EVM, laporan penutupan, presentasi akhir.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tenggat tugas mengikuti jadwal proyek.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran jelas dan tercatat (<i>At Taawun</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Menjaga mitra</h3><p>Santun dan menepati janji kepada mitra proyek (<i>Al Amanah</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Data, laporan, dan progres apa adanya. Tidak menyalin karya kelompok lain (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Hambatan proyek segera disampaikan, jangan ditunda sampai tenggat.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Proyek atau bukan?</h2><div class=\"cols w\"><div><p class=\"lead\">Tandai mana yang <b>proyek</b> dan mana yang <b>kegiatan rutin</b>. Berikan alasan singkat.</p><ol><li>Membangun aplikasi kasir untuk UMKM keripik tempe</li><li>Mencetak slip gaji dosen setiap bulan</li><li>Menyelenggarakan wisuda ke-10 Unusida</li><li>Melayani helpdesk akun SIAKAD setiap hari</li><li>Memindahkan server kantor desa ke cloud</li><li>Mencadangkan (backup) database setiap malam</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Petunjuk</h3><p>Tanyakan dua hal: <b>Apakah ada titik selesainya?</b> dan <b>Apakah hasilnya baru/unik?</b></p><p class=\"muted\">Jawaban dibahas di slide berikutnya.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu proyek?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A temporary endeavor undertaken to create a unique product, service, or result.\"</p><p class=\"tr\">\"Suatu usaha sementara yang dilakukan untuk menciptakan produk, layanan, atau hasil yang unik.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li><b>Sementara</b>: punya awal dan akhir yang jelas, bukan berarti singkat.</li><li><b>Unik</b>: hasilnya berbeda dari yang pernah ada, walau mirip.</li><li>Menghasilkan <button type=\"button\" class=\"term\" data-term=\"deliverable\">deliverable</button> yang bernilai bagi organisasi.</li><li>Melibatkan <button type=\"button\" class=\"term\" data-term=\"stakeholder\">stakeholder</button> dan mendorong perubahan.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Bandingkan dengan <button type=\"button\" class=\"term\" data-term=\"operations\">operasi</button></h3><table class=\"t\"><tbody><tr><th></th><th>Proyek</th><th>Operasi</th></tr><tr><td>Waktu</td><td>ada akhir</td><td>terus-menerus</td></tr><tr><td>Hasil</td><td>unik</td><td>berulang</td></tr><tr><td>Tujuan</td><td>mengubah</td><td>menjaga layanan</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Portofolio, program, proyek, operasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 820 290\" role=\"img\" aria-label=\"Hierarki: portfolio organisasi berisi program, proyek mandiri, dan operasi. Program berisi beberapa proyek yang saling terkait. Hasil proyek diserahkan ke operasi untuk dijalankan rutin.\"><defs><marker id=\"pa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"10\" width=\"800\" height=\"56\" rx=\"12\" class=\"s-acc\"/><text x=\"410\" y=\"36\" text-anchor=\"middle\" class=\"s-t\">Portfolio · Transformasi digital Pemkab (ilustrasi)</text><text x=\"410\" y=\"55\" text-anchor=\"middle\" class=\"s-s\">dipilih dan diprioritaskan menurut strategi organisasi</text><rect x=\"10\" y=\"100\" width=\"380\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"200\" y=\"124\" text-anchor=\"middle\" class=\"s-t\">Program · Layanan publik terpadu</text><rect x=\"26\" y=\"136\" width=\"170\" height=\"34\" rx=\"8\" class=\"s-box\"/><text x=\"111\" y=\"158\" text-anchor=\"middle\" class=\"s-s\">A: aplikasi perizinan</text><rect x=\"206\" y=\"136\" width=\"170\" height=\"34\" rx=\"8\" class=\"s-box\"/><text x=\"291\" y=\"158\" text-anchor=\"middle\" class=\"s-s\">B: integrasi data NIK</text><rect x=\"410\" y=\"100\" width=\"190\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"505\" y=\"132\" text-anchor=\"middle\" class=\"s-t\">Proyek mandiri</text><text x=\"505\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">migrasi server ke cloud</text><rect x=\"620\" y=\"100\" width=\"190\" height=\"80\" rx=\"12\" class=\"s-box\"/><text x=\"715\" y=\"132\" text-anchor=\"middle\" class=\"s-t\">Operasi</text><text x=\"715\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">helpdesk, backup harian</text><line x1=\"200\" y1=\"68\" x2=\"200\" y2=\"98\" class=\"s-line\" marker-end=\"url(#pa)\"/><line x1=\"505\" y1=\"68\" x2=\"505\" y2=\"98\" class=\"s-line\" marker-end=\"url(#pa)\"/><line x1=\"715\" y1=\"68\" x2=\"715\" y2=\"98\" class=\"s-line\" marker-end=\"url(#pa)\"/><path d=\"M200 182 C200 250 715 250 715 184\" class=\"s-line\" marker-end=\"url(#pa)\"/><path d=\"M505 182 C505 220 690 220 700 186\" class=\"s-line\" marker-end=\"url(#pa)\"/><text x=\"420\" y=\"270\" text-anchor=\"middle\" class=\"s-s\">hasil proyek diserahkan (handover) ke operasi untuk dijalankan setiap hari</text></svg><figcaption>Hubungan portfolio, program, proyek, dan operasi, disusun berdasarkan definisi PMI (2025). Contoh instansi adalah ilustrasi.</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"portfolio\">Portfolio</button> = memilih pekerjaan yang <b>benar</b> · <button type=\"button\" class=\"term\" data-term=\"program\">Program</button> = mengoordinasikan proyek yang saling terkait · proyek = mengerjakan dengan <b>benar</b></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konteks</span><span>Proyek teknologi informasi</span></div><h2>Apa yang khas dari proyek SI?</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pemangku kepentingan beragam</h3><p>Pimpinan, staf pengguna, bagian keuangan, vendor, sampai masyarakat, dengan kepentingan yang sering berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Tim beragam</h3><p>Analis, programmer, desainer UI, admin jaringan, dan pengguna kunci dengan latar belakang berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Teknologi beragam &amp; cepat berubah</h3><p>Platform, bahasa, cloud, dan standar keamanan berganti cepat; keahlian tim ikut harus menyesuaikan.</p></div></div><p style=\"margin-top:.8em\">Ciri-ciri ini diuraikan Schwalbe <span class=\"cite\">(2019)</span>. Hasil proyek SI juga sering <b>tak kasatmata</b>: kemajuan kode dan data lebih sulit dilihat daripada kemajuan bangunan fisik.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Manajemen proyek dan tiga batasannya</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The application of knowledge, skills, tools, and techniques to project activities to meet project requirements.\"</p><p class=\"tr\">\"Penerapan pengetahuan, keterampilan, alat, dan teknik pada kegiatan proyek untuk memenuhi persyaratan proyek.\"</p><div class=\"src\">PMI (2025); terjemahan harfiah penyusun</div></blockquote><p style=\"margin-top:.8em\">Klasiknya, setiap proyek dibatasi <button type=\"button\" class=\"term\" data-term=\"triple-constraint\">triple constraint</button> <span class=\"cite\">(Schwalbe, 2019)</span>:</p><ul><li><b>Scope</b>: apa yang dikerjakan dan dihasilkan.</li><li><b>Time</b>: berapa lama.</li><li><b>Cost</b>: berapa biayanya.</li></ul><p class=\"muted\">Mengubah satu sisi hampir selalu memengaruhi sisi lain. Mutu dan kepuasan pemangku kepentingan menjadi ukuran keberhasilan di atasnya.</p></div><figure class=\"fig\"><svg viewBox=\"0 0 320 260\" role=\"img\" aria-label=\"Segitiga tiga batasan proyek: scope di puncak, time di kiri bawah, cost di kanan bawah; di tengah tertulis mutu dan nilai.\"><polygon points=\"160,20 20,230 300,230\" class=\"s-soft\"/><text x=\"160\" y=\"14\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Scope</text><text x=\"20\" y=\"252\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Time</text><text x=\"300\" y=\"252\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Cost</text><circle cx=\"160\" cy=\"160\" r=\"46\" class=\"s-acc\"/><text x=\"160\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mutu &amp;</text><text x=\"160\" y=\"174\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">nilai</text></svg><figcaption>Triple constraint (Schwalbe, 2019).</figcaption></figure></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Siklus hidup</span><span>Indikator 2</span></div><h2>Prediktif, adaptif, atau hybrid?</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 230\" role=\"img\" aria-label=\"Spektrum pendekatan pengembangan: di kiri prediktif dengan lingkup ditetapkan di awal dan fase berurutan; di tengah hybrid; di kanan adaptif dengan siklus pendek berulang dan kebutuhan diperinci bertahap.\"><defs><marker id=\"pl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"40\" y1=\"30\" x2=\"820\" y2=\"30\" class=\"s-line\" marker-end=\"url(#pl)\" marker-start=\"url(#pl)\"/><text x=\"40\" y=\"20\" class=\"s-hd\">LINGKUP JELAS DI AWAL</text><text x=\"820\" y=\"20\" text-anchor=\"end\" class=\"s-hd\">KEBUTUHAN BERUBAH-UBAH</text><rect x=\"20\" y=\"50\" width=\"250\" height=\"160\" rx=\"12\" class=\"s-soft\"/><text x=\"145\" y=\"76\" text-anchor=\"middle\" class=\"s-t\">Predictive</text><rect x=\"32\" y=\"92\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"54\" y=\"107\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Analisis</text><rect x=\"78\" y=\"106\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"100\" y=\"121\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Desain</text><rect x=\"124\" y=\"120\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"146\" y=\"135\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Bangun</text><rect x=\"170\" y=\"134\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"192\" y=\"149\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Uji</text><rect x=\"216\" y=\"148\" width=\"44\" height=\"22\" rx=\"4\" class=\"s-box\"/><text x=\"238\" y=\"163\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:9px\">Serah</text><text x=\"145\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">fase berurutan, satu kali serah</text><rect x=\"305\" y=\"50\" width=\"250\" height=\"160\" rx=\"12\" class=\"s-acc\"/><text x=\"430\" y=\"76\" text-anchor=\"middle\" class=\"s-t\">Hybrid</text><rect x=\"320\" y=\"96\" width=\"90\" height=\"26\" rx=\"4\" class=\"s-box\"/><text x=\"365\" y=\"113\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">rencana induk</text><circle cx=\"445\" cy=\"140\" r=\"16\" class=\"s-box\"/><circle cx=\"485\" cy=\"140\" r=\"16\" class=\"s-box\"/><circle cx=\"525\" cy=\"140\" r=\"16\" class=\"s-box\"/><line x1=\"410\" y1=\"110\" x2=\"430\" y2=\"132\" class=\"s-line\" marker-end=\"url(#pl)\"/><text x=\"430\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">kerangka prediktif + iterasi</text><rect x=\"590\" y=\"50\" width=\"250\" height=\"160\" rx=\"12\" class=\"s-soft\"/><text x=\"715\" y=\"76\" text-anchor=\"middle\" class=\"s-t\">Adaptive</text><circle cx=\"640\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"640\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">1</text><circle cx=\"690\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"690\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">2</text><circle cx=\"740\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"740\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">3</text><circle cx=\"790\" cy=\"130\" r=\"20\" class=\"s-box\"/><text x=\"790\" y=\"135\" text-anchor=\"middle\" class=\"s-s\">4</text><text x=\"715\" y=\"176\" text-anchor=\"middle\" class=\"s-s\">siklus pendek berulang,</text><text x=\"715\" y=\"194\" text-anchor=\"middle\" class=\"s-s\">hasil diserahkan bertahap</text></svg><figcaption>Pendekatan pengembangan sebagai spektrum dari prediktif ke adaptif, diadaptasi dari PMI (2025) dan PMI &amp; Agile Alliance (2017).</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"predictive\">Predictive</button> cocok bila kebutuhan stabil · <button type=\"button\" class=\"term\" data-term=\"adaptive\">Adaptive</button> cocok bila kebutuhan belum pasti · <button type=\"button\" class=\"term\" data-term=\"hybrid\">Hybrid</button> menggabungkan keduanya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">PMBOK Guide ed. 8</span><span>Indikator 3</span></div><h2>Enam <button type=\"button\" class=\"term\" data-term=\"principle\">prinsip</button> manajemen proyek <span class=\"cite\">(PMI, 2025)</span></h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Adopt a holistic view</h3><p>Lihat proyek sebagai satu sistem: keputusan di satu bagian berdampak ke bagian lain.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Focus on value</h3><p>Ukur keberhasilan dari manfaat bagi organisasi, bukan sekadar \"fitur selesai\".</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Embed quality into processes and deliverables</h3><p>Mutu dirancang sejak awal, bukan diperiksa di akhir.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Be an accountable leader</h3><p>Memimpin dengan bertanggung jawab atas hasil, bukan hanya tugas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Integrate sustainability within all project areas</h3><p>Pertimbangkan dampak jangka panjang: lingkungan, sosial, dan keberlanjutan organisasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Build an empowered culture</h3><p>Bangun tim yang dipercaya, kolaboratif, dan berani menyampaikan masalah.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">PMBOK Guide ed. 8</span><span>Indikator 3</span></div><h2>Tujuh <button type=\"button\" class=\"term\" data-term=\"performance-domain\">domain kinerja</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 880 300\" role=\"img\" aria-label=\"Struktur PMBOK Guide edisi ke-8: enam prinsip sebagai dasar perilaku, tujuh domain kinerja yaitu Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk, dan lima focus areas yaitu Initiating, Planning, Executing, Monitoring and Controlling, Closing.\"><text x=\"10\" y=\"22\" class=\"s-hd\">6 PRINCIPLES · MENGAPA (pola pikir)</text><rect x=\"10\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"78\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Holistic view</text><rect x=\"155\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"223\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Focus on value</text><rect x=\"300\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"368\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Embed quality</text><rect x=\"445\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"513\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Accountable leader</text><rect x=\"590\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"658\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Sustainability</text><rect x=\"735\" y=\"32\" width=\"137\" height=\"40\" rx=\"8\" class=\"s-acc\"/><text x=\"803\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Empowered culture</text><text x=\"10\" y=\"112\" class=\"s-hd\">7 PERFORMANCE DOMAINS · APA (area praktik)</text><rect x=\"10\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"68\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Governance</text><rect x=\"134\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"192\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Scope</text><rect x=\"258\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"316\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Schedule</text><rect x=\"382\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"440\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Finance</text><rect x=\"506\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"564\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Stakeholders</text><rect x=\"630\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"688\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Resources</text><rect x=\"754\" y=\"122\" width=\"116\" height=\"44\" rx=\"8\" class=\"s-soft\"/><text x=\"812\" y=\"149\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Risk</text><text x=\"10\" y=\"206\" class=\"s-hd\">5 FOCUS AREAS · BAGAIMANA (40 proses)</text><rect x=\"10\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"85\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Initiating</text><rect x=\"170\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"245\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Planning</text><rect x=\"330\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"405\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Executing</text><rect x=\"490\" y=\"216\" width=\"210\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"595\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Monitoring &amp; Controlling</text><rect x=\"710\" y=\"216\" width=\"150\" height=\"40\" rx=\"20\" class=\"s-box\"/><text x=\"785\" y=\"241\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Closing</text><text x=\"440\" y=\"288\" text-anchor=\"middle\" class=\"s-s\">ketujuh domain bekerja bersamaan sepanjang proyek, bukan berurutan</text></svg><figcaption>Struktur PMBOK Guide edisi ke-8 (PMI, 2025): enam prinsip, tujuh domain kinerja, dan lima focus areas yang memuat 40 proses. Nama prinsip disingkat; nama lengkapnya ada di slide sebelumnya.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peran</span></div><h2>Apa kerja <button type=\"button\" class=\"term\" data-term=\"project-manager\">manajer proyek</button>?</h2><div class=\"cols\"><div><ul class=\"lead\"><li>Menyelaraskan proyek dengan <b>tujuan organisasi</b>.</li><li>Merencanakan, memantau, dan mengendalikan lingkup, jadwal, biaya, risiko.</li><li>Memimpin dan melindungi tim.</li><li>Berkomunikasi dengan sponsor, pengguna, dan vendor.</li><li>Mengambil keputusan dan bertanggung jawab atas hasil.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Bukan \"programmer paling senior\"</h3><p>Manajer proyek SI perlu paham teknologi, tetapi pekerjaan utamanya adalah <b>mengelola orang, keputusan, dan informasi</b>.</p><p class=\"muted\">Di kelompok Anda, satu orang akan berperan sebagai manajer proyek dan bertanggung jawab atas laporan progres.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Studi kasus</span><span>Instansi pemerintah · 2024</span></div><h2>Gangguan PDNS 2 Surabaya</h2><div class=\"cols w\"><div><ul><li>Juni 2024, Pusat Data Nasional Sementara (PDNS) 2 di Surabaya diserang <i>ransomware</i> Brain Cipher; pemerintah mengidentifikasi <b>282 instansi</b> yang terdampak <span class=\"cite\">(Antara, 2024)</span>.</li><li>Kepala BSSN menyatakan hanya sekitar <b>2%</b> data PDNS 2 yang tercadangkan di Batam, sehingga tidak bisa dipakai sebagai pusat pemulihan <span class=\"cite\">(Kompas.com, 2024)</span>.</li><li>Kepala BSSN menyebut permasalahan utamanya adalah <b>tata kelola</b> dan tidak adanya cadangan data <span class=\"cite\">(IDN Times, 2024)</span>.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Pertanyaan pemantik</h3><p>Ini kegagalan teknologi, atau kegagalan <b>manajemen</b>? Domain kinerja mana yang paling lemah?</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kasus</span><span>Kelompok 4–5 orang · 15 menit</span></div><h2>Bedah kasus proyek SI pemerintah</h2><div class=\"cols\"><div><p><b>Kasus pembanding: proyek e-KTP.</b> Proyek pengadaan e-KTP bernilai sekitar Rp5,9 triliun; hakim menetapkan kerugian negara sekitar Rp2,3 triliun akibat penggelembungan harga <span class=\"cite\">(Detik.com, 2017)</span>.</p><p class=\"lead\" style=\"margin-top:.6em\">Tugas kelompok:</p><ol><li>Pilih satu kasus (PDNS 2 atau e-KTP).</li><li>Identifikasi <b>tiga penyebab</b> masalah.</li><li>Petakan tiap penyebab ke <b>domain kinerja</b> dan <b>prinsip</b> PMBOK yang terkait.</li><li>Usulkan satu tindakan manajemen yang seharusnya dilakukan sejak awal.</li></ol></div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Penyebab</th><th>Domain</th><th>Prinsip</th></tr></thead><tbody><tr><td>…</td><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td><td>…</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Salin tabel ini di kertas atau dokumen kelompok.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Penting</span><span>Indikator 4</span></div><h2>Pola penyebab kegagalan proyek SI</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tujuan tidak jelas</h3><p>Proyek dimulai karena \"ada anggaran\", bukan karena masalah yang jelas.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pengguna tidak dilibatkan</h3><p>Kebutuhan ditebak; aplikasi jadi tetapi tidak dipakai.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Lingkup melebar</h3><p><button type=\"button\" class=\"term\" data-term=\"scope-creep\">Scope creep</button>: fitur terus ditambah tanpa menyesuaikan waktu dan biaya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Estimasi tidak realistis</h3><p>Jadwal dan biaya ditentukan dari tenggat, bukan dari perhitungan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko diabaikan</h3><p>Keamanan, backup, dan ketergantungan vendor tidak direncanakan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tata kelola lemah</h3><p>Tidak jelas siapa memutuskan dan siapa bertanggung jawab.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen dari diskusi kasus dan pembahasan dalam Schwalbe (2019) serta Kerzner (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Proyek bersifat <b>sementara</b> dan menghasilkan sesuatu yang <b>unik</b>; operasi berulang.</li><li>Portofolio memilih pekerjaan yang benar; program mengoordinasikan proyek terkait.</li><li>Pendekatan pengembangan berupa spektrum: <b>prediktif – hybrid – adaptif</b>.</li><li>PMBOK Guide ed. 8: <b>6 prinsip</b>, <b>7 domain kinerja</b>, 5 focus areas.</li><li>Kegagalan proyek SI lebih sering berakar pada <b>manajemen</b> daripada teknologi.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Membangun aplikasi presensi punya awal-akhir dan hasil unik; tiga lainnya kegiatan rutin.\"><p class=\"q\">Manakah yang merupakan proyek, bukan operasi?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Backup database setiap malam</button><button type=\"button\" data-o=\"b\">B. Membangun aplikasi presensi santri</button><button type=\"button\" data-o=\"c\">C. Melayani reset kata sandi SIAKAD</button><button type=\"button\" data-o=\"d\">D. Mencetak slip gaji bulanan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Pendekatan adaptif memerinci kebutuhan bertahap dan menyerahkan hasil dalam siklus pendek.\"><p class=\"q\">Kebutuhan pemilik UMKM belum jelas dan ingin mencoba fitur sedikit demi sedikit. Pendekatan yang paling cocok adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Prediktif</button><button type=\"button\" data-o=\"b\">B. Adaptif</button><b
